<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotMobスタイル データベース - Football Hub Japan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* FotMob-style layout */
        .fotmob-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            height: calc(100vh - 200px);
        }

        .sidebar {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .main-content {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .filter-section {
            margin-bottom: 2rem;
        }

        .filter-title {
            color: #00ff88;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-label {
            color: #cccccc;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .filter-input {
            width: 100%;
            padding: 0.8rem;
            background: #333333;
            border: 1px solid #555555;
            border-radius: 5px;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .filter-input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .filter-select {
            width: 100%;
            padding: 0.8rem;
            background: #333333;
            border: 1px solid #555555;
            border-radius: 5px;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .filter-select:focus {
            outline: none;
            border-color: #00ff88;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .player-card {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid #333333;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
        }

        .player-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .player-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            margin-right: 1rem;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .player-team {
            color: #00ff88;
            font-size: 0.9rem;
        }

        .player-position {
            color: #cccccc;
            font-size: 0.8rem;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.8rem;
            background: #333333;
            border-radius: 5px;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stat-label {
            color: #888888;
            font-size: 0.8rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .page-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .page-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #00ff88;
        }

        .error {
            text-align: center;
            padding: 2rem;
            color: #ff4444;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #333333;
        }

        .stat-card-value {
            color: #00ff88;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .stat-card-label {
            color: #cccccc;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .fotmob-layout {
                grid-template-columns: 1fr;
            }
            
            .players-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-overview {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ Football Hub Japan</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
            <button class="nav-btn" onclick="window.location.href='/radar-enhanced'">レーダーチャート</button>
            <button class="nav-btn" onclick="window.location.href='/ai-agent-enhanced'">AIエージェント</button>
            <button class="nav-btn" onclick="window.location.href='/'">ログアウト</button>
        </div>
    </header>

    <div class="main-container">
        <h1 class="page-title">FotMobスタイル データベース</h1>
        <p class="page-subtitle">常時表示される選手データベース</p>

        <div class="stats-overview">
            <div class="stat-card">
                <div class="stat-card-value" id="totalPlayers">-</div>
                <div class="stat-card-label">総選手数</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="totalTeams">-</div>
                <div class="stat-card-label">総チーム数</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="totalLeagues">-</div>
                <div class="stat-card-label">総リーグ数</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="lastUpdate">-</div>
                <div class="stat-card-label">最終更新</div>
            </div>
        </div>

        <div class="fotmob-layout">
            <div class="sidebar">
                <div class="filter-section">
                    <h3 class="filter-title">🔍 フィルター</h3>
                    
                    <div class="filter-group">
                        <label class="filter-label">検索</label>
                        <input type="text" id="searchInput" class="filter-input" placeholder="選手名、チーム名、国籍...">
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">リーグ</label>
                        <select id="leagueSelect" class="filter-select">
                            <option value="">すべてのリーグ</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">ポジション</label>
                        <select id="positionSelect" class="filter-select">
                            <option value="">すべてのポジション</option>
                            <option value="Forward">フォワード</option>
                            <option value="Midfielder">ミッドフィルダー</option>
                            <option value="Defender">ディフェンダー</option>
                            <option value="Goalkeeper">ゴールキーパー</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div id="playersContainer" class="players-grid">
                    <div class="loading">データを読み込み中...</div>
                </div>
                
                <div id="pagination" class="pagination"></div>
            </div>
        </div>
    </div>

    <script src="/ai-widget.js"></script>
    <script>
        let currentPage = 1;
        let currentFilters = {};
        let totalPlayers = 0;
        let totalPages = 0;

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            initializeData();
            setupEventListeners();
        });

        async function initializeData() {
            try {
                // Initialize FotMob service
                const initResponse = await fetch('/api/fotmob/init');
                const initData = await initResponse.json();
                console.log('FotMob service initialized:', initData);

                // Load initial data
                await loadPlayers();
                await loadStats();
                await loadLeagues();
            } catch (error) {
                console.error('Error initializing data:', error);
                // Even if initialization fails, try to load fallback data
                await loadFallbackData();
            }
        }

        async function loadFallbackData() {
            try {
                console.log('Loading fallback data...');
                
                // Load fallback players
                const playersResponse = await fetch('/api/fotmob/players');
                const playersData = await playersResponse.json();
                
                if (playersData.players && playersData.players.length > 0) {
                    displayPlayers(playersData.players);
                    totalPlayers = playersData.total;
                    totalPages = playersData.totalPages;
                    updatePagination();
                }

                // Load fallback stats
                await loadStats();
                
                // Load fallback leagues
                await loadLeagues();
                
                console.log('Fallback data loaded successfully');
            } catch (error) {
                console.error('Error loading fallback data:', error);
                showError('データの読み込みに失敗しました。ページを再読み込みしてください。');
            }
        }

        async function loadPlayers() {
            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    limit: 20,
                    ...currentFilters
                });

                const response = await fetch(`/api/fotmob/players?${params}`);
                const data = await response.json();

                if (data.players) {
                    displayPlayers(data.players);
                    totalPlayers = data.total;
                    totalPages = data.totalPages;
                    updatePagination();
                } else {
                    showError('選手データの取得に失敗しました');
                }
            } catch (error) {
                console.error('Error loading players:', error);
                showError('選手データの読み込みに失敗しました');
            }
        }

        async function loadStats() {
            try {
                const [playersResponse, teamsResponse, leaguesResponse] = await Promise.all([
                    fetch('/api/fotmob/players'),
                    fetch('/api/fotmob/teams'),
                    fetch('/api/fotmob/leagues')
                ]);

                const playersData = await playersResponse.json();
                const teamsData = await teamsResponse.json();
                const leaguesData = await leaguesResponse.json();

                document.getElementById('totalPlayers').textContent = playersData.total || 0;
                document.getElementById('totalTeams').textContent = teamsData.length || 0;
                document.getElementById('totalLeagues').textContent = leaguesData.length || 0;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('ja-JP');
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadLeagues() {
            try {
                const response = await fetch('/api/fotmob/leagues');
                const leagues = await response.json();

                const leagueSelect = document.getElementById('leagueSelect');
                leagueSelect.innerHTML = '<option value="">すべてのリーグ</option>';

                leagues.forEach(league => {
                    const option = document.createElement('option');
                    option.value = league.id;
                    option.textContent = `${league.name} (${league.country})`;
                    leagueSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading leagues:', error);
            }
        }

        function displayPlayers(players) {
            const container = document.getElementById('playersContainer');
            
            if (players.length === 0) {
                container.innerHTML = '<div class="error">選手が見つかりませんでした</div>';
                return;
            }

            container.innerHTML = players.map(player => `
                <div class="player-card" onclick="showPlayerDetails(${player.id})">
                    <div class="player-header">
                        <div class="player-avatar">
                            ${player.name.split(' ').map(n => n[0]).join('').toUpperCase()}
                        </div>
                        <div class="player-info">
                            <div class="player-name">${player.name}</div>
                            <div class="player-team">${player.teamName || 'Unknown Team'}</div>
                            <div class="player-position">${player.position || 'Unknown Position'}</div>
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="stat-item">
                            <div class="stat-value">${player.nationality || 'N/A'}</div>
                            <div class="stat-label">国籍</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${player.shirtNumber || 'N/A'}</div>
                            <div class="stat-label">背番号</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${player.dateOfBirth ? new Date(player.dateOfBirth).getFullYear() : 'N/A'}</div>
                            <div class="stat-label">生年</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // Previous button
            if (currentPage > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'page-btn';
                prevBtn.textContent = '前へ';
                prevBtn.onclick = () => changePage(currentPage - 1);
                pagination.appendChild(prevBtn);
            }

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    const pageBtn = document.createElement('button');
                    pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                    pageBtn.textContent = i;
                    pageBtn.onclick = () => changePage(i);
                    pagination.appendChild(pageBtn);
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.color = '#888888';
                    ellipsis.style.padding = '0.5rem';
                    pagination.appendChild(ellipsis);
                }
            }

            // Next button
            if (currentPage < totalPages) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'page-btn';
                nextBtn.textContent = '次へ';
                nextBtn.onclick = () => changePage(currentPage + 1);
                pagination.appendChild(nextBtn);
            }
        }

        function changePage(page) {
            currentPage = page;
            loadPlayers();
        }

        function setupEventListeners() {
            // Search input
            const searchInput = document.getElementById('searchInput');
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentFilters.search = e.target.value;
                    currentPage = 1;
                    loadPlayers();
                }, 500);
            });

            // League select
            const leagueSelect = document.getElementById('leagueSelect');
            leagueSelect.addEventListener('change', (e) => {
                currentFilters.league = e.target.value;
                currentPage = 1;
                loadPlayers();
            });

            // Position select
            const positionSelect = document.getElementById('positionSelect');
            positionSelect.addEventListener('change', (e) => {
                currentFilters.position = e.target.value;
                currentPage = 1;
                loadPlayers();
            });
        }

        function showPlayerDetails(playerId) {
            // Navigate to player details page or show modal
            window.location.href = `/player/${playerId}`;
        }

        function showError(message) {
            const container = document.getElementById('playersContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
        }
    </script>
</body>
</html>
