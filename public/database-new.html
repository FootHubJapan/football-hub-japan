    <title>サッカーデータベース - Football Hub Japan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0a0a0a;
            --foreground: #fafafa;
            --card: #171717;
            --card-hover: #1f1f1f;
            --primary: #00bdc7;
            --primary-hover: #00a8b0;
            --secondary: #262626;
            --muted: #a1a1aa;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--foreground);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
        }

        .logo {
            color: var(--foreground);
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            font-size: 1rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--foreground);
        }

        .nav-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .login-btn {
            color: var(--foreground);
            background: transparent;
            border: none;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .cta-btn {
            background: var(--primary);
            color: #000;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cta-btn:hover {
            background: var(--primary-hover);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: radial-gradient(ellipse at top, rgba(0, 189, 199, 0.1), transparent 50%);
        }

        .badge {
            display: inline-block;
            background: rgba(0, 189, 199, 0.1);
            color: var(--primary);
            padding: 0.375rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 189, 199, 0.2);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .hero p {
            color: var(--muted);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }

        /* Search Box */
        .search-container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            gap: 0.75rem;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1.25rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--foreground);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        .search-btn {
            background: var(--primary);
            color: #000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: var(--primary-hover);
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 2rem;
            background: var(--secondary);
            border-radius: 12px;
            padding: 0.25rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .tab {
            flex: 1;
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--muted);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--card);
            color: var(--foreground);
        }

        .tab:hover:not(.active) {
            color: var(--foreground);
        }

        /* Filter Input */
        .filter-container {
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .filter-input-wrapper {
            position: relative;
        }

        .filter-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--foreground);
            font-size: 0.875rem;
            outline: none;
        }

        .filter-input:focus {
            border-color: var(--primary);
        }

        .filter-input::placeholder {
            color: var(--muted);
        }

        .filter-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* League Card */
        .league-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .league-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .league-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .league-flag {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: var(--secondary);
        }

        .league-info h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .league-info p {
            color: var(--muted);
            font-size: 0.875rem;
        }

        .league-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--muted);
            font-size: 0.875rem;
        }

        .league-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Team Card */
        .team-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .team-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .team-logo {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: var(--secondary);
            overflow: hidden;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .team-info h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .team-info p {
            color: var(--muted);
            font-size: 0.875rem;
        }

        .team-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--muted);
            font-size: 0.875rem;
        }

        /* Player Card */
        .player-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .player-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .player-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), #059669);
            color: #000;
            overflow: hidden;
        }

        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-info h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .player-info p {
            color: var(--muted);
            font-size: 0.875rem;
        }

        .player-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--muted);
            font-size: 0.875rem;
        }

        .player-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-stat-value {
            color: var(--foreground);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .player-stat-label {
            font-size: 0.75rem;
        }

        /* Position Badge */
        .position-badge {
            display: inline-block;
            background: rgba(0, 189, 199, 0.1);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .page-btn {
            padding: 0.5rem 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--foreground);
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            border-color: var(--primary);
        }

        .page-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 0 1rem;
            }

            .nav-links {
                display: none;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .search-container {
                flex-direction: column;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="header">

    <section class="hero">

        <h1>サッカーデータベース</h1>
        <p>世界中のリーグ、チーム、選手の詳細なデータを網羅。リアルタイムで更新される統計情報にアクセス。</p>
        <div class="search-container">
            <div class="search-input-wrapper">

                <input type="text" id="globalSearch" class="search-input" placeholder="チーム名、選手名、リーグ名で検索...">

    <main class="main-content">
        <div class="tabs">
            <button class="tab active" data-tab="leagues">リーグ</button>
            <button class="tab" data-tab="teams">チーム</button>
            <button class="tab" data-tab="players">選手</button>
        </div>

        <!-- Leagues Tab -->
        <div id="leagues-content" class="tab-content active">
            <div class="filter-container">
                <div class="filter-input-wrapper">
                    <span class="filter-icon">🔍</span>
                    <input type="text" id="leagueFilter" class="filter-input" placeholder="リーグ名、国名で検索...">
                </div>
            </div>
            <div id="leaguesGrid" class="cards-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>リーグデータを読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- Teams Tab -->
        <div id="teams-content" class="tab-content">
            <div class="filter-container">
                <div class="filter-input-wrapper">
                    <span class="filter-icon">🔍</span>
                    <input type="text" id="teamFilter" class="filter-input" placeholder="チーム名、リーグ名で検索...">
                </div>
            </div>
            <div id="teamsGrid" class="cards-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>チームデータを読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- Players Tab -->
        <div id="players-content" class="tab-content">
            <div class="filter-container">
                <div class="filter-input-wrapper">
                    <span class="filter-icon">🔍</span>
                    <input type="text" id="playerFilter" class="filter-input" placeholder="選手名、チーム名、国籍で検索...">
                </div>
            </div>
            <div id="playersGrid" class="cards-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>選手データを読み込み中...</p>
                </div>
            </div>
            <div id="playersPagination" class="pagination"></div>
        </div>
    </main>

    <script src="/ai-widget.js"></script>
    <script>
        // Data
        let leagues = [];
        let teams = [];
        let allPlayers = []; // 全選手データ（メモリに保持）
        let filteredPlayers = []; // フィルタリング後の選手データ
        let currentPage = 1;
        const playersPerPage = 20;
        let selectedLeagueId = null; // 選択中のリーグID
        let selectedTeamId = null; // 選択中のチームID
        let isDataLoading = false; // データロード中フラグ
        let dataLastUpdated = null; // データ最終更新時刻

        // League data with flags and API league IDs
        const leagueData = [
            { id: 'j1', name: 'Jリーグ', country: '日本', flag: '🇯🇵', teams: 20, players: 560, leagueId: 98 },
            { id: 'pl', name: 'プレミアリーグ', country: 'イングランド', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', teams: 20, players: 520, leagueId: 39 },
            { id: 'laliga', name: 'ラ・リーガ', country: 'スペイン', flag: '🇪🇸', teams: 20, players: 500, leagueId: 140 },
            { id: 'seriea', name: 'セリエA', country: 'イタリア', flag: '🇮🇹', teams: 20, players: 520, leagueId: 135 },
            { id: 'bundesliga', name: 'ブンデスリーガ', country: 'ドイツ', flag: '🇩🇪', teams: 18, players: 480, leagueId: 78 },
            { id: 'ligue1', name: 'リーグ・アン', country: 'フランス', flag: '🇫🇷', teams: 18, players: 460, leagueId: 61 }
        ];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupTabs();
            setupFilters();
            loadData();
        });

        // Setup tabs
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', async () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    document.querySelectorAll('.tab-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    document.getElementById(`${tab.dataset.tab}-content`).classList.add('active');
                    
                    // チームタブ表示時、データが空なら再読み込み
                    if (tab.dataset.tab === 'teams' && teams.length === 0) {
                        const grid = document.getElementById('teamsGrid');
                        if (grid && !grid.querySelector('.loading')) {
                            grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>チームデータを読み込み中...</p></div>';
                            await loadAllTeams();
                            filterAndDisplayTeams(document.getElementById('teamFilter')?.value || '', selectedLeagueId);
                        }
                    }
                });
            });
        }

        // Setup filters
        function setupFilters() {
            document.getElementById('leagueFilter').addEventListener('input', filterLeagues);
            document.getElementById('teamFilter').addEventListener('input', filterTeams);
            
            document.getElementById('playerFilter').addEventListener('input', (e) => {
                currentPage = 1;
                // メモリから即座にフィルタリング
                applyPlayerFilters(e.target.value, selectedTeamId);
            });

            document.getElementById('globalSearch').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performGlobalSearch();
            });
        }

        // Load all data
        async function loadData() {
            displayLeagues(leagueData);
            // 並列でデータを読み込み
            await Promise.all([
                loadAllTeams(),
                loadAllPlayers()
            ]);
            
            // URLの?q=パラメータがあれば検索を実行（トップページからの検索遷移用）
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('q');
            if (searchQuery && searchQuery.trim()) {
                document.getElementById('globalSearch').value = searchQuery.trim();
                document.querySelector('[data-tab="players"]').click();
                document.getElementById('playerFilter').value = searchQuery.trim();
                currentPage = 1;
                applyPlayerFilters(searchQuery.trim(), selectedTeamId);
            }
            
            // 定期的にデータを更新（5分ごと）
            setInterval(async () => {
                if (!isDataLoading) {
                    console.log('🔄 バックグラウンドでデータを更新中...');
                    await Promise.all([
                        loadAllTeams(true), // サイレント更新
                        loadAllPlayers(true) // サイレント更新
                    ]);
                }
            }, 5 * 60 * 1000); // 5分
        }
        
        // 全チームデータを読み込み（data/teams.json を直接取得）
        async function loadAllTeams(silent = false) {
            try {
                if (!silent) {
                    const grid = document.getElementById('teamsGrid');
                    if (grid) grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>チームデータを読み込み中...</p></div>';
                }
                const response = await fetch('/data/teams.json', { cache: 'no-store' });
                const data = await response.json();
                teams = Array.isArray(data) ? data : (data.teams || []);
                dataLastUpdated = new Date();
                if (!silent) displayTeams(teams);
                console.log(`✅ ${teams.length}チームを読み込みました`);
            } catch (error) {
                console.error('Error loading teams:', error);
                if (!silent) {
                    document.getElementById('teamsGrid').innerHTML = 
                        '<div class="no-results">チームデータの読み込みに失敗しました</div>';
                }
            }
        }
        
        // 全選手データを読み込み（data/players.json を直接取得）
        async function loadAllPlayers(silent = false) {
            if (isDataLoading && !silent) return;
            try {
                isDataLoading = true;
                if (!silent) {
                    const grid = document.getElementById('playersGrid');
                    if (grid) grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>選手データを読み込み中...（97MB・数十秒かかります）</p></div>';
                }
                const response = await fetch('/data/players.json', { cache: 'no-store' });
                const data = await response.json();
                allPlayers = Array.isArray(data) ? data : (data.players || []);
                filteredPlayers = [...allPlayers];
                dataLastUpdated = new Date();
                if (!silent) applyPlayerFilters();
                console.log(`✅ ${allPlayers.length}名の選手を読み込みました`);
            } catch (error) {
                console.error('Error loading players:', error);
                if (!silent) {
                    document.getElementById('playersGrid').innerHTML = 
                        '<div class="no-results">選手データの読み込みに失敗しました</div>';
                }
            } finally {
                isDataLoading = false;
            }
        }

        // Display leagues
        function displayLeagues(data) {
            const grid = document.getElementById('leaguesGrid');
            
            if (data.length === 0) {
                grid.innerHTML = '<div class="no-results">リーグが見つかりませんでした</div>';
                return;
            }

            grid.innerHTML = data.map(league => `
                <div class="league-card" onclick="selectLeague('${league.id}')">
                    <div class="league-header">
                        <div class="league-flag">${league.flag}</div>
                        <div class="league-info">
                            <h3>${league.name}</h3>
                            <p>${league.country}</p>
                        </div>
                    </div>
                    <div class="league-stats">
                        <div class="league-stat">
                            <span>⚽</span>
                            <span>${league.teams} チーム</span>
                        </div>
                        <div class="league-stat">
                            <span>👤</span>
                            <span>${league.players} 選手</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter leagues
        function filterLeagues() {
            const query = document.getElementById('leagueFilter').value.toLowerCase();
            const filtered = leagueData.filter(l => 
                l.name.toLowerCase().includes(query) || 
                l.country.toLowerCase().includes(query)
            );
            displayLeagues(filtered);
        }

        // チームをフィルタリングして表示（メモリから）
        function filterAndDisplayTeams(searchQuery = '', leagueId = null) {
            let filtered = [...teams];
            
            // リーグIDでフィルタリング
            if (leagueId) {
                filtered = filtered.filter(team => team.leagueId === leagueId);
            }
            
            // 検索クエリでフィルタリング
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(team => {
                    const searchFields = [
                        team.name,
                        team.leagueName,
                        team.country,
                        team.venue
                    ].filter(Boolean);
                    return searchFields.some(field => field.toLowerCase().includes(query));
                });
            }
            
            displayTeams(filtered);
        }

        // Display teams
        function displayTeams(data) {
            const grid = document.getElementById('teamsGrid');
            
            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="no-results">チームが見つかりませんでした</div>';
                return;
            }

            grid.innerHTML = data.slice(0, 100).map(team => `
                <div class="team-card" onclick="selectTeam(${team.id || team.teamId || 0})">
                    <div class="team-header">
                        <div class="team-logo">
                            ${team.logo ? `<img src="${team.logo}" alt="${team.name}" onerror="this.parentElement.innerHTML='⚽'">` : '⚽'}
                        </div>
                        <div class="team-info">
                            <h3>${team.name}</h3>
                            <p>${team.leagueName || team.league || team.country || 'Unknown'}</p>
                        </div>
                    </div>
                    <div class="team-stats">
                        <div class="league-stat">
                            <span>🏟️</span>
                            <span>${team.venue || team.venueCity || 'Unknown'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter teams
        function filterTeams() {
            const query = document.getElementById('teamFilter').value.trim();
            // メモリから即座にフィルタリング
            filterAndDisplayTeams(query, selectedLeagueId);
        }

        // 選手フィルターを適用（メモリから即座に）
        function applyPlayerFilters(search = '', teamId = null, teamName = null) {
            // チーム名を取得
            let filterTeamName = teamName;
            if (teamId && !filterTeamName && teams && teams.length > 0) {
                const team = teams.find(t => t.id === parseInt(teamId) || t.teamId === parseInt(teamId));
                if (team) {
                    filterTeamName = team.name;
                }
            }
            
            if (teamId) {
                console.log(`🔍 チームでフィルタリング: ${filterTeamName || 'Unknown'} (ID: ${teamId})`);
            }
            
            // メモリから即座にフィルタリング
            filteredPlayers = [...allPlayers];
            
            // 検索クエリでフィルタリング
            if (search) {
                const query = search.toLowerCase().trim();
                const queryWords = query.split(' ').filter(w => w.length > 0);
                
                filteredPlayers = filteredPlayers.filter(player => {
                    const searchFields = [
                        player.name,
                        player.fullName,
                        player.firstName,
                        player.lastName,
                        player.currentTeam,
                        player.nationality
                    ].filter(Boolean);
                    
                    const fieldText = searchFields.join(' ').toLowerCase();
                    
                    if (queryWords.length > 1) {
                        return queryWords.every(word => fieldText.includes(word));
                    } else {
                        return fieldText.includes(query);
                    }
                });
            }
            
            // チームIDでフィルタリング
            if (teamId) {
                const teamIdNum = parseInt(teamId);
                const beforeFilter = filteredPlayers.length;
                filteredPlayers = filteredPlayers.filter(player => {
                    const matchesId = player.teamId === teamIdNum || 
                                     player.currentTeamId === teamIdNum ||
                                     player.team?.id === teamIdNum;
                    const matchesName = filterTeamName && (
                        (player.currentTeam && player.currentTeam.toLowerCase() === filterTeamName.toLowerCase()) ||
                        (player.teamName && player.teamName.toLowerCase() === filterTeamName.toLowerCase()) ||
                        (player.team && player.team.name && player.team.name.toLowerCase() === filterTeamName.toLowerCase())
                    );
                    return matchesId || matchesName;
                });
                console.log(`✅ フィルタリング後: ${filteredPlayers.length}名 (${beforeFilter} → ${filteredPlayers.length})`);
                if (filteredPlayers.length > 0) {
                    console.log(`   サンプル: ${filteredPlayers[0].name} (teamId: ${filteredPlayers[0].teamId}, currentTeam: ${filteredPlayers[0].currentTeam})`);
                } else {
                    console.warn(`⚠️ フィルタリング結果が0件です。teamId: ${teamIdNum}, teamName: ${filterTeamName}`);
                }
            }
            
            // 表示を更新
            displayPlayers(filteredPlayers);
            
            // ページネーションを更新
            const totalPages = Math.ceil(filteredPlayers.length / playersPerPage);
            updatePagination(totalPages, filteredPlayers.length);
        }

        // Display players
        function displayPlayers(data) {
            const grid = document.getElementById('playersGrid');
            
            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="no-results">選手が見つかりませんでした</div>';
                return;
            }

            // ページネーション対応: 現在のページの選手のみを表示
            const startIndex = (currentPage - 1) * playersPerPage;
            const endIndex = startIndex + playersPerPage;
            const paginatedData = data.slice(startIndex, endIndex);
            
            if (dataLastUpdated) {
                const updateTime = new Date(dataLastUpdated);
                const timeStr = updateTime.toLocaleTimeString('ja-JP');
                console.log(`📊 表示中: ${paginatedData.length}名 / 全${data.length}名 (更新: ${timeStr})`);
            }
            
            grid.innerHTML = paginatedData.map(player => `
                <div class="player-card" onclick="selectPlayer(${player.playerId || player.id || 0})">
                    <div class="player-header">
                        <div class="player-avatar">
                            ${player.photo ? 
                                `<img src="${player.photo}" alt="${player.name}" onerror="this.parentElement.innerHTML='${getInitials(player.name)}'">` : 
                                getInitials(player.name)}
                        </div>
                        <div class="player-info">
                            <h3>${player.name}</h3>
                            <p>${player.currentTeam || player.teamName || 'Unknown Team'}</p>
                            <span class="position-badge">${translatePosition(player.position)}</span>
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="player-stat">
                            <span class="player-stat-value">${getPlayerGoals(player)}</span>
                            <span class="player-stat-label">ゴール</span>
                        </div>
                        <div class="player-stat">
                            <span class="player-stat-value">${getPlayerAssists(player)}</span>
                            <span class="player-stat-label">アシスト</span>
                        </div>
                        <div class="player-stat">
                            <span class="player-stat-value">${getPlayerAppearances(player)}</span>
                            <span class="player-stat-label">出場</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Get player initials
        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        }

        // Translate position
        function translatePosition(pos) {
            if (!pos) return 'Unknown';
            const positions = {
                'Goalkeeper': 'GK',
                'Defender': 'DF',
                'Midfielder': 'MF',
                'Attacker': 'FW',
                'Forward': 'FW',
                'GK': 'GK',
                'DF': 'DF',
                'MF': 'MF',
                'FW': 'FW'
            };
            return positions[pos] || pos;
        }

        // 2025/26 一覧用スタッツ（lib/player-stats-consistency.js および player-detail.html と同じ合算ルール）
        const FHJ_CURRENT_SEASON_KEY = '2025-2026';

        function fhjIsSeason2025_26(raw) {
            if (raw == null || raw === '') return false;
            const s = String(raw).trim();
            if (s === '2025' || s === '2025/26' || s === '2025/2026' || s === '2025-2026') return true;
            if (/2025.*2026/.test(s)) return true;
            if (/^2025\//.test(s)) return true;
            return false;
        }

        function fhjDedupeCompetitionStats(statsArray) {
            if (!Array.isArray(statsArray) || statsArray.length === 0) return [];
            const byKey = new Map();
            for (const st of statsArray) {
                if (!st) continue;
                const league = String(st.leagueName || st.league || '').toLowerCase().trim();
                const season = String(st.season || '');
                const key = `${season}::${league}::${String(st.teamName || st.team || '')}`;
                const apps = Number(st.appearances || st.matches || st.lineups || 0);
                const prev = byKey.get(key);
                if (!prev) {
                    byKey.set(key, st);
                    continue;
                }
                const prevApps = Number(prev.appearances || prev.matches || prev.lineups || 0);
                const prevTs = prev.lastUpdated ? new Date(prev.lastUpdated).getTime() : 0;
                const curTs = st.lastUpdated ? new Date(st.lastUpdated).getTime() : 0;
                if (apps > prevApps || (apps === prevApps && curTs >= prevTs)) {
                    byKey.set(key, st);
                }
            }
            return Array.from(byKey.values());
        }

        function fhjBuildSeason2526FromStatsArray(statsArray) {
            if (!Array.isArray(statsArray)) return null;
            const seasonRows = statsArray.filter((s) => s && fhjIsSeason2025_26(s.season));
            if (seasonRows.length === 0) return null;
            const deduped = fhjDedupeCompetitionStats(seasonRows);
            let goals = 0;
            let assists = 0;
            let appearances = 0;
            let minutes = 0;
            let ratingWeighted = 0;
            let ratingW = 0;
            for (const st of deduped) {
                goals += Number(st.goals || 0);
                assists += Number(st.assists || 0);
                const apps = Number(st.appearances || st.matches || st.lineups || 0);
                appearances += apps;
                minutes += Number(st.minutes || 0);
                const r =
                    st.rating != null && st.rating !== 'N/A'
                        ? parseFloat(String(st.rating).replace(',', '.'))
                        : null;
                if (r != null && !Number.isNaN(r) && apps > 0) {
                    ratingWeighted += r * apps;
                    ratingW += apps;
                }
            }
            const rating = ratingW > 0 ? Math.round((ratingWeighted / ratingW) * 100) / 100 : null;
            return {
                goals,
                assists,
                appearances,
                minutes,
                rating: rating != null ? String(rating) : 'N/A'
            };
        }

        function fhjListSeason2025_26Stats(player) {
            if (!player) {
                return { goals: 0, assists: 0, appearances: 0 };
            }
            if (Array.isArray(player.stats) && player.stats.length) {
                const a = fhjBuildSeason2526FromStatsArray(player.stats);
                if (a) return a;
            }
            if (player.stats && typeof player.stats === 'object' && !Array.isArray(player.stats)) {
                const s = player.stats;
                if (fhjIsSeason2025_26(s.season || player.season)) {
                    const apps = Number(s.appearances || s.matches || s.lineups || 0);
                    return {
                        goals: Number(s.goals || 0),
                        assists: Number(s.assists || 0),
                        appearances: apps,
                        minutes: Number(s.minutes || 0),
                        rating: s.rating != null ? String(s.rating) : 'N/A'
                    };
                }
            }
            if (player.seasons && player.seasons[FHJ_CURRENT_SEASON_KEY] && player.seasons[FHJ_CURRENT_SEASON_KEY].stats) {
                return player.seasons[FHJ_CURRENT_SEASON_KEY].stats;
            }
            return { goals: 0, assists: 0, appearances: 0, minutes: 0, rating: 'N/A' };
        }

        function getPlayerGoals(player) {
            return fhjListSeason2025_26Stats(player).goals;
        }

        function getPlayerAssists(player) {
            return fhjListSeason2025_26Stats(player).assists;
        }

        function getPlayerAppearances(player) {
            return fhjListSeason2025_26Stats(player).appearances;
        }

        // Update pagination
        function updatePagination(totalPages, totalPlayers) {
            const pagination = document.getElementById('playersPagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            
            if (currentPage > 1) {
                html += `<button class="page-btn" onclick="changePage(${currentPage - 1})">前へ</button>`;
            }

            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            if (currentPage < totalPages) {
                html += `<button class="page-btn" onclick="changePage(${currentPage + 1})">次へ</button>`;
            }

            pagination.innerHTML = html;
        }

        // Change page
        function changePage(page) {
            currentPage = page;
            const search = document.getElementById('playerFilter').value;
            // メモリから即座にフィルタリング
            applyPlayerFilters(search, selectedTeamId);
        }

        // Navigation functions
        async function selectLeague(leagueId) {
            // リーグIDを取得
            const league = leagueData.find(l => l.id === leagueId);
            if (!league) return;
            
            selectedLeagueId = league.leagueId;
            selectedTeamId = null; // チーム選択をリセット
            
            // チームタブに切り替え
            document.querySelector('[data-tab="teams"]').click();
            
            // チームがまだ読み込まれていない場合は先に読み込む
            if (teams.length === 0) {
                const grid = document.getElementById('teamsGrid');
                if (grid) grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>チームデータを読み込み中...</p></div>';
                await loadAllTeams();
            }
            
            // リーグでフィルタリングしてチームを表示
            filterAndDisplayTeams('', selectedLeagueId);
            
            // チームフィルターをクリア
            document.getElementById('teamFilter').value = '';
        }

        function selectTeam(teamId) {
            const teamIdNum = parseInt(teamId);
            selectedTeamId = teamIdNum;
            
            // チーム名を取得
            let teamName = null;
            if (teams && teams.length > 0) {
                const team = teams.find(t => t.id === teamIdNum || t.teamId === teamIdNum);
                if (team) {
                    teamName = team.name;
                }
            }
            
            console.log(`🏆 チーム選択: ID=${teamIdNum}, Name=${teamName || 'Unknown'}`);
            
            // 選手タブに切り替え
            document.querySelector('[data-tab="players"]').click();
            
            // チームでフィルタリングして選手を表示（メモリから即座に）
            currentPage = 1;
            applyPlayerFilters('', selectedTeamId, teamName);
            
            // 選手フィルターをクリア
            document.getElementById('playerFilter').value = '';
        }

        function selectPlayer(playerId) {
            window.location.href = `/player/${playerId}`;
        }

        // Global search
        function performGlobalSearch() {
            const query = document.getElementById('globalSearch').value.trim();
            if (!query) return;

            // Search in players tab
            document.querySelector('[data-tab="players"]').click();
            document.getElementById('playerFilter').value = query;
            currentPage = 1;
            // メモリから即座にフィルタリング
            applyPlayerFilters(query, selectedTeamId);
        }
    </script>
