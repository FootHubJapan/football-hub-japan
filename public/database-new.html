<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotMobスタイル データベース - Football Hub Japan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0d1117;
            --foreground: #f0f6fc;
            --card: #161b22;
            --card-hover: #1c2128;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --secondary: #21262d;
            --muted: #8b949e;
            --border: #30363d;
            --border-light: rgba(48, 54, 61, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--foreground);
            line-height: 1.6;
        }

        .header {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
        }

        .logo {
            color: var(--primary);
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo::before {
            content: '⚡';
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            font-size: 1rem;
        }

        .nav-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .nav-btn {
            background: var(--secondary);
            color: var(--muted);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--primary);
            color: var(--background);
            border-color: var(--primary);
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
            font-weight: 700;
        }

        .page-subtitle {
            color: var(--muted);
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* FotMob-style layout */
        .fotmob-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            height: calc(100vh - 200px);
        }

        .sidebar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .main-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .filter-section {
            margin-bottom: 1.5rem;
        }

        .filter-title {
            color: var(--primary);
            font-size: 1rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .filter-group {
            margin-bottom: 1rem;
        }

        .filter-label {
            color: var(--muted);
            font-size: 0.8125rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .filter-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--foreground);
            font-size: 0.875rem;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filter-select {
            width: 100%;
            padding: 0.75rem;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--foreground);
            font-size: 0.875rem;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .player-card {
            background: var(--secondary);
            border-radius: 12px;
            padding: 1.25rem;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .player-card:hover {
            transform: translateY(-4px);
            border-color: rgba(34, 197, 94, 0.5);
            background: var(--card-hover);
        }

        .player-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .player-avatar {
            width: 56px;
            height: 56px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--background);
            margin-right: 1rem;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            color: var(--foreground);
            font-size: 1.0625rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .player-team {
            color: var(--primary);
            font-size: 0.875rem;
        }

        .player-position {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .player-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .action-btn {
            background: var(--secondary);
            color: var(--foreground);
            border: 1px solid var(--border);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .plan-btn:hover {
            background: var(--primary);
            color: var(--background);
            border-color: var(--primary);
        }

        .radar-btn:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .stat-item {
            text-align: center;
            padding: 0.625rem;
            background: var(--card);
            border-radius: 8px;
        }

        .stat-value {
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.6875rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .page-btn {
            background: var(--secondary);
            color: var(--foreground);
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: var(--primary);
            color: var(--background);
            border-color: var(--primary);
        }

        .page-btn.active {
            background: var(--primary);
            color: var(--background);
            border-color: var(--primary);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--primary);
        }

        .error {
            text-align: center;
            padding: 2rem;
            color: #f85149;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--card);
            padding: 1.25rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-card-value {
            color: var(--primary);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-card-label {
            color: var(--muted);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .header {
                padding: 0 1rem;
            }

            .nav-buttons {
                display: none;
            }

            .fotmob-layout {
                grid-template-columns: 1fr;
            }
            
            .players-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-overview {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Football Hub Japan</a>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/dashboard.html'">ダッシュボード</button>
            <button class="nav-btn" onclick="window.location.href='/radar-enhanced.html'">レーダーチャート</button>
            <button class="nav-btn" onclick="window.location.href='/ranking.html'">ランキング</button>
            <button class="nav-btn" onclick="window.location.href='/ai-agent-enhanced.html'">AI分析</button>
            <button class="nav-btn" onclick="window.location.href='/'">ログアウト</button>
        </div>
    </header>

    <div class="main-container">
        <h1 class="page-title">FotMobスタイル データベース</h1>
        <p class="page-subtitle">常時表示される選手データベース</p>

        <div class="stats-overview">
            <div class="stat-card">
                <div class="stat-card-value" id="totalPlayers">-</div>
                <div class="stat-card-label">総選手数</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="totalTeams">-</div>
                <div class="stat-card-label">総チーム数</div>
        </div>
            <div class="stat-card">
                <div class="stat-card-value" id="totalLeagues">-</div>
                <div class="stat-card-label">総リーグ数</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="lastUpdate">-</div>
                <div class="stat-card-label">最終更新</div>
            </div>
        </div>

        <div class="fotmob-layout">
            <div class="sidebar">
                <div class="filter-section">
                    <h3 class="filter-title">🔍 フィルター</h3>
                    
                    <div class="filter-group">
                        <label class="filter-label">検索</label>
                        <input type="text" id="searchInput" class="filter-input" placeholder="選手名、チーム名、国籍...">
                </div>
                
                    <div class="filter-group">
                        <label class="filter-label">リーグ</label>
                        <select id="leagueSelect" class="filter-select">
                            <option value="">すべてのリーグ</option>
                    </select>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">ポジション</label>
                        <select id="positionSelect" class="filter-select">
                        <option value="">すべてのポジション</option>
                        <option value="Forward">フォワード</option>
                            <option value="Midfielder">ミッドフィルダー</option>
                            <option value="Defender">ディフェンダー</option>
                            <option value="Goalkeeper">ゴールキーパー</option>
                    </select>
                </div>
            </div>
        </div>

            <div class="main-content">
                <div id="playersContainer" class="players-grid">
                    <div class="loading">データを読み込み中...</div>
        </div>

                <div id="pagination" class="pagination"></div>
            </div>
        </div>
            </div>

    <script src="/ai-widget.js"></script>
    <script>
        let currentPage = 1;
        let currentFilters = {};
        let totalPlayers = 0;
        let totalPages = 0;
        let allPlayers = []; // 全選手データを保持

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            initializeData();
            setupEventListeners();
            getPlayerFromUrl(); // URLパラメータから選手情報を取得
        });

        async function initializeData() {
            try {
                // Initialize FotMob service
                const initResponse = await fetch('/api/fotmob/init');
                const initData = await initResponse.json();
                console.log('FotMob service initialized:', initData);

                // Load initial data
                await loadPlayers();
                await loadStats();
                await loadLeagues();
            } catch (error) {
                console.error('Error initializing data:', error);
                // Even if initialization fails, try to load fallback data
                await loadFallbackData();
            }
        }

        async function loadFallbackData() {
            try {
                console.log('Loading fallback data...');
                
                // Load fallback players
                const playersResponse = await fetch('/api/fotmob/players');
                const playersData = await playersResponse.json();
                
                if (playersData.players && playersData.players.length > 0) {
                    displayPlayers(playersData.players);
                    totalPlayers = playersData.total;
                    totalPages = playersData.totalPages;
                    updatePagination();
                }

                // Load fallback stats
                await loadStats();
                
                // Load fallback leagues
                await loadLeagues();
                
                console.log('Fallback data loaded successfully');
            } catch (error) {
                console.error('Error loading fallback data:', error);
                showError('データの読み込みに失敗しました。ページを再読み込みしてください。');
            }
        }

        async function loadPlayers() {
            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    limit: 20,
                    ...currentFilters
                });

                const response = await fetch(`/api/fotmob/players?${params}`);
                const data = await response.json();

                if (data.players) {
                    displayPlayers(data.players);
                    totalPlayers = data.total;
                    totalPages = data.totalPages;
                    updatePagination();
            } else {
                    showError('選手データの取得に失敗しました');
                }
            } catch (error) {
                console.error('Error loading players:', error);
                showError('選手データの読み込みに失敗しました');
            }
        }

        async function loadStats() {
            try {
                const [playersResponse, teamsResponse, leaguesResponse] = await Promise.all([
                    fetch('/api/fotmob/players'),
                    fetch('/api/fotmob/teams'),
                    fetch('/api/fotmob/leagues')
                ]);

                const playersData = await playersResponse.json();
                const teamsData = await teamsResponse.json();
                const leaguesData = await leaguesResponse.json();

                document.getElementById('totalPlayers').textContent = playersData.total || 0;
                document.getElementById('totalTeams').textContent = teamsData.length || 0;
                document.getElementById('totalLeagues').textContent = leaguesData.length || 0;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('ja-JP');
                    } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadLeagues() {
            try {
                const response = await fetch('/api/fotmob/leagues');
                const leagues = await response.json();

                const leagueSelect = document.getElementById('leagueSelect');
                leagueSelect.innerHTML = '<option value="">すべてのリーグ</option>';

                leagues.forEach(league => {
                    const option = document.createElement('option');
                    option.value = league.id;
                    option.textContent = `${league.name} (${league.country})`;
                    leagueSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading leagues:', error);
            }
        }

        function displayPlayers(players) {
            const container = document.getElementById('playersContainer');
            allPlayers = players; // グローバル変数に保存
            
            if (players.length === 0) {
                container.innerHTML = '<div class="error">選手が見つかりませんでした</div>';
                                    return;
            }

            container.innerHTML = players.map(player => `
                <div class="player-card" onclick="navigateToPlayerDetail(${player.id})" style="cursor: pointer;">
                    <div class="player-header">
                        <div class="player-avatar">
                            ${player.name.split(' ').map(n => n[0]).join('').toUpperCase()}
                        </div>
                                <div class="player-info">
                            <div class="player-name">${player.name}</div>
                            <div class="player-team">${player.teamName || 'Unknown Team'}</div>
                            <div class="player-position">${player.position || 'Unknown Position'}</div>
                                </div>
                            </div>
                    <div class="player-stats">
                            <div class="stat-item">
                            <div class="stat-value">${player.nationality || 'N/A'}</div>
                            <div class="stat-label">国籍</div>
                            </div>
                            <div class="stat-item">
                            <div class="stat-value">${player.shirtNumber || 'N/A'}</div>
                            <div class="stat-label">背番号</div>
                            </div>
                            <div class="stat-item">
                            <div class="stat-value">${player.dateOfBirth ? new Date(player.dateOfBirth).getFullYear() : 'N/A'}</div>
                            <div class="stat-label">生年</div>
                            </div>
                            </div>
                    <div class="player-actions">
                        <button class="action-btn plan-btn" onclick="createPlayerPlan(${player.id})" title="プラン作成">
                            📋 プラン作成
                        </button>
                        <button class="action-btn radar-btn" onclick="viewPlayerRadar(${player.id})" title="レーダーチャート">
                            📈 レーダー
                        </button>
                            </div>
                            </div>
            `).join('');
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // Previous button
            if (currentPage > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'page-btn';
                prevBtn.textContent = '前へ';
                prevBtn.onclick = () => changePage(currentPage - 1);
                pagination.appendChild(prevBtn);
            }

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    const pageBtn = document.createElement('button');
                    pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                    pageBtn.textContent = i;
                    pageBtn.onclick = () => changePage(i);
                    pagination.appendChild(pageBtn);
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.color = '#888888';
                    ellipsis.style.padding = '0.5rem';
                    pagination.appendChild(ellipsis);
                }
            }

            // Next button
            if (currentPage < totalPages) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'page-btn';
                nextBtn.textContent = '次へ';
                nextBtn.onclick = () => changePage(currentPage + 1);
                pagination.appendChild(nextBtn);
            }
        }

        function changePage(page) {
            currentPage = page;
            loadPlayers();
        }

        function setupEventListeners() {
            // Search input
            const searchInput = document.getElementById('searchInput');
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentFilters.search = e.target.value;
                    currentPage = 1;
                    loadPlayers();
                }, 500);
            });

            // League select
            const leagueSelect = document.getElementById('leagueSelect');
            leagueSelect.addEventListener('change', (e) => {
                currentFilters.league = e.target.value;
                currentPage = 1;
                loadPlayers();
            });

            // Position select
            const positionSelect = document.getElementById('positionSelect');
            positionSelect.addEventListener('change', (e) => {
                currentFilters.position = e.target.value;
            currentPage = 1;
                loadPlayers();
            });
        }

        function showPlayerDetails(playerId) {
            // プランページで選手の詳細プランを作成
            const player = allPlayers.find(p => p.id === playerId || p.id === String(playerId));
            if (player) {
                const url = `plans.html?player=${playerId}&name=${encodeURIComponent(player.name)}&action=create-plan`;
                window.open(url, '_blank');
            }
        }

        function navigateToPlayerDetail(playerId) {
            // 選手詳細ページに遷移
            window.location.href = `/player/${playerId}`;
        }

        // プランページとの連携機能
        function createPlayerPlan(playerId) {
            const player = players.find(p => p.id === playerId);
            if (player) {
                const url = `plans.html?player=${playerId}&name=${encodeURIComponent(player.name)}&action=create-plan`;
                window.open(url, '_blank');
            }
        }

        function viewPlayerRadar(playerId) {
            const player = players.find(p => p.id === playerId);
            if (player) {
                const url = `radar.html?player=${playerId}&name=${encodeURIComponent(player.name)}`;
                window.open(url, '_blank');
            }
        }

        // URLパラメータから選手情報を取得
        function getPlayerFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerId = urlParams.get('player');
            const playerName = urlParams.get('name');
            
            if (playerId && playerName) {
                // 該当選手を検索して表示
                currentFilters.search = playerName;
                loadPlayers();
                
                // 選手が見つかった場合、詳細表示
                setTimeout(() => {
                    const player = allPlayers.find(p => p.id == playerId);
                    if (player) {
                        showPlayerDetails(playerId);
                    }
                }, 1000);
            }
        }

        function showError(message) {
            const container = document.getElementById('playersContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
        }
    </script>
</body>
</html>
