<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サッカーデータベース - Football Hub Japan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0a0a0a;
            --foreground: #fafafa;
            --card: #171717;
            --card-hover: #1f1f1f;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --secondary: #262626;
            --muted: #a1a1aa;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--foreground);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
        }

        .logo {
            color: var(--foreground);
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            font-size: 1rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--foreground);
        }

        .nav-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .login-btn {
            color: var(--foreground);
            background: transparent;
            border: none;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .cta-btn {
            background: var(--primary);
            color: #000;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cta-btn:hover {
            background: var(--primary-hover);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: radial-gradient(ellipse at top, rgba(34, 197, 94, 0.1), transparent 50%);
        }

        .badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.1);
            color: var(--primary);
            padding: 0.375rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .hero p {
            color: var(--muted);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }

        /* Search Box */
        .search-container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            gap: 0.75rem;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1.25rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--foreground);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        .search-btn {
            background: var(--primary);
            color: #000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: var(--primary-hover);
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 2rem;
            background: var(--secondary);
            border-radius: 12px;
            padding: 0.25rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .tab {
            flex: 1;
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--muted);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--card);
            color: var(--foreground);
        }

        .tab:hover:not(.active) {
            color: var(--foreground);
        }

        /* Filter Input */
        .filter-container {
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .filter-input-wrapper {
            position: relative;
        }

        .filter-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--foreground);
            font-size: 0.875rem;
            outline: none;
        }

        .filter-input:focus {
            border-color: var(--primary);
        }

        .filter-input::placeholder {
            color: var(--muted);
        }

        .filter-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* League Card */
        .league-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .league-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .league-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .league-flag {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: var(--secondary);
        }

        .league-info h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .league-info p {
            color: var(--muted);
            font-size: 0.875rem;
        }

        .league-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--muted);
            font-size: 0.875rem;
        }

        .league-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Team Card */
        .team-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .team-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .team-logo {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: var(--secondary);
            overflow: hidden;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .team-info h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .team-info p {
            color: var(--muted);
            font-size: 0.875rem;
        }

        .team-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--muted);
            font-size: 0.875rem;
        }

        /* Player Card */
        .player-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .player-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .player-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), #059669);
            color: #000;
            overflow: hidden;
        }

        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-info h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .player-info p {
            color: var(--muted);
            font-size: 0.875rem;
        }

        .player-stats {
            display: flex;
            gap: 1.5rem;
            color: var(--muted);
            font-size: 0.875rem;
        }

        .player-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-stat-value {
            color: var(--foreground);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .player-stat-label {
            font-size: 0.75rem;
        }

        /* Position Badge */
        .position-badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.1);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .page-btn {
            padding: 0.5rem 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--foreground);
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            border-color: var(--primary);
        }

        .page-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 0 1rem;
            }

            .nav-links {
                display: none;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .search-container {
                flex-direction: column;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">
            <span class="logo-icon">⚡</span>
            Football Hub
        </a>
        <nav class="nav-links">
            <a href="/database" class="nav-link active">データベース</a>
            <a href="/radar" class="nav-link">レーダーチャート</a>
            <a href="/schedule" class="nav-link">試合分析</a>
            <a href="/schedule" class="nav-link">スケジュール</a>
            <a href="/ai-agent" class="nav-link">AI分析</a>
            <a href="/ranking" class="nav-link">ランキング</a>
        </nav>
        <div class="nav-right">
            <button class="login-btn" onclick="window.location.href='/login'">ログイン</button>
            <button class="cta-btn" onclick="window.location.href='/login'">無料で始める</button>
        </div>
    </header>

    <section class="hero">
        <span class="badge">データベース</span>
        <h1>サッカーデータベース</h1>
        <p>世界中のリーグ、チーム、選手の詳細なデータを網羅。リアルタイムで更新される統計情報にアクセス。</p>
        <div class="search-container">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="globalSearch" class="search-input" placeholder="チーム名、選手名、リーグ名で検索...">
            </div>
            <button class="search-btn" onclick="performGlobalSearch()">検索</button>
        </div>
    </section>

    <main class="main-content">
        <div class="tabs">
            <button class="tab active" data-tab="leagues">リーグ</button>
            <button class="tab" data-tab="teams">チーム</button>
            <button class="tab" data-tab="players">選手</button>
        </div>

        <!-- Leagues Tab -->
        <div id="leagues-content" class="tab-content active">
            <div class="filter-container">
                <div class="filter-input-wrapper">
                    <span class="filter-icon">🔍</span>
                    <input type="text" id="leagueFilter" class="filter-input" placeholder="リーグ名、国名で検索...">
                </div>
            </div>
            <div id="leaguesGrid" class="cards-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>リーグデータを読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- Teams Tab -->
        <div id="teams-content" class="tab-content">
            <div class="filter-container">
                <div class="filter-input-wrapper">
                    <span class="filter-icon">🔍</span>
                    <input type="text" id="teamFilter" class="filter-input" placeholder="チーム名、リーグ名で検索...">
                </div>
            </div>
            <div id="teamsGrid" class="cards-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>チームデータを読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- Players Tab -->
        <div id="players-content" class="tab-content">
            <div class="filter-container">
                <div class="filter-input-wrapper">
                    <span class="filter-icon">🔍</span>
                    <input type="text" id="playerFilter" class="filter-input" placeholder="選手名、チーム名、国籍で検索...">
                </div>
            </div>
            <div id="playersGrid" class="cards-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>選手データを読み込み中...</p>
                </div>
            </div>
            <div id="playersPagination" class="pagination"></div>
        </div>
    </main>

    <script src="/ai-widget.js"></script>
    <script>
        // Data
        let leagues = [];
        let teams = [];
        let players = [];
        let currentPage = 1;
        const playersPerPage = 20;
        let selectedLeagueId = null; // 選択中のリーグID
        let selectedTeamId = null; // 選択中のチームID

        // League data with flags and API league IDs
        const leagueData = [
            { id: 'j1', name: 'Jリーグ', country: '日本', flag: '🇯🇵', teams: 20, players: 560, leagueId: 98 },
            { id: 'pl', name: 'プレミアリーグ', country: 'イングランド', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', teams: 20, players: 520, leagueId: 39 },
            { id: 'laliga', name: 'ラ・リーガ', country: 'スペイン', flag: '🇪🇸', teams: 20, players: 500, leagueId: 140 },
            { id: 'seriea', name: 'セリエA', country: 'イタリア', flag: '🇮🇹', teams: 20, players: 520, leagueId: 135 },
            { id: 'bundesliga', name: 'ブンデスリーガ', country: 'ドイツ', flag: '🇩🇪', teams: 18, players: 480, leagueId: 78 },
            { id: 'ligue1', name: 'リーグ・アン', country: 'フランス', flag: '🇫🇷', teams: 18, players: 460, leagueId: 61 }
        ];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupTabs();
            setupFilters();
            loadData();
        });

        // Setup tabs
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    document.querySelectorAll('.tab-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    document.getElementById(`${tab.dataset.tab}-content`).classList.add('active');
                    
                    // タブ切り替え時に選択状態をリセット（オプション）
                    // コメントアウトしているので、選択状態は保持されます
                    // if (tab.dataset.tab === 'leagues') {
                    //     selectedLeagueId = null;
                    //     selectedTeamId = null;
                    // }
                });
            });
        }

        // Setup filters
        function setupFilters() {
            document.getElementById('leagueFilter').addEventListener('input', filterLeagues);
            document.getElementById('teamFilter').addEventListener('input', filterTeams);
            
            let playerTimeout;
            document.getElementById('playerFilter').addEventListener('input', (e) => {
                clearTimeout(playerTimeout);
                playerTimeout = setTimeout(() => {
                    currentPage = 1;
                    loadPlayers(e.target.value);
                }, 300);
            });

            document.getElementById('globalSearch').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performGlobalSearch();
            });
        }

        // Load all data
        async function loadData() {
            displayLeagues(leagueData);
            await loadTeams();
            await loadPlayers();
        }

        // Display leagues
        function displayLeagues(data) {
            const grid = document.getElementById('leaguesGrid');
            
            if (data.length === 0) {
                grid.innerHTML = '<div class="no-results">リーグが見つかりませんでした</div>';
                return;
            }

            grid.innerHTML = data.map(league => `
                <div class="league-card" onclick="selectLeague('${league.id}')">
                    <div class="league-header">
                        <div class="league-flag">${league.flag}</div>
                        <div class="league-info">
                            <h3>${league.name}</h3>
                            <p>${league.country}</p>
                        </div>
                    </div>
                    <div class="league-stats">
                        <div class="league-stat">
                            <span>⚽</span>
                            <span>${league.teams} チーム</span>
                        </div>
                        <div class="league-stat">
                            <span>👤</span>
                            <span>${league.players} 選手</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter leagues
        function filterLeagues() {
            const query = document.getElementById('leagueFilter').value.toLowerCase();
            const filtered = leagueData.filter(l => 
                l.name.toLowerCase().includes(query) || 
                l.country.toLowerCase().includes(query)
            );
            displayLeagues(filtered);
        }

        // Load teams
        async function loadTeams(searchQuery = '', leagueId = null) {
            try {
                let url = '/api/fotmob/teams';
                const params = new URLSearchParams();
                
                if (searchQuery) {
                    params.append('query', searchQuery);
                }
                if (leagueId) {
                    params.append('league', leagueId);
                }
                
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                const response = await fetch(url);
                const data = await response.json();
                const allTeams = data.teams || data || [];
                
                // リーグIDでフィルタリング
                if (leagueId) {
                    teams = allTeams.filter(team => team.leagueId === leagueId);
                } else {
                    teams = allTeams;
                }
                
                displayTeams(teams);
            } catch (error) {
                console.error('Error loading teams:', error);
                document.getElementById('teamsGrid').innerHTML = 
                    '<div class="no-results">チームデータの読み込みに失敗しました</div>';
            }
        }

        // Display teams
        function displayTeams(data) {
            const grid = document.getElementById('teamsGrid');
            
            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="no-results">チームが見つかりませんでした</div>';
                return;
            }

            grid.innerHTML = data.slice(0, 100).map(team => `
                <div class="team-card" onclick="selectTeam(${team.id || team.teamId || 0})">
                    <div class="team-header">
                        <div class="team-logo">
                            ${team.logo ? `<img src="${team.logo}" alt="${team.name}" onerror="this.parentElement.innerHTML='⚽'">` : '⚽'}
                        </div>
                        <div class="team-info">
                            <h3>${team.name}</h3>
                            <p>${team.leagueName || team.league || team.country || 'Unknown'}</p>
                        </div>
                    </div>
                    <div class="team-stats">
                        <div class="league-stat">
                            <span>🏟️</span>
                            <span>${team.venue || team.venueCity || 'Unknown'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter teams
        function filterTeams() {
            const query = document.getElementById('teamFilter').value.trim();
            // 選択中のリーグIDも考慮してフィルタリング
            loadTeams(query, selectedLeagueId);
        }

        // Load players
        async function loadPlayers(search = '', teamId = null) {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>選手データを読み込み中...</p></div>';

            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    limit: playersPerPage
                });
                
                if (search) {
                    params.append('search', search);
                }
                
                const response = await fetch(`/api/integrated/players?${params}`);
                const data = await response.json();
                
                let allPlayers = Array.isArray(data) ? data : (data.players || data.results || []);
                
                // チームIDでフィルタリング
                if (teamId) {
                    const teamIdNum = parseInt(teamId);
                    allPlayers = allPlayers.filter(player => 
                        player.teamId === teamIdNum || 
                        player.currentTeamId === teamIdNum
                    );
                }
                
                players = allPlayers;
                displayPlayers(players);
                
                // ページネーションは全件数ベースで計算
                const totalPages = Math.ceil(players.length / playersPerPage);
                updatePagination(totalPages, players.length);
            } catch (error) {
                console.error('Error loading players:', error);
                grid.innerHTML = '<div class="no-results">選手データの読み込みに失敗しました</div>';
            }
        }

        // Display players
        function displayPlayers(data) {
            const grid = document.getElementById('playersGrid');
            
            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="no-results">選手が見つかりませんでした</div>';
                return;
            }

            // ページネーション対応: 現在のページの選手のみを表示
            const startIndex = (currentPage - 1) * playersPerPage;
            const endIndex = startIndex + playersPerPage;
            const paginatedData = data.slice(startIndex, endIndex);
            
            grid.innerHTML = paginatedData.map(player => `
                <div class="player-card" onclick="selectPlayer(${player.playerId || player.id || 0})">
                    <div class="player-header">
                        <div class="player-avatar">
                            ${player.photo ? 
                                `<img src="${player.photo}" alt="${player.name}" onerror="this.parentElement.innerHTML='${getInitials(player.name)}'">` : 
                                getInitials(player.name)}
                        </div>
                        <div class="player-info">
                            <h3>${player.name}</h3>
                            <p>${player.currentTeam || player.teamName || 'Unknown Team'}</p>
                            <span class="position-badge">${translatePosition(player.position)}</span>
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="player-stat">
                            <span class="player-stat-value">${getPlayerGoals(player)}</span>
                            <span class="player-stat-label">ゴール</span>
                        </div>
                        <div class="player-stat">
                            <span class="player-stat-value">${getPlayerAssists(player)}</span>
                            <span class="player-stat-label">アシスト</span>
                        </div>
                        <div class="player-stat">
                            <span class="player-stat-value">${getPlayerAppearances(player)}</span>
                            <span class="player-stat-label">出場</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Get player initials
        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        }

        // Translate position
        function translatePosition(pos) {
            if (!pos) return 'Unknown';
            const positions = {
                'Goalkeeper': 'GK',
                'Defender': 'DF',
                'Midfielder': 'MF',
                'Attacker': 'FW',
                'Forward': 'FW',
                'GK': 'GK',
                'DF': 'DF',
                'MF': 'MF',
                'FW': 'FW'
            };
            return positions[pos] || pos;
        }

        // Get player stats
        function getPlayerGoals(player) {
            // stats がオブジェクトの場合
            if (player.stats && typeof player.stats === 'object' && !Array.isArray(player.stats)) {
                return player.stats.goals || 0;
            }
            // stats が配列の場合
            if (player.stats && Array.isArray(player.stats) && player.stats.length > 0) {
                return player.stats.reduce((sum, s) => sum + (s.goals || 0), 0);
            }
            return player.goals || 0;
        }

        function getPlayerAssists(player) {
            // stats がオブジェクトの場合
            if (player.stats && typeof player.stats === 'object' && !Array.isArray(player.stats)) {
                return player.stats.assists || 0;
            }
            // stats が配列の場合
            if (player.stats && Array.isArray(player.stats) && player.stats.length > 0) {
                return player.stats.reduce((sum, s) => sum + (s.assists || 0), 0);
            }
            return player.assists || 0;
        }

        function getPlayerAppearances(player) {
            // stats がオブジェクトの場合
            if (player.stats && typeof player.stats === 'object' && !Array.isArray(player.stats)) {
                return player.stats.appearances || 0;
            }
            // stats が配列の場合
            if (player.stats && Array.isArray(player.stats) && player.stats.length > 0) {
                return player.stats.reduce((sum, s) => sum + (s.appearances || 0), 0);
            }
            return player.appearances || 0;
        }

        // Update pagination
        function updatePagination(totalPages, totalPlayers) {
            const pagination = document.getElementById('playersPagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            
            if (currentPage > 1) {
                html += `<button class="page-btn" onclick="changePage(${currentPage - 1})">前へ</button>`;
            }

            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            if (currentPage < totalPages) {
                html += `<button class="page-btn" onclick="changePage(${currentPage + 1})">次へ</button>`;
            }

            pagination.innerHTML = html;
        }

        // Change page
        function changePage(page) {
            currentPage = page;
            const search = document.getElementById('playerFilter').value;
            loadPlayers(search, selectedTeamId);
        }

        // Navigation functions
        function selectLeague(leagueId) {
            // リーグIDを取得
            const league = leagueData.find(l => l.id === leagueId);
            if (!league) return;
            
            selectedLeagueId = league.leagueId;
            selectedTeamId = null; // チーム選択をリセット
            
            // チームタブに切り替え
            document.querySelector('[data-tab="teams"]').click();
            
            // リーグでフィルタリングしてチームを表示
            loadTeams('', selectedLeagueId);
            
            // チームフィルターをクリア
            document.getElementById('teamFilter').value = '';
        }

        function selectTeam(teamId) {
            selectedTeamId = teamId;
            
            // 選手タブに切り替え
            document.querySelector('[data-tab="players"]').click();
            
            // チームでフィルタリングして選手を表示
            currentPage = 1;
            loadPlayers('', selectedTeamId);
            
            // 選手フィルターをクリア
            document.getElementById('playerFilter').value = '';
        }

        function selectPlayer(playerId) {
            window.location.href = `/player/${playerId}`;
        }

        // Global search
        function performGlobalSearch() {
            const query = document.getElementById('globalSearch').value.trim();
            if (!query) return;

            // Search in players tab
            document.querySelector('[data-tab="players"]').click();
            document.getElementById('playerFilter').value = query;
            currentPage = 1;
            loadPlayers(query);
        }
    </script>
</body>
</html>
