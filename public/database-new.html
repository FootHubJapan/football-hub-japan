<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0, s-maxage=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Surrogate-Control" content="no-store">
    <title>サッカーデータベース - Football Hub Japan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }

        .search-group {
            display: flex;
            flex-direction: column;
        }

        .search-group label {
            color: #cccccc;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .search-input {
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .search-btn {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #00cc6a;
        }

        .data-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
        }

        .data-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #333333;
        }

        .tab-btn {
            background: none;
            color: #cccccc;
            padding: 1rem 2rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #00ff88;
            border-bottom-color: #00ff88;
        }

        .tab-btn:hover {
            color: #00ff88;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .data-table th {
            background: #2a2a2a;
            color: #00ff88;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid #333333;
            font-weight: bold;
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid #333333;
            color: #cccccc;
        }

        .data-table tr:hover {
            background: #2a2a2a;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000000;
            margin-right: 1rem;
        }

        .player-info {
            display: flex;
            align-items: center;
        }

        .player-name {
            color: #ffffff;
            font-weight: bold;
        }

        .player-position {
            color: #888888;
            font-size: 0.9rem;
        }

        .team-badge {
            background: #00ff88;
            color: #000000;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem;
            background: #2a2a2a;
            border-radius: 5px;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stat-label {
            color: #888888;
            font-size: 0.8rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .page-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .page-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        /* API設定セクション */
        .api-config-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .api-config-section h3 {
            color: #00ff88;
            margin-bottom: 1rem;
        }

        .api-info {
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 5px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .api-info p {
            color: #cccccc;
            margin-bottom: 0.5rem;
        }

        .api-info code {
            background: #1a1a1a;
            color: #00ff88;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
        }

        .data-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #555555;
        }

        .action-btn.primary {
            background: #00ff88;
            color: #000000;
        }

        .action-btn.primary:hover {
            background: #00cc6a;
        }

        .api-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 5px;
            display: none;
        }

        .api-status.success {
            background: #1a3a1a;
            color: #00ff88;
            border: 1px solid #00ff88;
            display: block;
        }

        .api-status.error {
            background: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
            display: block;
        }
        
        .search-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .search-result.success {
            background-color: #1a3a1a;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        
        .search-result.warning {
            background-color: #3a3a1a;
            color: #ffaa00;
            border: 1px solid #ffaa00;
        }
        
        .search-result.error {
            background-color: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        /* native-stats.org風スタイル */
        .native-header {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .site-title {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0;
            letter-spacing: 2px;
        }

        .site-subtitle {
            color: #888;
            font-size: 1rem;
            margin: 0.5rem 0 0 0;
            font-weight: 300;
        }

        .league-nav {
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 1rem 0;
        }

        .league-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .league-tab {
            background: none;
            border: 1px solid #444;
            color: #888;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            min-width: 60px;
        }

        .league-tab:hover {
            border-color: #666;
            color: #fff;
        }

        .league-tab.active {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        .search-section {
            background: #1a1a1a;
            padding: 1.5rem 0;
            border-bottom: 1px solid #333;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            flex: 1;
            display: flex;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
        }



        .search-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            padding: 0.75rem 1rem;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-btn {
            background: #00ff88;
            border: none;
            color: #000;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .filter-select {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .data-row {
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid #333;
        }

        .data-row:hover {
            background-color: #2a2a2a;
        }

        .player-info, .team-info, .league-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar, .team-avatar, .league-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 16px;
        }

        .player-details, .team-details, .league-details {
            flex: 1;
        }

        .player-name, .team-name, .league-name {
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }

        .player-meta, .team-meta, .league-meta {
            font-size: 12px;
            color: #888;
        }

        .season-info {
            text-align: center;
        }

        .season-year {
            font-weight: bold;
            color: #00ff88;
        }

        .season-status, .season-position, .season-teams {
            font-size: 12px;
            color: #888;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
        }

        .stat-value {
            font-weight: bold;
            color: #00ff88;
        }

        /* モーダルスタイル */
        .detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        .modal-header h2 {
            color: #fff;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-body {
            padding: 20px;
        }

        .player-header, .team-header, .league-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-avatar-large, .team-avatar-large, .league-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 32px;
        }

        .player-info-large, .team-info-large, .league-info-large h3 {
            color: #fff;
            margin: 0 0 8px 0;
        }

        .player-info-large, .team-info-large, .league-info-large p {
            color: #888;
            margin: 4px 0;
        }

        .season-section {
            margin-top: 20px;
        }

        .player-info-section, .stats-section, .matches-section {
            margin-bottom: 30px;
        }

        .player-info-section h4, .stats-section h4, .matches-section h4 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #00ff88;
        }

        .info-item label {
            display: block;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .info-item span {
            color: #fff;
            font-weight: bold;
        }

        .stats-grid-native {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .stat-item-native {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }

        .stat-item-native .stat-label {
            display: block;
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .stat-item-native .stat-value {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .matches-table table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }

        .matches-table th {
            background: #333;
            color: #fff;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        .matches-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #333;
            color: #fff;
        }

        .matches-table tr:hover {
            background: #333;
        }

        .season-section h4 {
            color: #00ff88;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .stats-grid-large {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            display: block;
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: #888;
        }

        /* ページネーション改善 */
        .page-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            margin: 0 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover:not(.disabled) {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        .page-btn.active {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* native-stats.org風詳細表示 */
        .player-info-section {
            margin-bottom: 2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .info-item label {
            font-size: 0.875rem;
            color: #888;
            font-weight: 500;
        }

        .info-item span {
            color: #fff;
            font-size: 1rem;
        }

        .matches-section {
            margin-bottom: 2rem;
        }

        .matches-section h3 {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .matches-table table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }

        .matches-table th {
            background: #1a1a1a;
            color: #888;
            padding: 0.75rem;
            text-align: left;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .matches-table td {
            padding: 0.75rem;
            border-bottom: 1px solid #333;
            color: #fff;
            font-size: 0.875rem;
        }

        .matches-table tr:hover {
            background: #333;
        }

        .stats-section h3 {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .stats-grid-native {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .stat-item-native {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-item-native .stat-label {
            font-size: 0.875rem;
            color: #888;
        }

        .stat-item-native .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        @media (max-width: 768px) {
            .search-controls {
                grid-template-columns: 1fr;
            }
            
            .data-tabs {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .data-management-section {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #333;
        }

        .data-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .data-controls .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .data-status {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }

        .data-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .data-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .data-status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .data-status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ Football Hub Japan</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
            <button class="nav-btn" onclick="window.location.href='/radar'">レーダーチャート</button>
            <button class="nav-btn" onclick="window.location.href='/'">ログアウト</button>
        </div>
    </header>

    <div class="main-container">
        <h1 class="page-title">サッカーデータベース</h1>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>

    <script>
        // Force cache busting with unique timestamp
        const timestamp = Date.now();
        const random = Math.random();
        console.log('Loading firebaseData.js with cache busting:', timestamp, random);
        
        const script = document.createElement('script');
        script.src = `firebaseData.js?v=3.0&t=${timestamp}&r=${random}&nocache=true`;
        script.onload = function() {
            console.log('firebaseData.js loaded successfully at:', new Date().toISOString());
        };
        script.onerror = function() {
            console.error('Failed to load firebaseData.js');
        };
        document.head.appendChild(script);
    </script>
    <script>
        // Version: 1.5 - Cache busting - NEW FILE
        // データ管理
        let currentTab = 'players';
        let currentData = [];
        let allLeagues = [];
        let allTeams = [];
        let allPlayers = [];

        // FirebaseDataServiceの初期化確認
        function checkFirebaseDataService() {
            if (!window.firebaseDataService) {
                console.error('FirebaseDataServiceが初期化されていません');
                return false;
            }
            return true;
        }

        // Firebaseからデータを取得
        async function fetchLeagues() {
            try {
                if (!checkFirebaseDataService()) {
                    return [];
                }
                const data = await window.firebaseDataService.getLeagues();
                allLeagues = data;
                return data;
            } catch (error) {
                console.error('リーグデータ取得エラー:', error);
                return [];
            }
        }

        async function fetchTeams(leagueId) {
            try {
                if (!checkFirebaseDataService()) {
                    return [];
                }
                const data = await window.firebaseDataService.getTeams(leagueId);
                allTeams = data;
                return data;
            } catch (error) {
                console.error('チームデータ取得エラー:', error);
                return [];
            }
        }

        async function fetchPlayers(teamId) {
            try {
                if (!checkFirebaseDataService()) {
                    return [];
                }
                const data = await window.firebaseDataService.getPlayers(teamId);
                allPlayers = data;
                return data;
            } catch (error) {
                console.error('選手データ取得エラー:', error);
                return [];
            }
        }

        async function searchPlayers(query) {
            try {
                if (!checkFirebaseDataService()) {
                    return [];
                }
                const data = await window.firebaseDataService.searchPlayers(query);
                return data;
            } catch (error) {
                console.error('選手検索エラー:', error);
                return [];
            }
        }

        // タブ切り替え
        async function switchTab(tab, element = null) {
            currentTab = tab;
            
            // タブボタンのアクティブ状態を更新
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            } else {
                document.querySelector(`[onclick*="${tab}"]`).classList.add('active');
            }
            
            // タブコンテンツを切り替え
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
            document.getElementById(tab + 'Tab').style.display = 'block';
            
            // データを更新
            try {
                switch(tab) {
                    case 'players':
                        console.log('選手データを取得中...');
                        currentData = await window.firebaseDataService.getPlayers();
                        console.log('取得した選手データ:', currentData.length, '件');
                        console.log('データの型:', typeof currentData);
                        console.log('データの最初の要素:', currentData[0]);
                        break;
                    case 'teams':
                        console.log('チームデータを取得中...');
                        currentData = await window.firebaseDataService.getTeams();
                        console.log('取得したチームデータ:', currentData.length, '件');
                        break;
                    case 'leagues':
                        console.log('リーグデータを取得中...');
                        currentData = await window.firebaseDataService.getLeagues();
                        console.log('取得したリーグデータ:', currentData.length, '件');
                        break;
                }
            } catch (error) {
                console.error('データ取得エラー:', error);
                currentData = [];
            }
            
            displayData(currentData, currentTab);
        }

        // データを表示する関数
        function displayData(data, tabType) {
            console.log(`${tabType}データを表示中:`, data.length, '件');
            
            // データが配列でない場合は配列に変換
            if (!Array.isArray(data)) {
                console.warn('データが配列ではありません:', typeof data);
                data = [];
            }
            
            const tableBody = document.getElementById(tabType + 'TableBody');
            if (!tableBody) {
                console.error('テーブルボディが見つかりません:', tabType + 'TableBody');
                return;
            }
            
            let html = '';
            
            if (data.length === 0) {
                html = '<tr><td colspan="6" class="no-data">データが見つかりません</td></tr>';
            } else {
                data.forEach((item, index) => {
                    if (tabType === 'players') {
                        const playerName = item.fullName || item.name || 'Unknown Player';
                        const teamName = item.currentTeam || item.team || 'Unknown Team';
                        const leagueName = item.seasons?.['2024-2025']?.league || 'Unknown League';
                        
                        // 年齢を計算（API-Footballの場合は直接使用）
                        let age = item.age || 'N/A';
                        if (!age && item.birthday) {
                            const birthDate = new Date(item.birthday);
                            const today = new Date();
                            const ageDiff = today.getFullYear() - birthDate.getFullYear();
                            const monthDiff = today.getMonth() - birthDate.getMonth();
                            age = monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate()) 
                                ? ageDiff - 1 : ageDiff;
                        }
                        
                        const position = item.position || 'Unknown';
                        const stats = item.seasons?.['2024-2025']?.stats || {};
                        
                        // API-Footballの統計がある場合は使用
                        const apiStats = item.apiFootballStats;
                        const isAPIFootball = item.source === 'api-football';
                        
                        html += `
                            <tr class="data-row" onclick="showPlayerDetail('${item.id || index}', ${JSON.stringify(item).replace(/'/g, "\\'")})">
                                <td>
                                    <div class="player-info">
                                        <div class="player-avatar">
                                            ${item.photo ? `<img src="${item.photo}" alt="${playerName}" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover;" onerror="this.parentElement.innerHTML='${playerName.charAt(0)}'">` : playerName.charAt(0)}
                                        </div>
                                        <div class="player-details">
                                            <div class="player-name">
                                                ${playerName}
                                                ${item.isJapanese ? '<span style="background: #ff4444; color: white; padding: 0.2rem 0.4rem; border-radius: 10px; font-size: 0.7rem; margin-left: 0.5rem;">🇯🇵</span>' : ''}
                                                ${isAPIFootball ? '<span style="background: #00ff88; color: black; padding: 0.2rem 0.4rem; border-radius: 10px; font-size: 0.7rem; margin-left: 0.5rem;">🚀</span>' : ''}
                                            </div>
                                            <div class="player-meta">${position} • ${item.nationality || 'Unknown'} • ${age}歳</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="team-info">
                                        <div class="team-name">${teamName}</div>
                                        <div class="league-name">${leagueName}</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="age-info">
                                        <div class="age-value">${age}</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="position-info">
                                        <div class="position-value">${position}</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <span class="stat-label">⚽ ゴール</span>
                                            <span class="stat-value">${apiStats?.goals?.total || stats.goals || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">🎯 アシスト</span>
                                            <span class="stat-value">${apiStats?.goals?.assists || stats.assists || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📊 試合数</span>
                                            <span class="stat-value">${apiStats?.games?.appearences || stats.appearances || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">⭐ 評価</span>
                                            <span class="stat-value">${apiStats?.games?.rating || stats.rating || 'N/A'}</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    } else if (tabType === 'teams') {
                        const teamName = item.name || 'Unknown Team';
                        const leagueName = item.league || 'Unknown League';
                        const country = item.country || 'Unknown';
                        const founded = item.founded || 'N/A';
                        
                        html += `
                            <tr class="data-row" onclick="showTeamDetail('${item.id || index}')">
                                <td>
                                    <div class="team-info">
                                        <div class="team-avatar">${teamName.charAt(0)}</div>
                                        <div class="team-details">
                                            <div class="team-name">${teamName}</div>
                                            <div class="team-meta">${country} • 創設: ${founded}</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="league-info">
                                        <div class="league-name">${leagueName}</div>
                                        <div class="league-country">${country}</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="season-info">
                                        <div class="season-year">2024-2025</div>
                                        <div class="season-position">N/A位</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <span class="stat-label">🏆 ポイント</span>
                                            <span class="stat-value">0</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">✅ 勝利</span>
                                            <span class="stat-value">0</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">⚽ 得点</span>
                                            <span class="stat-value">0</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">🛡️ 失点</span>
                                            <span class="stat-value">0</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    } else if (tabType === 'leagues') {
                        const leagueName = item.name || 'Unknown League';
                        const country = item.country || 'Unknown';
                        const teams = item.teams || 0;
                        const season = item.season || '2024-25';
                        
                        html += `
                            <tr class="data-row" onclick="showLeagueDetail('${item.id || index}')">
                                <td>
                                    <div class="league-info">
                                        <div class="league-avatar">${leagueName.charAt(0)}</div>
                                        <div class="league-details">
                                            <div class="league-name">${leagueName}</div>
                                            <div class="league-meta">${country} • ${teams}チーム</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="country-info">
                                        <div class="country-name">${country}</div>
                                        <div class="country-flag">🏳️</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="season-info">
                                        <div class="season-year">${season}</div>
                                        <div class="season-teams">${teams}チーム</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <span class="stat-label">⚽ 総得点</span>
                                            <span class="stat-value">0</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📊 試合数</span>
                                            <span class="stat-value">0</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📈 平均得点</span>
                                            <span class="stat-value">0</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }
                });
            }
            
            tableBody.innerHTML = html;
            console.log(`${tabType}データの表示が完了しました`);
        }



        // API設定機能
        function setApiKey() {
            showApiStatus('APIキーはバックエンドで管理されています', 'success');
        }

        function addSampleData() {
            if (!window.addSampleDataToFirestore) {
                showApiStatus('FirebaseDataServiceが初期化されていません', 'error');
                return;
            }
            window.addSampleDataToFirestore();
            showApiStatus('サンプルデータの追加を開始しました', 'success');
        }

        function importRealData() {
            if (!window.importRealFootballData) {
                showApiStatus('FirebaseDataServiceが初期化されていません', 'error');
                return;
            }
            showApiStatus('実際のデータのインポートを開始しました。時間がかかる場合があります...', 'success');
            window.importRealFootballData();
        }

        function showApiStatus(message, type) {
            const statusElement = document.getElementById('apiStatus');
            if (!statusElement) {
                console.warn('apiStatus element not found, using alert instead');
                alert(message);
                return;
            }
            statusElement.textContent = message;
            statusElement.className = `api-status ${type}`;
            
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 5000);
        }

        // 検索タイプ変更時のフィルター表示制御
        function updateSearchFilters() {
            const searchType = document.getElementById('searchType').value;
            const positionFilter = document.getElementById('searchPosition');
            const leagueFilter = document.getElementById('searchLeague');
            
            // すべてのフィルターを非表示
            positionFilter.style.display = 'none';
            leagueFilter.style.display = 'none';
            
            // 検索タイプに応じてフィルターを表示
            if (searchType === 'players') {
                positionFilter.style.display = 'inline-block';
                leagueFilter.style.display = 'inline-block';
            } else if (searchType === 'teams') {
                leagueFilter.style.display = 'inline-block';
            }
        }

                if (isJapaneseSearch || isTranslated) {
                    if (isTranslated) {
                        console.log('日本語→英語変換検索を検出、API-Footballを試行中...', apiQuery);
                    } else {
                        console.log('日本語選手検索を検出、API-Footballを試行中...', apiQuery);
                    }
                    try {
                        const response = await fetch(`/api/japanese-players/search-v2?query=${encodeURIComponent(apiQuery)}`);
                        console.log('API-Footballレスポンス:', response.status, response.statusText);
                        
                        if (response.ok) {
                            const data = await response.json();
                            console.log('API-Footballデータ:', data);

                            if (data.totalResults > 0) {
                                console.log(`API-Football検索成功: ${data.totalResults}件`);
                                displayAPIFootballResults(data);
                                showSearchResult(`API-Football検索: ${data.totalResults}件の選手が見つかりました`, 'success');
                                return;
                            } else {
                                console.log('API-Football検索結果なし、標準検索にフォールバック');
                            }
                        } else {
                            console.log('API-Football検索失敗、標準検索にフォールバック');
                        }
                    } catch (error) {
                        console.error('API-Football検索エラー:', error);
                        console.log('エラーのため標準検索にフォールバック');
                    }
                } else {
                    console.log('日本語選手検索ではないため、標準検索を実行');
                }
            }
            
            // 検索中の表示
            const searchButton = document.querySelector('.search-btn');
            const originalText = searchButton.textContent;
            searchButton.textContent = '検索中...';
            searchButton.disabled = true;
            
            try {
                if (searchType === 'players') {
                    console.log(`選手検索開始: "${searchQuery}"`);
                    
                    // 選手データを取得
                    let players = await window.firebaseDataService.getPlayers();
                    currentTab = 'players';
                    
                    // タブを切り替え
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    document.querySelector('.tab-btn[onclick*="players"]').classList.add('active');
                    
                    document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
                    document.getElementById('playersTab').style.display = 'block';
                    
                    // フィルタリングを適用
                    let filteredPlayers = players;
                    
                    // 検索クエリでフィルタリング
                    if (searchQuery) {
                        filteredPlayers = filteredPlayers.filter(player => 
                            (player.name && player.name.toLowerCase().includes(searchQuery.toLowerCase())) ||
                            (player.fullName && player.fullName.toLowerCase().includes(searchQuery.toLowerCase())) ||
                            (player.team && player.team.toLowerCase().includes(searchQuery.toLowerCase())) ||
                            (player.currentTeam && player.currentTeam.toLowerCase().includes(searchQuery.toLowerCase()))
                        );
                    }
                    
                    // ポジションでフィルタリング
                    if (searchPosition) {
                        filteredPlayers = filteredPlayers.filter(player => {
                            const playerPosition = player.position || '';
                            // 完全一致または部分一致で検索
                            return playerPosition === searchPosition || 
                                   playerPosition.includes(searchPosition) ||
                                   searchPosition.includes(playerPosition);
                        });
                    }
                    
                    // リーグでフィルタリング
                    if (searchLeague) {
                        filteredPlayers = filteredPlayers.filter(player => 
                            player.seasons?.['2024-2025']?.league === searchLeague ||
                            player.league === searchLeague
                        );
                    }
                    
                    currentData = filteredPlayers;
                    
                    // 検索結果の表示
                    if (currentData.length === 0) {
                        showSearchResult('検索結果が見つかりませんでした。条件を変更して再試行してください。', 'warning');
                    } else {
                        const filters = [];
                        if (searchQuery) filters.push(`キーワード: "${searchQuery}"`);
                        if (searchPosition) filters.push(`ポジション: ${searchPosition}`);
                        if (searchLeague) filters.push(`リーグ: ${searchLeague}`);
                        
                        const filterText = filters.length > 0 ? ` (${filters.join(', ')})` : '';
                        showSearchResult(`${currentData.length}件の選手が見つかりました${filterText}`, 'success');
                    }
                } else {
                    // チーム・リーグ検索
                    await switchTab(searchType);
                    
                    // クライアントサイドでフィルタリング
                    if (searchQuery || searchLeague) {
                        const originalData = [...currentData];
                        currentData = currentData.filter(item => {
                            let matches = true;
                            
                            if (searchQuery) {
                                if (searchType === 'teams') {
                                    matches = matches && item.name.toLowerCase().includes(searchQuery.toLowerCase());
                                } else if (searchType === 'leagues') {
                                    matches = matches && item.name.toLowerCase().includes(searchQuery.toLowerCase());
                                }
                            }
                            
                            if (searchLeague && searchType === 'teams') {
                                matches = matches && (item.league === searchLeague || item.seasons?.['2024-2025']?.league === searchLeague);
                            }
                            
                            return matches;
                        });
                        
                        if (currentData.length === 0) {
                            showSearchResult('検索結果が見つかりませんでした。条件を変更して再試行してください。', 'warning');
                        } else {
                            showSearchResult(`${currentData.length}件の${searchType === 'teams' ? 'チーム' : 'リーグ'}が見つかりました`, 'success');
                        }
                    }
                }
                
                displayData(currentData, currentTab);
            } catch (error) {
                console.error('検索エラー:', error);
                showSearchResult('検索中にエラーが発生しました', 'error');
            } finally {
                // ボタンを元に戻す
                searchButton.textContent = originalText;
                searchButton.disabled = false;
            }
        }

            const resultDiv = document.getElementById('searchResult');

                const newResultDiv = document.createElement('div');
                newResultDiv.id = 'searchResult';
                newResultDiv.className = `search-result ${type}`;
                newResultDiv.textContent = message;
                
                const searchSection = document.querySelector('.search-section');
                searchSection.appendChild(newResultDiv);
            } else {
                resultDiv.textContent = message;
                resultDiv.className = `search-result ${type}`;
            }

            setTimeout(() => {
                if (resultDiv) {
                    resultDiv.style.display = 'none';
                }
            }, 3000);
        }

        // ページネーション管理
        let currentPage = 1;
        const itemsPerPage = 20;
        let totalPages = 1;
        let filteredData = [];

        // ページネーション
        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
            } else if (typeof direction === 'number' && direction >= 1 && direction <= totalPages) {
                currentPage = direction;
            }
            
            displayData(currentData, currentTab);
            updatePagination();
        }

        // ページネーション更新
        function updatePagination() {
            const paginationContainer = document.querySelector('.pagination');
            if (!paginationContainer) return;

            // ページネーション情報を計算
            totalPages = Math.ceil(filteredData.length / itemsPerPage);
            
            // ページネーションHTMLを生成
            let paginationHTML = `
                <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" 
                        onclick="changePage('prev')" ${currentPage === 1 ? 'disabled' : ''}>
                    ← 前へ
                </button>
            `;

            // ページ番号を表示（最大5ページまで）
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, startPage + 4);

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" 
                            onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            paginationHTML += `
                <button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" 
                        onclick="changePage('next')" ${currentPage === totalPages ? 'disabled' : ''}>
                    次へ →
                </button>
            `;

            paginationContainer.innerHTML = paginationHTML;
        }

            // 一時的にオーナー機能を有効にする（デバッグ用）
            return true;
            
            // 実際の実装では、サーバーサイドで認証を確認する
            // ここでは簡易的にURLパラメータで判定
            // const urlParams = new URLSearchParams(window.location.search);
            // return urlParams.get('owner') === 'true' || 
            //        localStorage.getItem('isOwner') === 'true';
        }

        // オーナー用機能の表示/非表示
        function toggleOwnerFeatures() {
            const ownerFeatures = document.querySelector('.data-management-section');
            if (ownerFeatures) {
                if (isOwner()) {
                    ownerFeatures.style.display = 'block';
                    console.log('オーナー機能を表示しました');
                } else {
                    ownerFeatures.style.display = 'none';
                    console.log('オーナー機能を非表示にしました');
                }
            }
        }



        // API-Football検索結果表示
        function displayAPIFootballResults(data) {
            const { results, totalResults } = data;
            
            if (totalResults === 0) {
                showSearchResult('検索結果が見つかりませんでした。条件を変更して再試行してください。', 'warning');
                return;
            }

            // 選手タブに切り替え
            currentTab = 'players';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.tab-btn[onclick*="players"]').classList.add('active');
            
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
            document.getElementById('playersTab').style.display = 'block';

            // API-Footballの結果を標準フォーマットに変換
            const convertedPlayers = results.map(player => {
                const { player: playerData, statistics, isJapanese, source } = player;
                const stats = statistics && statistics[0];
                
                return {
                    id: playerData.id,
                    name: playerData.name,
                    fullName: `${playerData.firstname || ''} ${playerData.lastname || ''}`.trim(),
                    position: stats?.games?.position || '不明',
                    team: stats?.team?.name || '不明',
                    currentTeam: stats?.team?.name || '不明',
                    age: playerData.age,
                    nationality: playerData.nationality,
                    height: playerData.height,
                    weight: playerData.weight,
                    photo: playerData.photo,
                    isJapanese: isJapanese,
                    source: source,
                    // API-Footballの詳細統計
                    apiFootballStats: stats,
                    seasons: {
                        '2024-2025': {
                            league: stats?.league?.name || '不明',
                            team: stats?.team?.name || '不明',
                            goals: stats?.goals?.total || 0,
                            assists: stats?.goals?.assists || 0,
                            appearances: stats?.games?.appearences || 0
                        }
                    }
                };
            });

            currentData = convertedPlayers;
            displayData(convertedPlayers, 'players');
        }



        // 初期表示
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Database page loaded');
            
            // 検索タイプ変更時のイベントリスナーを追加
            document.getElementById('searchType').addEventListener('change', updateSearchFilters);
        
        // デバッグ用：ポジションフィルターの動作確認
        document.getElementById('searchPosition').addEventListener('change', function() {
            console.log('ポジションフィルター変更:', this.value);
        });


            
            // 初期フィルター状態を設定
            updateSearchFilters();
            
            // オーナー機能の表示/非表示を設定
            toggleOwnerFeatures();
            
            // 初期タブを設定
            await switchTab('players');
            
            // 自動データ更新チェック（オーナーのみ）
            if (isOwner()) {
                await checkAndUpdateData();
            }
        });

        // 自動データ更新チェック
        async function checkAndUpdateData() {
            try {
                console.log('自動データ更新チェックを開始...');
                
                // FirebaseDataServiceの初期化を待つ
                let retryCount = 0;
                const maxRetries = 20;
                
                while (!window.firebaseDataService && retryCount < maxRetries) {
                    console.log(`FirebaseDataServiceの初期化を待機中... (${retryCount + 1}/${maxRetries})`);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    retryCount++;
                }
                
                if (!window.firebaseDataService) {
                    console.error('FirebaseDataServiceの初期化がタイムアウトしました');
                    showDataStatus('FirebaseDataServiceの初期化に失敗しました', 'error');
                    return;
                }

                console.log('FirebaseDataServiceが利用可能になりました');
                const status = await window.firebaseDataService.checkDataStatus();
                console.log('データ状況:', status);
                
                // データが存在しない場合、自動でインポート
                if (!status.isImported || status.playerCount === 0) {
                    console.log('データが存在しません。自動インポートを開始します...');
                    showDataStatus('データが存在しません。自動インポートを開始します...', 'info');
                    
                    // バックグラウンドでインポート実行
                    setTimeout(async () => {
                        try {
                            console.log('自動インポートを実行中...');
                            await window.firebaseDataService.importRealFootballData();
                            console.log('自動データインポートが完了しました');
                            showDataStatus('自動データインポートが完了しました', 'success');
                            
                            // 少し待ってからデータを再表示
                            setTimeout(async () => {
                                await switchTab('players');
                            }, 2000);
                        } catch (error) {
                            console.error('Auto-import error:', error);
                            showDataStatus('自動インポート中にエラーが発生しました: ' + error.message, 'error');
                        }
                    }, 1000);
                } else {
                    console.log(`データが既に存在します: ${status.playerCount}選手, ${status.teamCount}チーム`);
                    showDataStatus(`データが既に存在します: ${status.playerCount}選手, ${status.teamCount}チーム`, 'success');
                }
            } catch (error) {
                console.error('Auto-update check error:', error);
                showDataStatus('自動更新チェック中にエラーが発生しました: ' + error.message, 'error');
            }
        }
    </script>
