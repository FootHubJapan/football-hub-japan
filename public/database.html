<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サッカーデータベース - Football Hub Japan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }

        .search-group {
            display: flex;
            flex-direction: column;
        }

        .search-group label {
            color: #cccccc;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .search-input {
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .search-btn {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #00cc6a;
        }

        .data-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
        }

        .data-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #333333;
        }

        .tab-btn {
            background: none;
            color: #cccccc;
            padding: 1rem 2rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #00ff88;
            border-bottom-color: #00ff88;
        }

        .tab-btn:hover {
            color: #00ff88;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .data-table th {
            background: #2a2a2a;
            color: #00ff88;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid #333333;
            font-weight: bold;
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid #333333;
            color: #cccccc;
        }

        .data-table tr:hover {
            background: #2a2a2a;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000000;
            margin-right: 1rem;
        }

        .player-info {
            display: flex;
            align-items: center;
        }

        .player-name {
            color: #ffffff;
            font-weight: bold;
        }

        .player-position {
            color: #888888;
            font-size: 0.9rem;
        }

        .team-badge {
            background: #00ff88;
            color: #000000;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem;
            background: #2a2a2a;
            border-radius: 5px;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stat-label {
            color: #888888;
            font-size: 0.8rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .page-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .page-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        /* API設定セクション */
        .api-config-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .api-config-section h3 {
            color: #00ff88;
            margin-bottom: 1rem;
        }

        .api-info {
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 5px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .api-info p {
            color: #cccccc;
            margin-bottom: 0.5rem;
        }

        .api-info code {
            background: #1a1a1a;
            color: #00ff88;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
        }

        .data-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #555555;
        }

        .action-btn.primary {
            background: #00ff88;
            color: #000000;
        }

        .action-btn.primary:hover {
            background: #00cc6a;
        }

        .api-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 5px;
            display: none;
        }

        .api-status.success {
            background: #1a3a1a;
            color: #00ff88;
            border: 1px solid #00ff88;
            display: block;
        }

        .api-status.error {
            background: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
            display: block;
        }
        
        .search-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .search-result.success {
            background-color: #1a3a1a;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        
        .search-result.warning {
            background-color: #3a3a1a;
            color: #ffaa00;
            border: 1px solid #ffaa00;
        }
        
        .search-result.error {
            background-color: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        /* native-stats.org風スタイル */
        .native-header {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .site-title {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0;
            letter-spacing: 2px;
        }

        .site-subtitle {
            color: #888;
            font-size: 1rem;
            margin: 0.5rem 0 0 0;
            font-weight: 300;
        }

        .league-nav {
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 1rem 0;
        }

        .league-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .league-tab {
            background: none;
            border: 1px solid #444;
            color: #888;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            min-width: 60px;
        }

        .league-tab:hover {
            border-color: #666;
            color: #fff;
        }

        .league-tab.active {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        .search-section {
            background: #1a1a1a;
            padding: 1.5rem 0;
            border-bottom: 1px solid #333;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            flex: 1;
            display: flex;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
        }

        .search-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            padding: 0.75rem 1rem;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-btn {
            background: #00ff88;
            border: none;
            color: #000;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .filter-select {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .data-row {
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid #333;
        }

        .data-row:hover {
            background-color: #2a2a2a;
        }

        .player-info, .team-info, .league-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar, .team-avatar, .league-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 16px;
        }

        .player-details, .team-details, .league-details {
            flex: 1;
        }

        .player-name, .team-name, .league-name {
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }

        .player-meta, .team-meta, .league-meta {
            font-size: 12px;
            color: #888;
        }

        .season-info {
            text-align: center;
        }

        .season-year {
            font-weight: bold;
            color: #00ff88;
        }

        .season-status, .season-position, .season-teams {
            font-size: 12px;
            color: #888;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
        }

        .stat-value {
            font-weight: bold;
            color: #00ff88;
        }

        /* モーダルスタイル */
        .detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        .modal-header h2 {
            color: #fff;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-body {
            padding: 20px;
        }

        .player-header, .team-header, .league-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-avatar-large, .team-avatar-large, .league-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 32px;
        }

        .player-info-large, .team-info-large, .league-info-large h3 {
            color: #fff;
            margin: 0 0 8px 0;
        }

        .player-info-large, .team-info-large, .league-info-large p {
            color: #888;
            margin: 4px 0;
        }

        .season-section {
            margin-top: 20px;
        }

        .season-section h4 {
            color: #00ff88;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .stats-grid-large {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            display: block;
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: #888;
        }

        /* ページネーション改善 */
        .page-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            margin: 0 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover:not(.disabled) {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        .page-btn.active {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* native-stats.org風詳細表示 */
        .player-info-section {
            margin-bottom: 2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .info-item label {
            font-size: 0.875rem;
            color: #888;
            font-weight: 500;
        }

        .info-item span {
            color: #fff;
            font-size: 1rem;
        }

        .matches-section {
            margin-bottom: 2rem;
        }

        .matches-section h3 {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .matches-table table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }

        .matches-table th {
            background: #1a1a1a;
            color: #888;
            padding: 0.75rem;
            text-align: left;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .matches-table td {
            padding: 0.75rem;
            border-bottom: 1px solid #333;
            color: #fff;
            font-size: 0.875rem;
        }

        .matches-table tr:hover {
            background: #333;
        }

        .stats-section h3 {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .stats-grid-native {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .stat-item-native {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-item-native .stat-label {
            font-size: 0.875rem;
            color: #888;
        }

        .stat-item-native .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        @media (max-width: 768px) {
            .search-controls {
                grid-template-columns: 1fr;
            }
            
            .data-tabs {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ Football Hub Japan</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
            <button class="nav-btn" onclick="window.location.href='/radar'">レーダーチャート</button>
            <button class="nav-btn" onclick="window.location.href='/'">ログアウト</button>
        </div>
    </header>

    <div class="main-container">
        <h1 class="page-title">サッカーデータベース</h1>
        <p class="page-subtitle">世界中のリーグ、チーム、選手の詳細なデータを網羅</p>

        <!-- native-stats.org風ヘッダー -->
        <div class="native-header">
            <div class="header-content">
                <h1 class="site-title">Football Hub Japan</h1>
                <p class="site-subtitle">pure. fast. accessible.</p>
            </div>
        </div>

        <!-- リーグナビゲーション -->
        <div class="league-nav">
            <div class="league-tabs">
                <button class="league-tab active" onclick="filterByLeague('all')">ALL</button>
                <button class="league-tab" onclick="filterByLeague('PL')">PL</button>
                <button class="league-tab" onclick="filterByLeague('PD')">PD</button>
                <button class="league-tab" onclick="filterByLeague('SA')">SA</button>
                <button class="league-tab" onclick="filterByLeague('BL1')">BL1</button>
                <button class="league-tab" onclick="filterByLeague('FL1')">FL1</button>
            </div>
        </div>

        <!-- 検索セクション -->
        <div class="search-section">
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchQuery" class="search-input" placeholder="Search players, teams, matches...">
                    <button class="search-btn" onclick="searchData()">🔍</button>
                </div>
                <div class="search-filters">
                    <select id="searchType" class="filter-select">
                        <option value="players">Players</option>
                        <option value="teams">Teams</option>
                        <option value="matches">Matches</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- API設定セクション -->
        <div class="api-config-section">
            <h3>データソース設定</h3>
            <div class="api-info">
                <p>football-data.org APIキーはバックエンドで管理されています。</p>
                <p>環境変数 <code>FOOTBALL_DATA_API_KEY</code> が設定されていることを確認してください。</p>
            </div>
            <div class="data-actions">
                <button onclick="addSampleData()" class="action-btn">サンプルデータ追加</button>
                <button onclick="importRealData()" class="action-btn primary">実際のデータインポート</button>
            </div>
            <div id="apiStatus" class="api-status"></div>
        </div>

        <div class="data-section">
            <div class="data-tabs">
                <button class="tab-btn active" onclick="switchTab('players', this)">選手データ</button>
                <button class="tab-btn" onclick="switchTab('teams', this)">チームデータ</button>
                <button class="tab-btn" onclick="switchTab('leagues', this)">リーグデータ</button>
            </div>

            <div id="playersTab" class="tab-content">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>選手</th>
                            <th>チーム</th>
                            <th>リーグ</th>
                            <th>年齢</th>
                            <th>ポジション</th>
                            <th>統計</th>
                        </tr>
                    </thead>
                    <tbody id="playersTableBody">
                        <!-- データはJavaScriptで動的に生成 -->
                    </tbody>
                </table>
            </div>

            <div id="teamsTab" class="tab-content" style="display: none;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>チーム</th>
                            <th>リーグ</th>
                            <th>国</th>
                            <th>創設年</th>
                            <th>統計</th>
                        </tr>
                    </thead>
                    <tbody id="teamsTableBody">
                        <!-- データはJavaScriptで動的に生成 -->
                    </tbody>
                </table>
            </div>

            <div id="leaguesTab" class="tab-content" style="display: none;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>リーグ</th>
                            <th>国</th>
                            <th>チーム数</th>
                            <th>シーズン</th>
                            <th>統計</th>
                        </tr>
                    </thead>
                    <tbody id="leaguesTableBody">
                        <!-- データはJavaScriptで動的に生成 -->
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button class="page-btn" onclick="changePage(-1)">← 前へ</button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="firebaseData.js"></script>
    <script>
        // データ管理
        let currentTab = 'players';
        let currentData = [];
        let allLeagues = [];
        let allTeams = [];
        let allPlayers = [];

        // FirebaseDataServiceの初期化確認
        function checkFirebaseDataService() {
            if (!window.firebaseDataService) {
                console.error('FirebaseDataServiceが初期化されていません');
                return false;
            }
            return true;
        }

        // Firebaseからデータを取得
        async function fetchLeagues() {
            try {
                if (!checkFirebaseDataService()) {
                    return [];
                }
                const data = await window.firebaseDataService.getLeagues();
                allLeagues = data;
                return data;
            } catch (error) {
                console.error('リーグデータ取得エラー:', error);
                return [];
            }
        }

        async function fetchTeams(leagueId) {
            try {
                if (!checkFirebaseDataService()) {
                    return [];
                }
                const data = await window.firebaseDataService.getTeams(leagueId);
                allTeams = data;
                return data;
            } catch (error) {
                console.error('チームデータ取得エラー:', error);
                return [];
            }
        }

        async function fetchPlayers(teamId) {
            try {
                if (!checkFirebaseDataService()) {
                    return [];
                }
                const data = await window.firebaseDataService.getPlayers(teamId);
                allPlayers = data;
                return data;
            } catch (error) {
                console.error('選手データ取得エラー:', error);
                return [];
            }
        }

        async function searchPlayers(query) {
            try {
                if (!checkFirebaseDataService()) {
                    return [];
                }
                const data = await window.firebaseDataService.searchPlayers(query);
                return data;
            } catch (error) {
                console.error('選手検索エラー:', error);
                return [];
            }
        }

        // タブ切り替え
        async function switchTab(tab, element = null) {
            currentTab = tab;
            
            // タブボタンのアクティブ状態を更新
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            } else {
                document.querySelector(`[onclick*="${tab}"]`).classList.add('active');
            }
            
            // タブコンテンツを切り替え
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
            document.getElementById(tab + 'Tab').style.display = 'block';
            
            // データを更新
            switch(tab) {
                case 'players':
                    if (allPlayers.length === 0) {
                        // デフォルトでJ1リーグのチームから選手を取得
                        const leagues = await fetchLeagues();
                        if (leagues.length > 0) {
                            const teams = await fetchTeams(leagues[0].id);
                            if (teams.length > 0) {
                                currentData = await fetchPlayers(teams[0].id);
                            }
                        }
                    } else {
                        currentData = allPlayers;
                    }
                    break;
                case 'teams':
                    if (allTeams.length === 0) {
                        const leagues = await fetchLeagues();
                        if (leagues.length > 0) {
                            currentData = await fetchTeams(leagues[0].id);
                        }
                    } else {
                        currentData = allTeams;
                    }
                    break;
                case 'leagues':
                    if (allLeagues.length === 0) {
                        currentData = await fetchLeagues();
                    } else {
                        currentData = allLeagues;
                    }
                    break;
            }
            
            renderData();
        }

        // データをレンダリング（FotMob風）
        function renderData() {
            const tableBody = document.getElementById(currentTab + 'TableBody');
            if (!tableBody) return;

            // フィルタリングとページネーション
            filterAndPaginateData();
            
            // 現在のページのデータを取得
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            let html = '';
            
            if (pageData.length === 0) {
                html = '<tr><td colspan="6" class="no-data">データが見つかりません</td></tr>';
            } else {
                pageData.forEach(item => {
                    if (currentTab === 'players') {
                        const seasonStats = item.seasons?.['2024-2025']?.stats || item.stats || {};

                            <tr class="data-row" onclick="showPlayerDetail('${item.id}')">

                                    <div class="player-info">
                                        <div class="player-avatar">${item.name.charAt(0)}</div>
                                        <div class="player-details">
                                            <div class="player-name">${item.name}</div>
                                            <div class="player-meta">${item.position} • ${item.nationality} • ${item.age}歳</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="team-info">
                                        <div class="team-name">${item.team}</div>
                                        <div class="league-name">${item.league}</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="season-info">
                                        <div class="season-year">2024-2025</div>
                                        <div class="season-status">進行中</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <span class="stat-label">⚽ ゴール</span>
                                            <span class="stat-value">${seasonStats.goals || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">🎯 アシスト</span>
                                            <span class="stat-value">${seasonStats.assists || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📊 試合数</span>
                                            <span class="stat-value">${seasonStats.appearances || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">⭐ 評価</span>
                                            <span class="stat-value">${seasonStats.rating || 'N/A'}</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    } else if (currentTab === 'teams') {
                        const seasonStats = item.seasons?.['2024-2025']?.stats || item.stats || {};
                        html += `
                            <tr class="data-row" onclick="showTeamDetail('${item.id}')">
                                <td>
                                    <div class="team-info">
                                        <div class="team-avatar">${item.name.charAt(0)}</div>
                                        <div class="team-details">
                                            <div class="team-name">${item.name}</div>
                                            <div class="team-meta">${item.country} • 創設: ${item.founded || 'N/A'}</div>

                                </td>

                                    <div class="league-info">
                                        <div class="league-name">${item.league}</div>
                                        <div class="league-country">${item.country}</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="season-info">
                                        <div class="season-year">2024-2025</div>
                                        <div class="season-position">${seasonStats.position || 'N/A'}位</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="stats-grid">

                                            <span class="stat-label">🏆 ポイント</span>
                                            <span class="stat-value">${seasonStats.points || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">✅ 勝利</span>
                                            <span class="stat-value">${seasonStats.wins || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">⚽ 得点</span>
                                            <span class="stat-value">${seasonStats.goalsFor || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">🛡️ 失点</span>
                                            <span class="stat-value">${seasonStats.goalsAgainst || 0}</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    } else if (currentTab === 'leagues') {
                        html += `
                            <tr class="data-row" onclick="showLeagueDetail('${item.id}')">
                                <td>
                                    <div class="league-info">
                                        <div class="league-avatar">${item.name.charAt(0)}</div>
                                        <div class="league-details">
                                            <div class="league-name">${item.name}</div>
                                            <div class="league-meta">${item.country} • ${item.teams}チーム</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="country-info">
                                        <div class="country-name">${item.country}</div>
                                        <div class="country-flag">🏳️</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="season-info">
                                        <div class="season-year">${item.season}</div>
                                        <div class="season-teams">${item.teams}チーム</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <span class="stat-label">⚽ 総得点</span>
                                            <span class="stat-value">${item.stats?.totalGoals || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📊 試合数</span>
                                            <span class="stat-value">${item.stats?.totalMatches || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📈 平均得点</span>
                                            <span class="stat-value">${item.stats?.avgGoals || 0}</span>
                                        </div>

            tableBody.innerHTML = html;
            updatePagination();

        // API設定機能
        function setApiKey() {
            showApiStatus('APIキーはバックエンドで管理されています', 'success');
        }

        function addSampleData() {
            if (!window.addSampleDataToFirestore) {
                showApiStatus('FirebaseDataServiceが初期化されていません', 'error');
                return;
            }
            window.addSampleDataToFirestore();
            showApiStatus('サンプルデータの追加を開始しました', 'success');
        }

        function importRealData() {
            if (!window.importRealFootballData) {
                showApiStatus('FirebaseDataServiceが初期化されていません', 'error');
                return;
            }
            showApiStatus('実際のデータのインポートを開始しました。時間がかかる場合があります...', 'success');
            window.importRealFootballData();
        }

        function showApiStatus(message, type) {
            const statusElement = document.getElementById('apiStatus');
            statusElement.textContent = message;
            statusElement.className = `api-status ${type}`;
            
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 5000);
        }

        // 検索機能（改善版）
        async function searchData() {
            const searchType = document.getElementById('searchType')?.value || 'players';
            const searchQuery = document.getElementById('searchQuery')?.value?.trim() || '';
            const searchLeague = document.getElementById('searchLeague')?.value || '';
            
            if (!searchQuery) {
                alert('検索キーワードを入力してください');
                return;
            }
            
            // 検索中の表示
            const searchButton = document.querySelector('.search-btn');
            const originalText = searchButton.textContent;
            searchButton.textContent = '検索中...';
            searchButton.disabled = true;
            
            try {
                if (searchType === 'players' && searchQuery) {
                    console.log(`選手検索開始: "${searchQuery}"`);
                    
                    // 選手検索APIを使用
                    currentData = await searchPlayers(searchQuery);
                    currentTab = 'players';
                    
                    // タブを切り替え
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    document.querySelector('.tab-btn[onclick*="players"]').classList.add('active');
                    
                    document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
                    document.getElementById('playersTab').style.display = 'block';
                    
                    // 検索結果の表示
                    if (currentData.length === 0) {
                        showSearchResult('検索結果が見つかりませんでした。別のキーワードで試してください。', 'warning');
                    } else {
                        showSearchResult(`${currentData.length}件の選手が見つかりました`, 'success');
                    }
                } else {
                    // 通常のタブ切り替え
                    await switchTab(searchType);
                    
                    // クライアントサイドでフィルタリング
                    if (searchQuery) {
                        const originalData = [...currentData];
                        currentData = currentData.filter(item => {
                            if (searchType === 'players') {
                                return item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                       item.team.toLowerCase().includes(searchQuery.toLowerCase());
                            } else if (searchType === 'teams') {
                                return item.name.toLowerCase().includes(searchQuery.toLowerCase());
                            } else if (searchType === 'leagues') {
                                return item.name.toLowerCase().includes(searchQuery.toLowerCase());
                            }
                            return true;
                        });
                        
                        if (currentData.length === 0) {
                            showSearchResult('検索結果が見つかりませんでした。別のキーワードで試してください。', 'warning');
                        } else {
                            showSearchResult(`${currentData.length}件の${searchType === 'teams' ? 'チーム' : 'リーグ'}が見つかりました`, 'success');
                        }
                    }
                }
                
                renderData();
            } catch (error) {
                console.error('検索エラー:', error);
                showSearchResult('検索中にエラーが発生しました', 'error');
            } finally {
                // ボタンを元に戻す
                searchButton.textContent = originalText;
                searchButton.disabled = false;
            }
        }
        
        // 検索結果メッセージ表示
        function showSearchResult(message, type) {
            const resultDiv = document.getElementById('searchResult');
            if (!resultDiv) {
                // 結果表示用の要素を作成
                const newResultDiv = document.createElement('div');
                newResultDiv.id = 'searchResult';
                newResultDiv.className = `search-result ${type}`;
                newResultDiv.textContent = message;
                
                const searchSection = document.querySelector('.search-section');
                searchSection.appendChild(newResultDiv);
            } else {
                resultDiv.textContent = message;
                resultDiv.className = `search-result ${type}`;
            }
            
            // 3秒後に自動で非表示
            setTimeout(() => {
                if (resultDiv) {
                    resultDiv.style.display = 'none';
                }
            }, 3000);
        }

        // ページネーション管理
        let currentPage = 1;
        const itemsPerPage = 20;
        let totalPages = 1;
        let filteredData = [];

        // ページネーション
        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
            } else if (typeof direction === 'number' && direction >= 1 && direction <= totalPages) {
                currentPage = direction;
            }
            
            renderData();
            updatePagination();
        }

        // ページネーション更新
        function updatePagination() {
            const paginationContainer = document.querySelector('.pagination');
            if (!paginationContainer) return;

            // ページネーション情報を計算
            totalPages = Math.ceil(filteredData.length / itemsPerPage);
            
            // ページネーションHTMLを生成
            let paginationHTML = `
                <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" 
                        onclick="changePage('prev')" ${currentPage === 1 ? 'disabled' : ''}>
                    ← 前へ
                </button>
            `;

            // ページ番号を表示（最大5ページまで）
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, startPage + 4);

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" 
                            onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            paginationHTML += `
                <button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" 
                        onclick="changePage('next')" ${currentPage === totalPages ? 'disabled' : ''}>
                    次へ →
                </button>
            `;

            paginationContainer.innerHTML = paginationHTML;
        }

        // データフィルタリングとページネーション
        function filterAndPaginateData() {
            filteredData = [...currentData];
            currentPage = 1; // 検索時は最初のページに戻る
            updatePagination();
        }

                    <div class="modal-header">
                        <h2>${league.name}</h2>
                        <button onclick="closeModal()" class="close-btn">×</button>
                    </div>
                    <div class="modal-body">
                        <div class="league-header">
                            <div class="league-avatar-large">${league.name.charAt(0)}</div>
                            <div class="league-info-large">
                                <h3>${league.name}</h3>
                                <p>${league.country} • ${league.teams}チーム</p>
                                <p>シーズン: ${league.season}</p>
                            </div>
                        </div>
                        <div class="season-section">
                            <h4>シーズン統計</h4>
                            <div class="stats-grid-large">
                                <div class="stat-card">
                                    <div class="stat-value">${league.stats?.totalMatches || 0}</div>
                                    <div class="stat-label">総試合数</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value">${league.stats?.totalGoals || 0}</div>
                                    <div class="stat-label">総得点</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value">${league.stats?.avgGoals || 0}</div>
                                    <div class="stat-label">平均得点</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
        }

        function closeModal() {
            const modal = document.querySelector('.detail-modal');
            if (modal) {
                modal.remove();
            }
        }

        // リーグフィルター機能
        function filterByLeague(leagueCode) {
            // リーグタブのアクティブ状態を更新
            document.querySelectorAll('.league-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // データをフィルタリング
            if (leagueCode === 'all') {
                filteredData = [...currentData];
            } else {
                filteredData = currentData.filter(item => {
                    if (currentTab === 'players') {
                        return item.leagueId === leagueCode || item.league?.includes(leagueCode);
                    } else if (currentTab === 'teams') {
                        return item.leagueId === leagueCode || item.league?.includes(leagueCode);
                    }
                    return true;
                });
            }
            
            currentPage = 1;
            renderData();
        }

        // 初期表示
        document.addEventListener('DOMContentLoaded', async function() {
            // FirebaseDataServiceの初期化を待つ
            let retryCount = 0;
            const maxRetries = 10;
            
            const waitForFirebase = () => {
                if (window.firebaseDataService) {
                    console.log('FirebaseDataServiceが初期化されました');
                    initializeData();
                } else if (retryCount < maxRetries) {
                    retryCount++;
                    console.log(`FirebaseDataServiceの初期化を待機中... (${retryCount}/${maxRetries})`);
                    setTimeout(waitForFirebase, 500);
                } else {
                    console.error('FirebaseDataServiceの初期化がタイムアウトしました');
                    initializeFallbackData();
                }
            };
            
            const initializeData = async () => {
                try {
                    await switchTab('leagues');
                } catch (error) {
                    console.error('初期データ読み込みエラー:', error);
                    initializeFallbackData();
                }
            };
            
            const initializeFallbackData = () => {
                // フォールバックデータを設定
                currentData = [
                    {
                        name: "J1リーグ",
                        country: "日本",
                        teams: 18,
                        season: "2024",
                        stats: { totalMatches: 306, totalGoals: 856, avgGoals: 2.8 }
                    },
                    {
                        name: "J2リーグ",
                        country: "日本",
                        teams: 22,
                        season: "2024",
                        stats: { totalMatches: 462, totalGoals: 1155, avgGoals: 2.5 }
                    }
                ];
                renderData();
            };
            
            waitForFirebase();
        });
    </script>
