<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サッカーデータベース - Football Hub Japan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }

        .search-group {
            display: flex;
            flex-direction: column;
        }

        .search-group label {
            color: #cccccc;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .search-input {
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .search-btn {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #00cc6a;
        }

        .data-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
        }

        .data-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #333333;
        }

        .tab-btn {
            background: none;
            color: #cccccc;
            padding: 1rem 2rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #00ff88;
            border-bottom-color: #00ff88;
        }

        .tab-btn:hover {
            color: #00ff88;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .data-table th {
            background: #2a2a2a;
            color: #00ff88;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid #333333;
            font-weight: bold;
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid #333333;
            color: #cccccc;
        }

        .data-table tr:hover {
            background: #2a2a2a;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000000;
            margin-right: 1rem;
        }

        .player-info {
            display: flex;
            align-items: center;
        }

        .player-name {
            color: #ffffff;
            font-weight: bold;
        }

        .player-position {
            color: #888888;
            font-size: 0.9rem;
        }

        .team-badge {
            background: #00ff88;
            color: #000000;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem;
            background: #2a2a2a;
            border-radius: 5px;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stat-label {
            color: #888888;
            font-size: 0.8rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .page-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .page-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        /* API設定セクション */
        .api-config-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .api-config-section h3 {
            color: #00ff88;
            margin-bottom: 1rem;
        }

        .api-input-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .api-input-group label {
            color: #cccccc;
            font-weight: 500;
            min-width: 200px;
        }

        .api-input-group input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 1rem;
        }

        .api-btn {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .api-btn:hover {
            background: #00cc6a;
        }

        .data-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #555555;
        }

        .action-btn.primary {
            background: #00ff88;
            color: #000000;
        }

        .action-btn.primary:hover {
            background: #00cc6a;
        }

        .api-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 5px;
            display: none;
        }

        .api-status.success {
            background: #1a3a1a;
            color: #00ff88;
            border: 1px solid #00ff88;
            display: block;
        }

        .api-status.error {
            background: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
            display: block;
        }

        @media (max-width: 768px) {
            .search-controls {
                grid-template-columns: 1fr;
            }
            
            .data-tabs {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ Football Hub Japan</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
            <button class="nav-btn" onclick="window.location.href='/radar'">レーダーチャート</button>
            <button class="nav-btn" onclick="window.location.href='/'">ログアウト</button>
        </div>
    </header>

    <div class="main-container">
        <h1 class="page-title">サッカーデータベース</h1>
        <p class="page-subtitle">世界中のリーグ、チーム、選手の詳細なデータを網羅</p>

        <div class="search-section">
            <h2 class="search-title">データ検索</h2>
            <div class="search-controls">
                <div class="search-group">
                    <label for="searchType">検索タイプ</label>
                    <select id="searchType" class="search-input">
                        <option value="players">選手</option>
                        <option value="teams">チーム</option>
                        <option value="leagues">リーグ</option>
                    </select>
                </div>
                <div class="search-group">
                    <label for="searchQuery">検索キーワード</label>
                    <input type="text" id="searchQuery" class="search-input" placeholder="選手名、チーム名、リーグ名...">
                </div>
                <div class="search-group">
                    <label for="searchLeague">リーグ</label>
                    <select id="searchLeague" class="search-input">
                        <option value="">すべてのリーグ</option>
                        <option value="j1">J1リーグ</option>
                        <option value="j2">J2リーグ</option>
                        <option value="premier">プレミアリーグ</option>
                        <option value="laliga">ラ・リーガ</option>
                        <option value="bundesliga">ブンデスリーガ</option>
                        <option value="seriea">セリエA</option>
                        <option value="ligue1">リーグ・アン</option>
                    </select>
                </div>
                <button class="search-btn" onclick="searchData()">🔍 検索</button>
            </div>
        </div>

        <!-- API設定セクション -->
        <div class="api-config-section">
            <h3>データソース設定</h3>
            <div class="api-input-group">
                <label for="apiKeyInput">football-data.org APIキー:</label>
                <input type="text" id="apiKeyInput" placeholder="APIキーを入力してください">
                <button onclick="setApiKey()" class="api-btn">設定</button>
            </div>
            <div class="data-actions">
                <button onclick="addSampleData()" class="action-btn">サンプルデータ追加</button>
                <button onclick="importRealData()" class="action-btn primary">実際のデータインポート</button>
            </div>
            <div id="apiStatus" class="api-status"></div>
        </div>

        <div class="data-section">
            <div class="data-tabs">
                <button class="tab-btn active" onclick="switchTab('players', this)">選手データ</button>
                <button class="tab-btn" onclick="switchTab('teams', this)">チームデータ</button>
                <button class="tab-btn" onclick="switchTab('leagues', this)">リーグデータ</button>
            </div>

            <div id="playersTab" class="tab-content">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>選手</th>
                            <th>チーム</th>
                            <th>リーグ</th>
                            <th>年齢</th>
                            <th>ポジション</th>
                            <th>統計</th>
                        </tr>
                    </thead>
                    <tbody id="playersTableBody">
                        <!-- データはJavaScriptで動的に生成 -->
                    </tbody>
                </table>
            </div>

            <div id="teamsTab" class="tab-content" style="display: none;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>チーム</th>
                            <th>リーグ</th>
                            <th>国</th>
                            <th>創設年</th>
                            <th>統計</th>
                        </tr>
                    </thead>
                    <tbody id="teamsTableBody">
                        <!-- データはJavaScriptで動的に生成 -->
                    </tbody>
                </table>
            </div>

            <div id="leaguesTab" class="tab-content" style="display: none;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>リーグ</th>
                            <th>国</th>
                            <th>チーム数</th>
                            <th>シーズン</th>
                            <th>統計</th>
                        </tr>
                    </thead>
                    <tbody id="leaguesTableBody">
                        <!-- データはJavaScriptで動的に生成 -->
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button class="page-btn" onclick="changePage(-1)">← 前へ</button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>
                <button class="page-btn" onclick="changePage(1)">次へ →</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="firebaseData.js"></script>
    <script>
        // データ管理
        let currentTab = 'players';
        let currentData = [];
        let allLeagues = [];
        let allTeams = [];
        let allPlayers = [];

        // Firebaseからデータを取得
        async function fetchLeagues() {
            try {
                const data = await window.firebaseDataService.getLeagues();
                allLeagues = data;
                return data;
            } catch (error) {
                console.error('リーグデータ取得エラー:', error);
                return [];
            }
        }

        async function fetchTeams(leagueId) {
            try {
                const data = await window.firebaseDataService.getTeams(leagueId);
                allTeams = data;
                return data;
            } catch (error) {
                console.error('チームデータ取得エラー:', error);
                return [];
            }
        }

        async function fetchPlayers(teamId) {
            try {
                const data = await window.firebaseDataService.getPlayers(teamId);
                allPlayers = data;
                return data;
            } catch (error) {
                console.error('選手データ取得エラー:', error);
                return [];
            }
        }

        async function searchPlayers(query) {
            try {
                const data = await window.firebaseDataService.searchPlayers(query);
                return data;
            } catch (error) {
                console.error('選手検索エラー:', error);
                return [];
            }
        }

        // タブ切り替え
        async function switchTab(tab, element = null) {
            currentTab = tab;
            
            // タブボタンのアクティブ状態を更新
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            } else {
                document.querySelector(`[onclick*="${tab}"]`).classList.add('active');
            }
            
            // タブコンテンツを切り替え
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
            document.getElementById(tab + 'Tab').style.display = 'block';
            
            // データを更新
            switch(tab) {
                case 'players':
                    if (allPlayers.length === 0) {
                        // デフォルトでJ1リーグのチームから選手を取得
                        const leagues = await fetchLeagues();
                        if (leagues.length > 0) {
                            const teams = await fetchTeams(leagues[0].id);
                            if (teams.length > 0) {
                                currentData = await fetchPlayers(teams[0].id);
                            }
                        }
                    } else {
                        currentData = allPlayers;
                    }
                    break;
                case 'teams':
                    if (allTeams.length === 0) {
                        const leagues = await fetchLeagues();
                        if (leagues.length > 0) {
                            currentData = await fetchTeams(leagues[0].id);
                        }
                    } else {
                        currentData = allTeams;
                    }
                    break;
                case 'leagues':
                    if (allLeagues.length === 0) {
                        currentData = await fetchLeagues();
                    } else {
                        currentData = allLeagues;
                    }
                    break;
            }
            
            renderData();
        }

        // データをレンダリング
        function renderData() {
            const tableBody = document.getElementById(currentTab + 'TableBody');
            tableBody.innerHTML = '';
            
            if (!currentData || currentData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888888; padding: 2rem;">データを読み込み中...</td></tr>';
                return;
            }
            
            currentData.forEach(item => {
                const row = document.createElement('tr');
                
                if (currentTab === 'players') {
                    row.innerHTML = `
                        <td>
                            <div class="player-info">
                                <div class="player-avatar">${item.name.charAt(0)}</div>
                                <div>
                                    <div class="player-name">${item.name}</div>
                                    <div class="player-position">${item.position}</div>
                                </div>
                            </div>
                        </td>
                        <td><span class="team-badge">${item.team}</span></td>
                        <td>${item.league}</td>
                        <td>${item.age}歳</td>
                        <td>${item.position}</td>
                        <td>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.goals}</div>
                                    <div class="stat-label">得点</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.assists}</div>
                                    <div class="stat-label">アシスト</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.matches}</div>
                                    <div class="stat-label">試合数</div>
                                </div>
                            </div>
                        </td>
                    `;
                } else if (currentTab === 'teams') {
                    row.innerHTML = `
                        <td><span class="team-badge">${item.name}</span></td>
                        <td>${item.league}</td>
                        <td>${item.country}</td>
                        <td>${item.founded}</td>
                        <td>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.points}</div>
                                    <div class="stat-label">勝点</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.wins}</div>
                                    <div class="stat-label">勝利</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.draws}</div>
                                    <div class="stat-label">引分</div>
                                </div>
                            </div>
                        </td>
                    `;
                } else if (currentTab === 'leagues') {
                    row.innerHTML = `
                        <td><span class="team-badge">${item.name}</span></td>
                        <td>${item.country}</td>
                        <td>${item.teams}チーム</td>
                        <td>${item.season}</td>
                        <td>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.totalMatches}</div>
                                    <div class="stat-label">試合数</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.totalGoals}</div>
                                    <div class="stat-label">総得点</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${item.stats.avgGoals}</div>
                                    <div class="stat-label">平均得点</div>
                                </div>
                            </div>
                        </td>
                    `;
                }
                
                tableBody.appendChild(row);
            });
        }

        // API設定機能
        function setApiKey() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                showApiStatus('APIキーを入力してください', 'error');
                return;
            }
            
            window.setFootballDataApiKey(apiKey);
            showApiStatus('APIキーが設定されました', 'success');
        }

        function addSampleData() {
            window.addSampleDataToFirestore();
            showApiStatus('サンプルデータの追加を開始しました', 'success');
        }

        function importRealData() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                showApiStatus('APIキーを設定してから実行してください', 'error');
                return;
            }
            
            showApiStatus('実際のデータのインポートを開始しました。時間がかかる場合があります...', 'success');
            window.importRealFootballData(apiKey);
        }

        function showApiStatus(message, type) {
            const statusElement = document.getElementById('apiStatus');
            statusElement.textContent = message;
            statusElement.className = `api-status ${type}`;
            
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 5000);
        }

        // 検索機能
        async function searchData() {
            const searchType = document.getElementById('searchType').value;
            const searchQuery = document.getElementById('searchQuery').value;
            const searchLeague = document.getElementById('searchLeague').value;
            
            if (searchType === 'players' && searchQuery) {
                // 選手検索APIを使用
                currentData = await searchPlayers(searchQuery);
                currentTab = 'players';
                
                // タブを切り替え
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector('.tab-btn[onclick*="players"]').classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
                document.getElementById('playersTab').style.display = 'block';
            } else {
                // 通常のタブ切り替え
                await switchTab(searchType);
                
                // クライアントサイドでフィルタリング
                if (searchQuery) {
                    currentData = currentData.filter(item => {
                        if (searchType === 'players') {
                            return item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                   item.team.toLowerCase().includes(searchQuery.toLowerCase());
                        } else if (searchType === 'teams') {
                            return item.name.toLowerCase().includes(searchQuery.toLowerCase());
                        } else if (searchType === 'leagues') {
                            return item.name.toLowerCase().includes(searchQuery.toLowerCase());
                        }
                        return true;
                    });
                }
            }
            
            renderData();
        }

        // ページネーション
        function changePage(direction) {
            // 実装予定
            alert('ページネーション機能は準備中です');
        }

        // 初期表示
        document.addEventListener('DOMContentLoaded', async function() {
            // 初期データを読み込み
            try {
                await switchTab('leagues');
            } catch (error) {
                console.error('初期データ読み込みエラー:', error);
                // フォールバックデータを設定
                currentData = [
                    {
                        name: "J1リーグ",
                        country: "日本",
                        teams: 18,
                        season: "2024",
                        stats: { totalMatches: 306, totalGoals: 856, avgGoals: 2.8 }
                    },
                    {
                        name: "J2リーグ",
                        country: "日本",
