                    } else if (tabType === 'teams') {

        // 検索機能（改善版）
        async function searchData() {
            const searchType = document.getElementById('searchType')?.value || 'players';
            const searchQuery = document.getElementById('searchQuery')?.value?.trim() || '';
            const searchPosition = document.getElementById('searchPosition')?.value || '';
            const searchLeague = document.getElementById('searchLeague')?.value || '';
            
            // 検索クエリが空でもフィルターが設定されている場合は検索を実行
            if (!searchQuery && !searchPosition && !searchLeague) {
                alert('検索キーワードまたはフィルターを設定してください');
                return;
            }
            
            // 検索中の表示
            const searchButton = document.querySelector('.search-btn');
            const originalText = searchButton.textContent;
            searchButton.textContent = '検索中...';
            searchButton.disabled = true;
            
            try {
                if (searchType === 'players') {
                    console.log(`選手検索開始: "${searchQuery}"`);
                    
                    // 選手データを取得
                    let players = await window.firebaseDataService.getPlayers();
                    currentTab = 'players';
                    
                    // タブを切り替え
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    document.querySelector('.tab-btn[onclick*="players"]').classList.add('active');
                    
                    document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
                    document.getElementById('playersTab').style.display = 'block';
                    
                    // フィルタリングを適用
                    let filteredPlayers = players;
                    
                    // 検索クエリでフィルタリング
                    if (searchQuery) {
                        filteredPlayers = filteredPlayers.filter(player => 
                            (player.name && player.name.toLowerCase().includes(searchQuery.toLowerCase())) ||
                            (player.fullName && player.fullName.toLowerCase().includes(searchQuery.toLowerCase())) ||
                            (player.team && player.team.toLowerCase().includes(searchQuery.toLowerCase())) ||
                            (player.currentTeam && player.currentTeam.toLowerCase().includes(searchQuery.toLowerCase()))
                        );
                    }
                    
                    // ポジションでフィルタリング
                    if (searchPosition) {
                        filteredPlayers = filteredPlayers.filter(player => {
                            const playerPosition = player.position || '';
                            // 完全一致または部分一致で検索
                            return playerPosition === searchPosition || 
                                   playerPosition.includes(searchPosition) ||
                                   searchPosition.includes(playerPosition);
                        });
                    }
                    
                    // リーグでフィルタリング
                    if (searchLeague) {
                        filteredPlayers = filteredPlayers.filter(player => 
                            player.seasons?.['2024-2025']?.league === searchLeague ||
                            player.league === searchLeague
                        );
                    }
                    
                    currentData = filteredPlayers;
                    
                    // 検索結果の表示
                    if (currentData.length === 0) {
                        showSearchResult('検索結果が見つかりませんでした。条件を変更して再試行してください。', 'warning');
                    } else {
                        const filters = [];
                        if (searchQuery) filters.push(`キーワード: "${searchQuery}"`);
                        if (searchPosition) filters.push(`ポジション: ${searchPosition}`);
                        if (searchLeague) filters.push(`リーグ: ${searchLeague}`);
                        
                        const filterText = filters.length > 0 ? ` (${filters.join(', ')})` : '';
                        showSearchResult(`${currentData.length}件の選手が見つかりました${filterText}`, 'success');
                    }
                } else {
                    // チーム・リーグ検索
                    await switchTab(searchType);
                    
                    // クライアントサイドでフィルタリング
                    if (searchQuery || searchLeague) {
                        const originalData = [...currentData];
                        currentData = currentData.filter(item => {
                            let matches = true;
                            
                            if (searchQuery) {
                                if (searchType === 'teams') {
                                    matches = matches && item.name.toLowerCase().includes(searchQuery.toLowerCase());
                                } else if (searchType === 'leagues') {
                                    matches = matches && item.name.toLowerCase().includes(searchQuery.toLowerCase());
                                }
                            }
                            
                            if (searchLeague && searchType === 'teams') {
                                matches = matches && (item.league === searchLeague || item.seasons?.['2024-2025']?.league === searchLeague);
                            }
                            
                            return matches;
                        });
                        
                        if (currentData.length === 0) {
                            showSearchResult('検索結果が見つかりませんでした。条件を変更して再試行してください。', 'warning');
                        } else {
                            showSearchResult(`${currentData.length}件の${searchType === 'teams' ? 'チーム' : 'リーグ'}が見つかりました`, 'success');
                        }
                    }
                }
                
                displayData(currentData, currentTab);
            } catch (error) {
                console.error('検索エラー:', error);
                showSearchResult('検索中にエラーが発生しました', 'error');
            } finally {
                // ボタンを元に戻す
                searchButton.textContent = originalText;
                searchButton.disabled = false;
            }
        }
        
        // 検索結果メッセージ表示
        function showSearchResult(message, type) {
            const resultDiv = document.getElementById('searchResult');
            if (!resultDiv) {
                // 結果表示用の要素を作成
                const newResultDiv = document.createElement('div');
                newResultDiv.id = 'searchResult';
                newResultDiv.className = `search-result ${type}`;
                newResultDiv.textContent = message;
                
                const searchSection = document.querySelector('.search-section');
                searchSection.appendChild(newResultDiv);
            } else {
                resultDiv.textContent = message;
                resultDiv.className = `search-result ${type}`;
            }
            
            // 3秒後に自動で非表示
            setTimeout(() => {
                if (resultDiv) {
                    resultDiv.style.display = 'none';
                }
            }, 3000);
        }

        // ページネーション管理
        let currentPage = 1;
        const itemsPerPage = 20;
        let totalPages = 1;
        let filteredData = [];

        // ページネーション
        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
            } else if (typeof direction === 'number' && direction >= 1 && direction <= totalPages) {
                currentPage = direction;
            }
            
            displayData(currentData, currentTab);
            updatePagination();
        }

        // ページネーション更新
        function updatePagination() {
            const paginationContainer = document.querySelector('.pagination');
            if (!paginationContainer) return;

            // ページネーション情報を計算
            totalPages = Math.ceil(filteredData.length / itemsPerPage);
            
            // ページネーションHTMLを生成
            let paginationHTML = `
                <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" 
                        onclick="changePage('prev')" ${currentPage === 1 ? 'disabled' : ''}>
                    ← 前へ
                </button>
            `;

            // ページ番号を表示（最大5ページまで）
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, startPage + 4);

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" 
                            onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            paginationHTML += `
                <button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" 
                        onclick="changePage('next')" ${currentPage === totalPages ? 'disabled' : ''}>
                    次へ →
                </button>
            `;

            paginationContainer.innerHTML = paginationHTML;
        }

                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // データをフィルタリング
            if (leagueCode === 'all') {
                filteredData = [...currentData];
            } else {
                filteredData = currentData.filter(item => {
                    if (currentTab === 'players') {
                        return item.leagueId === leagueCode || item.league?.includes(leagueCode);
                    } else if (currentTab === 'teams') {
                        return item.leagueId === leagueCode || item.league?.includes(leagueCode);
                    }
                    return true;
                });
            }
            
            currentPage = 1;
            displayData(currentData, currentTab);

        // データ状況確認
        async function checkDataStatus() {
            if (!window.firebaseDataService) {
                showDataStatus('FirebaseDataServiceが初期化されていません', 'error');
                return;
            }

            try {
                const status = await window.firebaseDataService.checkDataStatus();
                showDataStatus(`データベースの状態: ${status.message}`, status.type);
                console.log('データベース状態:', status);
            } catch (error) {
                showDataStatus('データベース状態の確認中にエラーが発生しました', 'error');
                console.error('データベース状態確認エラー:', error);
            }
        }

            try {

        // 自動データ更新チェック
        async function checkAndUpdateData() {
            try {
                console.log('自動データ更新チェックを開始...');
                
                // FirebaseDataServiceの初期化を待つ
                let retryCount = 0;
                const maxRetries = 20;
                
                while (!window.firebaseDataService && retryCount < maxRetries) {
                    console.log(`FirebaseDataServiceの初期化を待機中... (${retryCount + 1}/${maxRetries})`);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    retryCount++;
                }
                
                if (!window.firebaseDataService) {
                    console.error('FirebaseDataServiceの初期化がタイムアウトしました');
                    showDataStatus('FirebaseDataServiceの初期化に失敗しました', 'error');
                    return;
                }

                console.log('FirebaseDataServiceが利用可能になりました');
                const status = await window.firebaseDataService.checkDataStatus();
                console.log('データ状況:', status);
                
                // データが存在しない場合、自動でインポート
                if (!status.isImported || status.playerCount === 0) {
                    console.log('データが存在しません。自動インポートを開始します...');
                    showDataStatus('データが存在しません。自動インポートを開始します...', 'info');
                    
                    // バックグラウンドでインポート実行

                        } catch (error) {
                            console.error('Auto-import error:', error);
                            showDataStatus('自動インポート中にエラーが発生しました: ' + error.message, 'error');
                        }
                    }, 1000);
                } else {
                    console.log(`データが既に存在します: ${status.playerCount}選手, ${status.teamCount}チーム`);
                    showDataStatus(`データが既に存在します: ${status.playerCount}選手, ${status.teamCount}チーム`, 'success');
                }
            } catch (error) {
                console.error('Auto-update check error:', error);
                showDataStatus('自動更新チェック中にエラーが発生しました: ' + error.message, 'error');
            }
        }
