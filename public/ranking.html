<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランキングシステム - Football Hub Japan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-subtitle {
            color: #a0a0a0;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .ranking-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            background: none;
            border: none;
            color: #a0a0a0;
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #00ff88;
            border-bottom-color: #00ff88;
        }

        .tab-btn:hover {
            color: #fff;
        }

        .filters-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-label {
            color: #a0a0a0;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .filter-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
        }

        .filter-select:focus {
            outline: none;
            border-color: #00ff88;
        }

        .search-btn {
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            border: none;
            color: #000;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .ranking-content {
            display: none;
        }

        .ranking-content.active {
            display: block;
        }

        .ranking-table {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .table-header {
            background: rgba(0, 255, 136, 0.1);
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .table-row {
            display: grid;
            grid-template-columns: 60px 1fr 120px 120px 120px 120px;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
            transition: all 0.3s ease;
        }

        .table-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .rank-number {
            font-weight: bold;
            font-size: 1.2rem;
            color: #00ff88;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }

        .player-details h4 {
            margin-bottom: 0.25rem;
            color: #fff;
        }

        .player-details p {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .stat-value {
            text-align: center;
            font-weight: bold;
            color: #00ff88;
        }

        .team-ranking {
            display: grid;
            grid-template-columns: 60px 1fr 100px 100px 100px 100px;
        }

        .team-logo {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 0.8rem;
        }

        .league-ranking {
            display: grid;
            grid-template-columns: 60px 1fr 100px 100px 100px;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #a0a0a0;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: #a0a0a0;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-title {
            margin-bottom: 1rem;
            color: #00ff88;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .table-row {
                grid-template-columns: 40px 1fr 80px;
                gap: 0.5rem;
            }

            .table-row .stat-value:nth-child(n+4) {
                display: none;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }

            .main-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">⚽ Football Hub Japan</a>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
                <button class="nav-btn" onclick="window.location.href='/database-enhanced'">データベース</button>
                <button class="nav-btn" onclick="window.location.href='/'">ログアウト</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <h1 class="page-title">ランキングシステム</h1>
        <p class="page-subtitle">ポジション別、リーグ別の詳細なランキング。選手の市場価値や移籍情報も追跡します。</p>

        <!-- タブナビゲーション -->
        <div class="ranking-tabs">
            <button class="tab-btn active" onclick="switchTab('players')">選手ランキング</button>
            <button class="tab-btn" onclick="switchTab('teams')">チームランキング</button>
            <button class="tab-btn" onclick="switchTab('leagues')">リーグランキング</button>
        </div>

        <!-- フィルターセクション -->
        <div class="filters-section">
            <div class="filters-grid">
                <div class="filter-group">
                    <label class="filter-label">リーグ</label>
                    <select class="filter-select" id="leagueFilter">
                        <option value="">すべてのリーグ</option>
                        <option value="PL">プレミアリーグ</option>
                        <option value="PD">ラ・リーガ</option>
                        <option value="SA">セリエA</option>
                        <option value="BL1">ブンデスリーガ</option>
                        <option value="FL1">リーグ・アン</option>
                        <option value="J1">J1リーグ</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">ポジション</label>
                    <select class="filter-select" id="positionFilter">
                        <option value="">すべてのポジション</option>
                        <option value="Goalkeeper">ゴールキーパー</option>
                        <option value="Defender">ディフェンダー</option>
                        <option value="Midfielder">ミッドフィルダー</option>
                        <option value="Forward">フォワード</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">統計項目</label>
                    <select class="filter-select" id="statFilter">
                        <option value="goals">得点</option>
                        <option value="assists">アシスト</option>
                        <option value="appearances">出場数</option>
                        <option value="minutes">出場時間</option>
                        <option value="passes">パス成功数</option>
                        <option value="tackles">タックル</option>
                        <option value="interceptions">インターセプト</option>
                        <option value="saves">セーブ数</option>
                        <option value="cleanSheets">クリーンシート</option>
                        <option value="rating">平均評価</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button class="search-btn" onclick="loadRanking()">ランキングを表示</button>
                </div>
            </div>
        </div>

        <!-- 選手ランキング -->
        <div id="playerRanking" class="ranking-content active">
            <div class="chart-container">
                <h3 class="chart-title">選手ランキングトップ10</h3>
                <canvas id="playerChart" width="400" height="200"></canvas>
            </div>
            <div class="ranking-table">
                <div class="table-header">
                    <div class="table-row">
                        <div>順位</div>
                        <div>選手</div>
                        <div>得点</div>
                        <div>アシスト</div>
                        <div>出場数</div>
                        <div>評価</div>
                    </div>
                </div>
                <div id="playerTableBody">
                    <div class="loading">ランキングを読み込み中...</div>
                </div>
            </div>
        </div>

        <!-- チームランキング -->
        <div id="teamRanking" class="ranking-content">
            <div class="chart-container">
                <h3 class="chart-title">チームランキングトップ10</h3>
                <canvas id="teamChart" width="400" height="200"></canvas>
            </div>
            <div class="ranking-table">
                <div class="table-header">
                    <div class="table-row team-ranking">
                        <div>順位</div>
                        <div>チーム</div>
                        <div>勝点</div>
                        <div>勝</div>
                        <div>分</div>
                        <div>負</div>
                    </div>
                </div>
                <div id="teamTableBody">
                    <div class="no-data">チームランキングを表示するには、リーグを選択してください。</div>
                </div>
            </div>
        </div>

        <!-- リーグランキング -->
        <div id="leagueRanking" class="ranking-content">
            <div class="chart-container">
                <h3 class="chart-title">欧州5大リーグ比較</h3>
                <canvas id="leagueChart" width="400" height="200"></canvas>
            </div>
            <div class="ranking-table">
                <div class="table-header">
                    <div class="table-row league-ranking">
                        <div>順位</div>
                        <div>リーグ</div>
                        <div>平均得点</div>
                        <div>平均観客</div>
                        <div>評価</div>
                    </div>
                </div>
                <div id="leagueTableBody">
                    <div class="no-data">リーグランキングを表示中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'players';
        let playerChart = null;
        let teamChart = null;
        let leagueChart = null;

        // タブ切り替え
        function switchTab(tab) {
            // タブボタンのアクティブ状態を更新
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // コンテンツの表示切り替え
            document.querySelectorAll('.ranking-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tab + 'Ranking').classList.add('active');

            currentTab = tab;

            // タブに応じてデータを読み込み
            if (tab === 'players') {
                loadPlayerRanking();
            } else if (tab === 'teams') {
                loadTeamRanking();
            } else if (tab === 'leagues') {
                loadLeagueRanking();
            }
        }

        // ランキング読み込み
        function loadRanking() {
            if (currentTab === 'players') {
                loadPlayerRanking();
            } else if (currentTab === 'teams') {
                loadTeamRanking();
            } else if (currentTab === 'leagues') {
                loadLeagueRanking();
            }
        }

        // 選手ランキング読み込み
        async function loadPlayerRanking() {
            const league = document.getElementById('leagueFilter').value;
            const position = document.getElementById('positionFilter').value;
            const stat = document.getElementById('statFilter').value;

            try {
                // APIから選手データを取得
                const response = await fetch(`/api/ranking/players?league=${league}&position=${position}&stat=${stat}`);
                let players;

                if (response.ok) {
                    const data = await response.json();
                    players = data.players || [];
                } else {
                    // フォールバックデータを使用
                    players = generateFallbackPlayerData(league, position, stat);
                }

                displayPlayerRanking(players);
                updatePlayerChart(players.slice(0, 10));

            } catch (error) {
                console.error('Error loading player ranking:', error);
                const players = generateFallbackPlayerData(league, position, stat);
                displayPlayerRanking(players);
                updatePlayerChart(players.slice(0, 10));
            }
        }

        // チームランキング読み込み
        async function loadTeamRanking() {
            const league = document.getElementById('leagueFilter').value;

            if (!league) {
                document.getElementById('teamTableBody').innerHTML = '<div class="no-data">チームランキングを表示するには、リーグを選択してください。</div>';
                return;
            }

            try {
                const response = await fetch(`/api/ranking/teams?league=${league}`);
                let teams;

                if (response.ok) {
                    const data = await response.json();
                    teams = data.teams || [];
                } else {
                    teams = generateFallbackTeamData(league);
                }

                displayTeamRanking(teams);
                updateTeamChart(teams.slice(0, 10));

            } catch (error) {
                console.error('Error loading team ranking:', error);
                const teams = generateFallbackTeamData(league);
                displayTeamRanking(teams);
                updateTeamChart(teams.slice(0, 10));
            }
        }

        // リーグランキング読み込み
        async function loadLeagueRanking() {
            try {
                const response = await fetch('/api/ranking/leagues');
                let leagues;

                if (response.ok) {
                    const data = await response.json();
                    leagues = data.leagues || [];
                } else {
                    leagues = generateFallbackLeagueData();
                }

                displayLeagueRanking(leagues);
                updateLeagueChart(leagues);

            } catch (error) {
                console.error('Error loading league ranking:', error);
                const leagues = generateFallbackLeagueData();
                displayLeagueRanking(leagues);
                updateLeagueChart(leagues);
            }
        }

        // 選手ランキング表示
        function displayPlayerRanking(players) {
            const tbody = document.getElementById('playerTableBody');
            
            if (players.length === 0) {
                tbody.innerHTML = '<div class="no-data">該当する選手が見つかりませんでした。</div>';
                return;
            }

            tbody.innerHTML = players.map((player, index) => `
                <div class="table-row">
                    <div class="rank-number">${index + 1}</div>
                    <div class="player-info">
                        <div class="player-avatar">${player.name.charAt(0)}</div>
                        <div class="player-details">
                            <h4>${player.name}</h4>
                            <p>${player.team} | ${player.position}</p>
                        </div>
                    </div>
                    <div class="stat-value">${player.goals || 0}</div>
                    <div class="stat-value">${player.assists || 0}</div>
                    <div class="stat-value">${player.appearances || 0}</div>
                    <div class="stat-value">${player.rating || 'N/A'}</div>
                </div>
            `).join('');
        }

        // チームランキング表示
        function displayTeamRanking(teams) {
            const tbody = document.getElementById('teamTableBody');
            
            tbody.innerHTML = teams.map((team, index) => `
                <div class="table-row team-ranking">
                    <div class="rank-number">${index + 1}</div>
                    <div class="player-info">
                        <div class="team-logo">${team.name.substring(0, 2).toUpperCase()}</div>
                        <div class="player-details">
                            <h4>${team.name}</h4>
                            <p>${team.league}</p>
                        </div>
                    </div>
                    <div class="stat-value">${team.points}</div>
                    <div class="stat-value">${team.wins}</div>
                    <div class="stat-value">${team.draws}</div>
                    <div class="stat-value">${team.losses}</div>
                </div>
            `).join('');
        }

        // リーグランキング表示
        function displayLeagueRanking(leagues) {
            const tbody = document.getElementById('leagueTableBody');
            
            tbody.innerHTML = leagues.map((league, index) => `
                <div class="table-row league-ranking">
                    <div class="rank-number">${index + 1}</div>
                    <div class="player-details">
                        <h4>${league.name}</h4>
                        <p>${league.country}</p>
                    </div>
                    <div class="stat-value">${league.avgGoals}</div>
                    <div class="stat-value">${league.avgAttendance}</div>
                    <div class="stat-value">${league.rating}</div>
                </div>
            `).join('');
        }

        // 選手チャート更新
        function updatePlayerChart(players) {
            const ctx = document.getElementById('playerChart').getContext('2d');
            
            if (playerChart) {
                playerChart.destroy();
            }

            playerChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: players.map(p => p.name),
                    datasets: [{
                        label: '得点',
                        data: players.map(p => p.goals || 0),
                        backgroundColor: 'rgba(0, 255, 136, 0.8)',
                        borderColor: '#00ff88',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#fff'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#fff'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#fff'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    }
                }
            });
        }

        // チームチャート更新
        function updateTeamChart(teams) {
            const ctx = document.getElementById('teamChart').getContext('2d');
            
            if (teamChart) {
                teamChart.destroy();
            }

            teamChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: teams.map(t => t.name),
                    datasets: [{
                        label: '勝点',
                        data: teams.map(t => t.points),
                        borderColor: '#00ff88',
                        backgroundColor: 'rgba(0, 255, 136, 0.2)',
                        borderWidth: 2,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#fff'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#fff'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#fff'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    }
                }
            });
        }

        // リーグチャート更新
        function updateLeagueChart(leagues) {
            const ctx = document.getElementById('leagueChart').getContext('2d');
            
            if (leagueChart) {
                leagueChart.destroy();
            }

            leagueChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: leagues.map(l => l.name),
                    datasets: [{
                        data: leagues.map(l => l.avgGoals),
                        backgroundColor: [
                            '#00ff88',
                            '#00d4ff',
                            '#ff6b6b',
                            '#ffd93d',
                            '#ff9ff3'
                        ],
                        borderWidth: 2,
                        borderColor: '#1a1a2e'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#fff'
                            }
                        }
                    }
                }
            });
        }

        // フォールバック選手データ生成
        function generateFallbackPlayerData(league, position, stat) {
            const players = [
                { name: '久保建英', team: 'レアル・ソシエダ', position: 'Midfielder', goals: 12, assists: 8, appearances: 28, rating: 7.8 },
                { name: '三笘薫', team: 'ブライトン', position: 'Forward', goals: 8, assists: 6, appearances: 25, rating: 7.5 },
                { name: '堂安律', team: 'フライブルク', position: 'Midfielder', goals: 6, assists: 4, appearances: 22, rating: 7.2 },
                { name: '田中碧', team: 'フォルトゥナ・デュッセルドルフ', position: 'Midfielder', goals: 5, assists: 7, appearances: 24, rating: 7.0 },
                { name: '伊藤洋輝', team: 'シュトゥットガルト', position: 'Defender', goals: 2, assists: 3, appearances: 26, rating: 6.9 },
                { name: '南野拓実', team: 'モナコ', position: 'Forward', goals: 10, assists: 5, appearances: 27, rating: 7.6 },
                { name: '浅野拓磨', team: 'ボーフム', position: 'Forward', goals: 7, assists: 4, appearances: 23, rating: 7.1 },
                { name: '遠藤航', team: 'リバプール', position: 'Midfielder', goals: 1, assists: 2, appearances: 20, rating: 6.8 },
                { name: '上田綺世', team: 'フェイエノールト', position: 'Forward', goals: 15, assists: 3, appearances: 29, rating: 7.9 },
