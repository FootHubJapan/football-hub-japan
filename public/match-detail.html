<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合詳細 - Football Hub Japan</title>
    <!-- Updated for deployment -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .match-header {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .team.away {
            flex-direction: row-reverse;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 1.5rem;
        }

        .team-info h3 {
            color: #00ff88;
            margin-bottom: 0.5rem;
        }

        .team-info p {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .match-score {
            font-size: 3rem;
            font-weight: bold;
            color: #00ff88;
            margin: 0 2rem;
        }

        .match-info {
            color: #a0a0a0;
            margin-bottom: 1rem;
        }

        .match-status {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .match-status.scheduled {
            background: rgba(255, 255, 255, 0.1);
            color: #a0a0a0;
        }

        .match-status.live {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            animation: pulse 2s infinite;
        }

        .match-status.finished {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .match-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            background: none;
            border: none;
            color: #a0a0a0;
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #00ff88;
            border-bottom-color: #00ff88;
        }

        .tab-btn:hover {
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .events-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .event-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .event-time {
            font-weight: bold;
            color: #00ff88;
            min-width: 40px;
        }

        .event-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .event-icon.goal {
            background: #00ff88;
            color: #000;
        }

        .event-icon.card {
            background: #ffd93d;
            color: #000;
        }

        .event-icon.substitution {
            background: #ff6b6b;
            color: #fff;
        }

        .event-description {
            flex: 1;
        }

        .formation-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .formation-field {
            background: linear-gradient(to bottom, #1a4d1a, #2d5a2d);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 2rem;
            margin: 1rem 0;
            position: relative;
            min-height: 400px;
        }

        .formation-line {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 1rem 0;
        }

        .player-position {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .player-position:hover {
            background: #00ff88;
            transform: scale(1.1);
        }

        .goalkeeper {
            background: #ffd93d !important;
        }

        .defender {
            background: #4CAF50 !important;
        }

        .midfielder {
            background: #2196F3 !important;
        }

        .forward {
            background: #f44336 !important;
        }

        .stats-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stats-comparison {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: center;
        }

        .team-stats {
            text-align: center;
        }

        .team-stats.away {
            text-align: center;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #a0a0a0;
        }

        .stat-value {
            font-weight: bold;
            color: #00ff88;
        }

        .stat-comparison {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-bar {
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
        }

        .stat-bar-fill {
            height: 100%;
            background: #00ff88;
            border-radius: 2px;
        }

        .stats-list {
            margin-top: 1rem;
        }

        .no-data {
            color: #a0a0a0;
            text-align: center;
            padding: 2rem;
            font-style: italic;
        }

        .lineup-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lineup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .lineup-team {
            text-align: center;
        }

        .lineup-team h4 {
            color: #00ff88;
            margin-bottom: 1rem;
        }

        .lineup-category {
            margin-bottom: 1rem;
        }

        .lineup-category h5 {
            color: #a0a0a0;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0;
            font-size: 0.9rem;
        }

        .player-number {
            background: #00ff88;
            color: #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .match-teams {
                flex-direction: column;
                gap: 1rem;
            }

            .team.away {
                flex-direction: row;
            }

            .match-score {
                margin: 1rem 0;
                font-size: 2rem;
            }

            .lineup-grid {
                grid-template-columns: 1fr;
            }

            .stats-comparison {
                grid-template-columns: 1fr;
            }

            .main-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">⚽ Football Hub Japan</a>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
                <button class="nav-btn" onclick="window.location.href='/schedule'">スケジュール</button>
                <button class="nav-btn" onclick="window.history.back()">戻る</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- 試合ヘッダー -->
        <div class="match-header">
            <div class="match-teams">
                <div class="team home">
                    <div class="team-logo" id="homeTeamLogo">M</div>
                    <div class="team-info">
                        <h3 id="homeTeamName">Manchester United</h3>
                        <p id="homeTeamLeague">Premier League</p>
                    </div>
                </div>
                
                <div class="match-score" id="matchScore">2 - 1</div>
                
                <div class="team away">
                    <div class="team-logo" id="awayTeamLogo">T</div>
                    <div class="team-info">
                        <h3 id="awayTeamName">Tottenham</h3>
                        <p id="awayTeamLeague">Premier League</p>
                    </div>
                </div>
            </div>
            
            <div class="match-info">
                <p><strong>日時:</strong> <span id="matchDate">2024年12月15日 15:00</span></p>
                <p><strong>会場:</strong> <span id="matchVenue">Old Trafford</span></p>
                <p><strong>審判:</strong> <span id="matchReferee">Michael Oliver</span></p>
            </div>
            
            <div class="match-status finished" id="matchStatus">試合終了</div>
        </div>

        <!-- タブナビゲーション -->
        <div class="match-tabs">
            <button class="tab-btn active" onclick="switchTab('events')">試合経過</button>
            <button class="tab-btn" onclick="switchTab('formation')">フォーメーション</button>
            <button class="tab-btn" onclick="switchTab('stats')">統計</button>
            <button class="tab-btn" onclick="switchTab('lineup')">ラインアップ</button>
        </div>

        <!-- 試合経過タブ -->
        <div id="eventsTab" class="tab-content active">
            <div class="events-section">
                <h3>試合経過</h3>
                <div id="matchEvents">
                    <div class="no-data">イベントデータを読み込み中...</div>
                </div>
            </div>
        </div>

        <!-- フォーメーションタブ -->
        <div id="formationTab" class="tab-content">
            <div class="formation-section">
                <h3>フォーメーション</h3>
                <div class="formation-field">
                    <!-- ホームチームフォーメーション -->
                    <div class="formation-line" style="margin-top: 0;">
                        <div class="player-position goalkeeper" title="David de Gea (1)">GK</div>
                    </div>
                    <div class="formation-line">
                        <div class="player-position defender" title="Aaron Wan-Bissaka (29)">RB</div>
                        <div class="player-position defender" title="Harry Maguire (5)">CB</div>
                        <div class="player-position defender" title="Raphael Varane (19)">CB</div>
                        <div class="player-position defender" title="Luke Shaw (23)">LB</div>
                    </div>
                    <div class="formation-line">
                        <div class="player-position midfielder" title="Scott McTominay (39)">CDM</div>
                        <div class="player-position midfielder" title="Bruno Fernandes (18)">CAM</div>
                        <div class="player-position midfielder" title="Christian Eriksen (14)">CM</div>
                    </div>
                    <div class="formation-line">
                        <div class="player-position forward" title="Marcus Rashford (10)">LW</div>
                        <div class="player-position forward" title="Anthony Martial (9)">ST</div>
                        <div class="player-position forward" title="Jadon Sancho (25)">RW</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 統計タブ -->
        <div id="statsTab" class="tab-content">
            <div class="stats-section">
                <h3>試合統計</h3>
                <div id="stats" class="stats-list">
                    <div class="no-data">統計データを読み込み中...</div>
                        </div>
            </div>
        </div>

        <!-- ラインアップタブ -->
        <div id="lineupTab" class="tab-content">
            <div class="lineup-section">
                <h3>ラインアップ</h3>
                <div id="lineup" class="lineup-grid">
                    <div class="no-data">ラインアップデータを読み込み中...</div>
                            </div>
                            </div>
        </div>
    </div>

    <script>
        // タブ切り替え機能
        function switchTab(tabName) {
            // すべてのタブボタンのアクティブ状態を解除
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // すべてのタブコンテンツを非表示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // クリックされたタブボタンをアクティブにする
            event.target.classList.add('active');
            
            // 対応するタブコンテンツを表示
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        // 試合データをURLパラメータから取得
        async function loadMatchData() {
            const urlParams = new URLSearchParams(window.location.search);
            const matchId = urlParams.get('id');
            const league = urlParams.get('league') || '';
            
            if (matchId) {
                try {
                // 実際のAPIから試合データを取得
                    const response = await fetch(`/api/match/${matchId}/details?league=${encodeURIComponent(league)}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({})
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    console.log('Match data response:', result);
                    console.log('Match data stats:', result.data?.stats);
                    console.log('Match data events:', result.data?.events);
                    console.log('Match data lineups:', result.data?.lineups);
                    
                    if (result.success && result.data) {
                        updateMatchDisplay(result.data);
                        updateStatsTab(result.data.stats || null, result.data);
                        updateEventsTab(result.data.events || []);
                        updateLineupTab(result.data);
                    } else {
                        console.error('試合データの取得に失敗しました:', result);
                        // エラーメッセージを表示
                        const statsContainer = document.getElementById('stats');
                        if (statsContainer) {
                            statsContainer.innerHTML = `<div class="no-data">試合データの取得に失敗しました: ${result.error || '不明なエラー'}</div>`;
                        }
                        loadFallbackMatchData();
                    }
                } catch (error) {
                        console.error('試合データの取得に失敗しました:', error);
                        loadFallbackMatchData();
                }
            } else {
                loadFallbackMatchData();
            }
        }

        // フォールバック試合データの読み込み
        function loadFallbackMatchData() {
            const matchData = {
                homeTeam: 'Manchester United',
                awayTeam: 'Tottenham',
                homeScore: 2,
                awayScore: 1,
                date: '2024年12月15日 15:00',
                venue: 'Old Trafford',
                referee: 'Michael Oliver',
                status: 'finished',
                stats: null,
                events: [],
                lineups: null
            };
            
            updateMatchDisplay(matchData);
            updateStatsTab(null, matchData);
            updateEventsTab([]);
            updateLineupTab(matchData);
        }

        // 試合表示の更新
        function updateMatchDisplay(data) {
            // チーム情報の更新
            const homeTeamName = data.homeTeam || 'ホームチーム';
            const awayTeamName = data.awayTeam || 'アウェイチーム';
            
            document.getElementById('homeTeamName').textContent = homeTeamName;
            document.getElementById('homeTeamLogo').textContent = homeTeamName.charAt(0).toUpperCase();
            document.getElementById('awayTeamName').textContent = awayTeamName;
            document.getElementById('awayTeamLogo').textContent = awayTeamName.charAt(0).toUpperCase();
            
            // リーグ情報
            const leagueName = data.league || 'リーグ未定';
            document.getElementById('homeTeamLeague').textContent = leagueName;
            document.getElementById('awayTeamLeague').textContent = leagueName;
            
            // スコアの更新
            const homeScore = data.homeScore !== null && data.homeScore !== undefined ? data.homeScore : '-';
            const awayScore = data.awayScore !== null && data.awayScore !== undefined ? data.awayScore : '-';
            document.getElementById('matchScore').textContent = `${homeScore} - ${awayScore}`;
            
            // 試合情報の更新
            if (data.date) {
                const dateObj = new Date(data.date);
                document.getElementById('matchDate').textContent = dateObj.toLocaleString('ja-JP');
            }
            document.getElementById('matchVenue').textContent = data.venue || '会場未定';
            document.getElementById('matchReferee').textContent = data.referee || '審判未定';
            
            // 試合ステータスの更新
            const statusElement = document.getElementById('matchStatus');
            const status = data.status || 'scheduled';
            statusElement.textContent = status === 'FT' || status === 'finished' ? '試合終了' : 
                                      status === 'LIVE' || status === 'live' ? '試合中' : '予定';
            statusElement.className = `match-status ${status === 'FT' || status === 'finished' ? 'finished' : status === 'LIVE' || status === 'live' ? 'live' : 'scheduled'}`;
        }

        // 統計タブを更新
        function updateStatsTab(statsData, matchData = null) {
            const statsContainer = document.getElementById('stats');
            if (!statsContainer) {
                console.warn('Stats container not found');
                return;
            }

            console.log('Updating stats tab with data:', statsData);
            
            if (statsData && Object.keys(statsData).length > 0) {
                let statsHTML = '';
                
                // 統計項目の定義（表示順序とラベル）
                const statsOrder = [
                    { key: 'possession', label: 'ボール支配率', suffix: '%', isPercentage: true },
                    { key: 'shots', label: 'シュート数' },
                    { key: 'shotsOnTarget', label: '枠内シュート' },
                    { key: 'shotsOffTarget', label: '枠外シュート' },
                    { key: 'shotsInsideBox', label: 'ペナルティエリア内シュート' },
                    { key: 'shotsOutsideBox', label: 'ペナルティエリア外シュート' },
                    { key: 'corners', label: 'コーナーキック' },
                    { key: 'fouls', label: 'ファウル' },
                    { key: 'yellowCards', label: 'イエローカード' },
                    { key: 'redCards', label: 'レッドカード' },
                    { key: 'offsides', label: 'オフサイド' },
                    { key: 'saves', label: 'セーブ' },
                    { key: 'goalkeepersSaves', label: 'GKセーブ' },
                    { key: 'passes', label: 'パス数' },
                    { key: 'passesAccuracy', label: 'パス成功率', suffix: '%', isPercentage: true },
                    { key: 'attacks', label: '攻撃回数' },
                    { key: 'dangerousAttacks', label: '危険な攻撃回数' },
                    { key: 'ballSafe', label: 'ボールセーフ' },
                    { key: 'throwIns', label: 'スローイン' },
                    { key: 'freeKicks', label: 'フリーキック' },
                    { key: 'goalKicks', label: 'ゴールキック' },
                    { key: 'substitutions', label: '交代回数' },
                    { key: 'tackles', label: 'タックル' },
                    { key: 'blockedShots', label: 'ブロックされたシュート' },
                    { key: 'hitWoodwork', label: 'ポスト・クロスバー' },
                    { key: 'bigChances', label: 'ビッグチャンス' }
                ];
                
                // 各統計項目を処理
                statsOrder.forEach(({ key, label, suffix = '', isPercentage = false }) => {
                    const value = statsData[key];
                    if (value && typeof value === 'object' && (value.home !== undefined || value.away !== undefined)) {
                        const homeValue = value.home || 0;
                        const awayValue = value.away || 0;
                        
                        // 両方とも0の場合は表示しない（重要度の低い統計を除外）
                        if (homeValue === 0 && awayValue === 0 && key !== 'possession' && key !== 'shots' && key !== 'shotsOnTarget') {
                            return;
                        }
                        
                        let statValue = '';
                        if (isPercentage) {
                            statValue = `${homeValue}% - ${awayValue}%`;
                        } else {
                            statValue = `${homeValue} - ${awayValue}${suffix}`;
                        }
                        
                        statsHTML += `
                            <div class="stat-item">
                                <span class="stat-label">${label}</span>
                                <span class="stat-value">${statValue}</span>
                            </div>
                        `;
                    }
                });
                
                if (statsHTML) {
                    statsContainer.innerHTML = statsHTML;
                    console.log('Stats HTML updated');
                } else {
                    const homeTeam = matchData?.homeTeam || 'ホームチーム';
                    const awayTeam = matchData?.awayTeam || 'アウェイチーム';
                    statsContainer.innerHTML = `<div class="no-data">${homeTeam} vs ${awayTeam}の統計データが利用できません</div>`;
                }
            } else {
                // データがない場合の表示
                const homeTeam = matchData?.homeTeam || 'ホームチーム';
                const awayTeam = matchData?.awayTeam || 'アウェイチーム';
                statsContainer.innerHTML = `<div class="no-data">${homeTeam} vs ${awayTeam}の統計データが利用できません</div>`;
            }
        }

        // イベントタブを更新
        function updateEventsTab(eventsData) {
            const eventsContainer = document.getElementById('matchEvents');
            if (!eventsContainer) {
                console.warn('Events container not found');
                return;
            }

            console.log('Updating events tab with data:', eventsData);
            
            if (eventsData && eventsData.length > 0) {
                let eventsHTML = '';
                
                // イベントを時間順にソート
                const sortedEvents = [...eventsData].sort((a, b) => {
                    const timeA = typeof a.time === 'object' ? a.time?.elapsed || 0 : a.time || 0;
                    const timeB = typeof b.time === 'object' ? b.time?.elapsed || 0 : b.time || 0;
                    return timeA - timeB;
                });
                
                sortedEvents.forEach(event => {
                    // 時間の取得（オブジェクトの場合はelapsedプロパティ、数値の場合はそのまま）
                    const time = typeof event.time === 'object' ? (event.time?.elapsed || 0) : (event.time || 0);
                    const type = event.type || 'Unknown';
                    const detail = event.detail || '';
                    const player = event.player?.name || event.player || 'Unknown';
                    const assist = event.assist?.name || event.assist || null;
                    const team = event.team?.name || event.team || 'Unknown';
                    
                    let eventIcon = '⚽';
                    let eventClass = 'goal';
                    let description = '';
                    
                    // イベントタイプに応じてアイコンと説明を設定
                    if (type === 'Goal' || detail === 'Normal Goal' || detail === 'Penalty' || detail === 'Own Goal') {
                        eventIcon = '⚽';
                        eventClass = 'goal';
                        const goalType = detail === 'Penalty' ? ' (ペナルティ)' : detail === 'Own Goal' ? ' (オウンゴール)' : '';
                        description = `<strong>得点!</strong> ${player}${goalType}${assist ? ` (アシスト: ${assist})` : ''}`;
                    } else if (type === 'Card' || detail === 'Yellow Card') {
                        eventIcon = '🟨';
                        eventClass = 'card';
                        description = `<strong>イエローカード</strong> ${player}`;
                    } else if (detail === 'Red Card' || detail === 'Second Yellow card') {
                        eventIcon = '🟥';
                        eventClass = 'card';
                        description = `<strong>レッドカード</strong> ${player}`;
                    } else if (type === 'subst' || type === 'Substitution') {
                        eventIcon = '🔄';
                        eventClass = 'substitution';
                        description = `<strong>選手交代</strong> ${player}`;
                    } else {
                        description = `<strong>${detail || type}</strong> ${player !== 'Unknown' ? player : ''}`;
                    }
                    
                    eventsHTML += `
                        <div class="event-item">
                            <span class="event-time">${time}'</span>
                            <div class="event-icon ${eventClass}">${eventIcon}</div>
                            <div class="event-description">${description}</div>
                        </div>
                    `;
                });
                
                eventsContainer.innerHTML = eventsHTML;
            } else {
                eventsContainer.innerHTML = '<div class="no-data">イベントデータが利用できません</div>';
            }
        }

        // ラインアップタブを更新
        function updateLineupTab(matchData) {
            const lineupContainer = document.getElementById('lineup');
            if (!lineupContainer) {
                console.warn('Lineup container not found');
                return;
            }

            console.log('Updating lineup tab with data:', matchData);
            
            const lineups = matchData.lineups;
            const homeTeam = matchData.homeTeam || 'ホームチーム';
            const awayTeam = matchData.awayTeam || 'アウェイチーム';
            
            if (lineups && (lineups.home || lineups.away)) {
                let lineupHTML = '<div class="lineup-grid">';
                
                // ホームチーム
                if (lineups.home) {
                    lineupHTML += `
                        <div class="lineup-team">
                            <h4>${homeTeam}</h4>
                            ${lineups.home.formation ? `<p>フォーメーション: ${lineups.home.formation}</p>` : ''}
                            <div class="lineup-category">
                                <h5>スタメン</h5>
                                ${(lineups.home.startXI || []).map(player => `
                                    <div class="player-item">
                                        <div class="player-number">${player.number || ''}</div>
                                        <span>${player.name || 'Unknown'} (${player.position || 'Unknown'})</span>
                                    </div>
                                `).join('')}
                            </div>
                            ${lineups.home.substitutes && lineups.home.substitutes.length > 0 ? `
                                <div class="lineup-category">
                                    <h5>ベンチ</h5>
                                    ${lineups.home.substitutes.map(player => `
                                        <div class="player-item">
                                            <div class="player-number">${player.number || ''}</div>
                                            <span>${player.name || 'Unknown'} (${player.position || 'Unknown'})</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            ${lineups.home.coach ? `
                                <div class="lineup-category">
                                    <h5>監督</h5>
                                    <div class="player-item">
                                        <span>${lineups.home.coach}</span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
                
                // アウェイチーム
                if (lineups.away) {
                    lineupHTML += `
                        <div class="lineup-team">
                            <h4>${awayTeam}</h4>
                            ${lineups.away.formation ? `<p>フォーメーション: ${lineups.away.formation}</p>` : ''}
                            <div class="lineup-category">
                                <h5>スタメン</h5>
                                ${(lineups.away.startXI || []).map(player => `
                                    <div class="player-item">
                                        <div class="player-number">${player.number || ''}</div>
                                        <span>${player.name || 'Unknown'} (${player.position || 'Unknown'})</span>
                                    </div>
                                `).join('')}
                            </div>
                            ${lineups.away.substitutes && lineups.away.substitutes.length > 0 ? `
                                <div class="lineup-category">
                                    <h5>ベンチ</h5>
                                    ${lineups.away.substitutes.map(player => `
                                        <div class="player-item">
                                            <div class="player-number">${player.number || ''}</div>
                                            <span>${player.name || 'Unknown'} (${player.position || 'Unknown'})</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            ${lineups.away.coach ? `
                                <div class="lineup-category">
                                    <h5>監督</h5>
                                    <div class="player-item">
                                        <span>${lineups.away.coach}</span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
                
                lineupHTML += '</div>';
                lineupContainer.innerHTML = lineupHTML;
            } else {
                lineupContainer.innerHTML = `<div class="no-data">${homeTeam} vs ${awayTeam}のラインアップデータが利用できません</div>`;
            }
        }

        // ページ読み込み時に試合データを読み込み
        document.addEventListener('DOMContentLoaded', function() {
            loadMatchData();
        });
    </script>
</body>
</html>
