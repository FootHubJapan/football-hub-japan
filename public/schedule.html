<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合スケジュール - Football Hub Japan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #00ff88;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .schedule-controls {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .control-select {
            background: #2a2a2a;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
        }

        .control-select:focus {
            outline: none;
            border-color: #00ff88;
        }

        .control-button {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .control-button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .match-card {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 2px solid #4CAF50;
            border-radius: 15px;
            padding: 20px;
            margin: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .match-card:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* モーダルスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background-color: #2a2a2a;
            margin: 5% auto;
            padding: 30px;
            border: 2px solid #4CAF50;
            border-radius: 15px;
            width: 80%;
            max-width: 600px;
            position: relative;
            color: white;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 20px;
        }

        .close:hover,
        .close:focus {
            color: #4CAF50;
        }

        .match-detail-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
        }

        .match-detail-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
            font-size: 24px;
            font-weight: bold;
        }

        .match-detail-score {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .match-detail-item {
            background-color: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }

        .match-detail-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }

        .match-detail-value {
            font-size: 16px;
            color: white;
            font-weight: bold;
        }

        .match-detail-status {
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-status .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333333;
        }

        .match-league {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .match-time {
            color: #888888;
            font-size: 0.9rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .team-name {
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: #333333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .match-score {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .match-venue {
            color: #888888;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
        }

        .match-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-finished {
            background: #00ff88;
            color: #000000;
        }

        .status-scheduled {
            background: #ffaa00;
            color: #000000;
        }

        .status-live {
            background: #ff4444;
            color: #ffffff;
        }

        .loading {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .error {
            text-align: center;
            color: #ff4444;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .no-matches {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        @media (max-width: 768px) {
            .schedule-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-select {
                min-width: auto;
            }

            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .match-teams {
                flex-direction: column;
                gap: 1rem;
            }

            .match-score {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

        <!-- ヘッダー -->
        <header class="header">
            <a href="/dashboard" class="logo">⚽ Football Hub Japan</a>
            <nav class="nav-links">
                <a href="/dashboard" class="nav-link">ダッシュボード</a>
                <a href="/database-enhanced" class="nav-link">データベース</a>
                <a href="/radar" class="nav-link">レーダーチャート</a>
                <a href="/ai-agent" class="nav-link">AIエージェント</a>
            </nav>
        </header>

        <div class="main-container">
            <h1 class="page-title">試合スケジュール</h1>
            <p class="page-subtitle">お気に入りのチームや選手の試合スケジュールを一覧表示</p>

            <div class="schedule-controls">
                <div class="control-group">
                    <label class="control-label">リーグ</label>
                    <select class="control-select" id="leagueSelect">
                        <option value="">すべてのリーグ</option>
                        <option value="PL">プレミアリーグ</option>
                        <option value="PD">ラ・リーガ</option>
                        <option value="SA">セリエA</option>
                        <option value="BL1">ブンデスリーガ</option>
                        <option value="FL1">リーグ・アン</option>
                        <option value="J1">J1リーグ</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">期間</label>
                    <select class="control-select" id="timeRangeSelect">
                        <option value="today">今日</option>
                        <option value="tomorrow">明日</option>
                        <option value="week" selected>今週</option>
                        <option value="lastweek">先週</option>
                        <option value="month">今月</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">検索</label>
                    <input type="text" id="searchInput" class="control-select" placeholder="チーム名や選手名で検索..." />
                </div>

                <button class="control-button" onclick="loadMatches()">試合を表示</button>
            </div>

            <div id="scheduleContent">
                <div class="loading">試合データを読み込み中...</div>
            </div>

    <!-- 試合概要モーダル -->
    <div id="matchModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="matchDetails">
                <!-- 試合詳細がここに動的に挿入される -->
            </div>
        </div>
    </div>

    <script src="/ai-widget.js"></script>
    <script>
        let currentMatches = [];

        // イベントリスナーを設定
        document.addEventListener('DOMContentLoaded', function() {
            // 初期データを読み込み
            loadMatches();
            
            // リーグ選択の変更を監視
            document.getElementById('leagueSelect').addEventListener('change', loadMatches);
            
            // 期間選択の変更を監視
            document.getElementById('timeRangeSelect').addEventListener('change', loadMatches);
            
            // 検索入力の変更を監視
            document.getElementById('searchInput').addEventListener('input', loadMatches);
            

        });

        // 試合データを読み込む
        async function loadMatches() {
            const league = document.getElementById('leagueSelect').value;
            const timeRange = document.getElementById('timeRangeSelect').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            console.log('Loading matches with:', { league, timeRange, searchTerm });
            
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '<div class="loading">試合データを読み込み中...</div>';

            try {
                const response = await fetch(`/api/fotmob/matches?league=${league}&timeRange=${timeRange}`);
                console.log('API Response status:', response.status);
                console.log('API Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // 生のレスポンステキストを確認
                const responseText = await response.text();
                console.log('Raw response text:', responseText);
                
                // JSONとしてパース
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('Parsed JSON data:', data);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    throw new Error(`JSON parse error: ${parseError.message}`);
                }
                
                if (data && data.matches && Array.isArray(data.matches) && data.matches.length > 0) {
                    console.log('Found matches:', data.matches.length);
                    currentMatches = data.matches;
                    // フィルタリングを適用
                    const filteredMatches = filterMatches(currentMatches, league, timeRange, searchTerm);
                    
                    if (filteredMatches.length === 0) {
                        contentDiv.innerHTML = '<div class="no-matches">条件に一致する試合が見つかりませんでした。</div>';
                        return;
                    }
                    
                    // 試合カードを生成
                    const matchesHtml = filteredMatches.map(match => {
                        const matchDate = new Date(match.date);
                        const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        });
                        const dateString = matchDate.toLocaleDateString('ja-JP', { 
                            month: 'short', 
                            day: 'numeric' 
                        });

                        // スコアの表示を元のnull表示に戻す
                        const homeScore = match.homeScore;
                        const awayScore = match.awayScore;
                        
                        // 試合の状態に応じた表示
                        let statusDisplay = '';
                        let scoreDisplay = '';
                        
                        if (match.status === 'TIMED' || match.status === 'Scheduled') {
                            statusDisplay = '予定';
                            scoreDisplay = `<span class="text-gray-400">null</span>`;
                        } else if (match.status === 'Finished' || match.status === 'FT') {
                            statusDisplay = '終了';
                            scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                        } else if (match.status === 'LIVE' || match.status === 'HT') {
                            statusDisplay = '試合中';
                            scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;
                        } else {
                            statusDisplay = match.status || '未定';
                            scoreDisplay = `<span class="text-gray-400">null</span>`;
                        }
                        
                        const matchHtml = `
                                <div class="match-card" onclick="showMatchDetails(${JSON.stringify(match).replace(/"/g, '&quot;')})">
                                    <div class="match-header">
                                        <span class="match-league">${getLeagueName(match.league)}</span>
                                        <span class="match-status ${getStatusClass(match.status)}">${getStatusText(match.status)}</span>
                                    </div>
                                    
                                    <div class="match-teams">
                                        <div class="team">
                                            <div class="team-logo">🏟️</div>
                                            <div class="team-name">${match.homeTeam}</div>
                                        </div>
                                        
                                        <div class="match-score">
                                            <span>${match.homeScore !== undefined && match.homeScore !== null ? match.homeScore : ''}</span>
                                            <span>${match.homeScore !== undefined && match.homeScore !== null && match.awayScore !== undefined && match.awayScore !== null ? '-' : ''}</span>
                                            <span>${match.awayScore !== undefined && match.awayScore !== null ? match.awayScore : ''}</span>
                                        </div>
                                        
                                        <div class="team">
                                            <div class="team-logo">🏟️</div>
                                            <div class="team-name">${match.awayTeam}</div>
                                        </div>
                                    </div>
                                    
                                    <div class="match-venue">${match.venue}</div>
                                    <div class="match-time">${dateString} ${timeString}</div>
                                </div>
                            `;

                        return matchHtml;
                    }).join('');

                    contentDiv.innerHTML = `<div class="schedule-grid">${matchesHtml}</div>`;
                } else {
                    console.log('No matches found in response. Response structure:', data);
                    console.log('Data type:', typeof data);
                    console.log('Data keys:', data ? Object.keys(data) : 'null/undefined');
                    
                    contentDiv.innerHTML = `
                        <div class="no-matches">
                            <p>指定された条件に一致する試合が見つかりませんでした。</p>
                            <p>レスポンス構造: ${JSON.stringify(data, null, 2)}</p>
                            <p>データ型: ${typeof data}</p>
                            <p>キー: ${data ? Object.keys(data).join(', ') : 'null/undefined'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading matches:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <p>試合データの読み込みに失敗しました。</p>
                        <p>エラー: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 試合を表示
        function displayMatches(matches) {
            const contentDiv = document.getElementById('scheduleContent');
            
            if (matches.length === 0) {
                contentDiv.innerHTML = '<div class="no-matches">試合が見つかりませんでした。</div>';
                return;
            }

            const matchesHtml = matches.map(match => {
                const matchDate = new Date(match.date);
                const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                const dateString = matchDate.toLocaleDateString('ja-JP', { 
                    month: 'short', 
                    day: 'numeric' 
                });

                // スコアの表示を元のnull表示に戻す
                const homeScore = match.homeScore;
                const awayScore = match.awayScore;
                
                // 試合の状態に応じた表示
                let statusDisplay = '';
                let scoreDisplay = '';
                
                if (match.status === 'TIMED' || match.status === 'Scheduled') {
                    statusDisplay = '予定';
                    scoreDisplay = `<span class="text-gray-400">null</span>`;
                } else if (match.status === 'Finished' || match.status === 'FT') {
                    statusDisplay = '終了';
                    scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                } else if (match.status === 'LIVE' || match.status === 'HT') {
                    statusDisplay = '試合中';
                    scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;
                } else {
                    statusDisplay = match.status || '未定';
                    scoreDisplay = `<span class="text-gray-400">null</span>`;
                }
                
                const matchHtml = `
                        <div class="match-card">
                            <div class="match-header">
                                <span class="match-league">${getLeagueName(match.league)}</span>
                                <span class="match-status ${getStatusClass(match.status)}">${getStatusText(match.status)}</span>
                            </div>
                            
                            <div class="match-teams">
                                <div class="team">
                                    <div class="team-logo">🏟️</div>
                                    <div class="team-name">${match.homeTeam}</div>
                                </div>
                                
                                <div class="match-score">
                                    <span>${match.homeScore !== undefined && match.homeScore !== null ? match.homeScore : ''}</span>
                                    <span>${match.homeScore !== undefined && match.homeScore !== null && match.awayScore !== undefined && match.awayScore !== null ? '-' : ''}</span>
                                    <span>${match.awayScore !== undefined && match.awayScore !== null ? match.awayScore : ''}</span>
                                </div>
                                
                                <div class="team">
                                    <div class="team-logo">🏟️</div>
                                    <div class="team-name">${match.awayTeam}</div>
                                </div>
                            </div>
                            
                            <div class="match-venue">${match.venue}</div>
                            <div class="match-time">${dateString} ${timeString}</div>
                        </div>
                    `;

                return matchHtml;
            }).join('');

            contentDiv.innerHTML = `<div class="schedule-grid">${matchesHtml}</div>`;
        }



        // ステータスクラスを取得
        function getStatusClass(status) {
            switch (status) {
                case 'Finished':
                    return 'status-finished';
                case 'Scheduled':
                case 'NS':
                    return 'status-scheduled';
                case 'Live':
                case 'LIVE':
                    return 'status-live';
                case 'HT':
                    return 'status-live';
                default:
                    return 'status-scheduled';
            }
        }

        // ステータステキストを取得
        function getStatusText(status) {
            switch (status) {
                case 'Finished':
                    return '終了';
                case 'Scheduled':
                case 'NS':
                    return '予定';
                case 'Live':
                case 'LIVE':
                    return '生中継';
                case 'HT':
                    return 'ハーフタイム';
                default:
                    return '予定';
            }
        }

        // リーグ名を取得
        function getLeagueName(leagueCode) {
            const leagueNames = {
                'PL': 'プレミアリーグ',
                'PD': 'ラ・リーガ',
                'SA': 'セリエA',
                'BL1': 'ブンデスリーガ',
                'FL1': 'リーグ・アン',
                'J1': 'J1リーグ'
            };
            return leagueNames[leagueCode] || leagueCode;
        }

        // 試合データをフィルタリング
        function filterMatches(matches, league, timeRange, searchTerm) {
            let filteredMatches = matches;
            
            // リーグでフィルタリング
            if (league && league !== '') {
                filteredMatches = filteredMatches.filter(match => match.league === league);
            }
            
            // 検索語でフィルタリング
            if (searchTerm && searchTerm.trim() !== '') {
                filteredMatches = filteredMatches.filter(match => {
                    const homeTeam = match.homeTeam.toLowerCase();
                    const awayTeam = match.awayTeam.toLowerCase();
                    const venue = match.venue ? match.venue.toLowerCase() : '';
                    
                    return homeTeam.includes(searchTerm) || 
                           awayTeam.includes(searchTerm) || 
                           venue.includes(searchTerm);
                });
            }
            
            return filteredMatches;
        }

        // 試合詳細を表示する関数
        function showMatchDetails(matchData) {
            const modal = document.getElementById('matchModal');
            const modalContent = modal.querySelector('.modal-content');
            const matchDetailsDiv = modalContent.querySelector('#matchDetails');

            // モーダルの内容をクリア
            matchDetailsDiv.innerHTML = '';

            // 試合詳細を表示
            const matchDate = new Date(matchData.date);
            const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            const dateString = matchDate.toLocaleDateString('ja-JP', { 
                month: 'short', 
                day: 'numeric' 
            });

            const homeScore = matchData.homeScore;
            const awayScore = matchData.awayScore;

            const statusText = getStatusText(matchData.status);
            const statusClass = getStatusClass(matchData.status);

            const leagueName = getLeagueName(matchData.league);

            const matchDetailsHtml = `
                <div class="match-detail-header">
                    <h2>${leagueName} ${dateString} ${timeString}</h2>
                </div>
                <div class="match-detail-teams">
                    <div class="team">
                        <div class="team-logo">🏟️</div>
                        <div class="team-name">${matchData.homeTeam}</div>
                    </div>
                    <div class="match-detail-score">${homeScore !== null && homeScore !== undefined ? homeScore : '-'} - ${awayScore !== null && awayScore !== undefined ? awayScore : '-'}</div>
                    <div class="team">
                        <div class="team-logo">🏟️</div>
                        <div class="team-name">${matchData.awayTeam}</div>
                    </div>
                </div>
                <div class="match-detail-info">
                    <div class="match-detail-item">
                        <span class="match-detail-label">ステータス:</span>
                        <span class="match-detail-value"><span class="status-badge ${statusClass}">${statusText}</span></span>
                    </div>
                    <div class="match-detail-item">
                        <span class="match-detail-label">リーグ:</span>
                        <span class="match-detail-value">${leagueName}</span>
                    </div>
                    <div class="match-detail-item">
                        <span class="match-detail-label">会場:</span>
                        <span class="match-detail-value">${matchData.venue || '会場未定'}</span>
                    </div>
                    <div class="match-detail-item">
                        <span class="match-detail-label">スコア:</span>
                        <span class="match-detail-value">${homeScore !== null && homeScore !== undefined ? homeScore : '-'} - ${awayScore !== null && awayScore !== undefined ? awayScore : '-'}</span>
                    </div>
                </div>
            `;

            matchDetailsDiv.innerHTML = matchDetailsHtml;
            modal.style.display = 'block';
        }

        // モーダルを閉じる関数
        document.getElementById('matchModal').addEventListener('click', function(event) {
            const modal = this;
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // モーダルの閉じるボタンをクリックしたとき
        document.querySelector('.close').addEventListener('click', function() {
            document.getElementById('matchModal').style.display = 'none';
        });
    </script>
</body>
</html>
