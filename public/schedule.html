<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合スケジュール - Football Hub Japan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading {
            text-align: center;
            padding: 2rem;
            color: #9ca3af;
            font-size: 1.1rem;
        }
        
        .error {
            background-color: #dc2626;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
            text-align: center;
        }
        
        .no-matches {
            text-align: center;
            padding: 2rem;
            color: #9ca3af;
            font-size: 1.1rem;
        }
        
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #374151;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #6b7280;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        
        /* グラデーションテキストのフォールバック */
        .bg-gradient-text {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* カードのホバーエフェクト */
        .match-card {
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .match-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.15);
        }
        
        /* リーグカラーのカスタムスタイル */
        .league-PL { 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .league-PD { 
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        .league-SA { 
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .league-BL1 { 
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        .league-FL1 { 
            background: linear-gradient(135deg, #f97316, #ea580c);
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        .league-J1 { 
            background: linear-gradient(135deg, #eab308, #ca8a04);
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
        }
        
        /* ボタンのホバーエフェクト */
        .btn-hover {
            transition: all 0.2s ease;
        }
        
        .btn-hover:hover {
            transform: scale(1.05);
        }
        
        /* ナビゲーションリンク */
        .nav-link {
            position: relative;
            overflow: hidden;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        /* チームロゴのアニメーション */
        .team-logo {
            transition: all 0.3s ease;
        }
        
        .team-logo:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        /* リーグバッジのアニメーション */
        .league-badge {
            transition: all 0.3s ease;
        }
        
        .league-badge:hover {
            transform: scale(1.05);
        }
        
        /* ダークモード対応 */
        @media (prefers-color-scheme: dark) {
            .match-card {
                background: rgba(31, 41, 55, 0.9);
            }
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gray-900 text-white">
        <!-- ヘッダー -->
        <header class="bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 border-b border-gray-700 shadow-2xl">
            <div class="container mx-auto px-6 py-8">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-gradient-to-br from-yellow-400 via-orange-500 to-red-500 rounded-2xl flex items-center justify-center shadow-2xl transform rotate-3 hover:rotate-0 transition-transform duration-300">
                            <span class="text-3xl">⚽</span>
                        </div>
                        <div class="text-center">
                            <h1 class="text-4xl font-black bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 bg-clip-text text-transparent leading-tight">
                                Football Hub Japan
                            </h1>
                            <p class="text-gray-300 text-sm mt-1">Your Ultimate Football Companion</p>
                        </div>
                    </div>
                    <nav class="hidden lg:flex space-x-8">
                        <a href="#" class="nav-link text-gray-300 hover:text-white transition-all duration-300 hover:scale-110">ダッシュボード</a>
                        <a href="#" class="nav-link text-gray-300 hover:text-white transition-all duration-300 hover:scale-110">データベース</a>
                        <a href="#" class="nav-link text-gray-300 hover:text-white transition-all duration-300 hover:scale-110">レーダーチャート</a>
                        <a href="#" class="nav-link text-gray-300 hover:text-white transition-all duration-300 hover:scale-110">AIエージェント</a>
                    </nav>
                </div>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="container mx-auto px-4 py-8">
            <!-- フィルターセクション -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 mb-8 border border-gray-200 dark:border-gray-700 shadow-xl backdrop-blur-sm">
                <div class="flex flex-col lg:flex-row gap-6 items-end">
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">リーグ選択</label>
                        <select id="leagueSelect" class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 rounded-xl px-4 py-3 text-gray-900 dark:text-white focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-300 text-lg">
                            <option value="">すべてのリーグ</option>
                            <option value="PL">🏆 プレミアリーグ</option>
                            <option value="PD">⚽ ラ・リーガ</option>
                            <option value="SA">🇮🇹 セリエA</option>
                            <option value="BL1">🇩🇪 ブンデスリーガ</option>
                            <option value="FL1">🇫🇷 リーグ・アン</option>
                            <option value="J1">🇯🇵 J1リーグ</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">期間選択</label>
                        <select id="timeRangeSelect" class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 rounded-xl px-4 py-3 text-gray-900 dark:text-white focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-300 text-lg">
                            <option value="today">📅 今日</option>
                            <option value="tomorrow">🌅 明日</option>
                            <option value="week" selected>📆 今週</option>
                            <option value="month">🗓️ 今月</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">データ更新</label>
                        <button id="refreshBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 hover:shadow-2xl shadow-lg flex items-center justify-center space-x-2">
                            <span class="text-xl">🔄</span>
                            <span>更新</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="scheduleContent">
                <div class="loading">試合データを読み込み中...</div>
            </div>
        </main>
    </div>

    <script src="/ai-widget.js"></script>
    <script>
        let currentMatches = [];

        // イベントリスナーを設定
        document.addEventListener('DOMContentLoaded', function() {
            // 初期データを読み込み
            loadMatches();
            
            // リーグ選択の変更を監視
            document.getElementById('leagueSelect').addEventListener('change', loadMatches);
            
            // 期間選択の変更を監視
            document.getElementById('timeRangeSelect').addEventListener('change', loadMatches);
            
            // 更新ボタンのクリックを監視
            document.getElementById('refreshBtn').addEventListener('click', loadMatches);
        });

        // 試合データを読み込む
        async function loadMatches() {
            const league = document.getElementById('leagueSelect').value;
            const timeRange = document.getElementById('timeRangeSelect').value;
            
            console.log('Loading matches with:', { league, timeRange });
            
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '<div class="loading">試合データを読み込み中...</div>';

            try {
                const response = await fetch(`/api/fotmob/matches?league=${league}&timeRange=${timeRange}`);
                console.log('API Response status:', response.status);
                console.log('API Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // 生のレスポンステキストを確認
                const responseText = await response.text();
                console.log('Raw response text:', responseText);
                
                // JSONとしてパース
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('Parsed JSON data:', data);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    throw new Error(`JSON parse error: ${parseError.message}`);
                }
                
                if (data && data.matches && Array.isArray(data.matches) && data.matches.length > 0) {
                    console.log('Found matches:', data.matches.length);
                    currentMatches = data.matches;
                    displayMatches(data.matches);
                } else {
                    console.log('No matches found in response. Response structure:', data);
                    console.log('Data type:', typeof data);
                    console.log('Data keys:', data ? Object.keys(data) : 'null/undefined');
                    
                    contentDiv.innerHTML = `
                        <div class="no-matches">
                            <p>指定された条件に一致する試合が見つかりませんでした。</p>
                            <p>レスポンス構造: ${JSON.stringify(data, null, 2)}</p>
                            <p>データ型: ${typeof data}</p>
                            <p>キー: ${data ? Object.keys(data).join(', ') : 'null/undefined'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading matches:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <p>試合データの読み込みに失敗しました。</p>
                        <p>エラー: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 試合を表示
        function displayMatches(matches) {
            const contentDiv = document.getElementById('scheduleContent');
            
            if (matches.length === 0) {
                contentDiv.innerHTML = '<div class="no-matches">試合が見つかりませんでした。</div>';
                return;
            }

            const matchesHtml = matches.map(match => {
                const matchDate = new Date(match.date);
                const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                const dateString = matchDate.toLocaleDateString('ja-JP', { 
                    month: 'short', 
                    day: 'numeric' 
                });

                // スコアの表示を元のnull表示に戻す
                const homeScore = match.homeScore;
                const awayScore = match.awayScore;
                
                // 試合の状態に応じた表示
                let statusDisplay = '';
                let scoreDisplay = '';
                
                if (match.status === 'TIMED' || match.status === 'Scheduled') {
                    statusDisplay = '予定';
                    scoreDisplay = `<span class="text-gray-400">null</span>`;
                } else if (match.status === 'Finished' || match.status === 'FT') {
                    statusDisplay = '終了';
                    scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                } else if (match.status === 'LIVE' || match.status === 'HT') {
                    statusDisplay = '試合中';
                    scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;
                } else {
                    statusDisplay = match.status || '未定';
                    scoreDisplay = `<span class="text-gray-400">null</span>`;
                }
                
                const matchHtml = `
                        <div class="match-card bg-white dark:bg-gray-800 rounded-xl p-4 mb-4 border border-gray-200 dark:border-gray-700 shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center space-x-3">
                                    <div class="league-badge league-${match.league} px-3 py-1 rounded-full text-xs font-bold text-white">
                                        ${getLeagueName(match.league)}
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs text-gray-500 dark:text-gray-400">${statusDisplay}</span>
                                        ${getStatusIcon(match.status)}
                                    </div>
                                </div>
                                <div class="text-xs text-gray-500 dark:text-gray-400 font-medium">${formatDate(match.date)}</div>
                            </div>
                            
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3 flex-1">
                                    <div class="team-logo w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-lg">
                                        ${match.homeTeam.charAt(0)}
                                    </div>
                                    <div class="team-info">
                                        <div class="team-name text-gray-900 dark:text-white font-semibold text-lg">${match.homeTeam}</div>
                                        <div class="team-league text-xs text-gray-500 dark:text-gray-400">${getLeagueName(match.league)}</div>
                                    </div>
                                </div>
                                
                                <div class="match-center text-center mx-4">
                                    ${scoreDisplay}
                                    <div class="match-time text-xs text-gray-500 dark:text-gray-400 mt-1">${formatTime(match.date)}</div>
                                </div>
                                
                                <div class="flex items-center space-x-3 flex-1 justify-end">
                                    <div class="team-info text-right">
                                        <div class="team-name text-gray-900 dark:text-white font-semibold text-lg">${match.awayTeam}</div>
                                        <div class="team-league text-xs text-gray-500 dark:text-gray-400">${getLeagueName(match.league)}</div>
                                    </div>
                                    <div class="team-logo w-12 h-12 bg-gradient-to-br from-red-500 to-red-600 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-lg">
                                        ${match.awayTeam.charAt(0)}
                                    </div>
                                </div>
                            </div>
                            
                            ${match.venue && match.venue !== 'Unknown' ? `
                                <div class="venue-info mt-3 pt-3 border-t border-gray-200 dark:border-gray-700">
                                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-600 dark:text-gray-400">
                                        <span>🏟️</span>
                                        <span>${match.venue}</span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;

                return matchHtml;
            }).join('');

            contentDiv.innerHTML = `<div class="schedule-grid">${matchesHtml}</div>`;
        }

        // リーグ名を取得
        function getLeagueName(leagueCode) {
            const leagueNames = {
                'PL': 'プレミアリーグ',
                'PD': 'ラ・リーガ',
                'SA': 'セリエA',
                'BL1': 'ブンデスリーガ',
                'FL1': 'リーグ・アン',
                'J1': 'J1リーグ'
            };
            return leagueNames[leagueCode] || leagueCode;
        }



        // ステータスアイコンを取得
        function getStatusIcon(status) {
            switch (status) {
                case 'Finished':
                    return '<span class="text-green-400">✅</span>';
                case 'LIVE':
                case 'HT':
                    return '<span class="text-red-400">🔴</span>';
                case 'Scheduled':
                case 'TIMED':
                    return '<span class="text-yellow-400">⚪</span>';
                default:
                    return '';
            }
        }

        // 日付をフォーマット
        function formatDate(dateString) {
            const date = new Date(dateString);
            return `${date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })} ${date.toLocaleTimeString('ja-JP', { hour: 'numeric', minute: 'numeric' })}`;
        }

        // 時間をフォーマット
        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString('ja-JP', { hour: 'numeric', minute: 'numeric' });
        }

        // ステータスクラスを取得
        function getStatusClass(status) {
            switch (status) {
                case 'Finished':
                    return 'status-finished';
                case 'Scheduled':
                    return 'status-scheduled';
                case 'Live':
                    return 'status-live';
                default:
                    return 'status-scheduled';
            }
        }

        // ステータステキストを取得
        function getStatusText(status) {
            switch (status) {
                case 'Finished':
                    return '終了';
                case 'Scheduled':
                    return '予定';
                case 'Live':
                    return '生中継';
                default:
                    return '予定';
            }
        }
    </script>
</body>
</html>
