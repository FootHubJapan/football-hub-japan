<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合スケジュール - Football Hub Japan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #00ff88;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .schedule-controls {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .control-select {
            background: #2a2a2a;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
        }

        .control-select:focus {
            outline: none;
            border-color: #00ff88;
        }

        .control-button {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .control-button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .match-card {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 2px solid #4CAF50;
            border-radius: 15px;
            padding: 20px;
            margin: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .match-card:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* モーダルスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background-color: #2a2a2a;
            margin: 5% auto;
            padding: 30px;
            border: 2px solid #4CAF50;
            border-radius: 15px;
            width: 80%;
            max-width: 600px;
            position: relative;
            color: white;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 20px;
        }

        .close:hover,
        .close:focus {
            color: #4CAF50;
        }

        .match-detail-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
        }

        .match-detail-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
            font-size: 24px;
            font-weight: bold;
        }

        .match-detail-score {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .match-detail-item {
            background-color: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }

        .match-detail-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }

        .match-detail-value {
            font-size: 16px;
            color: white;
            font-weight: bold;
        }

        .match-detail-status {
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-status .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 詳細ボタンスタイル */
        .detail-button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .detail-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        /* 大サイズモーダル */
        .large-modal {
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* タブコンテンツ */
        .tab-content {
            margin-top: 20px;
            min-height: 200px;
            position: relative;
        }

        /* より具体的なセレクターで優先度を下げる */
        .modal-content .tab-pane {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: relative;
            min-height: 100px;
            width: 100%;
        }

        .modal-content .tab-pane.active {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            height: auto !important;
            width: 100% !important;
            position: relative !important;
            min-height: 200px !important;
        }

        /* 強制表示用のスタイル */
        .modal-content .tab-pane[style*="display: block"] {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            min-height: 200px !important;
            width: 100% !important;
        }

        /* タブペイン内のコンテナを確実に表示 */
        .modal-content .tab-pane .stats-container,
        .modal-content .tab-pane .events-container,
        .modal-content .tab-pane .lineup-container {
            display: block !important;
            min-height: 150px !important;
            width: 100% !important;
            padding: 20px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            border-radius: 8px !important;
        }

        /* タブボタンのスタイル調整 */
        .tab-button {
            background: #333333;
            color: #cccccc;
            border: none;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-right: 5px;
        }

        .tab-button:hover {
            background: #4CAF50;
            color: #000000;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: #4CAF50;
            color: #000000;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.3);
        }

        /* ラインアップセクション */
        .lineup-section {
            margin-bottom: 30px;
        }

        .lineup-section h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .lineup-players {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        /* データなし表示 */
        .no-data {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 40px;
            font-size: 18px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333333;
        }

        .match-league {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .match-time {
            color: #888888;
            font-size: 0.9rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .team-name {
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: #333333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .match-score {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .match-venue {
            color: #888888;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
        }

        .match-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-finished {
            background: #00ff88;
            color: #000000;
        }

        .status-scheduled {
            background: #ffaa00;
            color: #000000;
        }

        .status-live {
            background: #ff4444;
            color: #ffffff;
        }

        .loading {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .error {
            text-align: center;
            color: #ff4444;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .no-matches {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        /* タブスタイル */
        .tab-navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .tab-button {
            background: #333333;
            color: #cccccc;
            border: none;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-button:hover {
            background: #4CAF50;
            color: #000000;
        }

        .tab-button.active {
            background: #4CAF50;
            color: #000000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 統計スタイル */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        /* イベントスタイル */
        .events-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .event-item {
            background: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-time {
            font-size: 0.9rem;
            color: #888;
            font-weight: bold;
        }

        .event-description {
            font-size: 1rem;
            color: #cccccc;
        }

        /* ラインアップスタイル */
        .lineup-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .lineup-item {
            background: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .lineup-position {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .lineup-name {
            font-size: 1rem;
            font-weight: bold;
            color: #00ff88;
        }

        @media (max-width: 768px) {
            .schedule-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-select {
                min-width: auto;
            }

            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .match-teams {
                flex-direction: column;
                gap: 1rem;
            }

            .match-score {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

        <!-- ヘッダー -->
        <header class="header">
            <a href="/dashboard" class="logo">⚽ Football Hub Japan</a>
            <nav class="nav-links">
                <a href="/dashboard" class="nav-link">ダッシュボード</a>
                <a href="/database-enhanced" class="nav-link">データベース</a>
                <a href="/radar" class="nav-link">レーダーチャート</a>
                <a href="/ai-agent" class="nav-link">AIエージェント</a>
            </nav>
        </header>

        <div class="main-container">
            <h1 class="page-title">試合スケジュール</h1>
            <p class="page-subtitle">お気に入りのチームや選手の試合スケジュールを一覧表示</p>

            <div class="schedule-controls">
                <div class="control-group">
                    <label class="control-label">リーグ</label>
                    <select class="control-select" id="leagueSelect">
                        <option value="">すべてのリーグ</option>
                        <option value="PL">プレミアリーグ</option>
                        <option value="PD">ラ・リーガ</option>
                        <option value="SA">セリエA</option>
                        <option value="BL1">ブンデスリーガ</option>
                        <option value="FL1">リーグ・アン</option>
                        <option value="J1">J1リーグ</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">期間</label>
                    <select class="control-select" id="timeRangeSelect">
                        <option value="today">今日</option>
                        <option value="tomorrow">明日</option>
                        <option value="week" selected>今週</option>
                        <option value="lastweek">先週</option>
                        <option value="month">今月</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">検索</label>
                    <input type="text" id="searchInput" class="control-select" placeholder="チーム名や選手名で検索..." />
                </div>

                <button class="control-button" onclick="loadMatches()">試合を表示</button>
            </div>

            <div id="scheduleContent">
                <div class="loading">試合データを読み込み中...</div>
            </div>

    <!-- 試合詳細モーダル（拡張版） -->
    <div id="matchDetailsModal" class="modal">
        <div class="modal-content large-modal">
            <span class="close">&times;</span>
            <div class="match-detail-header">
                <h2 id="modalTitle">試合詳細</h2>
            </div>
            
            <!-- タブナビゲーション -->
            <div class="tab-navigation">
                <button class="tab-button active" data-tab="overview">基本情報</button>
                <button class="tab-button" data-tab="stats">試合統計</button>
                <button class="tab-button" data-tab="events">試合イベント</button>
                <button class="tab-button" data-tab="lineup">ラインアップ</button>
            </div>
            
            <!-- タブコンテンツ -->
            <div class="tab-content">
                <!-- 基本情報タブ -->
                <div id="overview" class="tab-pane active">
                    <div class="match-detail-teams">
                        <div class="team">
                            <div class="team-logo">🏟️</div>
                            <div class="team-name" id="homeTeamName">-</div>
                        </div>
                        <div class="match-detail-score" id="modalScore">-</div>
                        <div class="team">
                            <div class="team-logo">🏟️</div>
                            <div class="team-name" id="awayTeamName">-</div>
                        </div>
                    </div>
                    <div class="match-detail-info" id="basicInfo">
                        <!-- 基本情報がここに挿入される -->
                    </div>
                </div>
                
                <!-- 試合統計タブ -->
                <div id="stats" class="tab-pane">
                    <div class="stats-container" id="statsContainer">
                        <!-- 統計データがここに挿入される -->
                    </div>
                </div>
                
                <!-- 試合イベントタブ -->
                <div id="events" class="tab-pane">
                    <div class="events-container" id="eventsContainer">
                        <!-- イベントデータがここに挿入される -->
                    </div>
                </div>
                
                <!-- ラインアップタブ -->
                <div id="lineup" class="tab-pane">
                    <div class="lineup-container" id="lineupContainer">
                        <!-- ラインアップデータがここに挿入される -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/ai-widget.js"></script>
    <script>
        let currentMatches = [];

        // イベントリスナーを設定
        document.addEventListener('DOMContentLoaded', function() {
            // 初期データを読み込み
            loadMatches();
            
            // リーグ選択の変更を監視
            document.getElementById('leagueSelect').addEventListener('change', loadMatches);
            
            // 期間選択の変更を監視
            document.getElementById('timeRangeSelect').addEventListener('change', loadMatches);
            
            // 検索入力の変更を監視
            document.getElementById('searchInput').addEventListener('input', loadMatches);
            

        });

        // 試合データを読み込む
        async function loadMatches() {
            const league = document.getElementById('leagueSelect').value;
            const timeRange = document.getElementById('timeRangeSelect').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            console.log('Loading matches with:', { league, timeRange, searchTerm });
            
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '<div class="loading">試合データを読み込み中...</div>';

            try {
                const response = await fetch(`/api/fotmob/matches?league=${league}&timeRange=${timeRange}`);
                console.log('API Response status:', response.status);
                console.log('API Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // 生のレスポンステキストを確認
                const responseText = await response.text();
                console.log('Raw response text:', responseText);
                
                // JSONとしてパース
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('Parsed JSON data:', data);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    throw new Error(`JSON parse error: ${parseError.message}`);
                }
                
                if (data && data.matches && Array.isArray(data.matches) && data.matches.length > 0) {
                    console.log('Found matches:', data.matches.length);
                    currentMatches = data.matches;
                    // フィルタリングを適用
                    const filteredMatches = filterMatches(currentMatches, league, timeRange, searchTerm);
                    
                    if (filteredMatches.length === 0) {
                        contentDiv.innerHTML = '<div class="no-matches">条件に一致する試合が見つかりませんでした。</div>';
                        return;
                    }
                    
                    // 試合カードを生成
                    const matchesHtml = filteredMatches.map(match => {
                        const matchDate = new Date(match.date);
                        const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        });
                        const dateString = matchDate.toLocaleDateString('ja-JP', { 
                            month: 'short', 
                            day: 'numeric' 
                        });

                        // スコアの表示を元のnull表示に戻す
                        const homeScore = match.homeScore;
                        const awayScore = match.awayScore;
                        
                        // 試合の状態に応じた表示
                        let statusDisplay = '';
                        let scoreDisplay = '';
                        
                        if (match.status === 'TIMED' || match.status === 'Scheduled') {
                            statusDisplay = '予定';
                            scoreDisplay = `<span class="text-gray-400">null</span>`;
                        } else if (match.status === 'Finished' || match.status === 'FT') {
                            statusDisplay = '終了';
                            scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                        } else if (match.status === 'LIVE' || match.status === 'HT') {
                            statusDisplay = '試合中';
                            scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;
                        } else {
                            statusDisplay = match.status || '未定';
                            scoreDisplay = `<span class="text-gray-400">null</span>`;
                        }
                        
                        const matchHtml = `
                                <div class="match-card" onclick="showDetailedMatchInfo('${match.id}', '${match.league}')">
                                    <div class="match-header">
                                        <span class="match-league">${getLeagueName(match.league)}</span>
                                        <span class="match-status ${getStatusClass(match.status)}">${getStatusText(match.status)}</span>
                                    </div>
                                    
                                    <div class="match-teams">
                                        <div class="team">
                                            <div class="team-logo">🏟️</div>
                                            <div class="team-name">${match.homeTeam}</div>
                                        </div>
                                        
                                        <div class="match-score">
                                            <span>${match.homeScore !== undefined && match.homeScore !== null ? match.homeScore : ''}</span>
                                            <span>${match.homeScore !== undefined && match.homeScore !== null && match.awayScore !== undefined && match.awayScore !== null ? '-' : ''}</span>
                                            <span>${match.awayScore !== undefined && match.awayScore !== null ? match.awayScore : ''}</span>
                                        </div>
                                        
                                        <div class="team">
                                            <div class="team-logo">🏟️</div>
                                            <div class="team-name">${match.awayTeam}</div>
                                        </div>
                                    </div>
                                    
                                    <div class="match-venue">${match.venue}</div>
                                    <div class="match-time">${dateString} ${timeString}</div>
                                </div>
                            `;

                        return matchHtml;
                    }).join('');

                    contentDiv.innerHTML = `<div class="schedule-grid">${matchesHtml}</div>`;
                } else {
                    console.log('No matches found in response. Response structure:', data);
                    console.log('Data type:', typeof data);
                    console.log('Data keys:', data ? Object.keys(data) : 'null/undefined');
                    
                    contentDiv.innerHTML = `
                        <div class="no-matches">
                            <p>指定された条件に一致する試合が見つかりませんでした。</p>
                            <p>レスポンス構造: ${JSON.stringify(data, null, 2)}</p>
                            <p>データ型: ${typeof data}</p>
                            <p>キー: ${data ? Object.keys(data).join(', ') : 'null/undefined'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading matches:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <p>試合データの読み込みに失敗しました。</p>
                        <p>エラー: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 試合を表示
        function displayMatches(matches) {
            const contentDiv = document.getElementById('scheduleContent');
            
            if (matches.length === 0) {
                contentDiv.innerHTML = '<div class="no-matches">試合が見つかりませんでした。</div>';
                return;
            }

            const matchesHtml = matches.map(match => {
                const matchDate = new Date(match.date);
                const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                const dateString = matchDate.toLocaleDateString('ja-JP', { 
                    month: 'short', 
                    day: 'numeric' 
                });

                // スコアの表示を元のnull表示に戻す
                const homeScore = match.homeScore;
                const awayScore = match.awayScore;
                
                // 試合の状態に応じた表示
                let statusDisplay = '';
                let scoreDisplay = '';
                
                if (match.status === 'TIMED' || match.status === 'Scheduled') {
                    statusDisplay = '予定';
                    scoreDisplay = `<span class="text-gray-400">null</span>`;
                } else if (match.status === 'Finished' || match.status === 'FT') {
                    statusDisplay = '終了';
                    scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                } else if (match.status === 'LIVE' || match.status === 'HT') {
                    statusDisplay = '試合中';
                    scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;
                } else {
                    statusDisplay = match.status || '未定';
                    scoreDisplay = `<span class="text-gray-400">null</span>`;
                }
                
                const matchHtml = `
                        <div class="match-card">
                            <div class="match-header">
                                <span class="match-league">${getLeagueName(match.league)}</span>
                                <span class="match-status ${getStatusClass(match.status)}">${getStatusText(match.status)}</span>
                            </div>
                            
                            <div class="match-teams">
                                <div class="team">
                                    <div class="team-logo">🏟️</div>
                                    <div class="team-name">${match.homeTeam}</div>
                                </div>
                                
                                <div class="match-score">
                                    <span>${match.homeScore !== undefined && match.homeScore !== null ? match.homeScore : ''}</span>
                                    <span>${match.homeScore !== undefined && match.homeScore !== null && match.awayScore !== undefined && match.awayScore !== null ? '-' : ''}</span>
                                    <span>${match.awayScore !== undefined && match.awayScore !== null ? match.awayScore : ''}</span>
                                </div>
                                
                                <div class="team">
                                    <div class="team-logo">🏟️</div>
                                    <div class="team-name">${match.awayTeam}</div>
                                </div>
                            </div>
                            
                            <div class="match-venue">${match.venue}</div>
                            <div class="match-time">${dateString} ${timeString}</div>
                        </div>
                    `;

                return matchHtml;
            }).join('');

            contentDiv.innerHTML = `<div class="schedule-grid">${matchesHtml}</div>`;
        }



        // ステータスクラスを取得
        function getStatusClass(status) {
            switch (status) {
                case 'Finished':
                    return 'status-finished';
                case 'Scheduled':
                case 'NS':
                    return 'status-scheduled';
                case 'Live':
                case 'LIVE':
                    return 'status-live';
                case 'HT':
                    return 'status-live';
                default:
                    return 'status-scheduled';
            }
        }

        // ステータステキストを取得
        function getStatusText(status) {
            switch (status) {
                case 'Finished':
                    return '終了';
                case 'Scheduled':
                case 'NS':
                    return '予定';
                case 'Live':
                case 'LIVE':
                    return '生中継';
                case 'HT':
                    return 'ハーフタイム';
                default:
                    return '予定';
            }
        }

        // リーグ名を取得
        function getLeagueName(leagueCode) {
            const leagueNames = {
                'PL': 'プレミアリーグ',
                'PD': 'ラ・リーガ',
                'SA': 'セリエA',
                'BL1': 'ブンデスリーガ',
                'FL1': 'リーグ・アン',
                'J1': 'J1リーグ'
            };
            return leagueNames[leagueCode] || leagueCode;
        }

        // 試合データをフィルタリング
        function filterMatches(matches, league, timeRange, searchTerm) {
            let filteredMatches = matches;
            
            // リーグでフィルタリング
            if (league && league !== '') {
                filteredMatches = filteredMatches.filter(match => match.league === league);
            }
            
            // 検索語でフィルタリング
            if (searchTerm && searchTerm.trim() !== '') {
                filteredMatches = filteredMatches.filter(match => {
                    const homeTeam = match.homeTeam.toLowerCase();
                    const awayTeam = match.awayTeam.toLowerCase();
                    const venue = match.venue ? match.venue.toLowerCase() : '';
                    
                    return homeTeam.includes(searchTerm) || 
                           awayTeam.includes(searchTerm) || 
                           venue.includes(searchTerm);
                });
            }
            
            return filteredMatches;
        }

        // 詳細な試合情報を表示する関数
        async function showDetailedMatchInfo(matchId, league) {
            try {
                console.log(`Loading detailed match info for ID: ${matchId}, League: ${league}`);
                
                // 詳細モーダルを開く
                const detailedModal = document.getElementById('matchDetailsModal');
                detailedModal.style.display = 'block';
                
                // ローディング表示
                document.getElementById('modalTitle').textContent = 'データを読み込み中...';
                
                // 試合詳細データを取得
                const response = await fetch(`/api/match/${matchId}/details?league=${league}`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    displayDetailedMatchInfo(result.data);
                } else {
                    throw new Error('データの取得に失敗しました');
                }
                
            } catch (error) {
                console.error('Error loading detailed match info:', error);
                document.getElementById('modalTitle').textContent = 'エラーが発生しました';
            }
        }

        // 詳細な試合情報を表示
        function displayDetailedMatchInfo(matchData) {
            console.log('Displaying detailed match info:', matchData);
            
            // モーダルタイトルを更新
            document.getElementById('modalTitle').textContent = `${matchData.homeTeam} vs ${matchData.awayTeam}`;
            
            // 基本情報を更新
            document.getElementById('homeTeamName').textContent = matchData.homeTeam;
            document.getElementById('awayTeamName').textContent = matchData.awayTeam;
            
            const homeScore = matchData.homeScore !== null && matchData.homeScore !== undefined ? matchData.homeScore : '-';
            const awayScore = matchData.awayScore !== null && matchData.awayScore !== undefined ? matchData.awayScore : '-';
            document.getElementById('modalScore').textContent = `${homeScore} - ${awayScore}`;
            
            // 基本情報タブの内容を更新
            updateBasicInfo(matchData);
            
            // 統計タブの内容を更新
            updateStatsTab(matchData);
            
            // イベントタブの内容を更新
            updateEventsTab(matchData);
            
            // ラインアップタブの内容を更新
            updateLineupTab(matchData);
            
            // 最初のタブ（基本情報）をアクティブにする
            setTimeout(() => {
                const firstTab = document.querySelector('.tab-button');
                const firstPane = document.getElementById('overview');
                if (firstTab && firstPane) {
                    // すべてのタブペインを強力に非表示
                    document.querySelectorAll('.tab-pane').forEach(pane => {
                        pane.style.cssText = 'display: none !important; opacity: 0 !important; visibility: hidden !important;';
                        pane.classList.remove('active');
                    });
                    
                    // 最初のタブをアクティブ化
                    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                    firstTab.classList.add('active');
                    
                    // 最初のタブペインを強力に表示
                    firstPane.style.cssText = 'display: block !important; opacity: 1 !important; visibility: visible !important; height: auto !important; width: 100% !important; min-height: 200px !important; position: relative !important;';
                    firstPane.classList.add('active');
                    
                    // 基本情報タブの内容も強制表示
                    const basicInfo = firstPane.querySelector('#basicInfo');
                    if (basicInfo) {
                        basicInfo.style.cssText = 'display: block !important; min-height: 100px !important; width: 100% !important; padding: 20px !important;';
                    }
                    
                    console.log('First tab activated and displayed with force');
                    console.log('First tab dimensions:', firstPane.offsetWidth, 'x', firstPane.offsetHeight);
                }
            }, 100);
        }

        // 基本情報タブを更新
        function updateBasicInfo(matchData) {
            const basicInfoDiv = document.getElementById('basicInfo');
            const matchDate = new Date(matchData.date);
            const formattedDate = matchDate.toLocaleDateString('ja-JP', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            const formattedTime = matchDate.toLocaleTimeString('ja-JP', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            basicInfoDiv.innerHTML = `
                <div class="match-detail-item">
                    <span class="match-detail-label">日時:</span>
                    <span class="match-detail-value">${formattedDate} ${formattedTime}</span>
                </div>
                <div class="match-detail-item">
                    <span class="match-detail-label">会場:</span>
                    <span class="match-detail-value">${matchData.venue || '会場未定'}</span>
                </div>
                <div class="match-detail-item">
                    <span class="match-detail-label">ステータス:</span>
                    <span class="match-detail-value"><span class="status-badge ${getStatusClass(matchData.status)}">${getStatusText(matchData.status)}</span></span>
                </div>
                <div class="match-detail-item">
                    <span class="match-detail-label">リーグ:</span>
                    <span class="match-detail-value">${getLeagueName(matchData.league)}</span>
                </div>
                ${matchData.referee ? `
                <div class="match-detail-item">
                    <span class="match-detail-label">主審:</span>
                    <span class="match-detail-value">${matchData.referee}</span>
                </div>
                ` : ''}
            `;
        }

        // 統計タブを更新
        function updateStatsTab(matchData) {
            console.log('Updating stats tab with data:', matchData.stats);
            const statsContainer = document.getElementById('statsContainer');
            console.log('Stats container found:', !!statsContainer);
            
            if (matchData.stats) {
                const stats = matchData.stats;
                console.log('Processing stats:', stats);
                
                // 統計データの存在確認と安全なアクセス
                const possessionHome = stats.possession?.home || stats.possession?.home === 0 ? stats.possession.home : 0;
                const possessionAway = stats.possession?.away || stats.possession?.away === 0 ? stats.possession.away : 0;
                const shotsHome = stats.shots?.home || stats.shots?.home === 0 ? stats.shots.home : 0;
                const shotsAway = stats.shots?.away || stats.shots?.away === 0 ? stats.shots.away : 0;
                const shotsOnTargetHome = stats.shotsOnTarget?.home || stats.shotsOnTarget?.home === 0 ? stats.shotsOnTarget.home : 0;
                const shotsOnTargetAway = stats.shotsOnTarget?.away || stats.shotsOnTarget?.away === 0 ? stats.shotsOnTarget.away : 0;
                const cornersHome = stats.corners?.home || stats.corners?.home === 0 ? stats.corners.home : 0;
                const cornersAway = stats.corners?.away || stats.corners?.away === 0 ? stats.corners.away : 0;
                const foulsHome = stats.fouls?.home || stats.fouls?.home === 0 ? stats.fouls.home : 0;
                const foulsAway = stats.fouls?.away || stats.fouls?.away === 0 ? stats.fouls.away : 0;
                
                const statsHtml = `
                    <div class="stat-item">
                        <div class="stat-label">ボール支配率</div>
                        <div class="stat-value">${possessionHome}% - ${possessionAway}%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">シュート数</div>
                        <div class="stat-value">${shotsHome} - ${shotsAway}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">枠内シュート</div>
                        <div class="stat-value">${shotsOnTargetHome} - ${shotsOnTargetAway}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">コーナーキック</div>
                        <div class="stat-value">${cornersHome} - ${cornersAway}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">ファウル</div>
                        <div class="stat-value">${foulsHome} - ${foulsAway}</div>
                    </div>
                `;
                
                statsContainer.innerHTML = statsHtml;
                console.log('Stats HTML updated:', statsHtml);
            } else {
                console.log('No stats data available');
                statsContainer.innerHTML = '<div class="no-data">統計データが利用できません</div>';
            }
        }

        // イベントタブを更新
        function updateEventsTab(matchData) {
            console.log('Updating events tab with data:', matchData.events);
            const eventsContainer = document.getElementById('eventsContainer');
            console.log('Events container found:', !!eventsContainer);
            
            if (matchData.events && matchData.events.length > 0) {
                console.log('Processing events:', matchData.events);
                const eventsHtml = matchData.events.map(event => {
                    const eventIcon = getEventIcon(event.type);
                    const eventColor = getEventColor(event.type);
                    
                    return `
                        <div class="event-item" style="border-left: 4px solid ${eventColor}">
                            <div class="event-time">${event.time}'</div>
                            <div class="event-description">
                                <span style="color: ${eventColor}">${eventIcon}</span>
                                ${event.player} (${event.team})
                                ${event.assist ? `<br><small>アシスト: ${event.assist}</small>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
                
                eventsContainer.innerHTML = eventsHtml;
                console.log('Events HTML updated, events count:', matchData.events.length);
            } else {
                console.log('No events data available');
                eventsContainer.innerHTML = '<div class="no-data">イベントデータが利用できません</div>';
            }
        }

        // ラインアップタブを更新
        function updateLineupTab(matchData) {
            console.log('Updating lineup tab with data:', matchData.lineups);
            const lineupContainer = document.getElementById('lineupContainer');
            console.log('Lineup container found:', !!lineupContainer);
            
            if (matchData.lineups) {
                const homeLineup = matchData.lineups.home;
                const awayLineup = matchData.lineups.away;
                
                console.log('Home lineup:', homeLineup);
                console.log('Away lineup:', awayLineup);
                
                let lineupHtml = '';
                
                if (homeLineup && homeLineup.startXI) {
                    lineupHtml += `
                        <div class="lineup-section">
                            <h3>${matchData.homeTeam} (${homeLineup.formation || '不明'})</h3>
                            <div class="lineup-players">
                                ${homeLineup.startXI.map(player => `
                                    <div class="lineup-item">
                                        <div class="lineup-position">${player.position || '不明'}</div>
                                        <div class="lineup-name">${player.name || '不明'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
                
                if (awayLineup && awayLineup.startXI) {
                    lineupHtml += `
                        <div class="lineup-section">
                            <h3>${matchData.awayTeam} (${awayLineup.formation || '不明'})</h3>
                            <div class="lineup-players">
                                ${awayLineup.startXI.map(player => `
                                    <div class="lineup-item">
                                        <div class="lineup-position">${player.position || '不明'}</div>
                                        <div class="lineup-name">${player.name || '不明'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
                
                if (lineupHtml) {
                    lineupContainer.innerHTML = lineupHtml;
                    console.log('Lineup HTML updated');
                } else {
                    lineupContainer.innerHTML = '<div class="no-data">ラインアップデータが利用できません</div>';
                }
            } else {
                console.log('No lineup data available');
                lineupContainer.innerHTML = '<div class="no-data">ラインアップデータが利用できません</div>';
            }
        }

        // イベントアイコンを取得
        function getEventIcon(eventType) {
            const icons = {
                'Goal': '⚽',
                'Card': '🟨',
                'Subst': '🔄',
                'Var': '📺'
            };
            return icons[eventType] || '⚽';
        }

        // イベントカラーを取得
        function getEventColor(eventType) {
            const colors = {
                'Goal': '#00ff88',
                'Card': '#ffff00',
                'Subst': '#0088ff',
                'Var': '#ff8800'
            };
            return colors[eventType] || '#00ff88';
        }

        // タブ切り替え機能
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Setting up tab functionality...');
            
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabPanes = document.querySelectorAll('.tab-pane');
            
            console.log('Found tab buttons:', tabButtons.length);
            console.log('Found tab panes:', tabPanes.length);
            
            // デバッグ用：タブペインの詳細情報をログ出力
            tabPanes.forEach((pane, index) => {
                console.log(`Tab pane ${index}:`, {
                    id: pane.id,
                    classes: pane.className,
                    display: pane.style.display,
                    computedDisplay: window.getComputedStyle(pane).display,
                    offsetHeight: pane.offsetHeight,
                    offsetWidth: pane.offsetWidth,
                    innerHTML: pane.innerHTML.substring(0, 100) + '...'
                });
            });
            
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');
                    console.log('Tab clicked:', targetTab);
                    
                    // アクティブなタブボタンを更新
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // タブペインを更新
                    tabPanes.forEach(pane => {
                        pane.classList.remove('active');
                        console.log('Removing active class from:', pane.id);
                    });
                    
                    const targetPane = document.getElementById(targetTab);
                    if (targetPane) {
                        targetPane.classList.add('active');
                        console.log('Added active class to:', targetPane.id);
                        
                        // タブコンテンツの表示状態を確認
                        console.log('Target pane display style before:', targetPane.style.display);
                        console.log('Target pane classes:', targetPane.className);
                        console.log('Target pane computed display:', window.getComputedStyle(targetPane).display);
                        console.log('Target pane offset dimensions:', targetPane.offsetWidth, 'x', targetPane.offsetHeight);
                        
                        // 強力に表示（CSSの優先度を上書き）
                        targetPane.style.cssText = 'display: block !important; opacity: 1 !important; visibility: visible !important; height: auto !important; width: 100% !important; min-height: 200px !important; position: relative !important;';
                        
                        // タブペイン内のコンテナも強制表示
                        const containers = targetPane.querySelectorAll('.stats-container, .events-container, .lineup-container');
                        containers.forEach(container => {
                            container.style.cssText = 'display: block !important; min-height: 150px !important; width: 100% !important; padding: 20px !important; background: rgba(255, 255, 255, 0.05) !important; border-radius: 8px !important;';
                        });
                        
                        // 他のタブペインを強力に非表示
                        tabPanes.forEach(pane => {
                            if (pane !== targetPane) {
                                pane.style.cssText = 'display: none !important; opacity: 0 !important; visibility: hidden !important;';
                                pane.classList.remove('active');
                            }
                        });
                        
                        console.log('Target pane display style after:', targetPane.style.display);
                        console.log('Target pane computed display after:', window.getComputedStyle(targetPane).display);
                        console.log('Target pane offset dimensions after:', targetPane.offsetWidth, 'x', targetPane.offsetHeight);
                        
                        // 強制リフロー
                        targetPane.offsetHeight;
                        
                        // さらに強制的に表示
                        setTimeout(() => {
                            targetPane.style.cssText = 'display: block !important; opacity: 1 !important; visibility: visible !important; height: auto !important; width: 100% !important; min-height: 200px !important; position: relative !important;';
                            
                            // コンテナも再度強制表示
                            containers.forEach(container => {
                                container.style.cssText = 'display: block !important; min-height: 150px !important; width: 100% !important; padding: 20px !important; background: rgba(255, 255, 255, 0.05) !important; border-radius: 8px !important;';
                            });
                            
                            console.log('Final force display applied');
                            console.log('Final dimensions:', targetPane.offsetWidth, 'x', targetPane.offsetHeight);
                        }, 10);
                    } else {
                        console.error('Target tab pane not found:', targetTab);
                    }
                });
            });
        });

        // モーダルを閉じる関数
        document.getElementById('matchDetailsModal').addEventListener('click', function(event) {
            const modal = this;
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // モーダルの閉じるボタンをクリックしたとき
        document.querySelector('.close').addEventListener('click', function() {
            document.getElementById('matchDetailsModal').style.display = 'none';
        });
    </script>
