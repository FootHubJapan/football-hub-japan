<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合スケジュール - Football Hub Japan</title>
    <style>
        .loading {
            text-align: center;
            padding: 2rem;
            color: #9ca3af;
            font-size: 1.1rem;
        }
        
        .error {
            background-color: #dc2626;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
            text-align: center;
        }
        
        .no-matches {
            text-align: center;
            padding: 2rem;
            color: #9ca3af;
            font-size: 1.1rem;
        }
        
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #374151;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #6b7280;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gray-900 text-white">
        <!-- ヘッダー -->
        <header class="bg-gradient-to-r from-blue-900 to-purple-900 border-b border-gray-700">
            <div class="container mx-auto px-4 py-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center shadow-lg">
                            <span class="text-2xl">⚽</span>
                        </div>
                        <h1 class="text-3xl font-bold bg-gradient-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent">
                            Football Hub Japan
                        </h1>
                    </div>
                    <nav class="hidden md:flex space-x-6">
                        <a href="#" class="text-gray-300 hover:text-white transition-colors">ダッシュボード</a>
                        <a href="#" class="text-gray-300 hover:text-white transition-colors">データベース</a>
                        <a href="#" class="text-gray-300 hover:text-white transition-colors">レーダーチャート</a>
                        <a href="#" class="text-gray-300 hover:text-white transition-colors">AIエージェント</a>
                    </nav>
                </div>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="container mx-auto px-4 py-8">
            <!-- フィルターセクション -->
            <div class="bg-gray-800 rounded-lg p-6 mb-8 border border-gray-700">
                <div class="flex flex-col md:flex-row gap-4 items-center">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-300 mb-2">リーグ</label>
                        <select id="leagueSelect" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">すべてのリーグ</option>
                            <option value="PL">プレミアリーグ</option>
                            <option value="PD">ラ・リーガ</option>
                            <option value="SA">セリエA</option>
                            <option value="BL1">ブンデスリーガ</option>
                            <option value="FL1">リーグ・アン</option>
                            <option value="J1">J1リーグ</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-300 mb-2">期間</label>
                        <select id="timeRangeSelect" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="today">今日</option>
                            <option value="tomorrow">明日</option>
                            <option value="week" selected>今週</option>
                            <option value="month">今月</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-300 mb-2">更新</label>
                        <button id="refreshBtn" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-2 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg">
                            🔄 更新
                        </button>
                    </div>
                </div>
            </div>

            <div id="scheduleContent">
                <div class="loading">試合データを読み込み中...</div>
            </div>
        </main>
    </div>

    <script src="/ai-widget.js"></script>
    <script>
        let currentMatches = [];

        // イベントリスナーを設定
        document.addEventListener('DOMContentLoaded', function() {
            // 初期データを読み込み
            loadMatches();
            
            // リーグ選択の変更を監視
            document.getElementById('leagueSelect').addEventListener('change', loadMatches);
            
            // 期間選択の変更を監視
            document.getElementById('timeRangeSelect').addEventListener('change', loadMatches);
            
            // 更新ボタンのクリックを監視
            document.getElementById('refreshBtn').addEventListener('click', loadMatches);
        });

        // 試合データを読み込む
        async function loadMatches() {
            const league = document.getElementById('leagueSelect').value;
            const timeRange = document.getElementById('timeRangeSelect').value;
            
            console.log('Loading matches with:', { league, timeRange });
            
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '<div class="loading">試合データを読み込み中...</div>';

            try {
                const response = await fetch(`/api/fotmob/matches?league=${league}&timeRange=${timeRange}`);
                console.log('API Response status:', response.status);
                console.log('API Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // 生のレスポンステキストを確認
                const responseText = await response.text();
                console.log('Raw response text:', responseText);
                
                // JSONとしてパース
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('Parsed JSON data:', data);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    throw new Error(`JSON parse error: ${parseError.message}`);
                }
                
                if (data && data.matches && Array.isArray(data.matches) && data.matches.length > 0) {
                    console.log('Found matches:', data.matches.length);
                    currentMatches = data.matches;
                    displayMatches(data.matches);
                } else {
                    console.log('No matches found in response. Response structure:', data);
                    console.log('Data type:', typeof data);
                    console.log('Data keys:', data ? Object.keys(data) : 'null/undefined');
                    
                    contentDiv.innerHTML = `
                        <div class="no-matches">
                            <p>指定された条件に一致する試合が見つかりませんでした。</p>
                            <p>レスポンス構造: ${JSON.stringify(data, null, 2)}</p>
                            <p>データ型: ${typeof data}</p>
                            <p>キー: ${data ? Object.keys(data).join(', ') : 'null/undefined'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading matches:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <p>試合データの読み込みに失敗しました。</p>
                        <p>エラー: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 試合を表示
        function displayMatches(matches) {
            const contentDiv = document.getElementById('scheduleContent');
            
            if (matches.length === 0) {
                contentDiv.innerHTML = '<div class="no-matches">試合が見つかりませんでした。</div>';
                return;
            }

            const matchesHtml = matches.map(match => {
                const matchDate = new Date(match.date);
                const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                const dateString = matchDate.toLocaleDateString('ja-JP', { 
                    month: 'short', 
                    day: 'numeric' 
                });

                // スコアの表示を改善
                const homeScore = match.homeScore !== null ? match.homeScore : '-';
                const awayScore = match.awayScore !== null ? match.awayScore : '-';
                
                // 試合の状態に応じた表示
                let statusDisplay = '';
                let scoreDisplay = '';
                
                if (match.status === 'TIMED' || match.status === 'Scheduled') {
                    statusDisplay = '予定';
                    scoreDisplay = `<span class="text-gray-400">vs</span>`;
                } else if (match.status === 'Finished' || match.status === 'FT') {
                    statusDisplay = '終了';
                    scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                } else if (match.status === 'LIVE' || match.status === 'HT') {
                    statusDisplay = '試合中';
                    scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;
                } else {
                    statusDisplay = match.status || '未定';
                    scoreDisplay = `<span class="text-gray-400">vs</span>`;
                }
                
                const matchHtml = `
                    <div class="bg-gray-800 rounded-lg p-4 mb-4 border border-gray-700 hover:border-blue-500 transition-colors">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div class="px-2 py-1 rounded text-xs font-bold ${getLeagueColor(match.league)}">${match.league}</div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs text-gray-500">${statusDisplay}</span>
                                    ${getStatusIcon(match.status)}
                                </div>
                            </div>
                            <div class="text-xs text-gray-400">${formatDate(match.date)}</div>
                        </div>
                        <div class="flex items-center justify-between mt-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg">${match.homeTeam.charAt(0)}</div>
                                <div class="text-white font-medium">${match.homeTeam}</div>
                            </div>
                            <div class="text-center">
                                ${scoreDisplay}
                            </div>
                            <div class="flex items-center space-x-3">
                                <div class="text-white font-medium">${match.awayTeam}</div>
                                <div class="w-10 h-10 bg-gradient-to-br from-red-500 to-orange-600 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg">${match.awayTeam.charAt(0)}</div>
                            </div>
                        </div>
                        ${match.venue && match.venue !== 'Unknown' ? `<div class="text-xs text-gray-500 mt-2 text-center">🏟️ ${match.venue}</div>` : ''}
                    </div>
                `;

                return matchHtml;
            }).join('');

            contentDiv.innerHTML = `<div class="schedule-grid">${matchesHtml}</div>`;
        }

        // リーグ名を取得
        function getLeagueName(leagueCode) {
            const leagueNames = {
                'PL': 'プレミアリーグ',
                'PD': 'ラ・リーガ',
                'SA': 'セリエA',
                'BL1': 'ブンデスリーガ',
                'FL1': 'リーグ・アン',
                'J1': 'J1リーグ'
            };
            return leagueNames[leagueCode] || leagueCode;
        }

        // リーグカラーを取得
        function getLeagueColor(leagueCode) {
            switch (leagueCode) {
                case 'PL':
                    return 'bg-blue-500';
                case 'PD':
                    return 'bg-purple-500';
                case 'SA':
                    return 'bg-green-500';
                case 'BL1':
                    return 'bg-red-500';
                case 'FL1':
                    return 'bg-orange-500';
                case 'J1':
                    return 'bg-yellow-500';
                default:
                    return 'bg-gray-500';
            }
        }

        // ステータスアイコンを取得
        function getStatusIcon(status) {
            switch (status) {
                case 'Finished':
                    return '<span class="text-green-400">✅</span>';
                case 'LIVE':
                case 'HT':
                    return '<span class="text-red-400">🔴</span>';
                case 'Scheduled':
                case 'TIMED':
                    return '<span class="text-yellow-400">⚪</span>';
                default:
                    return '';
            }
        }

        // 日付をフォーマット
        function formatDate(dateString) {
            const date = new Date(dateString);
            return `${date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })} ${date.toLocaleTimeString('ja-JP', { hour: 'numeric', minute: 'numeric' })}`;
        }

        // ステータスクラスを取得
        function getStatusClass(status) {
            switch (status) {
                case 'Finished':
                    return 'status-finished';
                case 'Scheduled':
                    return 'status-scheduled';
                case 'Live':
                    return 'status-live';
                default:
                    return 'status-scheduled';
            }
        }

        // ステータステキストを取得
        function getStatusText(status) {
            switch (status) {
                case 'Finished':
                    return '終了';
                case 'Scheduled':
                    return '予定';
                case 'Live':
                    return '生中継';
                default:
                    return '予定';
            }
        }
    </script>
</body>
</html>
