<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合スケジュール - Football Hub Japan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #00ff88;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .schedule-controls {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .control-select {
            background: #2a2a2a;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
        }

        .control-select:focus {
            outline: none;
            border-color: #00ff88;
        }

        .control-button {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .control-button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .match-card {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 2px solid #4CAF50;
            border-radius: 15px;
            padding: 20px;
            margin: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .match-card:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* モーダルスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background-color: #1a1a1a;
            margin: 5% auto;
            padding: 0;
            border: 1px solid #4CAF50;
            border-radius: 12px;
            width: 90%;
            max-width: none;
            min-width: 800px;
            max-height: 90vh;
            overflow: hidden;
            position: relative;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 20px;
        }

        .close:hover,
        .close:focus {
            color: #4CAF50;
        }

        .match-detail-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
        }

        .match-detail-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
            font-size: 24px;
            font-weight: bold;
        }

        .match-detail-score {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .match-detail-item {
            background-color: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }

        .match-detail-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }

        .match-detail-value {
            font-size: 16px;
            color: white;
            font-weight: bold;
        }

        .match-detail-status {
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-status .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 詳細ボタンスタイル */
        .detail-button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .detail-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        /* 大サイズモーダル */
        .large-modal {
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* タブコンテンツ */
        .tab-content {
            min-height: 400px;
            width: 100%;
            height: auto;
            overflow: visible;
            position: relative;
            display: block;
        }

        /* より具体的なセレクターで優先度を下げる */
        .modal-content .tab-pane {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: relative;
            min-height: 250px !important;
            width: 100% !important;
            height: auto !important;
            overflow: visible !important;
        }

        .modal-content .tab-pane.active {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            height: auto !important;
            width: 100% !important;
            position: relative !important;
            min-height: 250px !important;
            overflow: visible !important;
        }

        /* 強制表示用のスタイル */
        .modal-content .tab-pane[style*="display: block"] {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            min-height: 250px !important;
            width: 100% !important;
            overflow: visible !important;
        }

        /* タブペイン内のコンテナを確実に表示 */
        .modal-content .tab-pane .stats-container,
        .modal-content .tab-pane .events-container,
        .modal-content .tab-pane .lineup-container {
            display: block !important;
            min-height: 200px !important;
            width: 100% !important;
            padding: 20px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            border-radius: 8px !important;
            overflow: visible !important;
            position: relative !important;
        }

        /* モーダル全体の寸法制限を解除 */
        .modal-content {
            max-height: none !important;
            overflow: visible !important;
        }

        /* タブボタンのスタイル調整 */
        .tab-button {
            background: #333333;
            color: #cccccc;
            border: none;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-right: 5px;
        }

        .tab-button:hover {
            background: #4CAF50;
            color: #000000;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: #4CAF50;
            color: #000000;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.3);
        }

        /* ラインアップセクション */
        .lineup-section {
            margin-bottom: 30px;
        }

        .lineup-section h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .lineup-players {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .lineup-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .lineup-item:hover {
            background: rgba(76, 175, 80, 0.2);
            transform: translateY(-2px);
        }

        .lineup-position {
            color: #4CAF50;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .lineup-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* データなし表示 */
        .no-data {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 40px;
            font-size: 18px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333333;
        }

        .match-league {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .match-time {
            color: #888888;
            font-size: 0.9rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .team-name {
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: #333333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .match-score {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .match-venue {
            color: #888888;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
        }

        .match-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-finished {
            background: #00ff88;
            color: #000000;
        }

        .status-scheduled {
            background: #ffaa00;
            color: #000000;
        }

        .status-live {
            background: #ff4444;
            color: #ffffff;
        }

        .loading {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .error {
            text-align: center;
            color: #ff4444;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .no-matches {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        /* タブスタイル */
        .tab-navigation {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid rgba(76, 175, 80, 0.3);
        }

        .tab-button {
            background: #333333;
            color: #cccccc;
            border: none;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-button:hover {
            background: #4CAF50;
            color: #000000;
        }

        .tab-button.active {
            background: #4CAF50;
            color: #000000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 統計スタイル */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        /* イベントスタイル */
        .events-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* イベントコンテナ */
        .events-container {
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            position: relative;
            min-height: 200px !important;
            width: 100% !important;
            overflow: visible !important;
        }

        /* スクロールバーのスタイル */
        .events-container::-webkit-scrollbar {
            width: 8px;
        }

        .events-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .events-container::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 4px;
        }

        .events-container::-webkit-scrollbar-thumb:hover {
            background: #45a049;
        }

        /* イベントアイテム */
        .event-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
            transition: all 0.3s ease;
        }

        .event-item:hover {
            background: rgba(76, 175, 80, 0.15);
            transform: translateX(5px);
        }

        .event-time {
            background: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            margin-right: 15px;
        }

        .event-details {
            flex: 1;
        }

        .event-type {
            color: #4CAF50;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .event-player {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .event-team {
            color: #ccc;
            font-size: 12px;
            margin-top: 2px;
        }

        .event-assist {
            color: #4CAF50;
            font-size: 12px;
            margin-top: 2px;
        }

        /* ラインアップスタイル */
        .lineup-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .lineup-item {
            background: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .lineup-position {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .lineup-name {
            font-size: 1rem;
            font-weight: bold;
            color: #00ff88;
        }

        /* イベントヘッダー */
        .events-header {
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 15px;
        }

        .events-header h3 {
            color: #4CAF50;
            margin: 0;
            font-size: 18px;
        }

        /* イベントリスト */
        .events-list {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* イベントリストのスクロールバー */
        .events-list::-webkit-scrollbar {
            width: 8px;
        }

        .events-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .events-list::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 4px;
        }

        .events-list::-webkit-scrollbar-thumb:hover {
            background: #45a049;
        }

        @media (max-width: 768px) {
            .schedule-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-select {
                min-width: auto;
            }

            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .match-teams {
                flex-direction: column;
                gap: 1rem;
            }

            .match-score {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        .lineup-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* FotMobスタイルの新しいデザイン */
        .fotmob-style {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .team-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(76, 175, 80, 0.3);
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .team-logo-placeholder {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .team-details {
            flex: 1;
        }

        .team-name {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 5px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .team-formation {
            color: #4CAF50;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-rating {
            color: #FFD700;
            font-size: 18px;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: inline-block;
        }

        .fotmob-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .player-card.fotmob-player {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(76, 175, 80, 0.4);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .player-card.fotmob-player:hover {
            background: rgba(76, 175, 80, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
            border-color: #4CAF50;
        }

        .player-card.fotmob-player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4CAF50, #45a049);
        }

        .player-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            min-width: 30px;
            text-align: center;
        }

        .rating-excellent {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .rating-good {
            background: linear-gradient(135deg, #FF9800, #F57C00);
        }

        .rating-average {
            background: linear-gradient(135deg, #FF5722, #D84315);
        }

        .player-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #333, #555);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            border: 3px solid rgba(76, 175, 80, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .player-initial {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .player-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .player-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin: 8px 0 5px 0;
            line-height: 1.2;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .player-position {
            color: #4CAF50;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(76, 175, 80, 0.1);
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;

    <script>
        let currentMatches = [];

        // イベントリスナーを設定
        document.addEventListener('DOMContentLoaded', function() {
            // 初期データを読み込み
            loadMatches();
            
            // リーグ選択の変更を監視
            document.getElementById('leagueSelect').addEventListener('change', loadMatches);
            
            // 期間選択の変更を監視
            document.getElementById('timeRangeSelect').addEventListener('change', loadMatches);
            
            // 検索入力の変更を監視
            document.getElementById('searchInput').addEventListener('input', loadMatches);
            

        });

        // 試合データを読み込む
        async function loadMatches() {
            const league = document.getElementById('leagueSelect').value;
            const timeRange = document.getElementById('timeRangeSelect').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            console.log('Loading matches with:', { league, timeRange, searchTerm });
            
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '<div class="loading">試合データを読み込み中...</div>';

            try {
                const response = await fetch(`/api/fotmob/matches?league=${league}&timeRange=${timeRange}`);
                console.log('API Response status:', response.status);
                console.log('API Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // 生のレスポンステキストを確認
                const responseText = await response.text();
                console.log('Raw response text:', responseText);
                
                // JSONとしてパース
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('Parsed JSON data:', data);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    throw new Error(`JSON parse error: ${parseError.message}`);
                }
                
                if (data && data.matches && Array.isArray(data.matches) && data.matches.length > 0) {
                    console.log('Found matches:', data.matches.length);
                    currentMatches = data.matches;
                    // フィルタリングを適用
                    const filteredMatches = filterMatches(currentMatches, league, timeRange, searchTerm);
                    
                    if (filteredMatches.length === 0) {
                        contentDiv.innerHTML = '<div class="no-matches">条件に一致する試合が見つかりませんでした。</div>';
                        return;
                    }
                    
                    // 試合カードを生成
                    const matchesHtml = filteredMatches.map(match => {
                        const matchDate = new Date(match.date);
                        const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        });
                        const dateString = matchDate.toLocaleDateString('ja-JP', { 
                            month: 'short', 
                            day: 'numeric' 
                        });

                        // スコアの表示を元のnull表示に戻す
                        const homeScore = match.homeScore;
                        const awayScore = match.awayScore;
                        
                        // 試合の状態に応じた表示
                        let statusDisplay = '';
                        let scoreDisplay = '';
                        
                        if (match.status === 'TIMED' || match.status === 'Scheduled') {
                            statusDisplay = '予定';
                            scoreDisplay = `<span class="text-gray-400">null</span>`;
                        } else if (match.status === 'Finished' || match.status === 'FT') {
                            statusDisplay = '終了';
                            scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                        } else if (match.status === 'LIVE' || match.status === 'HT') {
                            statusDisplay = '試合中';
                            scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;

        // ステータスクラスを取得
        function getStatusClass(status) {
            switch (status) {
                case 'Finished':
                    return 'status-finished';
                case 'Scheduled':
                case 'NS':
                    return 'status-scheduled';
                case 'Live':
                case 'LIVE':
                    return 'status-live';
                case 'HT':
                    return 'status-live';
                default:
                    return 'status-scheduled';
            }
        }

        // ステータステキストを取得
        function getStatusText(status) {
            switch (status) {
                case 'Finished':
                    return '終了';
                case 'Scheduled':
                case 'NS':
                    return '予定';
                case 'Live':
                case 'LIVE':
                    return '生中継';
                case 'HT':
                    return 'ハーフタイム';
                default:
                    return '予定';
            }
        }

        // リーグ名を取得
        function getLeagueName(leagueCode) {
            const leagueNames = {
                'PL': 'プレミアリーグ',
                'PD': 'ラ・リーガ',
                'SA': 'セリエA',
                'BL1': 'ブンデスリーガ',
                'FL1': 'リーグ・アン',
                'J1': 'J1リーグ'
            };
            return leagueNames[leagueCode] || leagueCode;
        }

        // 試合データをフィルタリング
        function filterMatches(matches, league, timeRange, searchTerm) {
            let filteredMatches = matches;
            
            // リーグでフィルタリング
            if (league && league !== '') {
                filteredMatches = filteredMatches.filter(match => match.league === league);
            }
            
            // 検索語でフィルタリング
            if (searchTerm && searchTerm.trim() !== '') {
                filteredMatches = filteredMatches.filter(match => {
                    const homeTeam = match.homeTeam.toLowerCase();
                    const awayTeam = match.awayTeam.toLowerCase();
                    const venue = match.venue ? match.venue.toLowerCase() : '';
                    
                    return homeTeam.includes(searchTerm) || 
                           awayTeam.includes(searchTerm) || 
                           venue.includes(searchTerm);
                });
            }
            
            return filteredMatches;
        }

        // 詳細な試合情報を表示する関数
        async function showDetailedMatchInfo(matchId, league) {
            try {
                console.log(`Loading detailed match info for ID: ${matchId}, League: ${league}`);
                
                // 詳細モーダルを開く
                const detailedModal = document.getElementById('matchDetailsModal');
                if (!detailedModal) {
                    console.error('Detailed modal not found');
                    return;
                }
                
                detailedModal.style.display = 'block';
                
                // モーダルタイトルを更新
                const modalTitle = document.getElementById('modalTitle');
                if (modalTitle) {
                    modalTitle.textContent = 'データを読み込み中...';
                }
                
                // 試合詳細データを取得
                const response = await fetch(`/api/match/${matchId}/details?league=${league}`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    // モーダルタイトルを試合情報で更新
                    if (modalTitle) {
                        modalTitle.textContent = `${result.data.homeTeam} vs ${result.data.awayTeam}`;
                    }
                    
                    displayDetailedMatchInfo(result.data);
                } else {
                    throw new Error('データの取得に失敗しました');
                }
                
            } catch (error) {
                console.error('Error loading detailed match info:', error);
                
                // エラーメッセージを表示
                const modalTitle = document.getElementById('modalTitle');
                if (modalTitle) {
                    modalTitle.textContent = 'エラーが発生しました';
                }
                
                // エラー内容をコンソールに表示
                console.error('Error details:', error);
            }
        }

        // フォーメーション配置の生成関数
        function generateFormationPositions(formation, players, team) {
            // フォーメーションごとのポジション配置マップ
            const formationMap = {
                '4-2-3-1': {
                    GK: { x: 10, y: 50 },
                    LB: { x: 20, y: 20 },
                    CB: { x: 20, y: 40 },
                    CB2: { x: 20, y: 60 },
                    RB: { x: 20, y: 80 },
                    DM: { x: 35, y: 50 },
                    CM: { x: 35, y: 35 },
                    CM2: { x: 35, y: 65 },
                    LW: { x: 50, y: 25 },
                    AM: { x: 50, y: 50 },
                    RW: { x: 50, y: 75 },
                    ST: { x: 65, y: 50 }
                },
                '4-1-4-1': {
                    GK: { x: 10, y: 50 },
                    LB: { x: 20, y: 20 },
                    CB: { x: 20, y: 40 },
                    CB2: { x: 20, y: 60 },
                    RB: { x: 20, y: 80 },
                    DM: { x: 35, y: 50 },
                    LM: { x: 50, y: 25 },
                    CM: { x: 50, y: 40 },
                    CM2: { x: 50, y: 60 },
                    RM: { x: 50, y: 75 },
                    ST: { x: 65, y: 50 }
                },
                '4-4-2': {
                    GK: { x: 10, y: 50 },
                    LB: { x: 20, y: 20 },
                    CB: { x: 20, y: 40 },
                    CB2: { x: 20, y: 60 },
                    RB: { x: 20, y: 80 },
                    LM: { x: 35, y: 25 },
                    CM: { x: 35, y: 40 },
                    CM2: { x: 35, y: 60 },
                    RM: { x: 35, y: 75 },
                    ST: { x: 50, y: 35 },
                    ST2: { x: 50, y: 65 }
                },
                '3-5-2': {
                    GK: { x: 10, y: 50 },
                    CB: { x: 20, y: 30 },
                    CB2: { x: 20, y: 50 },
                    CB3: { x: 20, y: 70 },
                    LWB: { x: 35, y: 20 },
                    CM: { x: 35, y: 40 },
                    CM2: { x: 35, y: 50 },
                    CM3: { x: 35, y: 60 },
                    RWB: { x: 35, y: 80 },
                    ST: { x: 50, y: 35 },
                    ST2: { x: 50, y: 65 }
                }
            };
            
            const positions = formationMap[formation] || formationMap['4-2-3-1'];
            let html = '';
            
            // プレイヤーをポジションに配置
            players.forEach((player, index) => {
                const playerName = player.player?.name || player.name || `Player ${index + 1}`;
                const playerPosition = player.player?.pos || player.position || player.pos || 'Unknown';
                
                // ポジションに応じた座標を取得
                let coords = null;
                if (playerPosition === 'GK') coords = positions.GK;
                else if (playerPosition === 'CB') coords = positions.CB;
                else if (playerPosition === 'LB') coords = positions.LB;
                else if (playerPosition === 'RB') coords = positions.RB;
                else if (playerPosition === 'DM') coords = positions.DM;
                else if (playerPosition === 'CM') coords = positions.CM;
                else if (playerPosition === 'LW' || playerPosition === 'LM') coords = positions.LW || positions.LM;
                else if (playerPosition === 'RW' || playerPosition === 'RM') coords = positions.RW || positions.RM;
                else if (playerPosition === 'ST') coords = positions.ST;
                else if (playerPosition === 'AM') coords = positions.AM;
                
                // デフォルト位置（フォーメーションに基づく）
                if (!coords) {
                    const defaultPositions = Object.values(positions);
                    coords = defaultPositions[index] || { x: 50, y: 50 };
                }
                
                // アウェイチームの場合は左右反転
                const x = team === 'away' ? (100 - coords.x) : coords.x;
                const y = coords.y;
                
                html += `
                    <div class="pitch-player" style="left: ${x}%; top: ${y}%;" title="${playerName} (${playerPosition})">
                        <div class="pitch-player-avatar">${playerName.charAt(0)}</div>
                        <div class="pitch-player-number">${index + 1}</div>
                    </div>
                `;
            });
            
            return html;
        }

                        const tabContent = firstPane.closest('.tab-content');
                        if (tabContent) {
                            console.log('Parent tab-content dimensions:', tabContent.offsetWidth, 'x', tabContent.offsetHeight);
                        }
                    } else {
                        console.error('First tab or pane not found');
                    }
                }, 100);
                
            } catch (error) {
                console.error('Error in displayDetailedMatchInfo:', error);
                
                // エラーが発生した場合のフォールバック表示
                const overviewTab = document.getElementById('overview');
                if (overviewTab) {
                    overviewTab.innerHTML = `
                        <div class="error-message">
                            <h3>データの表示中にエラーが発生しました</h3>
                            <p>エラー詳細: ${error.message}</p>
                            <div class="fallback-info">
                                <h4>基本情報</h4>
                                <p><strong>試合:</strong> ${matchData.homeTeam} vs ${matchData.awayTeam}</p>
                                <p><strong>リーグ:</strong> ${getLeagueName(matchData.league)}</p>
                                <p><strong>日時:</strong> ${new Date(matchData.date).toLocaleString('ja-JP')}</p>
                                <p><strong>会場:</strong> ${matchData.venue || '未定'}</p>
                            </div>
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
