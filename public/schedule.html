<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合スケジュール - Football Hub Japan</title>
    
    <!-- 日本語フォントの"豆腐"対策 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #00ff88;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .schedule-controls {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .control-select {
            background: #2a2a2a;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
        }

        .control-select:focus {
            outline: none;
            border-color: #00ff88;
        }

        .control-button {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .control-button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .match-card {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 2px solid #4CAF50;
            border-radius: 15px;
            padding: 20px;
            margin: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .match-card:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* モーダルスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background-color: #1a1a1a;
            margin: 5% auto;
            padding: 0;
            border: 1px solid #4CAF50;
            border-radius: 12px;
            width: 95%;
            max-width: 1400px;
            min-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 20px;
        }

        .close:hover,
        .close:focus {
            color: #4CAF50;
        }

        .match-detail-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
        }

        .match-detail-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
            font-size: 24px;
            font-weight: bold;
        }

        .match-detail-score {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .match-detail-item {
            background-color: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }

        .match-detail-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }

        .match-detail-value {
            font-size: 16px;
            color: white;
            font-weight: bold;
        }

        .match-detail-status {
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-status .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 詳細ボタンスタイル */
        .detail-button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .detail-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        /* 大サイズモーダル */
        .large-modal {
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* タブコンテンツ */
        .tab-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* より具体的なセレクターで優先度を下げる */
        .modal-content .tab-pane {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .modal-content .tab-pane.active {
            display: block;
            position: relative;
        }

        /* 強制表示用のスタイル */
        .modal-content .tab-pane[style*="display: block"] {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            min-height: 250px !important;
            width: 100% !important;
            overflow: visible !important;
        }

        /* タブペイン内のコンテナを確実に表示 */
        .modal-content .tab-pane .stats-container,
        .modal-content .tab-pane .events-container,
        .modal-content .tab-pane .lineup-container {
            display: block !important;
            min-height: 200px !important;
            width: 100% !important;
            padding: 20px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            border-radius: 8px !important;
            overflow: visible !important;
            position: relative !important;
        }

        /* モーダル全体の寸法制限を解除 */
        .modal-content {
            max-height: none !important;
            overflow: visible !important;
        }

        /* タブボタンのスタイル調整 */
        .tab-button {
            background: #333333;
            color: #cccccc;
            border: none;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-right: 5px;
        }

        .tab-button:hover {
            background: #4CAF50;
            color: #000000;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: #4CAF50;
            color: #000000;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.3);
        }

        /* ラインアップセクション */
        .lineup-section {
            margin-bottom: 30px;
        }

        .lineup-section h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .lineup-players {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .lineup-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .lineup-item:hover {
            background: rgba(76, 175, 80, 0.2);
            transform: translateY(-2px);
        }

        .lineup-position {
            color: #4CAF50;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .lineup-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* データなし表示 */
        .no-data {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 40px;
            font-size: 18px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333333;
        }

        .match-league {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .match-time {
            color: #888888;
            font-size: 0.9rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .team-name {
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: #333333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .match-score {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .match-venue {
            color: #888888;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
        }

        .match-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-finished {
            background: #00ff88;
            color: #000000;
        }

        .status-scheduled {
            background: #ffaa00;
            color: #000000;
        }

        .status-live {
            background: #ff4444;
            color: #ffffff;
        }

        .status-postponed {
            background: #9C27B0;
            color: #ffffff;
        }

        .status-cancelled {
            background: #607D8B;
            color: #ffffff;
        }

        .data-source-info {
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .source-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #00ff88;
        }

        .source-icon {
            font-size: 1.2rem;
        }

        .source-text {
            font-weight: 500;
        }

        .loading {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .error {
            text-align: center;
            color: #ff4444;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .no-matches {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        /* タブスタイル */
        .tab-navigation {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            z-index: 10;
            border-bottom: 2px solid #4CAF50;
            flex-shrink: 0;
        }

        .tab-button {
            background: #333333;
            color: #cccccc;
            border: none;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-button:hover {
            background: #4CAF50;
            color: #000000;
        }

        .tab-button.active {
            background: #4CAF50;
            color: #000000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 統計とイベントの基本スタイル（重複を削除） */

        .event-player {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .event-team {
            color: #ccc;
            font-size: 12px;
            margin-top: 2px;
        }

        .event-assist {
            color: #4CAF50;
            font-size: 12px;
            margin-top: 2px;
        }

        /* ラインアップスタイル */
        .lineup-container {
            max-height: 60vh;
            overflow-y: auto;
            overflow-x: auto;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(76, 175, 80, 0.3);
            width: 100%;
        }

        .lineup-item {
            background: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .lineup-position {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .lineup-name {
            font-size: 1rem;
            font-weight: bold;
            color: #00ff88;
        }

        /* イベントヘッダー */
        .events-header {
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 15px;
        }

        .events-header h3 {
            color: #4CAF50;
            margin: 0;
            font-size: 18px;
        }

        /* イベントリスト */
        .events-list {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* イベントリストのスクロールバー */
        .events-list::-webkit-scrollbar {
            width: 8px;
        }

        .events-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .events-list::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 4px;
        }

        .events-list::-webkit-scrollbar-thumb:hover {
            background: #45a049;
        }

        @media (max-width: 768px) {
            /* ヘッダーのサイズを小さく */
            .header {
                padding: 0.5rem 1rem;
            }

            .logo {
                font-size: 1.2rem;
            }

            .nav-links {
                gap: 0.5rem;
            }

            .nav-link {
                font-size: 0.75rem;
                padding: 0.3rem 0.5rem;
            }

            /* ページタイトルを小さく */
            .page-title {
                font-size: 1.5rem;
            }

            .page-subtitle {
                font-size: 0.9rem;
            }

            /* コントロールセクション */
            .schedule-controls {
                flex-direction: column;
                align-items: stretch;
                padding: 1rem;
                gap: 0.8rem;
            }

            .control-select {
                min-width: auto;
                font-size: 0.85rem;
                padding: 0.6rem 0.8rem;
            }

            .control-label {
                font-size: 0.8rem;
            }

            /* 試合グリッドを4列に */
            .schedule-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.5rem;
            }

            /* 試合カードを小さく（横幅を統一） */
            .match-card {
                padding: 8px;
                margin: 0;
                border-radius: 8px;
                font-size: 0.7rem;
                width: 100%;
                box-sizing: border-box;
            }

            .match-header {
                flex-direction: column;
                gap: 4px;
                margin-bottom: 6px;
            }

            .match-league {
                font-size: 0.65rem;
            }

            .match-status {
                font-size: 0.65rem;
                padding: 2px 6px;
            }

            /* 試合チームを横並びに */
            .match-teams {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 6px;
                margin: 6px 0;
            }

            .team {
                flex-direction: row;
                align-items: center;
                gap: 4px;
                flex: 1;
            }

            .team-logo {
                width: 24px !important;
                height: 24px !important;
                min-width: 24px;
            }

            .team-name {
                font-size: 0.65rem !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 80px;
            }

            .match-score {
                font-size: 0.75rem !important;
                gap: 4px;
                min-width: 40px;
                justify-content: center;
            }

            .match-info {
                font-size: 0.65rem;
                margin-top: 4px;
            }

            .match-venue,
            .match-date,
            .match-time {
                font-size: 0.55rem;
            }

            /* モーダル */
            .modal-content {
                width: 95%;
                min-width: auto;
                margin: 2% auto;
            }
        }

        /* 非常に小さい画面（480px以下）の調整 */
        @media (max-width: 480px) {
            .schedule-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.4rem;
            }

            .match-card {
                width: 100%;
                margin: 0;
            }

            .logo {
                font-size: 1rem;
            }

            .nav-links {
                flex-wrap: wrap;
                gap: 0.3rem;
            }

            .nav-link {
                font-size: 0.65rem;
                padding: 0.2rem 0.4rem;
            }
        }

        .lineup-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* FotMobスタイルの新しいデザイン */
        .fotmob-style {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .team-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(76, 175, 80, 0.3);
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .team-logo {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .team-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .team-logo-fallback {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .team-details {
            flex: 1;
        }

        .team-name {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 5px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .team-formation {
            color: #4CAF50;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-rating {
            color: #FFD700;
            font-size: 18px;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: inline-block;
        }

        .fotmob-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .player-card.fotmob-player {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(76, 175, 80, 0.4);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .player-card.fotmob-player:hover {
            background: rgba(76, 175, 80, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
            border-color: #4CAF50;
        }

        .player-card.fotmob-player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4CAF50, #45a049);
        }

        .player-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 12px;

    <script>
        let currentMatches = [];

        // イベントリスナーを設定
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Setting up tab functionality...');
            
            // タブボタンにイベントリスナーを追加
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabPanes = document.querySelectorAll('.tab-pane');
            
            console.log('Found tab buttons:', tabButtons.length);
            console.log('Found tab panes:', tabPanes.length);
            
            // デバッグ用：タブペインの詳細情報をログ出力
            tabPanes.forEach((pane, index) => {
                console.log(`Tab pane ${index}:`, {
                    id: pane.id,
                    classes: pane.className,
                    display: pane.style.display,
                    computedDisplay: window.getComputedStyle(pane).display,
                    offsetHeight: pane.offsetHeight,
                    offsetWidth: pane.offsetWidth,
                    innerHTML: pane.innerHTML.substring(0, 100) + '...'
                });
            });
            
            // スクロールイベントの伝播を防ぐ
            const scrollableContainers = document.querySelectorAll('.basic-info.fotmob-style, .stats-container, .events-container, .lineup-container, .formation-display, .lineup-players.fotmob-grid');
            scrollableContainers.forEach(container => {
                container.addEventListener('wheel', function(e) {
                    e.stopPropagation();
                });
                
                container.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                });
                
                container.addEventListener('touchmove', function(e) {
                    e.stopPropagation();
                });
            });
            
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');
                    console.log('Tab clicked:', targetTab);
                    
                    // アクティブなタブボタンを更新
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // タブペインを更新
                    tabPanes.forEach(pane => {
                        pane.classList.remove('active');
                        console.log('Removing active class from:', pane.id);
                    });
                    
                    const targetPane = document.getElementById(targetTab);
                    if (targetPane) {
                        targetPane.classList.add('active');
                        console.log('Added active class to:', targetPane.id);
                        
                        // スクロール位置をリセット

                        'BL1': 'bundesliga',
                        'FL1': 'ligue1',
                        'J1': 'j1',

                        'ECL': 'conferenceLeague',

                        'ラリーガ': 'laLiga',

                        'J1リーグ': 'j1',
                        'チャンピオンズリーグ': 'championsLeague',
                        'ヨーロッパリーグ': 'europaLeague',
                        'ヨーロッパカンファレンスリーグ': 'conferenceLeague'
                    };
                    
                    const mappedLeague = leagueMapping[league] || league;
                    const leagueParam = mappedLeague ? `&league=${encodeURIComponent(mappedLeague)}` : '';
                    const statusParam = statusFilter ? `&status=${encodeURIComponent(statusFilter)}` : '';
                    const seasonParam = season ? `&season=${encodeURIComponent(season)}` : '';
                    const timeRangeParam = timeRange ? `&timeRange=${encodeURIComponent(timeRange)}` : '';
                    
                    console.log('🔄 統合APIを呼び出し中...');
                    console.log('🔍 リーグマッピング:', league, '→', mappedLeague);
                    const integratedUrl = `/api/schedule?season=${season}${leagueParam}${statusParam}${timeRangeParam}`;
                    console.log('📡 統合API URL:', integratedUrl);
                    console.log('📡 パラメータ詳細:', { season, leagueParam, statusParam, timeRangeParam });
                    response = await fetch(integratedUrl, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        signal: AbortSignal.timeout(30000) // 30秒のタイムアウト
                    });
                
                if (!response.ok) {
                        throw new Error(`Integrated API error! status: ${response.status}`);
                }
                
                const responseText = await response.text();
                    console.log('✅ 統合API レスポンス取得成功');

        // ステータスクラスを取得

        // リーグキーを取得（CL, PL, PD, SA, BL1, FL1など）
        function getLeagueKey(leagueName) {
            if (!leagueName) return '';
            
            const normalized = leagueName.toLowerCase().replace(/\s+/g, '');
            
            // 主要リーグのマッピング
            if (normalized.includes('champions') || normalized.includes('ucl') || normalized === 'cl') return 'CL';
            if (normalized.includes('europa') || normalized.includes('uel') || normalized === 'el') return 'EL';
            if (normalized.includes('premier') || normalized === 'pl') return 'PL';
            if (normalized.includes('laliga') || normalized.includes('la liga') || normalized === 'pd') return 'PD';
            if (normalized.includes('serie a') || normalized === 'sa') return 'SA';
            if (normalized.includes('bundesliga') || normalized === 'bl1') return 'BL1';
            if (normalized.includes('ligue 1') || normalized.includes('ligue1') || normalized === 'fl1') return 'FL1';
            
            return '';
        }

        // リーグ名を取得（各種表記に対応）
        function getLeagueName(leagueCode) {
            if (!leagueCode) return '不明';
            
            // 正規化関数（大文字小文字・アクセント記号・スペースを無視）
            const normalize = (name) => {
                if (!name) return '';
                return name.toLowerCase()
                    .replace(/[áàâãä]/g, 'a')
                    .replace(/[éèêë]/g, 'e')
                    .replace(/[íìîï]/g, 'i')
                    .replace(/[óòôõö]/g, 'o')
                    .replace(/[úùûü]/g, 'u')
                    .replace(/[ñ]/g, 'n')
                    .replace(/[ç]/g, 'c')
                    .replace(/\s+/g, '')
                    .trim();
            };
            
            const normalizedCode = normalize(leagueCode);
            
            // リーグコードまたは正規化された名前でのマッピング
            const leagueNames = {
                // コード
                'pl': 'プレミアリーグ',
                'pd': 'ラ・リーガ',
                'sa': 'セリエA',
                'bl1': 'ブンデスリーガ',
                'fl1': 'リーグ・アン',
                'j1': 'J1リーグ',
                'cl': 'チャンピオンズリーグ',
                'el': 'ヨーロッパリーグ',
                'ecl': 'ヨーロッパカンファレンスリーグ',
                // 英語名（正規化後）
                'premierleague': 'プレミアリーグ',
                'premier': 'プレミアリーグ',
                'laliga': 'ラ・リーガ',
                'ligasantander': 'ラ・リーガ',
                'primeradivision': 'ラ・リーガ',
                'primera': 'ラ・リーガ',
                'seriea': 'セリエA',
                'serie': 'セリエA',
                'bundesliga': 'ブンデスリーガ',
                'bundes': 'ブンデスリーガ',
                'ligue1': 'リーグ・アン',
                'ligue': 'リーグ・アン',
                'j1league': 'J1リーグ',
                'jleague': 'J1リーグ',
                'championsleague': 'チャンピオンズリーグ',
                'uefachampions': 'チャンピオンズリーグ',
                'ucl': 'チャンピオンズリーグ',
                'europaleague': 'ヨーロッパリーグ',
                'uefaeuropa': 'ヨーロッパリーグ',
                'uel': 'ヨーロッパリーグ',
                'conferenceleague': 'ヨーロッパカンファレンスリーグ',
                'uefaconference': 'ヨーロッパカンファレンスリーグ',
                'uecl': 'ヨーロッパカンファレンスリーグ'
            };
            
            // まず直接マッチを試す
            if (leagueNames[normalizedCode]) {
                return leagueNames[normalizedCode];
            }
            
            // 部分マッチを試す
            for (const [key, value] of Object.entries(leagueNames)) {
                if (normalizedCode.includes(key) || key.includes(normalizedCode)) {
                    return value;
                }
            }
            
            // マッチしない場合は元の値を返す
            return leagueCode;
        }

        // 試合ステータスを取得
        function getMatchStatus(match) {
            // ステータスを正規化（大文字小文字を区別しない）
            const normalizeStatus = (status) => {
                if (!status) return '';
                return String(status).toLowerCase().trim();
            };
            
            const status = normalizeStatus(match.status || match.fixture?.status?.short || match.fixture?.status?.long);
            
            // 終了ステータスのチェック（複数のパターンに対応）
            if (status === 'finished' || status === 'ft' || status === 'full-time' || status === 'complete') {
                return '終了';
            }
            
            // 試合中ステータスのチェック
            if (status === 'live' || status === 'inplay' || status === 'in_play' || status === 'in-play' || 
                status === 'playing' || status === 'first_half' || status === 'second_half' || 
                status === 'half_time' || status === 'ht') {
                return '試合中';
            }
            
            // 予定ステータスのチェック
            if (status === 'scheduled' || status === 'timed' || status === 'ns' || status === 'not_started' || 
                status === 'not-started' || status === 'upcoming' || status === 'future') {
                return '予定';
            }
            
            // ステータスが不明な場合、日時で判定
            const now = new Date();
            const matchDate = match.date ? new Date(match.date) : null;
            
            if (!matchDate || isNaN(matchDate.getTime())) {
                // 日時が無効な場合はデフォルトで予定として扱う
                return '予定';
            }
            
            const matchTime = matchDate.getTime();
            const currentTime = now.getTime();
            
            // 試合開始時刻から90分後（試合終了想定時刻）
            const matchEndTime = matchTime + (90 * 60 * 1000);
            
            if (matchTime <= currentTime && currentTime <= matchEndTime) {
                return '試合中';
            } else if (matchTime > currentTime) {
                return '予定';
            } else {
                // 試合終了時刻を過ぎている場合は終了と判定
                return '終了';
            }
        }

        // 試合データをフィルタリング
        function filterMatches(matches, league, timeRange, searchTerm, statusFilter, season = null) {
            let filteredMatches = matches;
            console.log(`🔍 フィルタリング開始: ${matches.length}件のマッチ`);
            
            // リーグでフィルタリング
            if (league && league !== '') {
                const beforeCount = filteredMatches.length;
                
                // リーグコードと日本語名のマッピング（大文字小文字・スペース・アクセント記号を考慮）
                const leagueNameMap = {
                    'PL': ['premier league', 'プレミアリーグ', 'premier', 'premierleague'],
                    'PD': [
                        'la liga', 'ラ・リーガ', 'ラリーガ', 
                        'primera división', 'primera division', 'primera',
                        'primeradivision', 'primera división', 'primera divisi'
                    ],
                    'SA': ['serie a', 'セリエA', 'seriea', 'serie'],
                    'BL1': ['bundesliga', 'ブンデスリーガ', 'bundes'],
                    'FL1': ['ligue 1', 'リーグ・アン', 'ligue1', 'ligue'],
                    'J1': ['j1', 'j1リーグ', 'j.league', 'jleague'],
                    'CL': ['champions league', 'チャンピオンズリーグ', 'uefa champions', 'ucl', 'champions'],
                    'EL': ['europa league', 'ヨーロッパリーグ', 'uefa europa', 'uel', 'europa'],
                    'ECL': ['conference league', 'ヨーロッパカンファレンスリーグ', 'uefa conference', 'uecl', 'conference']
                };
                
                const searchTerms = leagueNameMap[league] || [league.toLowerCase()];
                
                filteredMatches = filteredMatches.filter(match => {
                    // リーグ名を正規化（小文字化、アクセント記号除去、スペース除去）
                    const normalizeLeagueName = (name) => {
                        if (!name) return '';
                        return name.toLowerCase()
                            .replace(/[áàâãä]/g, 'a')
                            .replace(/[éèêë]/g, 'e')
                            .replace(/[íìîï]/g, 'i')
                            .replace(/[óòôõö]/g, 'o')
                            .replace(/[úùûü]/g, 'u')
                            .replace(/[ñ]/g, 'n')
                            .replace(/[ç]/g, 'c')
                            .replace(/\s+/g, ' ')  // 複数のスペースを1つに
                            .trim();
                    };
                    
                    const matchLeague = normalizeLeagueName(match.leagueName || match.league || '');
                    
                    // マッピングされた検索語でマッチング
                    for (const term of searchTerms) {
                        const normalizedTerm = normalizeLeagueName(term);
                        // 部分マッチング（スペースを考慮しない比較も追加）
                        if (matchLeague.includes(normalizedTerm) || 
                            normalizedTerm.includes(matchLeague) ||
                            matchLeague.replace(/\s+/g, '').includes(normalizedTerm.replace(/\s+/g, '')) ||
                            normalizedTerm.replace(/\s+/g, '').includes(matchLeague.replace(/\s+/g, ''))) {
                            return true;
                        }
                    }
                    
                    // リーグコード直接マッチ（PD, PL など）
                    if (matchLeague === league.toLowerCase()) {
                        return true;
                    }
                    
                    // 部分一致
                    if (matchLeague.includes(league.toLowerCase()) || league.toLowerCase().includes(matchLeague)) {
                        return true;
                    }
                    
                    return false;
                });
                console.log(`🔍 リーグフィルタリング: ${beforeCount} → ${filteredMatches.length}件 (リーグ: ${league})`);
            }
            
            // 期間でフィルタリング（過去シーズンの場合はスキップ）
            // シーズンの正規化（2024/25形式を2024に変換）
            let normalizedSeason = season || null;
            if (normalizedSeason && typeof normalizedSeason === 'string' && normalizedSeason.includes('/')) {
                normalizedSeason = parseInt(normalizedSeason.split('/')[0]);
            } else if (normalizedSeason) {
                normalizedSeason = parseInt(normalizedSeason);
            }
            
            // 現在のシーズンを判定（8月以降は新しいシーズン）
            const currentDate = new Date();
            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth() + 1; // 0-indexed
            const currentSeason = currentMonth >= 8 ? currentYear : currentYear - 1;
            const isPastSeason = normalizedSeason && normalizedSeason < currentSeason;
            
            // 過去シーズンの場合は期間フィルタリングをスキップ
            if (timeRange && timeRange !== '' && !isPastSeason) {
                const beforeCount = filteredMatches.length;
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                
                let startDate, endDate;
                
                switch (timeRange) {
                    case 'today':
                        startDate = new Date(now);
                        endDate = new Date(now);
                        endDate.setHours(23, 59, 59, 999);
                        break;
                    case 'tomorrow':
                        startDate = new Date(now);
                        startDate.setDate(startDate.getDate() + 1);
                        endDate = new Date(startDate);
                        endDate.setHours(23, 59, 59, 999);
                        break;
                    case 'week':
                        // 今週の月曜日〜日曜日を取得
                        const currentDay = now.getDay(); // 0=日曜日, 1=月曜日, ..., 6=土曜日
                        const daysToMonday = currentDay === 0 ? -6 : 1 - currentDay; // 月曜日までの日数
                        startDate = new Date(now);
                        startDate.setDate(now.getDate() + daysToMonday);
                        startDate.setHours(0, 0, 0, 0);
                        endDate = new Date(startDate);
                        endDate.setDate(startDate.getDate() + 6); // 日曜日まで
                        endDate.setHours(23, 59, 59, 999);
                        break;
                    case 'lastweek':
                        // 先週の月曜日〜日曜日を取得
                        const currentDayLastWeek = now.getDay();
                        const daysToMondayLastWeek = currentDayLastWeek === 0 ? -6 : 1 - currentDayLastWeek;
                        const lastWeekMonday = new Date(now);
                        lastWeekMonday.setDate(now.getDate() + daysToMondayLastWeek - 7); // 先週の月曜日
                        startDate = new Date(lastWeekMonday);
                        startDate.setHours(0, 0, 0, 0);
                        endDate = new Date(lastWeekMonday);
                        endDate.setDate(lastWeekMonday.getDate() + 6); // 先週の日曜日まで
                        endDate.setHours(23, 59, 59, 999);
                        break;
                    case 'month':
                        startDate = new Date(now);
                        endDate = new Date(now);
                        endDate.setMonth(endDate.getMonth() + 1);
                        endDate.setHours(23, 59, 59, 999);
                        break;
                    case 'lastmonth':
                        startDate = new Date(now);
                        startDate.setMonth(startDate.getMonth() - 1);
                        startDate.setDate(1); // 先月の1日から
                        endDate = new Date(now);
                        endDate.setDate(0); // 先月の最後の日まで
                        endDate.setHours(23, 59, 59, 999);
                        break;
                    case 'last3months':
                        startDate = new Date(now);
                        startDate.setMonth(startDate.getMonth() - 3);
                        startDate.setDate(1); // 3ヶ月前の1日から
                        endDate = new Date(now);
                        endDate.setHours(23, 59, 59, 999);
                        break;
                    case 'last6months':
                        startDate = new Date(now);
                        startDate.setMonth(startDate.getMonth() - 6);
                        startDate.setDate(1); // 6ヶ月前の1日から
                        endDate = new Date(now);
                        endDate.setHours(23, 59, 59, 999);
                        break;
                    default:
                        // 期間指定がない場合はフィルタリングしない
                        startDate = null;
                        endDate = null;
                }
                
                if (startDate && endDate) {
                    filteredMatches = filteredMatches.filter(match => {
                        const parseUtcDate = (dateStr) => {
                            if (!dateStr) return null;
                            const date = new Date(dateStr);
                            return isNaN(date.getTime()) ? null : date;
                        };
                        
                        const matchDate = parseUtcDate(match.date || match.utcDate || match.matchDate || match.fixture?.date);
                        if (!matchDate) return false;
                        
                        return matchDate >= startDate && matchDate <= endDate;
                    });
                    console.log(`🔍 期間フィルタリング: ${beforeCount} → ${filteredMatches.length}件 (期間: ${timeRange})`);
                }
            }
            
            // ステータスでフィルタリング
            if (statusFilter && statusFilter !== '') {
                filteredMatches = filteredMatches.filter(match => {
                    const matchStatus = getMatchStatus(match);
                    return matchStatus === statusFilter;
                });
            }
            
            // 検索語でフィルタリング
            if (searchTerm && searchTerm.trim() !== '') {
                filteredMatches = filteredMatches.filter(match => {
                    // homeTeamとawayTeamがオブジェクトの場合と文字列の場合を考慮
                    const homeTeamName = typeof match.homeTeam === 'string' ? match.homeTeam : match.homeTeam?.name || '';
                    const awayTeamName = typeof match.awayTeam === 'string' ? match.awayTeam : match.awayTeam?.name || '';
                    const venue = match.venue ? match.venue.toLowerCase() : '';
                    
                    return homeTeamName.toLowerCase().includes(searchTerm) || 
                           awayTeamName.toLowerCase().includes(searchTerm) || 
                           venue.includes(searchTerm);
                });
            }
            
            return filteredMatches;
        }

        // カード要素から試合詳細を表示する関数（新しい実装）

        // 新しい詳細な試合情報を表示する関数（ID解決レイヤー使用）
        async function showDetailedMatchInfoV2({ source, fixtureId, fotmobId, leagueKey, kickoffUtc, home, away }) {
            try {
                console.log('🔍 showDetailedMatchInfoV2 called:', { source, fixtureId, fotmobId, leagueKey, kickoffUtc, home, away });
                
                const detailedModal = document.getElementById('matchDetailsModal');
                if (!detailedModal) {
                    console.error('Detailed modal not found');
                    return;
                }
                
                detailedModal.style.display = 'block';
                
                // モーダルタイトルを更新
                const modalTitle = document.getElementById('modalTitle');
                if (modalTitle) {
                    modalTitle.textContent = `${home} vs ${away}`;
                }
                
                // 新しいAPIエンドポイントを使用（fixtureIdを優先）
                const params = new URLSearchParams({
                    ...(fixtureId ? { fixtureId } : {}),
                    ...(fotmobId && !fixtureId ? { fotmobId, source: 'fotmob', leagueKey, kickoffUtc } : {}),
                    ...(home ? { home } : {}),
                    ...(away ? { away } : {}),
                    ...(leagueKey ? { leagueKey } : {}),

                    if (matchData) {

                        actualMatchId = matchData.fixture?.id ||

                    } else {

                        actualMatchId = matchId;

                if (!actualMatchId || actualMatchId === 'unknown' || actualMatchId === 'undefined') {
                    // matchDataからIDを取得してみる
                    if (matchData && (matchData.id || matchData.match_id || matchData.fixture?.id)) {
                        actualMatchId = matchData.fixture?.id || matchData.match_id || matchData.id;

                const detailedModal = document.getElementById('matchDetailsModal');
                if (!detailedModal) {

                    return;
                }
                
                detailedModal.style.display = 'block';
                
                // モーダルタイトルを更新
                const modalTitle = document.getElementById('modalTitle');
                if (modalTitle) {

                    if (matchData && (matchData.homeTeam || matchData.home) && (matchData.awayTeam || matchData.away)) {

                }
                
                // 試合詳細データを取得（クリックした試合の情報も送信）
                const requestUrl = `/api/match/${actualMatchId}/details?league=${encodeURIComponent(league || '')}`;
                const requestBody = {
                    clickedMatchData: matchData
                };
                
                console.log('📡 Fetching match details:', { url: requestUrl, actualMatchId, matchData });
                
                const response = await fetch(requestUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                const result = await response.json();
                
                if (result.success && result.data) {
                    // 取得したデータのチーム名を確認（クリックした試合と一致しているか）
                    const apiHomeTeam = result.data.homeTeam || result.data.home;
                    const apiAwayTeam = result.data.awayTeam || result.data.away;
                    const clickedHomeTeam = matchData?.homeTeam || matchData?.home || matchData?.teams?.home?.name;
                    const clickedAwayTeam = matchData?.awayTeam || matchData?.away || matchData?.teams?.away?.name;
                    
                    console.log('🔍 Team name verification:', {
                        api: { apiHomeTeam, apiAwayTeam },
                        clicked: { clickedHomeTeam, clickedAwayTeam }
                    });
                    
                    // チーム名が一致しない場合は警告を出して、クリックした試合のデータを使用
                    if (clickedHomeTeam && clickedAwayTeam &&

                        result.data.homeTeam = clickedHomeTeam;
                        result.data.awayTeam = clickedAwayTeam;
                        result.data.id = matchId; // IDも確実に設定
                    } else if (clickedHomeTeam && clickedAwayTeam) {
                        // チーム名が一致する場合でも、クリックした試合の情報を確実に設定
                        result.data.homeTeam = clickedHomeTeam;
                        result.data.awayTeam = clickedAwayTeam;

        // 得点者リストを生成する関数（チーム別）
        function generateScorersListByTeam(matchData, teamType) {
            console.log('Generating scorers list for team:', teamType);
            
            if (!matchData.events || matchData.events.length === 0) {
                return '<div class="no-data">得点者情報がありません</div>';
            }

            const homeTeam = matchData.homeTeam || matchData.home;
            const awayTeam = matchData.awayTeam || matchData.away;
            
            // ゴールイベントをフィルタリング
            const goals = matchData.events.filter(event => {
                const eventType = event.type || event.eventType || event.name;
                if (eventType !== 'Goal' && eventType !== 'goal' && eventType !== 'GOAL') {
                    return false;
                }
                
                // チームでフィルタリング
                let eventTeam = '';
                if (event.team === 'home' || event.team?.name === homeTeam || event.team === homeTeam) {
                    eventTeam = 'home';
                } else if (event.team === 'away' || event.team?.name === awayTeam || event.team === awayTeam) {
                    eventTeam = 'away';
                } else if (event.team && typeof event.team === 'object') {
                    const teamName = event.team.name || event.team.shortName || '';
                    if (teamName === homeTeam) {
                        eventTeam = 'home';
                    } else if (teamName === awayTeam) {
                        eventTeam = 'away';
                    }
                }
                
                return eventTeam === teamType;
            });
            
            if (goals.length === 0) {
                return '<div class="no-data">得点者情報がありません</div>';
            }

            return goals.map(goal => {
                let playerName, time, detail;
                
                // プレイヤー名の取得
                if (goal.player && typeof goal.player === 'object') {
                    playerName = goal.player.name || goal.player.displayName || goal.player.firstName || '不明';
                    if (goal.player.lastName) {
                        playerName = `${playerName} ${goal.player.lastName}`;
                    }
                } else if (typeof goal.player === 'string') {
                    playerName = goal.player;
                } else if (goal.scorer && typeof goal.scorer === 'object') {
                    playerName = goal.scorer.name || goal.scorer.displayName || '不明';
                } else if (goal.scorer && typeof goal.scorer === 'string') {
                    playerName = goal.scorer;
                } else {
                    playerName = '不明';
                }
                
                // 時間の取得
                if (typeof goal.time === 'object' && goal.time.elapsed) {
                    time = goal.time.elapsed;
                } else if (typeof goal.time === 'number') {
                    time = goal.time;
                } else if (goal.minute) {
                    time = goal.minute;
                } else {
                    time = '?';
                }
                
                detail = goal.detail || goal.goalType || 'Normal Goal';
                
                return `
                    <div class="scorer-item">
                        <div class="scorer-info">
                            <span class="scorer-name">${playerName}</span>
                        </div>
                        <div class="scorer-details">
                            <span class="scorer-time">${time}'</span>
                            <span class="scorer-type">${detail}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

                button.classList.remove('active');

            // すべてのタブペインを非表示

            });
            
            // クリックされたタブボタンをアクティブに

            if (activeButton) {
                activeButton.classList.add('active');

            // 対応するタブペインを表示
            const targetPane = document.getElementById(tabName);
            if (targetPane) {
                targetPane.classList.add('active');
                
                // スクロール位置をリセット
                const scrollableContainers = targetPane.querySelectorAll('.basic-info.fotmob-style, .stats-container, .events-container, .lineup-container, .formation-display, .lineup-players.fotmob-grid');
                scrollableContainers.forEach(container => {

                // ポジション情報の取得
                if (player.player && player.player.pos && player.player.pos !== 'UNKNOWN' && player.player.pos !== 'Unknown' && player.player.pos !== 'null' && player.player.pos !== null) {

                // 背番号の取得
                if (player.player && player.player.number && player.player.number !== 'UNKNOWN' && player.player.number !== 'Unknown' && player.player.number !== 'null' && player.player.number !== null) {

                // プレイヤー写真の取得（API-Footballのphotoフィールド）
                if (player.player && player.player.photo && player.player.photo !== 'UNKNOWN' && player.player.photo !== 'Unknown' && player.player.photo !== 'null' && player.player.photo !== null && player.player.photo !== '') {

                console.log(`Player ${index + 1} (${teamType}):`, {

                const performanceRating = (Math.random() * 2 + 6).toFixed(1);

        // 統合ピッチでのプレイヤー位置を生成する関数（中央線分離版）
        function generateUnifiedPlayerPositions(players, teamType, formation, homeTeam, awayTeam) {
            // フォーメーションに応じて適切な位置を取得
            const basePositions = getFormationPositions(formation);
            
            // 選手を配置（インデックスベース - フォーメーションの位置配列の順序に従う）
            // 通常、APIから返されるプレイヤーの順序はフォーメーションの順序と一致している
            return players.map((player, index) => {
                // インデックスがフォーメーションの位置数を超えないように制限
                const positionIndex = Math.min(index, basePositions.length - 1);
                const pos = basePositions[positionIndex];
                
                if (!pos) {
                    console.warn(`No position found for player ${player.name} at index ${index}`);
                    return '';
                }
                
                return createPlayerMarker(pos, player, teamType, homeTeam, awayTeam);
            }).join('');
        }
        
        // プレイヤーマーカーを作成する関数（共通処理）
        function createPlayerMarker(pos, player, teamType, homeTeam, awayTeam) {
            let left, top;
            
            if (teamType === 'home') {
                // ホームチーム（左側、left: 2-46%）
                // フォーメーションの位置をそのまま使用（すべてホームチーム基準に統一されている）
                left = Math.max(2, Math.min(46, pos.left)); // 2-46%の範囲に制限
                top = Math.max(5, Math.min(95, pos.top)); // 5-95%の範囲に制限
            } else {
                // アウェイチーム（右側、left: 54-98%）
                // ホームチーム基準の位置を反転（左右対称）
                left = 100 - pos.left;
                top = pos.top; // topはそのまま（上下は反転しない）
                
                // 中央線（50%）を超えないように、かつ右側の範囲内に制限
                left = Math.max(54, Math.min(98, left)); // 54-98%の範囲に制限
                top = Math.max(5, Math.min(95, top)); // 5-95%の範囲に制限
            }
            
            // プレイヤー情報を取得
            const playerName = player.name || player.player?.name || 'Unknown';
            const playerNumber = player.number || player.player?.number || 0;
            const playerPhoto = player.photo || player.player?.photo || null;
            const playerRating = player.rating || player.player?.rating || 'N/A';
            const ratingClass = player.ratingClass || (typeof playerRating === 'number' && playerRating >= 7 ? 'high' : typeof playerRating === 'number' && playerRating >= 6 ? 'medium' : 'low');
            
            // 名前は常に選手写真の真下に配置（中央揃え）
            return `
                <div class="player-marker ${teamType}-player" style="left: ${left}%; top: ${top}%;" onclick="showPlayerDetails('${playerName}', '${teamType === 'home' ? homeTeam : awayTeam}')">
                    <div class="player-avatar">
                        ${playerPhoto ? 
                            `<img src="${playerPhoto}" alt="${playerName}" class="player-photo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="player-initial" style="display:none;">${playerName.charAt(0)}</div>` : 
                            `<div class="player-initial">${playerName.charAt(0)}</div>`
                        }
                    </div>
                    <div class="player-rating ${ratingClass}">${playerRating}</div>
                    <div class="player-number">${playerNumber}</div>
                    <div class="player-name">${playerName.replace(/^[^ ]+ /, '')}</div>
                </div>
            `;
        }
        
        // 選手位置を調整して重なりを防ぐ関数
        function adjustPlayerPositions(positions, teamType) {
            const adjusted = [...positions];
            const minDistance = 8; // 最小距離（%）
            
            for (let i = 0; i < adjusted.length; i++) {
                for (let j = i + 1; j < adjusted.length; j++) {
                    const dx = Math.abs(adjusted[i].left - adjusted[j].left);
                    const dy = Math.abs(adjusted[i].top - adjusted[j].top);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < minDistance) {
                        // 重なっている場合、位置を調整
                        const angle = Math.atan2(adjusted[j].top - adjusted[i].top, adjusted[j].left - adjusted[i].left);
                        const offset = minDistance - distance;
                        
                        adjusted[j].left += Math.cos(angle) * offset;
                        adjusted[j].top += Math.sin(angle) * offset;
                        
                        // 境界チェック
                        adjusted[j].left = Math.max(5, Math.min(95, adjusted[j].left));
                        adjusted[j].top = Math.max(5, Math.min(95, adjusted[j].top));
                    }
                }
            }
            
            return adjusted;
        }
        
        // 名前の表示位置を計算する関数（重なりを防ぐ）
        function calculateNameOffset(index, positions, teamType) {
            const currentPos = positions[index];
            let offsetX = 0; // デフォルトは中央（transform: translateX(-50%)で中央揃え）
            let offsetY = 0; // デフォルトは下（top: 100%）
            
            // 近くの選手をチェック
            for (let i = 0; i < positions.length; i++) {
                if (i === index) continue;
                
                const otherPos = positions[i];
                const dx = Math.abs(currentPos.left - otherPos.left);
                const dy = Math.abs(currentPos.top - otherPos.top);
                
                // 同じライン（topが近い）で左右に近い場合
                if (dy < 5 && dx < 15) {
                    // 左側の選手は名前を左に、右側の選手は名前を右に
                    if (currentPos.left < otherPos.left) {
                        offsetX = -20; // 左にずらす（px単位）
                    } else {
                        offsetX = 20; // 右にずらす（px単位）
                    }
                }
                
                // 上下に近い場合、名前を横にずらす
                if (dx < 5 && dy < 15) {
                    if (currentPos.top < otherPos.top) {
                        offsetX = -20; // 上側の選手は左に
                    } else {
                        offsetX = 20; // 下側の選手は右に
                    }
                }
            }
            
            return { x: offsetX, y: offsetY };
        }

        // フォーメーションに基づくプレイヤー位置を取得する関数（統一版 - すべてホームチーム基準）
        function getFormationPositions(formation) {
            const positions = [];
            
            // すべてのフォーメーションをホームチーム基準（左側、left: 0-50%）に統一

                case '3-5-2':
