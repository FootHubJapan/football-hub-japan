<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合スケジュール - Football Hub Japan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #00ff88;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .schedule-controls {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .control-select {
            background: #2a2a2a;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
        }

        .control-select:focus {
            outline: none;
            border-color: #00ff88;
        }

        .control-button {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .control-button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .match-card {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .match-card:hover {
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333333;
        }

        .match-league {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .match-time {
            color: #888888;
            font-size: 0.9rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .team-name {
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: #333333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .match-score {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .match-venue {
            color: #888888;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
        }

        .match-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-finished {
            background: #00ff88;
            color: #000000;
        }

        .status-scheduled {
            background: #ffaa00;
            color: #000000;
        }

        .status-live {
            background: #ff4444;
            color: #ffffff;
        }

        .loading {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .error {
            text-align: center;
            color: #ff4444;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .no-matches {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        @media (max-width: 768px) {
            .schedule-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-select {
                min-width: auto;
            }

            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .match-teams {
                flex-direction: column;
                gap: 1rem;
            }

            .match-score {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/dashboard" class="logo">⚽ Football Hub Japan</a>
        <nav class="nav-links">
            <a href="/dashboard" class="nav-link">ダッシュボード</a>
            <a href="/database-enhanced" class="nav-link">データベース</a>
            <a href="/radar" class="nav-link">レーダーチャート</a>
            <a href="/ai-agent" class="nav-link">AIエージェント</a>
        </nav>
    </header>

    <div class="main-container">
        <h1 class="page-title">試合スケジュール</h1>
        <p class="page-subtitle">お気に入りのチームや選手の試合スケジュールを一覧表示</p>

        <div class="schedule-controls">
            <div class="control-group">
                <label class="control-label">リーグ</label>
                <select class="control-select" id="leagueSelect">
                    <option value="">すべてのリーグ</option>
                    <option value="PL">プレミアリーグ</option>
                    <option value="PD">ラ・リーガ</option>
                    <option value="SA">セリエA</option>
                    <option value="BL1">ブンデスリーガ</option>
                    <option value="FL1">リーグ・アン</option>
                    <option value="J1">J1リーグ</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">期間</label>
                <select class="control-select" id="timeRangeSelect">
                    <option value="today">今日</option>
                    <option value="tomorrow">明日</option>
                    <option value="week" selected>今週</option>
                    <option value="month">今月</option>
                </select>
            </div>

            <button class="control-button" onclick="loadMatches()">試合を表示</button>
        </div>

        <div id="scheduleContent">
            <div class="loading">試合データを読み込み中...</div>
        </div>
    </div>

    <script src="/ai-widget.js"></script>
    <script>
        let currentMatches = [];

        // ページ読み込み時に試合を表示
        document.addEventListener('DOMContentLoaded', function() {
            loadMatches();
        });

        // 試合データを読み込む
        async function loadMatches() {
            const league = document.getElementById('leagueSelect').value;
            const timeRange = document.getElementById('timeRangeSelect').value;
            
            console.log('Loading matches with:', { league, timeRange });
            
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '<div class="loading">試合データを読み込み中...</div>';

            try {
                const response = await fetch(`/api/fotmob/matches?league=${league}&timeRange=${timeRange}`);
                console.log('API Response status:', response.status);
                console.log('API Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // 生のレスポンステキストを確認
                const responseText = await response.text();
                console.log('Raw response text:', responseText);
                
                // JSONとしてパース
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('Parsed JSON data:', data);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    throw new Error(`JSON parse error: ${parseError.message}`);
                }
                
                if (data && data.matches && Array.isArray(data.matches) && data.matches.length > 0) {
                    console.log('Found matches:', data.matches.length);
                    currentMatches = data.matches;
                    displayMatches(data.matches);
                } else {
                    console.log('No matches found in response. Response structure:', data);
                    console.log('Data type:', typeof data);
                    console.log('Data keys:', data ? Object.keys(data) : 'null/undefined');
                    
                    contentDiv.innerHTML = `
                        <div class="no-matches">
                            <p>指定された条件に一致する試合が見つかりませんでした。</p>
                            <p>レスポンス構造: ${JSON.stringify(data, null, 2)}</p>
                            <p>データ型: ${typeof data}</p>
                            <p>キー: ${data ? Object.keys(data).join(', ') : 'null/undefined'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading matches:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <p>試合データの読み込みに失敗しました。</p>
                        <p>エラー: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 試合を表示
        function displayMatches(matches) {
            const contentDiv = document.getElementById('scheduleContent');
            
            if (matches.length === 0) {
                contentDiv.innerHTML = '<div class="no-matches">試合が見つかりませんでした。</div>';
                return;
            }

            const matchesHtml = matches.map(match => {
                const matchDate = new Date(match.date);
                const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                const dateString = matchDate.toLocaleDateString('ja-JP', { 
                    month: 'short', 
                    day: 'numeric' 
                });

                // スコアの表示を改善
                const homeScore = match.homeScore !== null ? match.homeScore : '-';
                const awayScore = match.awayScore !== null ? match.awayScore : '-';
                
                // 試合の状態に応じた表示
                let statusDisplay = '';
                let scoreDisplay = '';
                
                if (match.status === 'TIMED' || match.status === 'Scheduled') {
                    statusDisplay = '予定';
                    scoreDisplay = `<span class="text-gray-400">vs</span>`;
                } else if (match.status === 'Finished' || match.status === 'FT') {
                    statusDisplay = '終了';
                    scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                } else if (match.status === 'LIVE' || match.status === 'HT') {
                    statusDisplay = '試合中';
                    scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;
                } else {
                    statusDisplay = match.status || '未定';
                    scoreDisplay = `<span class="text-gray-400">vs</span>`;
                }
                
                const matchHtml = `
                    <div class="bg-gray-800 rounded-lg p-4 mb-4 border border-gray-700">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div class="text-sm text-gray-400">${match.league}</div>
                                <div class="text-xs text-gray-500">${statusDisplay}</div>
                            </div>
                            <div class="text-xs text-gray-400">${dateString} ${timeString}</div>
                        </div>
                        <div class="flex items-center justify-between mt-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center text-xs font-bold">${match.homeTeam.charAt(0)}</div>
                                <div class="text-white">${match.homeTeam}</div>
                            </div>
                            <div class="text-center">
                                ${scoreDisplay}
                            </div>
                            <div class="flex items-center space-x-3">
                                <div class="text-white">${match.awayTeam}</div>
                                <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center text-xs font-bold">${match.awayTeam.charAt(0)}</div>
                            </div>
                        </div>
                        ${match.venue && match.venue !== 'Unknown' ? `<div class="text-xs text-gray-500 mt-2 text-center">${match.venue}</div>` : ''}
                    </div>
                `;

                return matchHtml;
            }).join('');

            contentDiv.innerHTML = `<div class="schedule-grid">${matchesHtml}</div>`;
        }

        // リーグ名を取得
        function getLeagueName(leagueCode) {
            const leagueNames = {
                'PL': 'プレミアリーグ',
                'PD': 'ラ・リーガ',
                'SA': 'セリエA',
                'BL1': 'ブンデスリーガ',
                'FL1': 'リーグ・アン',
                'J1': 'J1リーグ'
            };
            return leagueNames[leagueCode] || leagueCode;
        }

        // ステータスクラスを取得
        function getStatusClass(status) {
            switch (status) {
                case 'Finished':
                    return 'status-finished';
                case 'Scheduled':
                    return 'status-scheduled';
                case 'Live':
                    return 'status-live';
                default:
                    return 'status-scheduled';
            }
        }

        // ステータステキストを取得
        function getStatusText(status) {
            switch (status) {
                case 'Finished':
                    return '終了';
                case 'Scheduled':
                    return '予定';
                case 'Live':
                    return '生中継';
                default:
                    return '予定';
            }
        }
    </script>
</body>
</html>
