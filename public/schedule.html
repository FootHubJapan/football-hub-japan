<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合スケジュール - Football Hub Japan</title>
    
    <!-- 日本語フォントの"豆腐"対策 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #00ff88;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .schedule-controls {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .control-select {
            background: #2a2a2a;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
        }

        .control-select:focus {
            outline: none;
            border-color: #00ff88;
        }

        .control-button {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .control-button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .match-card {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 2px solid #4CAF50;
            border-radius: 15px;
            padding: 20px;
            margin: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .match-card:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* モーダルスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background-color: #1a1a1a;
            margin: 5% auto;
            padding: 0;
            border: 1px solid #4CAF50;
            border-radius: 12px;
            width: 90%;
            max-width: none;
            min-width: 800px;
            max-height: 90vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 20px;
        }

        .close:hover,
        .close:focus {
            color: #4CAF50;
        }

        .match-detail-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
        }

        .match-detail-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
            font-size: 24px;
            font-weight: bold;
        }

        .match-detail-score {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .match-detail-item {
            background-color: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }

        .match-detail-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }

        .match-detail-value {
            font-size: 16px;
            color: white;
            font-weight: bold;
        }

        .match-detail-status {
            text-align: center;
            margin: 20px 0;
        }

        .match-detail-status .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 詳細ボタンスタイル */
        .detail-button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .detail-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        /* 大サイズモーダル */
        .large-modal {
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* タブコンテンツ */
        .tab-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* より具体的なセレクターで優先度を下げる */
        .modal-content .tab-pane {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .modal-content .tab-pane.active {
            display: block;
            position: relative;
        }

        /* 強制表示用のスタイル */
        .modal-content .tab-pane[style*="display: block"] {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            min-height: 250px !important;
            width: 100% !important;
            overflow: visible !important;
        }

        /* タブペイン内のコンテナを確実に表示 */
        .modal-content .tab-pane .stats-container,
        .modal-content .tab-pane .events-container,
        .modal-content .tab-pane .lineup-container {
            display: block !important;
            min-height: 200px !important;
            width: 100% !important;
            padding: 20px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            border-radius: 8px !important;
            overflow: visible !important;
            position: relative !important;
        }

        /* モーダル全体の寸法制限を解除 */
        .modal-content {
            max-height: none !important;
            overflow: visible !important;
        }

        /* タブボタンのスタイル調整 */
        .tab-button {
            background: #333333;
            color: #cccccc;
            border: none;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-right: 5px;
        }

        .tab-button:hover {
            background: #4CAF50;
            color: #000000;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: #4CAF50;
            color: #000000;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.3);
        }

        /* ラインアップセクション */
        .lineup-section {
            margin-bottom: 30px;
        }

        .lineup-section h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .lineup-players {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .lineup-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .lineup-item:hover {
            background: rgba(76, 175, 80, 0.2);
            transform: translateY(-2px);
        }

        .lineup-position {
            color: #4CAF50;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .lineup-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* データなし表示 */
        .no-data {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 40px;
            font-size: 18px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333333;
        }

        .match-league {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .match-time {
            color: #888888;
            font-size: 0.9rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .team-name {
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: #333333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .match-score {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .match-venue {
            color: #888888;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
        }

        .match-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-finished {
            background: #00ff88;
            color: #000000;
        }

        .status-scheduled {
            background: #ffaa00;
            color: #000000;
        }

        .status-live {
            background: #ff4444;
            color: #ffffff;
        }

        .status-postponed {
            background: #9C27B0;
            color: #ffffff;
        }

        .status-cancelled {
            background: #607D8B;
            color: #ffffff;
        }

        .data-source-info {
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .source-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #00ff88;
        }

        .source-icon {
            font-size: 1.2rem;
        }

        .source-text {
            font-weight: 500;
        }

        .loading {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .error {
            text-align: center;
            color: #ff4444;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .no-matches {
            text-align: center;
            color: #888888;
            font-size: 1.2rem;
            padding: 3rem;
        }

        /* タブスタイル */
        .tab-navigation {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            z-index: 10;
            border-bottom: 2px solid #4CAF50;
            flex-shrink: 0;
        }

        .tab-button {
            background: #333333;
            color: #cccccc;
            border: none;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-button:hover {
            background: #4CAF50;
            color: #000000;
        }

        .tab-button.active {
            background: #4CAF50;
            color: #000000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 統計とイベントの基本スタイル（重複を削除） */

        .event-player {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .event-team {
            color: #ccc;
            font-size: 12px;
            margin-top: 2px;
        }

        .event-assist {
            color: #4CAF50;
            font-size: 12px;
            margin-top: 2px;
        }

        /* ラインアップスタイル */
        .lineup-container {
            max-height: 60vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .lineup-item {
            background: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .lineup-position {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .lineup-name {
            font-size: 1rem;
            font-weight: bold;
            color: #00ff88;
        }

        /* イベントヘッダー */
        .events-header {
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 15px;
        }

        .events-header h3 {
            color: #4CAF50;
            margin: 0;
            font-size: 18px;
        }

        /* イベントリスト */
        .events-list {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* イベントリストのスクロールバー */
        .events-list::-webkit-scrollbar {
            width: 8px;
        }

        .events-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .events-list::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 4px;
        }

        .events-list::-webkit-scrollbar-thumb:hover {
            background: #45a049;
        }

        @media (max-width: 768px) {
            .schedule-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-select {
                min-width: auto;
            }

            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .match-teams {
                flex-direction: column;
                gap: 1rem;
            }

            .match-score {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        .lineup-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* FotMobスタイルの新しいデザイン */
        .fotmob-style {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .team-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(76, 175, 80, 0.3);
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .team-logo {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .team-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .team-logo-fallback {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .team-details {
            flex: 1;
        }

        .team-name {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 5px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .team-formation {
            color: #4CAF50;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-rating {
            color: #FFD700;
            font-size: 18px;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: inline-block;
        }

        .fotmob-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .player-card.fotmob-player {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(76, 175, 80, 0.4);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .player-card.fotmob-player:hover {
            background: rgba(76, 175, 80, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
            border-color: #4CAF50;
        }

        .player-card.fotmob-player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4CAF50, #45a049);
        }

        .player-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            min-width: 30px;
            text-align: center;
        }

        .rating-excellent {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .rating-good {
            background: linear-gradient(135deg, #FF9800, #F57C00);
        }

        .rating-average {
            background: linear-gradient(135deg, #FF5722, #D84315);
        }

        .player-avatar {
            width: 38px; /* 42pxから38pxに縮小 */
            height: 38px; /* 42pxから38pxに縮小 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .player-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .player-initial {
            color: white;
            font-weight: bold;
            font-size: 14px; /* 16pxから14pxに縮小 */
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .player-number {
            position: absolute;
            top: -6px; /* -8pxから-6pxに調整 */
            left: -6px; /* -8pxから-6pxに調整 */
            background: rgba(76, 175, 80, 0.9);
            color: white;
            width: 20px; /* 22pxから20pxに縮小 */
            height: 20px; /* 22pxから20pxに縮小 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px; /* 11pxから10pxに縮小 */
            font-weight: bold;
            border: 2px solid white;
            z-index: 25;
        }

        .player-name {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 8px; /* 9pxから8pxに縮小 */
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            margin-top: 10px; /* 8pxから10pxに増加 */
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 20;
            max-width: 70px; /* 80pxから70pxに縮小 */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-number-display {
            position: absolute;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 7px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            margin-top: 5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        .player-position {
            color: #4CAF50;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(76, 175, 80, 0.1);
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;

    <script>
        let currentMatches = [];

        // イベントリスナーを設定
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Setting up tab functionality...');
            
            // タブボタンにイベントリスナーを追加
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabPanes = document.querySelectorAll('.tab-pane');
            
            console.log('Found tab buttons:', tabButtons.length);
            console.log('Found tab panes:', tabPanes.length);
            
            // デバッグ用：タブペインの詳細情報をログ出力
            tabPanes.forEach((pane, index) => {
                console.log(`Tab pane ${index}:`, {
                    id: pane.id,
                    classes: pane.className,
                    display: pane.style.display,
                    computedDisplay: window.getComputedStyle(pane).display,
                    offsetHeight: pane.offsetHeight,
                    offsetWidth: pane.offsetWidth,
                    innerHTML: pane.innerHTML.substring(0, 100) + '...'
                });
            });
            
            // スクロールイベントの伝播を防ぐ
            const scrollableContainers = document.querySelectorAll('.basic-info.fotmob-style, .stats-container, .events-container, .lineup-container, .formation-display, .lineup-players.fotmob-grid');
            scrollableContainers.forEach(container => {
                container.addEventListener('wheel', function(e) {
                    e.stopPropagation();
                });
                
                container.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                });
                
                container.addEventListener('touchmove', function(e) {
                    e.stopPropagation();
                });
            });
            
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');
                    console.log('Tab clicked:', targetTab);
                    
                    // アクティブなタブボタンを更新
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // タブペインを更新
                    tabPanes.forEach(pane => {
                        pane.classList.remove('active');
                        console.log('Removing active class from:', pane.id);
                    });
                    
                    const targetPane = document.getElementById(targetTab);
                    if (targetPane) {
                        targetPane.classList.add('active');
                        console.log('Added active class to:', targetPane.id);
                        
                        // スクロール位置をリセット
                        targetPane.scrollTop = 0;
                        
                        // タブコンテンツの表示状態を確認
                        console.log('Target pane display style before:', targetPane.style.display);
                        console.log('Target pane classes:', targetPane.className);
                        console.log('Target pane computed display:', window.getComputedStyle(targetPane).display);
                        console.log('Target pane offset dimensions:', targetPane.offsetWidth, 'x', targetPane.offsetHeight);
                        
                        // モーダル全体の寸法を強制制御
                        const modalContent = targetPane.closest('.modal-content');
                        if (modalContent) {
                            modalContent.style.cssText = 'width: 90% !important; max-width: none !important; min-width: 800px !important; overflow: visible !important; position: relative !important;';
                        }
                        
                        // 強力に表示（CSSの優先度を上書き）
                        targetPane.style.cssText = 'display: block !important; opacity: 1 !important; visibility: visible !important; height: auto !important; width: 100% !important; min-height: 250px !important; position: relative !important; overflow: hidden !important;';
                        
                        // タブペイン内のコンテナも強制表示
                        const containers = targetPane.querySelectorAll('.stats-container, .events-container, .lineup-container');
                        containers.forEach(container => {
                            container.style.cssText = 'display: block !important; min-height: 200px !important; width: 100% !important; padding: 20px !important; background: rgba(255, 255, 255, 0.05) !important; border-radius: 8px !important; overflow: visible !important; position: relative !important; max-height: 60vh !important; overflow-y: auto !important; overflow-x: hidden !important;';
                        });
                        
                        // 基本情報タブのコンテナも強制設定
                        const basicInfoContainer = targetPane.querySelector('.basic-info.fotmob-style');
                        if (basicInfoContainer) {
                            basicInfoContainer.style.cssText = 'max-height: 60vh !important; overflow-y: auto !important; overflow-x: hidden !important; padding: 20px !important; background: rgba(255, 255, 255, 0.05) !important; border-radius: 8px !important; border: 1px solid rgba(76, 175, 80, 0.3) !important;';
                            
                            // カスタムスクロールバーを強制適用
                            basicInfoContainer.style.setProperty('--scrollbar-width', '8px', 'important');
                            basicInfoContainer.style.setProperty('--scrollbar-track-color', 'rgba(255, 255, 255, 0.1)', 'important');
                            basicInfoContainer.style.setProperty('--scrollbar-thumb-color', 'rgba(76, 175, 80, 0.6)', 'important');
                        }
                        
                        // フォーメーション表示も強制設定
                        const formationDisplay = targetPane.querySelector('.formation-display');
                        if (formationDisplay) {
                            formationDisplay.style.cssText = 'margin-top: 20px !important; padding: 20px !important; background: rgba(255, 255, 255, 0.1) !important; border-radius: 10px !important; max-height: 40vh !important; overflow-y: auto !important; overflow-x: hidden !important;';
                            
                            // カスタムスクロールバーを強制適用
                            formationDisplay.style.setProperty('--scrollbar-width', '8px', 'important');
                            formationDisplay.style.setProperty('--scrollbar-track-color', 'rgba(255, 255, 255, 0.1)', 'important');
                            formationDisplay.style.setProperty('--scrollbar-thumb-color', 'rgba(76, 175, 80, 0.6)', 'important');
                        }
                        
                        // プレイヤーグリッドも強制設定
                        const lineupGrid = targetPane.querySelector('.lineup-players.fotmob-grid');
                        if (lineupGrid) {
                            lineupGrid.style.cssText = 'display: grid !important; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) !important; gap: 15px !important; margin-top: 20px !important; max-height: 30vh !important; overflow-y: auto !important; overflow-x: hidden !important;';
                            
                            // カスタムスクロールバーを強制適用
                            lineupGrid.style.setProperty('--scrollbar-width', '8px', 'important');
                            lineupGrid.style.setProperty('--scrollbar-track-color', 'rgba(255, 255, 255, 0.1)', 'important');
                            lineupGrid.style.setProperty('--scrollbar-thumb-color', 'rgba(76, 175, 80, 0.6)', 'important');
                        }
                        
                        // 親要素の寸法制限も解除
                        const tabContent = targetPane.closest('.tab-content');
                        if (tabContent) {
                            tabContent.style.cssText = 'min-height: 300px !important; width: 100% !important; height: auto !important; overflow: hidden !important; position: relative !important; display: block !important;';
                        }
                        
                        // 他のタブペインを強力に非表示
                        tabPanes.forEach(pane => {

        // 試合データを読み込む
        async function loadMatches() {
            const league = document.getElementById('leagueSelect').value;
            const timeRange = document.getElementById('timeRangeSelect').value;
            const season = document.getElementById('seasonSelect').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            console.log('🚀 loadMatches called with:', { league, timeRange, season, searchTerm, statusFilter });
            console.log('🔍 About to call integrated API...');
            
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '<div class="loading">試合データを読み込み中...</div>';

            try {
                // 統合されたデータを優先的に使用
                let response;
                let dataSource = 'integrated';
                
                try {
                    // まず統合データを試す
                    // リーグコードを新しいAPI形式にマッピング
                    const leagueMapping = {
                        'PL': 'premierLeague',
                        'PD': 'laLiga',
                        'SA': 'serieA',
                        'BL1': 'bundesliga',
                        'FL1': 'ligue1',
                        'J1': 'j1',
                        'CL': 'championsLeague',
                        'EL': 'europaLeague',
                        'ECL': 'conferenceLeague'
                    };
                    
                    const mappedLeague = leagueMapping[league] || league;
                    const leagueParam = mappedLeague ? `&league=${encodeURIComponent(mappedLeague)}` : '';
                    const statusParam = statusFilter ? `&status=${encodeURIComponent(statusFilter)}` : '';
                    const seasonParam = season ? `&season=${encodeURIComponent(season)}` : '';
                    
                    console.log('🔄 統合APIを呼び出し中...');
                    console.log('🔍 リーグマッピング:', league, '→', mappedLeague);
                    const integratedUrl = `/api/schedule?season=${season}${leagueParam}${statusParam}`;
                    console.log('📡 統合API URL:', integratedUrl);
                    console.log('📡 パラメータ詳細:', { season, leagueParam, statusParam });
                    response = await fetch(integratedUrl, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        signal: AbortSignal.timeout(30000) // 30秒のタイムアウト
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Integrated API error! status: ${response.status}`);
                    }
                    
                    const responseText = await response.text();
                    console.log('✅ 統合API レスポンス取得成功');
                    console.log('レスポンスサイズ:', responseText.length, '文字');
                    
                    data = JSON.parse(responseText);
                    console.log('📊 統合データ解析成功:', data.items?.length || 0, '件のマッチ');
                    console.log('📊 データソース:', data.source);
                    
                    // 新しいAPI形式に合わせてデータを変換
                    if (data.items) {
                        data.matches = data.items;
                    }
                    
                } catch (integratedError) {
                    console.log('⚠️ 統合API失敗:', integratedError.message);
                    console.log('🔍 統合APIエラーの詳細:', integratedError);
                    
                    // フォールバックデータは使用しない
                    console.log('❌ APIデータが取得できませんでした。データを表示しません。');
                    throw new Error('APIデータの取得に失敗しました');
                }
                
                if (data && data.matches && Array.isArray(data.matches) && data.matches.length > 0) {
                  console.log(`Found matches from ${dataSource}:`, data.matches.length);
                  console.log('🔍 最初のマッチのデータ構造:', data.matches[0]);
                  currentMatches = data.matches;
                  
                  // データソースを更新
                  dataSource = data.dataSource || dataSource;
                    
                    // データソース情報を表示（新しいAPI形式に対応）
                  const dataSourceInfo = document.createElement('div');
                  dataSourceInfo.className = 'data-source-info';
                  
                  // サーバーのsourceプロパティを優先使用（フォールバック判定の修正）
                  const actualSource = data.source || 'fallback';
                  const totalCount = data.total || data.matches.length;
                  const limitedCount = data.limited;
                  
                  console.log('🔍 データソース判定:', { 
                      serverSource: data.source, 
                      actualSource, 
                      matchesCount: data.matches.length,
                      totalCount 
                  });
                  
                  dataSourceInfo.innerHTML = `
                      <div class="source-badge">
                          <span class="source-icon">${actualSource === 'live' ? '🔗' : actualSource === 'cache' ? '💾' : actualSource === 'api-football' ? '⚽' : actualSource === 'football-data' ? '🌐' : '📁'}</span>
                          <span class="source-text">${actualSource === 'live' ? 
                              `統合データ (API-Football + Football-data.org) - ${data.matches.length}件表示${limitedCount ? ` (全${totalCount}件中)` : ''}` : 
                              actualSource === 'cache' ?
                              `キャッシュデータ - ${data.matches.length}件表示${limitedCount ? ` (全${totalCount}件中)` : ''}` :
                              actualSource === 'api-football' ? 
                              `API-Football (リアルタイム) - ${data.matches.length}件表示${limitedCount ? ` (全${totalCount}件中)` : ''}` :
                              actualSource === 'football-data' ? 
                              `Football-data.org (リアルタイム) - ${data.matches.length}件表示${limitedCount ? ` (全${totalCount}件中)` : ''}` :
                              actualSource === 'error' ?
                              `❌ APIデータ取得エラー - ${data.matches.length}件表示${limitedCount ? ` (全${totalCount}件中)` : ''}` :
                              `データ - ${data.matches.length}件表示${limitedCount ? ` (全${totalCount}件中)` : ''}`}</span>
                      </div>
                  `;
                    
                    // フィルタリングを適用
                    const filteredMatches = filterMatches(currentMatches, league, timeRange, searchTerm, statusFilter);
                    
                    console.log(`🔍 フィルタリング結果: ${currentMatches.length} → ${filteredMatches.length}件`);
                    console.log('🔍 フィルタリング条件:', { league, timeRange, searchTerm, statusFilter });
                    
                    if (filteredMatches.length === 0) {
                        contentDiv.innerHTML = '<div class="no-matches">条件に一致する試合が見つかりませんでした。</div>';
                        return;
                    }
                    
                    // 試合カードを生成
                    const matchesHtml = filteredMatches.map(match => {
                        // 日付の正規化と表示（Invalid Date対策）
                        const parseUtcDate = (dateStr) => {
                            if (!dateStr) return null;
                            const date = new Date(dateStr);
                            return isNaN(date.getTime()) ? null : date;
                        };
                        
                        // 複数の日付フィールドをチェック
                        const matchDate = parseUtcDate(match.date || match.utcDate || match.matchDate || match.fixture?.date);
                        const timeString = matchDate ? matchDate.toLocaleTimeString('ja-JP', { 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        }) : '時間未定';
                        const dateString = matchDate ? matchDate.toLocaleDateString('ja-JP', { 
                            month: 'short', 
                            day: 'numeric' 
                        }) : '日付未定';

                        // スコアの表示（統合APIとAPI-Footballの両方に対応）
                        const homeScore = match.score?.fullTime?.home ?? match.homeScore;
                        const awayScore = match.score?.fullTime?.away ?? match.awayScore;
                        
                        // チーム名の取得（複数のフィールドをチェック）
                        const homeTeamName = typeof match.homeTeam === 'string' ? match.homeTeam : 
                                            match.homeTeam?.name || 
                                            match.homeTeam?.team?.name || 
                                            match.teams?.home?.name || 
                                            'Unknown';
                        const awayTeamName = typeof match.awayTeam === 'string' ? match.awayTeam : 
                                            match.awayTeam?.name || 
                                            match.awayTeam?.team?.name || 
                                            match.teams?.away?.name || 
                                            'Unknown';
                        
                        // 会場の正規化（複数のフィールドをチェック）
                        const venueName = match.venue?.name || 
                                         match.venue || 
                                         match.fixture?.venue?.name || 
                                         '会場未定';
                        
                        // 試合の状態に応じた表示
                        const matchStatus = getMatchStatus(match);
                        let statusDisplay = matchStatus;
                        let scoreDisplay = '';
                        
                        if (matchStatus === '終了') {
                            scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                        } else if (matchStatus === '試合中') {
                            scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;
                        } else {
                            scoreDisplay = `<span class="text-gray-400">-</span>`;
                        }
                        
                        const matchHtml = `
                                <div class="match-card" onclick="showDetailedMatchInfo('${match.id || match.matchId || 'unknown'}', '${match.leagueName || match.league}')">
                                    <div class="match-header">
                                        <span class="match-league">${getLeagueName(match.leagueName || match.league)} ${match.season ? `(${match.season})` : ''}</span>
                                        <span class="match-status ${getStatusClass(match.status)}">${getStatusText(match.status)}</span>
                                    </div>
                                    
                                    <div class="match-teams">
                                        <div class="team">
                                            <div class="team-logo">
                                                <img src="https://media.api-sports.io/football/teams/${getTeamId(homeTeamName)}.png" alt="${homeTeamName}" class="team-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                                <div class="team-logo-fallback">${homeTeamName.charAt(0)}</div>
                                            </div>
                                            <div class="team-name">${homeTeamName}</div>
                                        </div>
                                        
                                        <div class="match-score">
                                            <span>${homeScore !== undefined && homeScore !== null ? homeScore : ''}</span>
                                            <span>${homeScore !== undefined && homeScore !== null && awayScore !== undefined && awayScore !== null ? '-' : ''}</span>
                                            <span>${awayScore !== undefined && awayScore !== null ? awayScore : ''}</span>
                                        </div>
                                        
                                        <div class="team">
                                            <div class="team-logo">
                                                <img src="https://media.api-sports.io/football/teams/${getTeamId(awayTeamName)}.png" alt="${awayTeamName}" class="team-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                                <div class="team-logo-fallback">${awayTeamName.charAt(0)}</div>
                                            </div>
                                            <div class="team-name">${awayTeamName}</div>
                                        </div>
                                    </div>
                                    
                                    <div class="match-venue">${venueName}</div>
                                    <div class="match-time">${dateString} ${timeString}</div>
                                </div>
                            `;

                        return matchHtml;
                    }).join('');

                    // データソース情報と試合カードを表示
                    contentDiv.innerHTML = dataSourceInfo.outerHTML + `<div class="schedule-grid">${matchesHtml}</div>`;
                } else {
                    console.log('No matches found in response. Response structure:', data);
                    console.log('Data type:', typeof data);
                    console.log('Data keys:', data ? Object.keys(data) : 'null/undefined');
                    
                    contentDiv.innerHTML = `
                        <div class="no-matches">
                            <p>指定された条件に一致する試合が見つかりませんでした。</p>
                            <p>レスポンス構造: ${JSON.stringify(data, null, 2)}</p>
                            <p>データ型: ${typeof data}</p>
                            <p>キー: ${data ? Object.keys(data).join(', ') : 'null/undefined'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading matches:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <p>試合データの読み込みに失敗しました。</p>
                        <p>エラー: ${error.message}</p>
                        <p>API制限の可能性があります。しばらく時間をおいてから再度お試しください。</p>
                    </div>
                `;
            }
        }

        // 試合を表示
        function displayMatches(matches) {
            const contentDiv = document.getElementById('scheduleContent');
            
            if (matches.length === 0) {
                contentDiv.innerHTML = '<div class="no-matches">試合が見つかりませんでした。</div>';
                return;
            }

            const matchesHtml = matches.map(match => {
                const matchDate = new Date(match.date);
                const timeString = matchDate.toLocaleTimeString('ja-JP', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                const dateString = matchDate.toLocaleDateString('ja-JP', { 
                    month: 'short', 
                    day: 'numeric' 
                });

                // スコアの表示を元のnull表示に戻す
                const homeScore = match.homeScore;
                const awayScore = match.awayScore;
                
                // 試合の状態に応じた表示
                let statusDisplay = '';
                let scoreDisplay = '';
                
                if (match.status === 'TIMED' || match.status === 'Scheduled') {

                    scoreDisplay = `<span class="text-gray-400">null</span>`;

                    statusDisplay = '終了';
                    scoreDisplay = `<span class="text-white font-bold">${homeScore} - ${awayScore}</span>`;
                } else if (match.status === 'LIVE' || match.status === 'HT') {
                    statusDisplay = '試合中';
                    scoreDisplay = `<span class="text-green-400 font-bold">${homeScore} - ${awayScore}</span>`;

                    statusDisplay = match.status || '未定';
                    scoreDisplay = `<span class="text-gray-400">null</span>`;

                            <div class="match-teams">
                                <div class="team">

                                    <span>${match.homeScore !== undefined && match.homeScore !== null && match.awayScore !== undefined && match.awayScore !== null ? '-' : ''}</span>
                                    <span>${match.awayScore !== undefined && match.awayScore !== null ? match.awayScore : ''}</span>

        // ステータスクラスを取得
        function getStatusClass(status) {
            console.log('Getting status class for:', status);
            
            switch (status) {
                case 'Finished':
                case 'FT':
                case 'FINISHED':
                    return 'status-finished';
                case 'Scheduled':
                case 'NS':
                case 'NOT_STARTED':
                    return 'status-scheduled';
                case 'Live':
                case 'LIVE':
                case 'IN_PLAY':
                    return 'status-live';
                case 'HT':
                case 'HALF_TIME':
                    return 'status-live';
                case 'POSTPONED':
                    return 'status-postponed';
                case 'CANCELLED':
                    return 'status-cancelled';
                default:
                    console.log('Unknown status class:', status, 'defaulting to status-scheduled');
                    return 'status-scheduled';
            }
        }

        // ステータステキストを取得
        function getStatusText(status) {
            console.log('Getting status text for:', status);
            
            switch (status) {
                case 'Finished':
                case 'FT':
                case 'FINISHED':
                    return '終了';
                case 'Scheduled':
                case 'NS':
                case 'NOT_STARTED':
                    return '予定';
                case 'Live':
                case 'LIVE':
                case 'IN_PLAY':
                    return '生中継';
                case 'HT':
                case 'HALF_TIME':
                    return 'ハーフタイム';
                case 'POSTPONED':
                    return '延期';
                case 'CANCELLED':
                    return '中止';
                default:
                    console.log('Unknown status:', status, 'defaulting to 予定');
                    return '予定';
            }
        }

        // リーグ名を取得
        function getLeagueName(leagueCode) {
            const leagueNames = {
                'PL': 'プレミアリーグ',
                'PD': 'ラ・リーガ',
                'SA': 'セリエA',
                'BL1': 'ブンデスリーガ',
                'FL1': 'リーグ・アン',
                'J1': 'J1リーグ',
                'CL': 'チャンピオンズリーグ',
                'EL': 'ヨーロッパリーグ',
                'ECL': 'ヨーロッパカンファレンスリーグ',
                'Serie A Brazil': 'ブラジル・セリエA',
                'MLS': 'メジャーリーグサッカー',
                'Liga MX': 'リーガMX',
                'Premier League': 'プレミアリーグ',
                'La Liga': 'ラ・リーガ',
                'Serie A': 'セリエA',
                'Bundesliga': 'ブンデスリーガ',
                'Ligue 1': 'リーグ・アン',
                'J1 League': 'J1リーグ',
                'UEFA Champions League': 'チャンピオンズリーグ',
                'UEFA Europa League': 'ヨーロッパリーグ',
                'UEFA Europa Conference League': 'ヨーロッパカンファレンスリーグ'
            };
            return leagueNames[leagueCode] || leagueCode;
        }

        // 試合ステータスを取得
        function getMatchStatus(match) {
            const now = new Date();
            const matchDate = new Date(match.date);
            const matchTime = matchDate.getTime();
            const currentTime = now.getTime();
            
            // 試合開始時刻から90分後（試合終了想定時刻）
            const matchEndTime = matchTime + (90 * 60 * 1000);
            
            if (match.status === 'finished' || match.status === 'FT') {
                return '終了';
            } else if (match.status === 'live' || match.status === 'inplay') {
                return '試合中';
            } else if (matchTime <= currentTime && currentTime <= matchEndTime) {
                return '試合中';
            } else if (matchTime > currentTime) {
                return '予定';
            } else {
                return '終了';
            }
        }

        // 試合データをフィルタリング
        function filterMatches(matches, league, timeRange, searchTerm, statusFilter) {
            let filteredMatches = matches;
            console.log(`🔍 フィルタリング開始: ${matches.length}件のマッチ`);
            
            // リーグでフィルタリング
            if (league && league !== '') {
                const beforeCount = filteredMatches.length;
                filteredMatches = filteredMatches.filter(match => {
                    const matchLeague = match.leagueName || match.league || '';
                    const leagueLower = league.toLowerCase();
                    const matchLeagueLower = matchLeague.toLowerCase();
                    
                    // 完全一致
                    if (matchLeague === league || matchLeagueLower === leagueLower) {
                        return true;
                    }
                    
                    // チャンピオンズリーグの特別処理
                    if (league === 'CL' || league === 'Champions League') {
                        return matchLeagueLower.includes('champions') || 
                               matchLeagueLower.includes('uefa') ||
                               matchLeagueLower.includes('cl');
                    }
                    
                    // 部分一致
                    return matchLeagueLower.includes(leagueLower) || 
                           leagueLower.includes(matchLeagueLower);
                });
                console.log(`🔍 リーグフィルタリング: ${beforeCount} → ${filteredMatches.length}件 (リーグ: ${league})`);
            }
            
            // ステータスでフィルタリング
            if (statusFilter && statusFilter !== '') {
                filteredMatches = filteredMatches.filter(match => {
                    const matchStatus = getMatchStatus(match);
                    return matchStatus === statusFilter;
                });
            }
            
            // 検索語でフィルタリング
            if (searchTerm && searchTerm.trim() !== '') {
                filteredMatches = filteredMatches.filter(match => {
                    // homeTeamとawayTeamがオブジェクトの場合と文字列の場合を考慮
                    const homeTeamName = typeof match.homeTeam === 'string' ? match.homeTeam : match.homeTeam?.name || '';
                    const awayTeamName = typeof match.awayTeam === 'string' ? match.awayTeam : match.awayTeam?.name || '';
                    const venue = match.venue ? match.venue.toLowerCase() : '';
                    
                    return homeTeamName.toLowerCase().includes(searchTerm) || 
                           awayTeamName.toLowerCase().includes(searchTerm) || 
                           venue.includes(searchTerm);
                });
            }
            
            return filteredMatches;
        }

        // 得点者リストを生成する関数
        function generateScorersList(matchData) {
            console.log('Generating scorers list with matchData:', matchData);
            
            if (!matchData.events || matchData.events.length === 0) {
                console.log('No events data available');
                return '<div class="no-data">得点者情報がありません</div>';
            }

            console.log('Available events:', matchData.events);
            
            // ゴールイベントをフィルタリング（複数のパターンに対応）
            const goals = matchData.events.filter(event => {
                const eventType = event.type || event.eventType || event.name;
                return eventType === 'Goal' || eventType === 'goal' || eventType === 'GOAL';
            });
            
            console.log('Filtered goals:', goals);
            
            if (goals.length === 0) {
                return '<div class="no-data">得点者情報がありません</div>';
            }

            return goals.map(goal => {
                // APIから取得したデータの構造に対応
                let playerName, team, time, detail;
                
                // プレイヤー名の取得を改善
                if (goal.player && typeof goal.player === 'object') {
                    // オブジェクトの場合（FotMob形式）
                    playerName = goal.player.name || goal.player.displayName || goal.player.firstName || '不明';
                    if (goal.player.lastName) {
                        playerName = `${playerName} ${goal.player.lastName}`;
                    }
                } else if (typeof goal.player === 'string') {
                    // 文字列の場合（API-Football形式）
                    playerName = goal.player;
                } else if (goal.scorer && typeof goal.scorer === 'object') {
                    // scorerオブジェクトがある場合
                    playerName = goal.scorer.name || goal.scorer.displayName || '不明';
                } else if (goal.scorer && typeof goal.scorer === 'string') {
                    // scorerが文字列の場合
                    playerName = goal.scorer;
                } else {
                    playerName = '不明';
                }
                
                // チーム名の取得を改善
                if (goal.team === 'home' || goal.team === 'Liverpool') {
                    team = matchData.homeTeam;
                } else if (goal.team === 'away' || goal.team === 'Bournemouth') {
                    team = matchData.awayTeam;
                } else if (goal.team && typeof goal.team === 'object') {
                    team = goal.team.name || goal.team.shortName || '不明';
                } else {
                    team = goal.team || '不明';
                }
                
                // 時間の取得を改善
                if (typeof goal.time === 'object' && goal.time.elapsed) {
                    time = goal.time.elapsed;
                } else if (typeof goal.time === 'number') {
                    time = goal.time;
                } else if (goal.minute) {
                    time = goal.minute;
                } else {
                    time = '?';
                }
                
                detail = goal.detail || goal.goalType || 'Normal Goal';
                
                console.log('Processing goal:', { playerName, team, time, detail, originalGoal: goal });
                
                return `
                    <div class="scorer-item">
                        <div class="scorer-info">
                            <span class="scorer-name">${playerName}</span>
                            <span class="scorer-team">${team}</span>
                        </div>
                        <div class="scorer-details">
                            <span class="scorer-time">${time}'</span>
                            <span class="scorer-type">${detail}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // フォーメーション配置の生成関数
        function generateFormationPositions(formation, players, team) {
            // フォーメーションごとのポジション配置マップ
            const formationMap = {
                '4-2-3-1': {
                    GK: { x: 10, y: 50 },
                    LB: { x: 20, y: 20 },
                    CB: { x: 20, y: 40 },
                    CB2: { x: 20, y: 60 },
                    RB: { x: 20, y: 80 },
                    DM: { x: 35, y: 50 },
                    CM: { x: 35, y: 35 },
                    CM2: { x: 35, y: 65 },
                    LW: { x: 50, y: 25 },
                    AM: { x: 50, y: 50 },
                    RW: { x: 50, y: 75 },
                    ST: { x: 65, y: 50 }
                },
                '4-1-4-1': {
                    GK: { x: 10, y: 50 },
                    LB: { x: 20, y: 20 },
                    CB: { x: 20, y: 40 },
                    CB2: { x: 20, y: 60 },
                    RB: { x: 20, y: 80 },
                    DM: { x: 35, y: 50 },
                    LM: { x: 50, y: 25 },
                    CM: { x: 50, y: 40 },
                    CM2: { x: 50, y: 60 },
                    RM: { x: 50, y: 75 },
                    ST: { x: 65, y: 50 }
                },
                '4-4-2': {
                    GK: { x: 10, y: 50 },
                    LB: { x: 20, y: 20 },
                    CB: { x: 20, y: 40 },
                    CB2: { x: 20, y: 60 },
                    RB: { x: 20, y: 80 },
                    LM: { x: 35, y: 25 },
                    CM: { x: 35, y: 40 },
                    CM2: { x: 35, y: 60 },
                    RM: { x: 35, y: 75 },
                    ST: { x: 50, y: 35 },
                    ST2: { x: 50, y: 65 }
                },
                '3-5-2': {
                    GK: { x: 10, y: 50 },
                    CB: { x: 20, y: 30 },
                    CB2: { x: 20, y: 50 },
                    CB3: { x: 20, y: 70 },
                    LWB: { x: 35, y: 20 },
                    CM: { x: 35, y: 40 },
                    CM2: { x: 35, y: 50 },
                    CM3: { x: 35, y: 60 },
                    RWB: { x: 35, y: 80 },
                    ST: { x: 50, y: 35 },
                    ST2: { x: 50, y: 65 }
                }
            };
            
            const positions = formationMap[formation] || formationMap['4-2-3-1'];
            let html = '';
            
            // プレイヤーをポジションに配置
            players.forEach((player, index) => {
                const playerName = player.player?.name || player.name || `Player ${index + 1}`;
                const playerPosition = player.player?.pos || player.position || player.pos || 'Unknown';
                
                // ポジションに応じた座標を取得
                let coords = null;
                if (playerPosition === 'GK') coords = positions.GK;
                else if (playerPosition === 'CB') coords = positions.CB;
                else if (playerPosition === 'LB') coords = positions.LB;
                else if (playerPosition === 'RB') coords = positions.RB;
                else if (playerPosition === 'DM') coords = positions.DM;
                else if (playerPosition === 'CM') coords = positions.CM;
                else if (playerPosition === 'LW' || playerPosition === 'LM') coords = positions.LW || positions.LM;
                else if (playerPosition === 'RW' || playerPosition === 'RM') coords = positions.RW || positions.RM;
                else if (playerPosition === 'ST') coords = positions.ST;
                else if (playerPosition === 'AM') coords = positions.AM;
                
                // デフォルト位置（フォーメーションに基づく）
                if (!coords) {
                    const defaultPositions = Object.values(positions);
                    coords = defaultPositions[index] || { x: 50, y: 50 };
                }
                
                // アウェイチームの場合は左右反転
                const x = team === 'away' ? (100 - coords.x) : coords.x;
                const y = coords.y;
                
                html += `
                    <div class="pitch-player" style="left: ${x}%; top: ${y}%;" title="${playerName} (${playerPosition})">
                        <div class="pitch-player-avatar">${playerName.charAt(0)}</div>
                        <div class="pitch-player-number">${index + 1}</div>
                    </div>
                `;
            });
            
            return html;
        }

                let playerPosition = '不明';
                let playerNumber = index + 1;

                // プレイヤー名の取得
                if (player.player && player.player.name && player.player.name !== 'UNKNOWN' && player.player.name !== 'Unknown' && player.player.name !== 'null' && player.player.name !== null) {
                    playerName = player.player.name;
                } else if (player.name && player.name !== 'UNKNOWN' && player.name !== 'Unknown' && player.name !== 'null' && player.name !== null) {
                    playerName = player.name;
                }
                
                // ポジション情報の取得
                if (player.player && player.player.pos && player.player.pos !== 'UNKNOWN' && player.player.pos !== 'Unknown' && player.player.pos !== 'null' && player.player.pos !== null) {
                    playerPosition = player.player.pos;
                } else if (player.position && player.position !== 'UNKNOWN' && player.position !== 'Unknown' && player.position !== 'null' && player.position !== null) {
                    playerPosition = player.position;
                }
                
                // 背番号の取得
                if (player.player && player.player.number && player.player.number !== 'UNKNOWN' && player.player.number !== 'Unknown' && player.player.number !== 'null' && player.player.number !== null) {
                    playerNumber = player.player.number;
                } else if (player.number && player.number !== 'UNKNOWN' && player.number !== 'Unknown' && player.number !== 'null' && player.number !== null) {
                    playerNumber = player.number;
                }
                
                // プレイヤー写真の取得（API-Footballのphotoフィールド）
                if (player.player && player.player.photo && player.player.photo !== 'UNKNOWN' && player.player.photo !== 'Unknown' && player.player.photo !== 'null' && player.player.photo !== null) {
                    playerPhoto = player.player.photo;
                } else if (player.photo && player.photo !== 'UNKNOWN' && player.photo !== 'Unknown' && player.photo !== 'null' && player.photo !== null) {
                    playerPhoto = player.photo;
                }
                
                // フォールバック: 顔写真がない場合は、プレイヤー名の頭文字を使用
                if (!playerPhoto) {
                    playerPhoto = `https://media.api-sports.io/football/players/${playerNumber}.png`;
                }
                
                // デバッグ情報をコンソールに出力
                console.log(`Player ${index + 1} (${teamType}):`, {

                    position: playerPosition,

                    photo: playerPhoto,
                    hasPhoto: !!playerPhoto
                });
                
                // パフォーマンス評価をランダムに生成（実際のAPIデータがある場合はそれを使用）
                const performanceRating = (Math.random() * 2 + 6).toFixed(1);

                return {

                    number: playerNumber,
                    photo: playerPhoto,
                    rating: performanceRating,
                    ratingClass: ratingClass,
                    teamType: teamType,
                    index: index

            });

        // 統合ピッチでのプレイヤー位置を生成する関数（中央線分離版）
        function generateUnifiedPlayerPositions(players, teamType, formation, homeTeam, awayTeam) {
            const positions = getFormationPositions(formation);
            
            return players.map((player, index) => {
                if (index < positions.length) {
                    const pos = positions[index];
                    let left, top;
                    
                    if (teamType === 'home') {
                        // ホームチーム（左側、左のゴール）
                        left = pos.left;
                        top = pos.top;
                        
                        // 中央安全ゾーン（48%-52%）に入らないように制限
                        if (left >= 48 && left <= 52) {
                            left = 46; // 左側に移動
                        }
                    } else {
                        // アウェイチーム（右側、右のゴール）
                        // アウェイチームは右側のハーフコートに配置
                        if (formation === '4-1-4-1') {
                            // 4-1-4-1フォーメーションは既に右側用に設定済み
                            left = pos.left;
                            top = pos.top;
                            
                            // 中央安全ゾーン（48%-52%）に入らないように制限
                            if (left >= 48 && left <= 55) {
                                left = 54; // 右側に移動
                            }
                        } else {
                            // その他のフォーメーションは右側に反転
                            left = 100 - pos.left;
                            top = pos.top;
                            
                            // 中央安全ゾーン（48%-52%）に入らないように制限
                            if (left >= 48 && left <= 52) {
                                left = 54; // 右側に移動
                            }
                        }
                    }
                    
                    return `
                        <div class="player-marker ${teamType}-player" style="left: ${left}%; top: ${top}%;" onclick="showPlayerDetails('${player.name}', '${teamType === 'home' ? homeTeam : awayTeam}')">
                            <div class="player-avatar">
                                ${player.photo ? 
                                    `<img src="${player.photo}" alt="${player.name}" class="player-photo">` : 
                                    `<div class="player-initial">${player.name.charAt(0)}</div>`
                                }
                            </div>
                            <div class="player-rating ${player.ratingClass}">${player.rating}</div>
                            <div class="player-number">${player.number}</div>
                            <div class="player-name">${player.name.replace(/^[^ ]+ /, '')}</div>
                        </div>
                    `;
                }
                return '';
            }).join('');
        }

        // フォーメーションに基づくプレイヤー位置を取得する関数（陣地分離版）
        function getFormationPositions(formation) {
            const positions = [];
            
            switch (formation) {
                case '4-2-3-1':
                    // GK (左のゴール、より後ろに)
                    positions.push({ left: 8, top: 50 });
                    // Defenders (左から2番目のライン、より後ろに、CB間隔を大幅に広げる)
                    positions.push({ left: 18, top: 20 });
                    positions.push({ left: 18, top: 35 });
                    positions.push({ left: 18, top: 65 });
                    positions.push({ left: 18, top: 80 });
                    // Midfielders (左から3番目のライン、間隔を広げる)
                    positions.push({ left: 28, top: 30 });
                    positions.push({ left: 28, top: 70 });
                    // Attacking Midfielders (左から4番目のライン、ハーフライン手前、間隔を広げる)
                    positions.push({ left: 38, top: 15 });
                    positions.push({ left: 38, top: 50 });
                    positions.push({ left: 38, top: 85 });
                    // Striker (左から5番目のライン、ハーフライン手前)
                    positions.push({ left: 45, top: 50 });
                    break;
                    
                case '4-1-4-1':
                    // GK (右のゴール、より後ろに)
                    positions.push({ left: 92, top: 50 });
                    // Defenders (右から2番目のライン、より後ろに、CB間隔を大幅に広げる)
                    positions.push({ left: 82, top: 20 });
                    positions.push({ left: 82, top: 35 });
                    positions.push({ left: 82, top: 65 });
                    positions.push({ left: 82, top: 80 });
                    // Defensive Midfielder (右から3番目のライン)
                    positions.push({ left: 72, top: 50 });
                    // Midfielders (右から4番目のライン、ハーフライン手前、間隔を広げる)
                    positions.push({ left: 62, top: 15 });
                    positions.push({ left: 62, top: 30 });
                    positions.push({ left: 62, top: 70 });
                    positions.push({ left: 62, top: 85 });
                    // Striker (右から5番目のライン、ハーフライン手前)
                    positions.push({ left: 55, top: 50 });
                    break;
                    
                case '4-4-2':
                    // GK (左のゴール、より後ろに)
                    positions.push({ left: 8, top: 50 });
                    // Defenders (左から2番目のライン、より後ろに、CB間隔を広げる)
                    positions.push({ left: 18, top: 15 });
                    positions.push({ left: 18, top: 30 });
                    positions.push({ left: 18, top: 70 });
                    positions.push({ left: 18, top: 85 });
                    // Midfielders (左から3番目のライン、間隔を広げる)
                    positions.push({ left: 28, top: 15 });
                    positions.push({ left: 28, top: 30 });
                    positions.push({ left: 28, top: 70 });
                    positions.push({ left: 28, top: 85 });
                    // Strikers (左から4番目のライン、ハーフライン手前、間隔を広げる)
                    positions.push({ left: 38, top: 30 });
                    positions.push({ left: 38, top: 70 });
                    break;
                    
                case '3-5-2':
                    // GK (左のゴール、より後ろに)
                    positions.push({ left: 8, top: 50 });
                    // Defenders (左から2番目のライン、より後ろに、CB間隔を広げる)
                    positions.push({ left: 18, top: 20 });
                    positions.push({ left: 18, top: 50 });
                    positions.push({ left: 18, top: 80 });
                    // Midfielders (左から3番目のライン、間隔を広げる)
                    positions.push({ left: 28, top: 10 });
                    positions.push({ left: 28, top: 25 });
                    positions.push({ left: 28, top: 50 });
                    positions.push({ left: 28, top: 75 });
                    positions.push({ left: 28, top: 90 });
                    // Strikers (左から4番目のライン、ハーフライン手前、間隔を広げる)
                    positions.push({ left: 38, top: 30 });
                    positions.push({ left: 38, top: 70 });
                    break;
                    
                default:
                    // デフォルトの4-4-2
                    for (let i = 0; i < 11; i++) {
                        if (i === 0) {
                            // GK
                            positions.push({ left: 8, top: 50 });
                        } else if (i <= 4) {
                            // Defenders (間隔を広げる)
                            positions.push({ left: 18, top: 10 + (i - 1) * 20 });
                        } else if (i <= 8) {
                            // Midfielders (間隔を広げる)
                            positions.push({ left: 28, top: 15 + (i - 5) * 20 });
                        } else {
                            // Strikers (間隔を広げる)
                            positions.push({ left: 38, top: 25 + (i - 9) * 50 });
                        }
                    }
                    break;
            }
            
            return positions;
        }
