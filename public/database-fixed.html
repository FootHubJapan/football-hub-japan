    <script>
        // Force cache busting with unique timestamp
        const timestamp = Date.now();
        const random = Math.random();
        console.log('Loading firebaseData.js with cache busting:', timestamp, random);
        
        const script = document.createElement('script');
        script.src = `firebaseData.js?v=1.6&t=${timestamp}&r=${random}`;
        script.onload = function() {
            console.log('firebaseData.js loaded successfully at:', new Date().toISOString());
        };
        script.onerror = function() {
            console.error('Failed to load firebaseData.js');
        };
        document.head.appendChild(script);
    </script>
    <script>
        // Version: 1.6 - FIXED VERSION - NO CACHE ISSUES
        // データ管理
        let currentTab = 'players';
        let currentData = [];
        let allLeagues = [];
        let allTeams = [];
        let allPlayers = [];
        let isLoading = false;
        let filteredData = [];
        let isSearchActive = false;

        // FirebaseDataServiceの初期化確認
        function checkFirebaseDataService() {
            if (!window.firebaseDataService) {
                console.error('FirebaseDataServiceが初期化されていません');
                return false;
            }
            return true;
        }

        // タブ切り替え（改善版）
        async function switchTab(tab, element = null) {
            try {
                console.log('Switching to tab:', tab);
                currentTab = tab;
                
                // ローディング状態を表示
                showLoading(true, `${tab}データを読み込み中...`);
                
                // FirebaseDataServiceの準備を待つ
                if (!window.firebaseDataService) {
                    console.log('Waiting for FirebaseDataService before switching tab...');
                    await waitForFirebaseDataService();
                }
                
                // タブボタンのアクティブ状態を更新
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                if (element) {
                    element.classList.add('active');
                } else {
                    const targetButton = document.querySelector(`[onclick*="${tab}"]`);
                    if (targetButton) {
                        targetButton.classList.add('active');
                    }
                }
                
                // タブコンテンツを切り替え
                document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
                const targetTab = document.getElementById(tab + 'Tab');
                if (targetTab) {
                    targetTab.style.display = 'block';
                }
                
                // データを安全に取得
                const dataFetchFunctions = {
                    'players': () => window.firebaseDataService.getPlayers(),
                    'teams': () => window.firebaseDataService.getTeams(),
                    'leagues': () => window.firebaseDataService.getLeagues()
                };
                
                const fallbackFunctions = {
                    'players': () => window.firebaseDataService.getFallbackPlayers(),
                    'teams': () => window.firebaseDataService.getFallbackTeams(),
                    'leagues': () => window.firebaseDataService.getFallbackLeagues()
                };
                
                if (dataFetchFunctions[tab] && fallbackFunctions[tab]) {
                    currentData = await fetchDataSafely(
                        dataFetchFunctions[tab],
                        fallbackFunctions[tab],
                        `${tab}-data-fetch`
                    );
                    console.log(`取得した${tab}データ:`, currentData.length, '件');
                } else {
                    console.error(`Unknown tab: ${tab}`);
                    currentData = [];
                }
                
                // ローディング状態を非表示にしてデータを表示
                showLoading(false);
                displayData(currentData, currentTab);
                
            } catch (error) {
                handleError(error, 'tab-switch');
                showLoading(false);
                currentData = [];
                displayData(currentData, currentTab);
            }
        }

        // データを表示する関数
        function displayData(data, tabType) {
            console.log(`${tabType}データを表示中:`, data.length, '件');
            
            const tableBody = document.getElementById(tabType + 'TableBody');
            if (!tableBody) {
                console.error('テーブルボディが見つかりません:', tabType + 'TableBody');
                return;
            }
            
            let html = '';
            
            if (data.length === 0) {
                html = '<tr><td colspan="6" class="no-data">データが見つかりません</td></tr>';
            } else {
                data.forEach((item, index) => {
                    if (tabType === 'players') {
                        const playerName = item.fullName || item.name || 'Unknown Player';
                        const teamName = item.currentTeam || item.team || 'Unknown Team';
                        const leagueName = item.seasons?.['2024-2025']?.league || 'Unknown League';
                        const age = item.age || 'N/A';
                        const position = item.position || 'Unknown';
                        const stats = item.seasons?.['2024-2025']?.stats || {};
                        
                        html += `
                            <tr class="data-row" onclick="showPlayerDetail('${item.id || index}')">
                                <td>
                                    <div class="player-info">
                                        <div class="player-avatar">${playerName.charAt(0)}</div>
                                        <div class="player-details">
                                            <div class="player-name">${playerName}</div>
                                            <div class="player-meta">${position} • ${item.nationality || 'Unknown'} • ${age}歳</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="team-info">
                                        <div class="team-name">${teamName}</div>
                                        <div class="league-name">${leagueName}</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="season-info">
                                        <div class="season-year">2024-2025</div>
                                        <div class="season-status">進行中</div>
                                    </div>
                                </td>
                                <td>${age}</td>
                                <td>${position}</td>
                                <td>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <span class="stat-label">⚽ ゴール</span>
                                            <span class="stat-value">${stats.goals || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">🎯 アシスト</span>
                                            <span class="stat-value">${stats.assists || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📊 試合数</span>
                                            <span class="stat-value">${stats.appearances || 0}</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">⭐ 評価</span>
                                            <span class="stat-value">${stats.rating || 'N/A'}</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    } else if (tabType === 'teams') {
                        const teamName = item.name || 'Unknown Team';
                        const leagueName = item.league || 'Unknown League';
                        const country = item.country || 'Unknown';
                        const founded = item.founded || 'N/A';
                        
                        html += `
                            <tr class="data-row" onclick="showTeamDetail('${item.id || index}')">
                                <td>
                                    <div class="team-info">
                                        <div class="team-avatar">${teamName.charAt(0)}</div>
                                        <div class="team-details">
                                            <div class="team-name">${teamName}</div>
                                            <div class="team-meta">${country} • 創設: ${founded}</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="league-info">
                                        <div class="league-name">${leagueName}</div>
                                        <div class="league-country">${country}</div>
                                    </div>
                                </td>
                                <td>${country}</td>
                                <td>${founded}</td>
                                <td>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <span class="stat-label">🏆 順位</span>
                                            <span class="stat-value">N/A位</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📊 試合数</span>
                                            <span class="stat-value">N/A</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    } else if (tabType === 'leagues') {
                        const leagueName = item.name || 'Unknown League';
                        const country = item.country || 'Unknown';
                        const teams = item.teams || 'N/A';
                        const season = item.season || '2024-25';
                        
                        html += `
                            <tr class="data-row" onclick="showLeagueDetail('${item.id || index}')">
                                <td>
                                    <div class="league-info">
                                        <div class="league-name">${leagueName}</div>
                                        <div class="league-country">${country}</div>
                                    </div>
                                </td>
                                <td>${country}</td>
                                <td>${teams}</td>
                                <td>${season}</td>
                                <td>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <span class="stat-label">🏆 優勝</span>
                                            <span class="stat-value">N/A</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">📊 試合数</span>
                                            <span class="stat-value">N/A</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }
                });
            }
            
            tableBody.innerHTML = html;
            console.log(`${tabType}データの表示完了:`, data.length, '件');
        }

        // API設定機能
        function setApiKey() {
            showApiStatus('APIキーはバックエンドで管理されています', 'success');
        }

        function addSampleData() {
            if (!window.addSampleDataToFirestore) {
                showApiStatus('FirebaseDataServiceが初期化されていません', 'error');
                return;
            }
            window.addSampleDataToFirestore();
            showApiStatus('サンプルデータの追加を開始しました', 'success');
        }

        async function importRealData() {
            if (!window.firebaseDataService) {
                console.log('Waiting for FirebaseDataService...');
                await waitForFirebaseDataService();
            }
            
            if (!window.importRealFootballData) {
                showApiStatus('FirebaseDataServiceが初期化されていません', 'error');
                return;
            }
            showApiStatus('実際のデータのインポートを開始しました。時間がかかる場合があります...', 'success');
            window.importRealFootballData();
        }

        function showApiStatus(message, type) {
            const statusElement = document.getElementById('apiStatus');
            if (!statusElement) {
                console.warn('apiStatus element not found, using alert instead');
                alert(message);
                return;
            }
            statusElement.textContent = message;
            statusElement.className = `api-status ${type}`;
            statusElement.style.display = 'block';
            
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 5000);
        }

        // データ状況確認
        async function checkDataStatus() {
            if (!window.firebaseDataService) {
                console.log('Waiting for FirebaseDataService...');
                await waitForFirebaseDataService();
            }

            try {
                const status = await window.firebaseDataService.checkDataStatus();
                showDataStatus(`データベースの状態: ${status.message}`, status.type);
                console.log('データベース状態:', status);
            } catch (error) {
                showDataStatus('データベース状態の確認中にエラーが発生しました', 'error');
                console.error('データベース状態確認エラー:', error);
            }
        }

        // キャッシュクリア
        async function clearCachedData() {
            if (!window.firebaseDataService) {
                console.log('Waiting for FirebaseDataService...');
                await waitForFirebaseDataService();
            }

            try {
                await window.firebaseDataService.clearCachedData();
                showDataStatus('キャッシュがクリアされました', 'success');
                console.log('キャッシュクリア完了');
            } catch (error) {
                showDataStatus('キャッシュクリア中にエラーが発生しました', 'error');
                console.error('キャッシュクリアエラー:', error);
            }
        }

        // データ更新
        async function refreshData() {
            if (!window.firebaseDataService) {
                console.log('Waiting for FirebaseDataService...');
                await waitForFirebaseDataService();
            }

            try {
                await window.firebaseDataService.refreshData();
                showDataStatus('データベースの更新を開始しました', 'success');
                console.log('データ更新開始');
            } catch (error) {
                showDataStatus('データ更新中にエラーが発生しました', 'error');
                console.error('データ更新エラー:', error);
            }
        }

        // ローディング状態の表示/非表示
        function showLoading(show, message = 'データを読み込み中...') {
            isLoading = show;
            
            const tableBodies = ['playersTableBody', 'teamsTableBody', 'leaguesTableBody'];
            
            tableBodies.forEach(tableId => {
                const tableBody = document.getElementById(tableId);
                if (tableBody) {
                    if (show) {
                        tableBody.innerHTML = `
                            <tr>
                                <td colspan="6">
                                    <div class="loading">
                                        <div class="loading-spinner"></div>
                                        <div class="loading-text">${message}</div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }
                }
            });
        }

        // データ状態表示
        function showDataStatus(message, type) {
            const statusElement = document.getElementById('dataStatus');
            if (statusElement) {
                statusElement.textContent = message;
                statusElement.className = `data-status ${type}`;
                statusElement.style.display = 'block';
                
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 5000);
            }
        }

        // オーナー権限チェック（簡易版）
        function isOwner() {
            // 一時的にオーナー機能を有効にする（デバッグ用）
            return true;
        }

        // オーナー用機能の表示/非表示
        function toggleOwnerFeatures() {
            const ownerFeatures = document.querySelector('.data-management-section');
            if (ownerFeatures) {
                if (isOwner()) {
                    ownerFeatures.style.display = 'block';
                    console.log('オーナー機能を表示しました');
                } else {
                    ownerFeatures.style.display = 'none';
                    console.log('オーナー機能を非表示にしました');
                }
            }
        }

        // エラーハンドリングの改善
        function handleError(error, context) {
            console.error(`Error in ${context}:`, error);
            
            // ユーザーフレンドリーなエラーメッセージ
            const errorMessages = {
                'data-fetch': 'データの取得中にエラーが発生しました',
                'firebase-init': 'Firebaseの初期化に失敗しました',
                'network': 'ネットワークエラーが発生しました',
                'unknown': '予期しないエラーが発生しました'
            };
            
            const message = errorMessages[context] || errorMessages['unknown'];
            showDataStatus(message, 'error');
        }

        // データ取得の改善
        async function fetchDataSafely(fetchFunction, fallbackFunction, context) {
            try {
                const result = await fetchFunction();
                if (result && Array.isArray(result) && result.length > 0) {
                    return result;
                } else {
                    console.warn(`No data returned from ${context}, using fallback`);
                    return fallbackFunction();
                }
            } catch (error) {
                handleError(error, context);
                return fallbackFunction();
            }
        }

        // FirebaseDataServiceの初期化完了を待つ（改善版）
        function waitForFirebaseDataService() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 50; // 5秒間待機
                
                const checkService = () => {
                    attempts++;
                    
                    if (window.firebaseDataService) {
                        console.log('FirebaseDataService is ready');
                        resolve(window.firebaseDataService);
                    } else if (attempts >= maxAttempts) {
                        const error = new Error('FirebaseDataService initialization timeout');
                        handleError(error, 'firebase-init');
                        reject(error);
                    } else {
                        console.log(`Waiting for FirebaseDataService... (${attempts}/${maxAttempts})`);
                        setTimeout(checkService, 100);
                    }
                };
                checkService();
            });
        }

        // 初期化処理（改善版）
        async function initializeApplication() {
            try {
                console.log('Database page loaded - FIXED VERSION');
                
                // オーナー機能の表示/非表示を設定
                toggleOwnerFeatures();
                
                // FirebaseDataServiceの初期化完了を待つ
                await waitForFirebaseDataService();
                
                // 初期タブを設定
                await switchTab('players');
                
                console.log('Application initialization completed successfully');
                
            } catch (error) {
                handleError(error, 'app-init');
                console.error('Application initialization failed:', error);
            }
        }

        // 初期表示
        document.addEventListener('DOMContentLoaded', initializeApplication);

        // 検索機能
        async function performSearch() {
            try {
                const searchQuery = document.getElementById('searchInput').value.trim();
                const positionFilter = document.getElementById('positionFilter').value;
                const leagueFilter = document.getElementById('leagueFilter').value;

                if (!searchQuery && !positionFilter && !leagueFilter) {
                    clearSearch();
                    return;
                }

                showLoading(true, '検索中...');
                isSearchActive = true;

                // 現在のタブに応じて検索を実行
                let searchResults = [];
                
                if (currentTab === 'players') {
                    searchResults = await searchPlayers(searchQuery, positionFilter, leagueFilter);
                } else if (currentTab === 'teams') {
                    searchResults = await searchTeams(searchQuery, leagueFilter);
                } else if (currentTab === 'leagues') {
                    searchResults = await searchLeagues(searchQuery);
                }

                filteredData = searchResults;
                showLoading(false);
                displayData(filteredData, currentTab);

                // 検索結果の表示
                showSearchResults(searchResults.length, searchQuery, positionFilter, leagueFilter);

            } catch (error) {
                handleError(error, 'search');
                showLoading(false);
            }
        }

        // 選手検索
        async function searchPlayers(query, position, league) {
            if (!window.firebaseDataService) {
                await waitForFirebaseDataService();
            }

            const allPlayers = await window.firebaseDataService.getPlayers();
            return allPlayers.filter(player => {
                const matchesQuery = !query || 
                    player.fullName?.toLowerCase().includes(query.toLowerCase()) ||
                    player.currentTeam?.toLowerCase().includes(query.toLowerCase()) ||
                    player.nationality?.toLowerCase().includes(query.toLowerCase());

                const matchesPosition = !position || player.position === position;
                const matchesLeague = !league || 
                    player.seasons?.['2024-2025']?.league === league;

                return matchesQuery && matchesPosition && matchesLeague;
            });
        }

        // チーム検索
        async function searchTeams(query, league) {
            if (!window.firebaseDataService) {
                await waitForFirebaseDataService();
            }

            const allTeams = await window.firebaseDataService.getTeams();
            return allTeams.filter(team => {
                const matchesQuery = !query || 
                    team.name?.toLowerCase().includes(query.toLowerCase()) ||
                    team.country?.toLowerCase().includes(query.toLowerCase());

                const matchesLeague = !league || team.league === league;

                return matchesQuery && matchesLeague;
            });
        }

        // リーグ検索
        async function searchLeagues(query) {
            if (!window.firebaseDataService) {
                await waitForFirebaseDataService();
            }

            const allLeagues = await window.firebaseDataService.getLeagues();
            return allLeagues.filter(league => {
                return !query || 
                    league.name?.toLowerCase().includes(query.toLowerCase()) ||
                    league.country?.toLowerCase().includes(query.toLowerCase());
            });
        }

        // 検索クリア
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('positionFilter').value = '';
            document.getElementById('leagueFilter').value = '';
            
            isSearchActive = false;
            filteredData = [];
            
            // 元のデータを再表示
            switchTab(currentTab);
            
            // 検索結果表示をクリア
            const searchResults = document.querySelector('.search-results');
            if (searchResults) {
                searchResults.remove();
            }
        }

        // 検索結果の表示
        function showSearchResults(count, query, position, league) {
            // 既存の検索結果を削除
            const existingResults = document.querySelector('.search-results');
            if (existingResults) {
                existingResults.remove();
            }

            const searchSection = document.querySelector('.search-section');
            const resultsDiv = document.createElement('div');
            resultsDiv.className = 'search-results';
            
            let resultText = `${count}件の結果が見つかりました`;
            if (query) resultText += ` (検索: "${query}")`;
            if (position) resultText += ` (ポジション: ${position})`;
            if (league) resultText += ` (リーグ: ${league})`;
            
            resultsDiv.textContent = resultText;
            searchSection.appendChild(resultsDiv);
        }

        // ページネーション
        function changePage(direction) {
            console.log('Page change requested:', direction);
            // ページネーション機能は後で実装
        }

        function showPlayerDetail(playerId) {
            console.log('Player detail requested:', playerId);
            alert(`選手詳細: ${playerId}`);
        }

        // チーム詳細表示
        function showTeamDetail(teamId) {
            console.log('Team detail requested:', teamId);
            alert(`チーム詳細: ${teamId}`);
        }

        // リーグ詳細表示
        function showLeagueDetail(leagueId) {
            console.log('League detail requested:', leagueId);
            alert(`リーグ詳細: ${leagueId}`);
        }
    </script>
