<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
    <title>強化レーダーチャート - Football Hub Japan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .controls-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .controls-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
        }

        .comparison-type {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .type-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .type-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .type-btn:hover {
            background: #00cc6a;
        }

        .stats-selection-section {
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .selection-title {
            color: #00ff88;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .season-selection {
            margin-bottom: 1.5rem;
        }

        .season-dropdown {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem;
            border: 1px solid #555555;
            border-radius: 5px;
            margin-left: 1rem;
        }

        .stats-dropdown-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stats-dropdown-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stats-dropdown-group label {
            color: #cccccc;
            font-size: 0.9rem;
        }

        .stats-dropdown {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem;
            border: 1px solid #555555;
            border-radius: 5px;
        }

        .selection-counter {
            color: #00ff88;
            font-weight: bold;
            text-align: center;
            padding: 0.5rem;
            background: #1a1a1a;
            border-radius: 5px;
        }

        .auto-refresh-section {
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .refresh-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .refresh-controls label {
            color: #cccccc;
            margin-right: 0.5rem;
        }

        .refresh-controls select {
            background: #333333;
            color: #ffffff;
            padding: 0.3rem;
            border: 1px solid #555555;
            border-radius: 3px;
        }

        .refresh-status {
            color: #00ff88;
            font-weight: bold;
            padding: 0.3rem 0.8rem;
            background: #1a1a1a;
            border-radius: 3px;
        }

        .selection-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .selection-group {
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1.5rem;
        }

        .search-section {
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.8rem;
            background: #333333;
            color: #ffffff;
            border: 1px solid #555555;
            border-radius: 5px;
            margin-bottom: 0.5rem;
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 5px;
        }

        .search-result-item {
            padding: 0.8rem;
            border-bottom: 1px solid #333333;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-result-item:hover {
            background: #333333;
        }

        .selected-player {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #1a1a1a;
            border-radius: 5px;
            margin-top: 1rem;
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            background: #00ff88;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .player-info h4 {
            color: #00ff88;
            margin-bottom: 0.2rem;
        }

        .player-info p {
            color: #cccccc;
            font-size: 0.9rem;
        }

        .compare-btn {
            background: #00ff88;
            color: #000000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
        }

        .compare-btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .chart-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
        }

        .chart-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
            background: #0a0a0a;
            border-radius: 10px;
            padding: 1rem;
        }

        .analysis-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .analysis-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .analysis-input {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .analysis-input input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 1rem;
        }

        .analysis-input button {
            padding: 0.8rem 1.5rem;
            background: #00ff88;
            color: #000000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .analysis-result {
            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1rem;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: #333333;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #cccccc;
            margin-top: 0.5rem;
        }

        .loading {
            display: none;
            text-align: center;
            color: #00ff88;
            font-size: 1.1rem;
            margin: 1rem 0;
        }

        .error {
            color: #ff4444;
            background: #330000;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .success {
            color: #00ff88;
            background: #003300;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 0.8rem;
            text-align: center;
            border: 1px solid #333333;
        }

        .comparison-table th {
            background: #333333;
            color: #00ff88;
            font-weight: bold;
        }

        .comparison-table td {
            background: #222222;
        }

        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .player-inputs {
                grid-template-columns: 1fr;
            }
            
            .main-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Football Hub Japan</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/'">ホーム</button>
            <button class="nav-btn" onclick="window.location.href='/database-enhanced'">データベース</button>
            <button class="nav-btn" onclick="window.location.href='/ai-agent-enhanced'">AIエージェント</button>
            <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
        </div>
    </div>

    <div class="main-container">
        <h1 class="page-title">強化レーダーチャート</h1>
        <p class="page-subtitle">選手能力の詳細分析とAI比較</p>

        <!-- コントロールセクション -->
        <div class="controls-section">
            <h2 class="controls-title">比較設定</h2>
            
            <div class="comparison-type">
                <button class="type-btn active" onclick="switchType('players')">選手比較</button>
                <button class="type-btn" onclick="switchType('teams')">チーム比較</button>
            </div>

            <!-- 統計項目選択セクション -->
            <div class="stats-selection-section">
                <h3 class="selection-title">📊 比較項目選択（6項目を選択してください）</h3>
                
                <!-- シーズン選択 -->
                <div class="season-selection">
                    <label for="seasonSelect">シーズン:</label>
                    <select id="seasonSelect" class="season-dropdown" onchange="updateSeason()">
                        <option value="2024-2025">2024-2025</option>
                        <option value="2023-2024">2023-2024</option>
                        <option value="2022-2023">2022-2023</option>
                        <option value="2021-2022">2021-2022</option>
                    </select>
                </div>
                
                <div class="stats-dropdown-container">
                    <div class="stats-dropdown-group">
                        <label for="statSelect1">項目 1:</label>
                        <select id="statSelect1" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect2">項目 2:</label>
                        <select id="statSelect2" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect3">項目 3:</label>
                        <select id="statSelect3" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect4">項目 4:</label>
                        <select id="statSelect4" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect5">項目 5:</label>
                        <select id="statSelect5" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect6">項目 6:</label>
                        <select id="statSelect6" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                </div>
                <div class="selection-counter" id="selectionCounter">0/6 項目選択中</div>
            </div>

            <!-- 自動リフレッシュ設定 -->
            <div class="auto-refresh-section">
                <h3 class="selection-title">🔄 自動リフレッシュ設定</h3>
                <div class="refresh-controls">
                    <label for="autoRefreshToggle">自動リフレッシュ:</label>
                    <input type="checkbox" id="autoRefreshToggle" onchange="toggleAutoRefresh()">
                    <label for="refreshInterval">間隔:</label>
                    <select id="refreshInterval" onchange="updateRefreshInterval()">
                        <option value="30">30秒</option>
                        <option value="60" selected>1分</option>
                        <option value="300">5分</option>
                        <option value="600">10分</option>
                    </select>
                    <span id="refreshStatus" class="refresh-status">停止中</span>
                </div>
            </div>

            <div class="selection-controls">
                <div class="selection-group">
                    <h3 class="selection-title">🏃‍♂️ 比較対象 A</h3>
                    <div class="search-section">
                        <input type="text" id="searchA" class="search-input" placeholder="選手名を入力して検索..." oninput="searchPlayers('A')">
                        <div id="searchResultsA" class="search-results"></div>
                    </div>
                    <div id="selectedPlayerA" class="selected-player" style="display: none;">
                        <div class="player-avatar" id="avatarA">?</div>
                        <div class="player-info">
                            <h4 id="nameA">選手A</h4>
                            <p id="teamA">チーム名</p>
                        </div>
                    </div>
                </div>

                <div class="selection-group">
                    <h3 class="selection-title">🏃‍♂️ 比較対象 B</h3>
                    <div class="search-section">
                        <input type="text" id="searchB" class="search-input" placeholder="選手名を入力して検索..." oninput="searchPlayers('B')">
                        <div id="searchResultsB" class="search-results"></div>
                    </div>
                    <div id="selectedPlayerB" class="selected-player" style="display: none;">
                        <div class="player-avatar" id="avatarB">?</div>
                        <div class="player-info">
                            <h4 id="nameB">選手B</h4>
                            <p id="teamB">チーム名</p>
                        </div>
                    </div>
                </div>

                <div class="selection-group">
                    <h3 class="selection-title">🏃‍♂️ 比較対象 C</h3>
                    <div class="search-section">
                        <input type="text" id="searchC" class="search-input" placeholder="選手名を入力して検索..." oninput="searchPlayers('C')">
                        <div id="searchResultsC" class="search-results"></div>
                    </div>
                    <div id="selectedPlayerC" class="selected-player" style="display: none;">
                        <div class="player-avatar" id="avatarC">?</div>
                        <div class="player-info">
                            <h4 id="nameC">選手C</h4>
                            <p id="teamC">チーム名</p>
                        </div>
                    </div>
                </div>
            </div>

            <button class="compare-btn" onclick="startComparison()">📊 比較開始</button>
        </div>

        <!-- チャートセクション -->
        <div class="charts-container">
            <div class="chart-section">
                <h2 class="chart-title">能力比較チャート</h2>
                <div class="chart-wrapper">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
            
            <div class="chart-section">
                <h2 class="chart-title">統計比較</h2>
                <div class="stats-grid" id="statsGrid">
                    <!-- 統計カードがここに表示されます -->
                </div>
            </div>
        </div>

        <!-- AI分析セクション -->
        <div class="analysis-section">
            <h2 class="analysis-title">AI分析</h2>
            <div class="analysis-input">
                <input type="text" id="analysisInput" placeholder="分析したい内容を入力してください（例：久保建英と三笘薫の強みを比較して）">
                <button onclick="performAIAnalysis()">分析実行</button>
            </div>
            <div class="loading" id="analysisLoading">AI分析中...</div>
            <div class="analysis-result" id="analysisResult">
                AI分析の結果がここに表示されます。
            </div>
        </div>

        <!-- 比較テーブルセクション -->
        <div class="analysis-section">
            <h2 class="analysis-title">詳細比較表</h2>
            <table class="comparison-table" id="comparisonTable">
                <thead>
                    <tr>
                        <th>項目</th>
                        <th id="player1Header">選手1</th>
                        <th id="player2Header">選手2</th>
                        <th id="player3Header">選手3</th>
                    </tr>
                </thead>
                <tbody id="comparisonTableBody">
                    <!-- 比較データがここに表示されます -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let mainChart = null;
        let currentChartType = 'radar';
        let currentPlayers = { A: null, B: null, C: null };
        let selectedStats = [];
        let availableStats = [
            { value: 'goals', label: '得点' },
            { value: 'assists', label: 'アシスト' },
            { value: 'appearances', label: '出場試合' },
            { value: 'minutes', label: '出場時間' },
            { value: 'passes', label: 'パス成功率' },
            { value: 'dribbles', label: 'ドリブル成功率' },
            { value: 'tackles', label: 'タックル数' },
            { value: 'interceptions', label: 'インターセプト' },
            { value: 'clearances', label: 'クリアランス' },
            { value: 'saves', label: 'セーブ数' },
            { value: 'clean_sheets', label: 'クリーンシート' },
            { value: 'yellow_cards', label: 'イエローカード' },
            { value: 'red_cards', label: 'レッドカード' },
            { value: 'rating', label: '平均評価' },
            { value: 'key_passes', label: 'キーパス' },
            { value: 'shots', label: 'シュート数' },
            { value: 'shots_on_target', label: '枠内シュート' },
            { value: 'fouls', label: 'ファウル数' },
            { value: 'offsides', label: 'オフサイド' },
            { value: 'blocks', label: 'ブロック' }
        ];
        let autoRefreshInterval = null;
        let refreshInterval = 60000; // デフォルト1分

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            initializeStatsDropdowns();
            loadSamplePlayers();
            updateSelectedStats();
        });

        // 統計ドロップダウンの初期化
        function initializeStatsDropdowns() {
            const dropdowns = [
                'statSelect1', 'statSelect2', 'statSelect3', 
                'statSelect4', 'statSelect5', 'statSelect6'
            ];

            dropdowns.forEach((dropdownId, index) => {
                const dropdown = document.getElementById(dropdownId);
                dropdown.innerHTML = '<option value="">選択してください</option>';
                
                availableStats.forEach(stat => {
                    const option = document.createElement('option');
                    option.value = stat.value;
                    option.textContent = stat.label;
                    dropdown.appendChild(option);
                });
            });
        }

        // 選択された統計項目を更新
        function updateSelectedStats() {
            selectedStats = [];
            const dropdowns = [
                'statSelect1', 'statSelect2', 'statSelect3', 
                'statSelect4', 'statSelect5', 'statSelect6'
            ];

            dropdowns.forEach(dropdownId => {
                const dropdown = document.getElementById(dropdownId);
                if (dropdown.value) {
                    selectedStats.push(dropdown.value);
                }
            });

            const counter = document.getElementById('selectionCounter');
            counter.textContent = `${selectedStats.length}/6 項目選択中`;
            
            // カウンターの色を更新
            if (selectedStats.length === 6) {
                counter.style.color = '#00ff88';
            } else if (selectedStats.length > 6) {
                counter.style.color = '#ff4444';
            } else {
                counter.style.color = '#ffaa00';
            }
        }

        // シーズン更新
        function updateSeason() {
            const season = document.getElementById('seasonSelect').value;
            console.log('シーズン更新:', season);
            // シーズンに応じてデータを更新
            if (currentPlayers.A || currentPlayers.B || currentPlayers.C) {
                updateCharts();
            }
        }

        // 自動リフレッシュの切り替え
        function toggleAutoRefresh() {
            const toggle = document.getElementById('autoRefreshToggle');
            const status = document.getElementById('refreshStatus');
            
            if (toggle.checked) {
                startAutoRefresh();
                status.textContent = '実行中';
                status.style.color = '#00ff88';
            } else {
                stopAutoRefresh();
                status.textContent = '停止中';
                status.style.color = '#cccccc';
            }
        }

        // 自動リフレッシュ開始
        function startAutoRefresh() {
            stopAutoRefresh(); // 既存のインターバルをクリア
            autoRefreshInterval = setInterval(() => {
                console.log('自動リフレッシュ実行:', new Date().toLocaleTimeString());
                updateCharts();
            }, refreshInterval);
        }

        // 自動リフレッシュ停止
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // リフレッシュ間隔更新
        function updateRefreshInterval() {
            const intervalSelect = document.getElementById('refreshInterval');
            refreshInterval = parseInt(intervalSelect.value) * 1000;
            
            // 自動リフレッシュが有効な場合は再起動
            const toggle = document.getElementById('autoRefreshToggle');
            if (toggle.checked) {
                startAutoRefresh();
            }
        }

        // 比較タイプ切り替え
        function switchType(type) {
            // ボタンの状態を更新
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // タイプに応じてUIを更新
            if (type === 'teams') {
                // チーム比較モード
                document.querySelectorAll('.selection-title').forEach(title => {
                    title.textContent = title.textContent.replace('選手', 'チーム');
                });
            } else {
                // 選手比較モード
                document.querySelectorAll('.selection-title').forEach(title => {
                    title.textContent = title.textContent.replace('チーム', '選手');
                });
            }
        }

        // 選手検索
        function searchPlayers(target) {
            const searchInput = document.getElementById(`search${target}`);
            const query = searchInput.value.trim();
            
            if (query.length < 2) {
                document.getElementById(`searchResults${target}`).innerHTML = '';
                return;
            }

            // サンプル選手データから検索
            const results = samplePlayers.filter(player => 
                player.name.toLowerCase().includes(query.toLowerCase()) ||
                player.fullName.toLowerCase().includes(query.toLowerCase())
            );

            displaySearchResults(results, target);
        }

        // 検索結果表示
        function displaySearchResults(players, target) {
            const resultsContainer = document.getElementById(`searchResults${target}`);
            resultsContainer.innerHTML = '';

            if (players.length === 0) {
                resultsContainer.innerHTML = '<div class="search-result-item">選手が見つかりません</div>';
                return;
            }

            players.forEach(player => {
                const resultItem = document.createElement('div');
                resultItem.className = 'search-result-item';
                resultItem.innerHTML = `
                    <div><strong>${player.name}</strong></div>
                    <div style="font-size: 0.8rem; color: #cccccc;">
                        ${player.currentTeam || player.team} | ${player.position || 'N/A'}
                    </div>
                `;
                resultItem.onclick = () => selectPlayer(player, target);
                resultsContainer.appendChild(resultItem);
            });
        }

        // 選手選択
        function selectPlayer(player, target) {
            currentPlayers[target] = player;
            
            const selectedPlayerDiv = document.getElementById(`selectedPlayer${target}`);
            const avatar = document.getElementById(`avatar${target}`);
            const name = document.getElementById(`name${target}`);
            const team = document.getElementById(`team${target}`);
            
            avatar.textContent = player.name.charAt(0);
            name.textContent = player.name;
            team.textContent = `${player.currentTeam || player.team} | ${player.position || 'N/A'}`;
            
            selectedPlayerDiv.style.display = 'flex';
            document.getElementById(`searchResults${target}`).innerHTML = '';
            document.getElementById(`search${target}`).value = '';
        }

        // 比較開始
        function startComparison() {
            if (!currentPlayers.A && !currentPlayers.B && !currentPlayers.C) {
                alert('比較する選手を1人以上選択してください');
                return;
            }

            if (selectedStats.length < 6) {
                alert('6項目を選択してください');
                return;
            }

            updateCharts();
            updateStatsComparison();
        }

        // チャート更新
        function updateCharts() {
            if (!mainChart) {
                initializeChart();
            }

            const labels = selectedStats.map(stat => {
                const statObj = availableStats.find(s => s.value === stat);
                return statObj ? statObj.label : stat;
            });

            const datasets = [];
            const colors = ['#00ff88', '#ff4444', '#4444ff'];

            Object.entries(currentPlayers).forEach(([key, player], index) => {
                if (player) {
                    datasets.push({
                        label: player.name,
                        data: generateRandomData(selectedStats.length),
                        borderColor: colors[index],
                        backgroundColor: colors[index] + '20',
                        borderWidth: 2
                    });
                }
            });

            mainChart.data.labels = labels;
            mainChart.data.datasets = datasets;
            mainChart.update();
        }

        // ランダムデータ生成
        function generateRandomData(length) {
            return Array.from({ length }, () => Math.floor(Math.random() * 100) + 1);
        }

        // チャート初期化
        function initializeChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            if (mainChart) {
                mainChart.destroy();
            }

            mainChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: selectedStats.map(stat => {
                        const statObj = availableStats.find(s => s.value === stat);
                        return statObj ? statObj.label : stat;
                    }),
                    datasets: []
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                color: '#ffffff',
                                backdropColor: 'transparent'
                            },
                            grid: {
                                color: '#333333'
                            },
                            pointLabels: {
                                color: '#ffffff'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#ffffff'
                            }
                        }
                    }
                }
            });
        }

        // 統計比較更新
        function updateStatsComparison() {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = '';

            Object.entries(currentPlayers).forEach(([key, player]) => {
                if (player) {
                    const statCard = document.createElement('div');
                    statCard.className = 'stat-card';
                    statCard.innerHTML = `
                        <h3>${player.name}</h3>
                        <div class="stat-item">
                            <span>得点:</span>
                            <span>${player.stats?.goals || 0}</span>
                        </div>
                        <div class="stat-item">
                            <span>アシスト:</span>
                            <span>${player.stats?.assists || 0}</span>
                        </div>
                        <div class="stat-item">
                            <span>出場:</span>
                            <span>${player.stats?.appearances || 0}</span>
                        </div>
                    `;
                    statsGrid.appendChild(statCard);
                }
            });
        }

        // AI分析実行
        function performAIAnalysis() {
            const analysisInput = document.getElementById('analysisInput').value;
            const analysisLoading = document.getElementById('analysisLoading');
            const analysisResult = document.getElementById('analysisResult');

            if (!analysisInput.trim()) {
                alert('分析したい内容を入力してください');
                return;
            }

            analysisLoading.style.display = 'block';
            analysisResult.innerHTML = 'AI分析中...';

            // シミュレーション（実際のAI API呼び出し）
            setTimeout(() => {
                analysisLoading.style.display = 'none';
                analysisResult.innerHTML = `
                    <h4>AI分析結果</h4>
                    <p>${analysisInput}についての分析結果がここに表示されます。</p>
                    <p>実際のAI APIとの連携が必要です。</p>
                `;
            }, 2000);
        }
