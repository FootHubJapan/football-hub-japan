<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - Football Hub Japan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #1a1a1a;
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: #00ff88;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: #cccccc;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ffffff;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .login-btn {
            width: 100%;
            background: #00ff88;
            color: #000000;
            padding: 1rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }

        .login-btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .back-btn {
            width: 100%;
            background: transparent;
            color: #00ff88;
            padding: 0.8rem;
            border: 1px solid #00ff88;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .error-message {
            background: #ff4444;
            color: #ffffff;
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message {
            background: #00ff88;
            color: #000000;
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .account-info {
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 5px;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .account-info h4 {
            color: #00ff88;
            margin-bottom: 0.5rem;
        }

        .account-info p {
            color: #cccccc;
            margin-bottom: 0.3rem;
        }

        .owner-badge {
            background: #00ff88;
            color: #000000;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-left: 0.5rem;
        }

        .user-badge {
            background: #ffaa00;
            color: #000000;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>⚽ Football Hub Japan</h1>
            <p>サッカー統計プラットフォーム</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" required placeholder="your-email@example.com">
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" required placeholder="パスワードを入力">
            </div>

            <button type="submit" class="login-btn">ログイン</button>
        </form>

        <button onclick="goBack()" class="back-btn">戻る</button>

        <div class="account-info">
            <h4>アカウント情報</h4>
            <p><strong>オーナーアカウント:</strong> iyuki09175407@gmail.com <span class="owner-badge">機能制限なし</span></p>
            <p><strong>一般ユーザー:</strong> その他のメールアドレス <span class="user-badge">機能制限あり</span></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // 簡単なバリデーション
            if (!email || !password) {
                showError('メールアドレスとパスワードを入力してください。');
                return;
            }

            // オーナーアカウントかどうかチェック
            const isOwner = email === 'iyuki09175407@gmail.com';
            
            if (isOwner) {
                showSuccess('オーナーアカウントでログインしました！機能制限なしでご利用いただけます。');
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
            } else {
                showSuccess('一般ユーザーでログインしました！一部機能に制限があります。');
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            const successDiv = document.getElementById('successMessage');
            successDiv.style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
        }

        function goBack() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
