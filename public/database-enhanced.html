<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
    <title>強化データベース - Football Hub Japan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .search-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-select {
            background: #333333;
            color: #ffffff;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 0.6rem;
            font-size: 0.9rem;
            min-width: 150px;
        }

        .search-select:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .search-input {
            background: #333333;
            color: #ffffff;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 0.6rem;
            font-size: 0.9rem;
            width: 100%;
        }

        .search-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .filter-btn {
            background: #333333;
            color: #ffffff;
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .search-btn {
            background: #00ff88;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .player-card {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .player-card:hover {
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
        }

        .player-avatar {
            text-align: center;
            margin-bottom: 1rem;
        }

        .player-avatar img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #00ff88;
        }

        .player-name {
            color: #00ff88;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .player-team,
        .player-position,
        .player-nationality {
            color: #cccccc;
            margin-bottom: 0.3rem;
            text-align: center;
        }

        .player-stats {
            margin-top: 1rem;
            text-align: center;
        }

        .stat {
            background: #333333;
            color: #00ff88;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
            margin: 0.2rem;
            display: inline-block;
        }

        .error-message {
            background: #ff4444;
            color: #ffffff;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            color: #00ff88;
            font-size: 1.2rem;
            padding: 2rem;
        }

        .no-results {
            text-align: center;
            color: #cccccc;
            font-size: 1.1rem;
            padding: 2rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .data-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
        }

        .section-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
        }

        .player-card {
            background: #333333;
            border: 1px solid #00ff88;
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .player-card:hover {
            background: #444444;
            transform: translateY(-2px);
        }

        .player-card.selected {
            background: #00ff88;
            color: #000000;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .player-info {
            font-size: 0.9rem;
            color: #cccccc;
            margin-bottom: 0.5rem;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            font-size: 0.8rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.3rem;
            background: #222222;
            border-radius: 3px;
        }

        /* 試合スケジュールセクション */
        .schedule-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .schedule-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .schedule-controls select {
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 1rem;
            min-width: 150px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .match-card {
            background: #333333;
            border: 1px solid #00ff88;
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.3s;
        }

        .match-card:hover {
            background: #444444;
            transform: translateY(-2px);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #444444;
        }

        .match-league {
            color: #00ff88;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .match-time {
            color: #cccccc;
            font-size: 0.8rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: #222222;
            border-radius: 50%;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #cccccc;
        }

        .match-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
            margin: 0 1rem;
        }

        .match-venue {
            color: #cccccc;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.5rem;
        }

        .comparison-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .comparison-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .comparison-player {
            background: #333333;
            border-radius: 10px;
            padding: 1rem;
        }

        .comparison-player h3 {
            color: #00ff88;
            margin-bottom: 1rem;
        }

        .comparison-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .comparison-stat {
            background: #222222;
            padding: 0.8rem;
            border-radius: 5px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #cccccc;
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff88;
        }

        .ai-analysis-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .ai-input {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .ai-input input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 1rem;
        }

        .ai-input button {
            padding: 0.8rem 1.5rem;
            background: #00ff88;
            color: #000000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .ai-response {
            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1rem;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }

        .loading {
            display: none;
            text-align: center;
            color: #00ff88;
            font-size: 1.1rem;
            margin: 1rem 0;
        }

        .error {
            color: #ff4444;
            background: #330000;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .success {
            color: #00ff88;
            background: #003300;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .quick-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: #333333;
            color: #ffffff;
            border: 1px solid #00ff88;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #00ff88;
            color: #000000;
        }
        




        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .comparison-controls {
                grid-template-columns: 1fr;
            }
            
            .main-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Football Hub Japan</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/'">ホーム</button>
            <button class="nav-btn" onclick="window.location.href='/ai-agent-enhanced'">AIエージェント</button>
            <button class="nav-btn" onclick="window.location.href='/radar'">レーダーチャート</button>
            <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
        </div>
    </div>

    <div class="main-container">
        <h1 class="page-title">強化データベース</h1>
        <p class="page-subtitle">選手データとAI分析の統合プラットフォーム</p>

        <!-- 検索セクション -->
        <div class="search-section">
            <h2 class="search-title">選手検索</h2>
            
            <div class="quick-filters">
                <button class="filter-btn active" onclick="setFilter('all')">すべて</button>
                <button class="filter-btn" onclick="setFilter('japanese')">日本人選手</button>
                <button class="filter-btn" onclick="setFilter('forwards')">フォワード</button>
                <button class="filter-btn" onclick="setFilter('midfielders')">ミッドフィルダー</button>
                <button class="filter-btn" onclick="setFilter('defenders')">ディフェンダー</button>
                <button class="filter-btn" onclick="setFilter('goalkeepers')">ゴールキーパー</button>
            </div>

            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="選手名を入力..." onkeyup="handleSearch()">
                <select id="leagueSelect">
                    <option value="">すべてのリーグ</option>
                    <option value="PL">プレミアリーグ</option>
                    <option value="PD">ラ・リーガ</option>
                    <option value="SA">セリエA</option>
                    <option value="BL1">ブンデスリーガ</option>
                    <option value="FL1">リーグ・アン</option>
                    <option value="J1">J1リーグ</option>
                </select>

                
                <!-- 詳細ポジションのプルダウン -->
                <select id="detailedPositionSelect" class="search-select">
                    <option value="">詳細ポジションを選択</option>
                    <option value="ST">ストライカー (ST)</option>
                    <option value="CF">センターフォワード (CF)</option>
                    <option value="SS">セカンドストライカー (SS)</option>
                    <option value="LW">レフトウィング (LW)</option>
                    <option value="RW">ライトウィング (RW)</option>
                    <option value="AM">攻撃的MF (AM)</option>
                    <option value="CM">センターミッドフィルダー (CM)</option>
                    <option value="DM">守備的MF (DM)</option>
                    <option value="LM">レフトMF (LM)</option>
                    <option value="RM">ライトMF (RM)</option>
                    <option value="CB">センターバック (CB)</option>
                    <option value="LB">レフトバック (LB)</option>
                    <option value="RB">ライトバック (RB)</option>
                    <option value="WB">ウィングバック (WB)</option>
                    <option value="GK">ゴールキーパー (GK)</option>
                </select>
                
                <button class="search-btn" onclick="performSearch()">検索</button>
            </div>
        </div>

        <!-- 検索セクション -->
        <div class="search-section">
            <h2 class="section-title">選手検索</h2>
            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="選手名を入力..." class="search-input">
                <select id="leagueSelect" class="search-select">
                    <option value="">すべてのリーグ</option>
                    <option value="PL">プレミアリーグ</option>
                    <option value="PD">ラ・リーガ</option>
                    <option value="SA">セリエA</option>
                    <option value="BL1">ブンデスリーガ</option>
                    <option value="FL1">リーグ・アン</option>
                    <option value="J1">J1リーグ</option>
                </select>
                <select id="positionSelect" class="search-select">
                    <option value="">すべてのポジション</option>
                    <option value="FW">フォワード (FW)</option>
                    <option value="MF">ミッドフィルダー (MF)</option>
                    <option value="DF">ディフェンダー (DF)</option>
                    <option value="GK">ゴールキーパー (GK)</option>
                </select>
                <button class="search-btn" onclick="performSearch()">検索</button>
                <button class="clear-btn" onclick="clearSearch()">クリア</button>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="content-grid">
            <!-- 選手データセクション -->
            <div class="data-section" style="grid-column: 1 / -1;">
                <h2 class="section-title">選手一覧</h2>
                <div class="players-grid" id="playersGrid">
                    <!-- 選手カードがここに表示されます -->
                </div>
            </div>
        </div>
        


        <!-- 試合スケジュールセクション -->
        <div class="schedule-section">
            <h2 class="section-title">試合スケジュール</h2>
            <div class="schedule-controls">
                <select id="scheduleLeagueSelect">
                    <option value="">すべてのリーグ</option>
                    <option value="PL">プレミアリーグ</option>
                    <option value="PD">ラ・リーガ</option>
                    <option value="SA">セリエA</option>
                    <option value="BL1">ブンデスリーガ</option>
                    <option value="FL1">リーグ・アン</option>
                    <option value="J1">J1リーグ</option>
                </select>
                <select id="scheduleTimeSelect">
                    <option value="today">今日</option>
                    <option value="tomorrow">明日</option>
                    <option value="week">今週</option>
                    <option value="month">今月</option>
                </select>
                <button class="search-btn" onclick="loadScheduleMatches()">試合を表示</button>
            </div>
            <div class="matches-grid" id="matchesGrid">
                <!-- 試合情報がここに表示されます -->
            </div>
        </div>

        <!-- 選手比較セクション -->
        <div class="comparison-section">
            <h2 class="section-title">選手比較分析</h2>
            <div class="comparison-controls">
                <div class="comparison-player">
                    <h3>選手1</h3>
                    <input type="text" id="player1Input" placeholder="選手名を入力..." onchange="updateComparison()">
                    <div class="comparison-stats" id="player1Stats">
                        <!-- 選手1の統計がここに表示されます -->
                    </div>
                </div>
                
                <div class="comparison-player">
                    <h3>選手2</h3>
                    <input type="text" id="player2Input" placeholder="選手名を入力..." onchange="updateComparison()">
                    <div class="comparison-stats" id="player2Stats">
                        <!-- 選手2の統計がここに表示されます -->
                    </div>
                </div>
            </div>
            
            <button class="search-btn" onclick="compareSelectedPlayers()">AI比較分析</button>
        </div>

        <!-- AI分析セクション -->
        <div class="ai-analysis-section">
            <h2 class="section-title">AI分析</h2>
            <div class="ai-input">
                <input type="text" id="aiInput" placeholder="分析したい内容を入力してください（例：久保建英の強みを教えて）">
                <button onclick="performAIAnalysis()">分析実行</button>
            </div>
            <div class="loading" id="aiLoading">AI分析中...</div>
            <div class="ai-response" id="aiResponse">
                AI分析の結果がここに表示されます。
            </div>
        </div>
    </div>

    <script>
        // 初期化 - 修正済み v2.1 (2025-01-21 完全フォールバック対応)
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Database Enhanced v2.1 initializing...');
            initInfiniteList();
            
            // APIの可用性をチェックしてから初期化
            checkAPIAndInitialize();
            
            // スケジュールセクションの初期化も追加
            if (document.getElementById('scheduleLeagueSelect')) {
                loadScheduleMatches();
            }
            

        });

        // APIの可用性をチェックして初期化
        async function checkAPIAndInitialize() {
            try {
                console.log('Checking Japanese players API...');
                const response = await fetch('/api/japanese-players?_t=' + Date.now());
                if (response.ok) {
                    console.log('Japanese players API available, loading from server');
                    const players = await response.json();
                    if (players && players.length > 0) {
                        currentPlayers = players;
                        displayPlayers(players);
                        console.log('Loaded', players.length, 'Japanese players from API');
                    } else {
                        console.log('No players returned from API, using fallback data');
                        loadFallbackData();
                    }
                } else {
                    console.log('Japanese players API unavailable, using fallback data');
                    loadFallbackData();
                }
            } catch (error) {
                console.log('Japanese players API error, using fallback data:', error);
                loadFallbackData();
            }
        }

        // フォールバックデータを直接読み込み
        function loadFallbackData() {
            console.log('Loading fallback data...');
            const fallbackData = generateFallbackPlayers(60);
            currentPlayers = fallbackData;
            displayPlayers(fallbackData);
            console.log('Fallback data loaded:', fallbackData.length, 'players');
        }

        // 無限スクロール用の状態
        let currentPage = 1;
        let totalPages = Infinity;
        let isLoading = false;
        let io;
        let currentPlayers = [];

        // 不足している関数を追加
        function getSelectedDetailedPositions() {
            const select = document.getElementById('detailedPositionSelect');
            return select && select.value ? [select.value] : [];
        }

        // 選手表示関数（パフォーマンス最適化）
        function displayPlayers(players) {
            const grid = document.getElementById('playersGrid');
            if (!grid) return;
            
            // 表示をクリア
            grid.innerHTML = '';
            
            // 最大1000名まで表示（パフォーマンス向上のため）
            const displayPlayers = players.slice(0, 1000);
            
            console.log(`Displaying ${displayPlayers.length} players out of ${players.length} total`);
            
            // バッチ処理で表示（パフォーマンス向上）
            const batchSize = 50;
            let currentIndex = 0;
            
            function displayBatch() {
                const endIndex = Math.min(currentIndex + batchSize, displayPlayers.length);
                
                for (let i = currentIndex; i < endIndex; i++) {
                    const player = displayPlayers[i];
                    if (player && player.name) {
                        grid.appendChild(createPlayerCard(player));
                    }
                }
                
                currentIndex = endIndex;
                
                // 進捗ログ
                if (currentIndex % 100 === 0) {
                    console.log(`Displayed ${currentIndex} players...`);
                }
                
                // 次のバッチを表示
                if (currentIndex < displayPlayers.length) {
                    requestAnimationFrame(displayBatch);
                } else {
                    console.log(`Displayed ${displayPlayers.length} players...`);
                }
            }
            
            // 最初のバッチを開始
            requestAnimationFrame(displayBatch);
        }

        // エラー表示関数
        function showError(message) {
            const errorDiv = document.createElement('div');

        function initInfiniteList() {
            // 1ページ目を読み込み
            loadPlayersPage(1);
            // 監視用セントネル
            const sentinel = document.createElement('div');
            sentinel.id = 'infiniteSentinel';
            sentinel.style.height = '1px';
            sentinel.style.width = '100%';
            document.body.appendChild(sentinel);
            // IntersectionObserverでロード
            io = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    if (e.isIntersecting && !isLoading && currentPage < totalPages) {
                        loadPlayersPage(currentPage + 1);
                    }
                });
            }, { root: null, rootMargin: '2000px 0px 200px 0px', threshold: 0 });
            io.observe(sentinel);
        }

        async function loadPlayersPage(page) {
            if (isLoading) return;
            isLoading = true;
            try {
                const resp = await fetch(`/api/fotmob/players?page=${page}&limit=60&_t=${Date.now()}`);
                if (resp.ok) {
                    const data = await resp.json();
                    totalPages = data.totalPages || 1;
                    const list = Array.isArray(data.players) ? data.players : [];
                    if (list.length > 0) {
                        if (!Array.isArray(currentPlayers)) currentPlayers = [];
                        currentPlayers = currentPlayers.concat(list);
                        // 追記表示（差分のみ）
                        const grid = document.getElementById('playersGrid');
                        list.forEach(p => { if (p && p.name) grid.appendChild(createPlayerCard(p)); });
                        console.log(`Loaded page ${page}/${totalPages} with ${list.length} players`);
                    }
                } else {
                    // APIが利用できない場合、フォールバックデータを使用
                    console.log('API unavailable, using fallback data');
                    const fallbackData = generateFallbackPlayers(60);
                    if (!Array.isArray(currentPlayers)) currentPlayers = [];
                    currentPlayers = currentPlayers.concat(fallbackData);
                    const grid = document.getElementById('playersGrid');
                    fallbackData.forEach(p => { if (p && p.name) grid.appendChild(createPlayerCard(p)); });
                }
            } catch (e) {
                console.error('Load page error:', e);
                // エラー時もフォールバックデータを使用
                const fallbackData = generateFallbackPlayers(60);
                if (!Array.isArray(currentPlayers)) currentPlayers = [];
                currentPlayers = currentPlayers.concat(fallbackData);
                const grid = document.getElementById('playersGrid');
                fallbackData.forEach(p => { if (p && p.name) grid.appendChild(createPlayerCard(p)); });
            } finally {
                isLoading = false;
                currentPage = page;
            }
        }

        async function showPlayerDetails(player) {
            ensureDetailsPanel();
            const panel = document.getElementById('playerDetailsPanel');
            const name = player.name || player.fullName || player.japaneseName || 'Unknown Player';
            const team = player.currentTeam || player.team || player.teamName || 'Unknown Team';
            const position = player.position || 'Unknown Position';
            const nationality = player.nationality || 'Unknown';
            let stats = player.stats || {};

            // サーバから詳細を追加取得
            try {
                if (player.id) {
                    const r = await fetch(`/api/fotmob/players/${encodeURIComponent(player.id)}?_t=${Date.now()}`);
                    if (r.ok) {
                        const full = await r.json();
                        if (full && full.stats) { stats = { ...stats, ...full.stats }; }
                    }
                }
            } catch {}

            document.getElementById('detailsName').textContent = name;
            document.getElementById('detailsMeta').textContent = `${team} | ${position} | ${nationality}`;
            const statsEl = document.getElementById('detailsStats');
            statsEl.innerHTML = '';
            const items = [
                ['得点', stats.goals || 0],
                ['アシスト', stats.assists || 0],
                ['出場', stats.appearances || 0],
                ['分', stats.minutes || 0],
                ['評価', stats.rating || 'N/A'],
                ['黄', stats.yellowCards || 0],
                ['赤', stats.redCards || 0],
                ['シュート', stats.shots || 0],
                ['枠内', stats.shotsOnTarget || 0],
                ['パス', stats.passes || 0],
                ['成功率', stats.passAccuracy || 'N/A'],
                ['タックル', stats.tackles || 0]
            ];
            items.forEach(([label, value]) => {
                const box = document.createElement('div');
                box.style.border = '1px solid #2a2a2a';
                box.style.borderRadius = '8px';
                box.style.padding = '6px';
                box.style.textAlign = 'center';
                box.innerHTML = `<div style=\"color:#888;font-size:11px;\">${label}</div><div style=\"color:#e5e5e5;font-weight:700;font-size:13px;\">${value}</div>`;
                statsEl.appendChild(box);
            });
            const radarLink = document.getElementById('openRadar');
            radarLink.href = `/radar?player=${encodeURIComponent(name)}`;
            panel.style.display = 'block';
        }

            const cards = document.querySelectorAll('.player-card');
            cards.forEach(card => card.classList.remove('selected'));
            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('selected');

        // 検索処理
        async function performSearch() {
            const searchInput = document.getElementById('searchInput');
            const leagueSelect = document.getElementById('leagueSelect');
            const positionSelect = document.getElementById('positionSelect');
            
            if (!searchInput || !leagueSelect || !positionSelect) {
                console.error('Search elements not found');
                return;
            }
            
            const query = searchInput.value.trim();
            const league = leagueSelect.value;
            const position = positionSelect.value;

            if (!query && !league && !position) {
                // 検索条件がない場合は全選手を表示
                if (currentPlayers && currentPlayers.length > 0) {
                    displayPlayers(currentPlayers);
                } else {
                    loadSamplePlayers();
                }
                return;
            }

            try {
                // 現在の選手データから検索（高速化）
                if (currentPlayers && currentPlayers.length > 0) {
                    let filteredPlayers = currentPlayers;
                    
                    // 名前検索
                    if (query) {
                        filteredPlayers = filteredPlayers.filter(player => 
                            player.name.toLowerCase().includes(query.toLowerCase()) ||
                            player.englishName?.toLowerCase().includes(query.toLowerCase()) ||
                            player.currentTeam?.toLowerCase().includes(query.toLowerCase())
                        );
                    }
                    
                    // リーグ検索
                    if (league) {
                        filteredPlayers = filteredPlayers.filter(player => 
                            player.league === league
                        );
                    }
                    
                    // ポジション検索
                    if (position) {
                        filteredPlayers = filteredPlayers.filter(player => 
                            player.position?.toLowerCase().includes(position.toLowerCase())
                        );
                    }
                    
                    // 検索結果を表示
                    displayPlayers(filteredPlayers);
                    console.log(`Search results: ${filteredPlayers.length} players found`);
                    return;
                }
                
                // フォールバック検索
                console.log('Using fallback search');
                const fallbackResults = performFallbackSearch(query, league, position);
                if (fallbackResults.length > 0) {
                    currentPlayers = fallbackResults;
                    displayPlayers(fallbackResults);
                } else {
                    showError('選手が見つかりませんでした');
                }
            } catch (error) {
                console.error('Search error:', error);
                showError('検索中にエラーが発生しました');
            }
        }

        // 検索クリア機能
        function clearSearch() {
            const searchInput = document.getElementById('searchInput');
            const leagueSelect = document.getElementById('leagueSelect');
            const titleSelect = document.getElementById('positionSelect');
            
            if (searchInput) searchInput.value = '';
            if (leagueSelect) leagueSelect.value = '';
            if (positionSelect) positionSelect.value = '';
            
            // 全選手を再表示
            if (currentPlayers && currentPlayers.length > 0) {
                displayPlayers(currentPlayers);
                console.log('Search cleared, showing all players');
            }
        }

        // フォールバック検索処理
        function performFallbackSearch(query, league, position, detailedPositions) {
            console.log('Performing fallback search with:', { query, league, position, detailedPositions });
            
            // フォールバックデータが利用できない場合、生成
            if (!currentPlayers || currentPlayers.length === 0) {
                currentPlayers = generateFallbackPlayers(100);
            }
            
            let filteredPlayers = currentPlayers;
            
            // クエリによるフィルタリング
            if (query) {
                filteredPlayers = filteredPlayers.filter(player => 
                    player.name.toLowerCase().includes(query.toLowerCase()) ||
                    player.currentTeam.toLowerCase().includes(query.toLowerCase()) ||
                    player.position.toLowerCase().includes(query.toLowerCase())
                );
            }
            
            // リーグによるフィルタリング
            if (league) {
                // リーグ情報がない場合は、チーム名で推測
                filteredPlayers = filteredPlayers.filter(player => 
                    player.currentTeam && player.currentTeam.toLowerCase().includes(league.toLowerCase())
                );
            }
            
            // ポジションによるフィルタリング
            if (position) {
                filteredPlayers = filteredPlayers.filter(player => 
                    player.position && player.position.toLowerCase().includes(position.toLowerCase())
                );
            }
            
            // 詳細ポジションによるフィルタリング
            if (detailedPositions.length > 0) {
                filteredPlayers = filteredPlayers.filter(player => 
                    detailedPositions.some(dp => 
                        player.position && player.position.toLowerCase().includes(dp.toLowerCase())
                    )
                );
            }
            
            console.log('Fallback search results:', filteredPlayers.length, 'players');
            return filteredPlayers;
        }

        // リアルタイム検索
        function handleSearch() {
            clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(performSearch, 500);
        }

        // フィルター設定
        function setFilter(filter) {
            currentFilter = filter;
            
            // フィルターボタンの状態を更新
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 選手をフィルタリング
            let filteredPlayers = currentPlayers;

            switch (filter) {
                case 'japanese':
                    filteredPlayers = currentPlayers.filter(p => p.nationality === 'Japan');
                    break;
                case 'forwards':
                    filteredPlayers = currentPlayers.filter(p => p.position === 'Forward');
                    break;
                case 'midfielders':
                    filteredPlayers = currentPlayers.filter(p => p.position === 'Midfielder');
                    break;
                case 'defenders':
                    filteredPlayers = currentPlayers.filter(p => p.position === 'Defender');
                    break;
                case 'goalkeepers':
                    filteredPlayers = currentPlayers.filter(p => p.position === 'Goalkeeper');
                    break;
            }

            displayPlayers(filteredPlayers);
        }

        // 選手比較更新
        async function updateComparison() {
            const player1Name = document.getElementById('player1Input').value.trim();
            const player2Name = document.getElementById('player2Input').value.trim();

            if (player1Name) {
                const player1 = await searchPlayer(player1Name);
                if (player1) {
                    displayPlayerStats(player1, 'player1Stats');
                }
            }

            if (player2Name) {
                const player2 = await searchPlayer(player2Name);
                if (player2) {
                    displayPlayerStats(player2, 'player2Stats');
                }
            }
        }

        // 選手検索
        async function searchPlayer(name) {
            try {
                const response = await fetch(`/api/fotmob/search?q=${encodeURIComponent(name)}&limit=1`);
                const data = await response.json();
                
                if (data.players && data.players.length > 0) {
                    return data.players[0];
                }
                return null;
            } catch (error) {
                console.error('Player search error:', error);
                return null;
            }
        }

        // 選手統計表示
        function displayPlayerStats(player, containerId) {
            const container = document.getElementById(containerId);
            
            container.innerHTML = `
                <div class="comparison-stat">
                    <div class="stat-label">得点</div>
                    <div class="stat-value">${player.stats?.goals || 0}</div>
                </div>
                <div class="comparison-stat">
                    <div class="stat-label">アシスト</div>
                    <div class="stat-value">${player.stats?.assists || 0}</div>
                </div>
                <div class="comparison-stat">
                    <div class="stat-label">出場試合</div>
                    <div class="stat-value">${player.stats?.appearances || 0}</div>
                </div>
                <div class="comparison-stat">
                    <div class="stat-label">評価</div>
                    <div class="stat-value">${player.stats?.rating || 'N/A'}</div>
                </div>
                <div class="comparison-stat">
                    <div class="stat-label">出場時間</div>
                    <div class="stat-value">${player.stats?.minutes || 0}分</div>
                </div>
                <div class="comparison-stat">
                    <div class="stat-label">シュート</div>
                    <div class="stat-value">${player.stats?.shots || 0}</div>
                </div>
                <div class="comparison-stat">
                    <div class="stat-label">枠内シュート</div>
                    <div class="stat-value">${player.stats?.shotsOnTarget || 0}</div>
                </div>
                <div class="comparison-stat">
                    <div class="stat-label">パス成功率</div>
                    <div class="stat-value">${player.stats?.passAccuracy || 'N/A'}</div>
                </div>
            `;
        }

        // 選択された選手を比較
        async function compareSelectedPlayers() {
            const player1Name = document.getElementById('player1Input').value.trim();
            const player2Name = document.getElementById('player2Input').value.trim();

            if (!player1Name || !player2Name) {
                showError('比較する選手名を両方入力してください');
                return;
            }

            try {
                const response = await fetch('/api/ai/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player1: player1Name, player2: player2Name })
                });

                const data = await response.json();
                
                if (data.response) {
                    showSuccess(`<h3>${player1Name} vs ${player2Name}</h3><p>${data.response}</p>`);
                } else {
                    showError('比較分析を実行できませんでした');
                }
            } catch (error) {
                console.error('Comparison error:', error);
                showError('比較分析中にエラーが発生しました');
            }
        }

        // AI分析実行
        async function performAIAnalysis() {
            const input = document.getElementById('aiInput').value.trim();
            
            if (!input) {
                showError('分析内容を入力してください');
                return;
            }

            const loading = document.getElementById('aiLoading');
            const response = document.getElementById('aiResponse');
            
            loading.style.display = 'block';
            response.innerHTML = '';

            try {
                const aiResponse = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: input })
                });

                const data = await aiResponse.json();
                
                if (data.response) {
                    response.innerHTML = `<div class="success">${data.response}</div>`;
                } else {
                    response.innerHTML = '<div class="error">AI分析を実行できませんでした</div>';
                }
            } catch (error) {
                console.error('AI analysis error:', error);
                response.innerHTML = '<div class="error">AI分析中にエラーが発生しました</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        // エラー表示
        function showError(message) {
            const response = document.getElementById('aiResponse');
            response.innerHTML = `<div class="error">${message}</div>`;
        }

        // 成功表示
        function showSuccess(message) {
            const response = document.getElementById('aiResponse');
            response.innerHTML = `<div class="success">${message}</div>`;
        }

        // 試合スケジュールを読み込む
        async function loadScheduleMatches() {
            const league = document.getElementById('scheduleLeagueSelect').value;
            const timeRange = document.getElementById('scheduleTimeSelect').value;
            
            try {
                const response = await fetch(`/api/fotmob/matches?league=${league}&timeRange=${timeRange}`);
                const data = await response.json();
                
                if (data.matches && data.matches.length > 0) {
                    displayScheduleMatches(data.matches);
                } else {
                    document.getElementById('matchesGrid').innerHTML = '<div class="no-data">試合が見つかりませんでした</div>';
                }
            } catch (error) {
                console.error('Schedule loading error:', error);
                document.getElementById('matchesGrid').innerHTML = '<div class="error">試合データの読み込みに失敗しました</div>';
            }
        }

        // 試合スケジュールを表示
        function displayScheduleMatches(matches) {
            const grid = document.getElementById('matchesGrid');
            grid.innerHTML = '';
            
            matches.forEach(match => {
                const matchCard = document.createElement('div');
                matchCard.className = 'match-card';
                matchCard.innerHTML = `
                    <div class="match-header">
                        <span class="match-league">${match.league || 'Unknown League'}</span>
                        <span class="match-status ${getStatusClass(match.status)}">${getStatusText(match.status)}</span>
                    </div>
                    <div class="match-teams">
                        <div class="team home-team">
                            <span class="team-name">${match.homeTeam}</span>
                            <span class="team-score">${match.homeScore || 0}</span>
                        </div>
                        <div class="match-vs">vs</div>
                        <div class="team away-team">
                            <span class="team-score">${match.awayScore || 0}</span>
                            <span class="team-name">${match.awayTeam}</span>
                        </div>
                    </div>
                    <div class="match-info">
                        <span class="match-venue">${match.venue || 'Unknown Venue'}</span>
                        <span class="match-date">${formatMatchDate(match.date)}</span>
                    </div>
                `;
                grid.appendChild(matchCard);
            });
        }

        // 試合ステータスのクラスを取得
        function getStatusClass(status) {
            switch (status) {
                case 'Finished':
                case 'FT':
                case 'FINISHED':
                    return 'status-finished';
                case 'Not Started':
                case 'NOT_STARTED':
                    return 'status-scheduled';
                case 'In Play':
                case 'IN_PLAY':
                    return 'status-live';
                case 'Half Time':
                case 'HALF_TIME':
                    return 'status-halftime';
                default:
                    return 'status-unknown';
            }
        }

        // 試合ステータスのテキストを取得
        function getStatusText(status) {
            switch (status) {
                case 'Finished':
                case 'FT':
                case 'FINISHED':
                    return '終了';
                case 'Not Started':
                case 'NOT_STARTED':
                    return '予定';
                case 'In Play':
                case 'IN_PLAY':
                    return '試合中';
                case 'Half Time':
                case 'HALF_TIME':
                    return 'ハーフタイム';
                default:
                    return '不明';
            }
        }

        // 試合日付をフォーマット
        function formatMatchDate(dateString) {
            if (!dateString) return '日時不明';
            
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('ja-JP', {
                    month: 'numeric',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (error) {
                return '日時不明';
            }
        }
    </script>
