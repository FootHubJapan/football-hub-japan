<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
    <title>強化データベース - Football Hub Japan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .search-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-select {
            background: #333333;
            color: #ffffff;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 0.6rem;
            font-size: 0.9rem;
            min-width: 150px;
        }

        .search-select:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .search-input {
            background: #333333;
            color: #ffffff;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 0.6rem;
            font-size: 0.9rem;
            width: 100%;
        }

        .search-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .filter-btn {
            background: #333333;
            color: #ffffff;
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .search-btn {
            background: #00ff88;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .player-card {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .player-card:hover {
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
        }

        .player-avatar {
            text-align: center;
            margin-bottom: 1rem;
        }

        .player-avatar img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #00ff88;
        }

        .player-name {
            color: #00ff88;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .player-team,
        .player-position,
        .player-nationality {
            color: #cccccc;
            margin-bottom: 0.3rem;
            text-align: center;
        }

        .player-stats {
            margin-top: 1rem;
            text-align: center;
        }

        .stat {
            background: #333333;
            color: #00ff88;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
            margin: 0.2rem;
            display: inline-block;
        }

        .error-message {
            background: #ff4444;
            color: #ffffff;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            color: #00ff88;
            font-size: 1.2rem;
            padding: 2rem;
        }

        .no-results {
            text-align: center;
            color: #cccccc;
            font-size: 1.1rem;
            padding: 2rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .data-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
        }

        .section-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
        }

        .player-card {
            background: #333333;
            border: 1px solid #00ff88;
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .player-card:hover {
            background: #444444;
            transform: translateY(-2px);
        }

        .player-card.selected {
            background: #00ff88;
            color: #000000;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .player-info {
            font-size: 0.9rem;
            color: #cccccc;
            margin-bottom: 0.5rem;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            font-size: 0.8rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.3rem;
            background: #222222;
            border-radius: 3px;
        }

        /* 試合スケジュールセクション */
        .schedule-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .schedule-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .schedule-controls select {
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 1rem;
            min-width: 150px;
        }

        .schedule-btn {
            background: #00ff88;
            color: #000;
            border: 2px solid #00ff88;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            font-weight: bold;
        }

        .schedule-btn:hover {
            background: #00cc6a;
            border-color: #00cc6a;
            transform: translateY(-2px);
        }

        .clear-schedule-btn {
            background: #666;
            color: #fff;
            border: 2px solid #666;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .clear-schedule-btn:hover {
            background: #888;
            border-color: #888;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .match-card {
            background: #333333;
            border: 1px solid #00ff88;
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.3s;
        }

        .match-card:hover {
            background: #444444;
            transform: translateY(-2px);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #444444;
        }

        .match-league {
            color: #00ff88;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .match-time {
            color: #cccccc;
            font-size: 0.8rem;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: #222222;
            border-radius: 50%;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #cccccc;
        }

        .match-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
            margin: 0 1rem;
        }

        .match-venue {
            color: #cccccc;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.5rem;
        }

        .comparison-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .comparison-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .comparison-player {
            background: #333333;
            border-radius: 10px;
            padding: 1rem;
        }

        .comparison-player h3 {
            color: #00ff88;
            margin-bottom: 1rem;
        }

        .comparison-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .comparison-stat {
            background: #222222;
            padding: 0.8rem;
            border-radius: 5px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #cccccc;
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff88;
        }

        .ai-analysis-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .ai-input {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .ai-input input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 1rem;
        }

        .ai-input button {
            padding: 0.8rem 1.5rem;
            background: #00ff88;
            color: #000000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .ai-response {
            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1rem;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }

        .loading {
            display: none;
            text-align: center;
            color: #00ff88;
            font-size: 1.1rem;
            margin: 1rem 0;
        }

        .error {
            color: #ff4444;
            background: #330000;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .success {
            color: #00ff88;
            background: #003300;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .quick-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: #333333;
            color: #ffffff;
            border: 1px solid #00ff88;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .search-help {
            margin-top: 0.5rem;
            color: #00ff88;
            font-size: 0.8rem;
            text-align: center;
        }

        .search-help small {
            opacity: 0.8;
        }
        




        /* 選手詳細パネルスタイル */
        .player-details-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            background: #1a1a1a;
            border: 2px solid #00ff88;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .player-details-panel.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .panel-header {
            display: flex;
            align-items: center;
            padding: 2rem;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            position: relative;
        }

        .player-photo-large {
            margin-right: 2rem;
        }

        .player-basic-info h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #000;
        }

        .player-basic-info p {
            margin: 0.3rem 0;
            color: #333;
            font-weight: 500;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.3);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: scale(1.1);
        }

        .panel-content {
            padding: 2rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .stats-section h3 {
            color: #00ff88;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-item {
            background: #333;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-item:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
        }

        .stat-label {
            display: block;
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            display: block;
            color: #00ff88;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .actions-section {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .action-btn {
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        /* 選手カードの改善 */
        .player-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .player-card:hover {
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            transition: left 0.5s;
        }

        .player-card:hover::before {
            left: 100%;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .player-actions {
            margin-top: 1rem;
            text-align: center;
        }

        .detail-btn {
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .detail-btn:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        /* オーバーレイ */
        .player-details-panel::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: -1;
        }

        /* データベース管理セクション */
        .database-management-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .db-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .db-btn {
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .db-btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .db-status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            background: #333;
            border-radius: 10px;
            padding: 1.5rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background: #222;
            border-radius: 5px;
        }

        .status-label {
            color: #ccc;
            font-weight: 500;
        }

        .status-value {
            color: #00ff88;
            font-weight: bold;
        }

        /* 進捗表示スタイル */
        .progress-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #444;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            color: #ccc;
            font-size: 0.8rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .comparison-controls {
                grid-template-columns: 1fr;
            }
            
            .main-container {
                padding: 1rem;
            }

            .player-details-panel {
                width: 95%;
                max-height: 95vh;
            }

            .panel-header {
                flex-direction: column;
                text-align: center;
                padding: 1.5rem;
            }

            .player-photo-large {
                margin-right: 0;
                margin-bottom: 1rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .actions-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Football Hub Japan</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/'">ホーム</button>
            <button class="nav-btn" onclick="window.location.href='/ai-agent-enhanced'">AIエージェント</button>
            <button class="nav-btn" onclick="window.location.href='/radar'">レーダーチャート</button>
            <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
        </div>
    </div>

    <div class="main-container">
        <h1 class="page-title">強化データベース</h1>
        <p class="page-subtitle">選手データとAI分析の統合プラットフォーム</p>

        <!-- 検索セクション -->
        <div class="search-section">
            <h2 class="search-title">選手検索</h2>
            
            <div class="quick-filters">
                <button class="filter-btn active" onclick="setFilter('all')">すべて</button>
                <button class="filter-btn" onclick="setFilter('japanese')">日本人選手</button>
                <button class="filter-btn" onclick="setFilter('forwards')">フォワード</button>
                <button class="filter-btn" onclick="setFilter('midfielders')">ミッドフィルダー</button>

        // API連携サービス
        class APIConnectionService {
            constructor() {
                this.baseUrl = window.location.hostname === 'localhost' ? '' : 'https://football-hub-japan-ubzb.onrender.com';
                this.cache = new Map();
                this.cacheTimeout = 5 * 60 * 1000; // 5分
            }

            // キャッシュからデータを取得
            getFromCache(key) {
                const cached = this.cache.get(key);
                if (cached && Date.now() - cached.timestamp < this.cacheTimeout) {
                    return cached.data;
                }
                return null;
            }

            // データをキャッシュに保存
            setCache(key, data) {
                this.cache.set(key, {
                    data,
                    timestamp: Date.now()
                });
            }

            // 選手検索
            async searchPlayers(query, filters = {}) {
                const cacheKey = `search_${query}_${JSON.stringify(filters)}`;
                const cached = this.getFromCache(cacheKey);
                if (cached) return cached;

                try {
                    const params = new URLSearchParams();
                    if (query) params.append('q', query);
                    if (filters.league) params.append('league', filters.league);
                    if (filters.position) params.append('position', filters.position);
                    if (filters.nationality) params.append('nationality', filters.nationality);
                    params.append('limit', '50');

                    const response = await fetch(`${this.baseUrl}/api/search/players?${params}`);
                    if (!response.ok) throw new Error('Search failed');

                    const data = await response.json();
                    this.setCache(cacheKey, data);
                    return data;
                } catch (error) {
                    console.error('選手検索エラー:', error);
                    return { players: [], total: 0 };
                }
            }

            // 選手詳細取得
            async getPlayerDetails(playerId) {
                const cacheKey = `player_${playerId}`;
                const cached = this.getFromCache(cacheKey);
                if (cached) return cached;

                try {
                    const response = await fetch(`${this.baseUrl}/api/players/${playerId}`);
                    if (!response.ok) throw new Error('Player not found');

                    const data = await response.json();
                    this.setCache(cacheKey, data);
                    return data;
                } catch (error) {
                    console.error('選手詳細取得エラー:', error);
                    return null;
                }
            }

            // チーム選手一覧取得
            async getTeamPlayers(teamId, season = 2024) {
                const cacheKey = `team_players_${teamId}_${season}`;
                const cached = this.getFromCache(cacheKey);
                if (cached) return cached;

                try {
                    const response = await fetch(`${this.baseUrl}/api/teams/${teamId}/players?season=${season}`);
                    if (!response.ok) throw new Error('Team players not found');

                    const data = await response.json();
                    this.setCache(cacheKey, data);
                    return data;
                } catch (error) {
                    console.error('チーム選手取得エラー:', error);
                    return { players: [], count: 0 };
                }
            }

            // 選手統計取得
            async getPlayerStats(playerId, season = 2024) {
                const cacheKey = `stats_${playerId}_${season}`;
                const cached = this.getFromCache(cacheKey);
                if (cached) return cached;

                try {
                    const response = await fetch(`${this.baseUrl}/api/players/${playerId}/stats?season=${season}`);
                    if (!response.ok) throw new Error('Stats not found');

                    const data = await response.json();
                    this.setCache(cacheKey, data);

        // 画像URLを検証して有効なURLを返す関数

            if (!photoUrl) return null;
            
            // placeholder.pngや不正なURLを除外
            if (photoUrl.includes('placeholder.png') || 
                photoUrl.includes('undefined') || 
                photoUrl.includes('null') ||
                photoUrl === 'placeholder.png') {
                return null;
            }
            
            // 有効な画像URLかチェック
            if (photoUrl.startsWith('http') && 
                (photoUrl.includes('.png') || photoUrl.includes('.jpg') || photoUrl.includes('.jpeg'))) {
                return photoUrl;
            }
            
            return null;
        }

            // 表示をクリア
            grid.innerHTML = '';
            
            // 全選手を表示（パフォーマンス向上のため、ページネーションで制御）
            const playersToDisplay = players;
            
            console.log(`Displaying ${playersToDisplay.length} players out of ${players.length} total`);
            
            // バッチ処理で表示（パフォーマンス向上）
            const batchSize = 50;
            let currentIndex = 0;
            
            function displayBatch() {
                const endIndex = Math.min(currentIndex + batchSize, playersToDisplay.length);
                
                for (let i = currentIndex; i < endIndex; i++) {
                    const player = playersToDisplay[i];
                if (player && player.name) {
                    grid.appendChild(createPlayerCard(player));
                }
                }
                
                currentIndex = endIndex;
                
                // 進捗ログ
                if (currentIndex % 100 === 0) {
                    console.log(`Displayed ${currentIndex} players...`);
                }
                
                // 次のバッチを表示
                if (currentIndex < playersToDisplay.length) {
                    requestAnimationFrame(displayBatch);
                } else {
                    console.log(`Displayed ${playersToDisplay.length} players...`);
                }
            }
            
            // 最初のバッチを開始
            requestAnimationFrame(displayBatch);
        }

        function initInfiniteList() {
            // 1ページ目を読み込み
            loadPlayersPage(1);
            // 監視用セントネル
            const sentinel = document.createElement('div');
            sentinel.id = 'infiniteSentinel';
            sentinel.style.height = '1px';
            sentinel.style.width = '100%';
            document.body.appendChild(sentinel);
            // IntersectionObserverでロード
            io = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    if (e.isIntersecting && !isLoading && currentPage < totalPages) {
                        loadPlayersPage(currentPage + 1);
                    }
                });
            }, { root: null, rootMargin: '2000px 0px 200px 0px', threshold: 0 });
            io.observe(sentinel);
        }

        async function loadPlayersPage(page) {
            if (isLoading) return;
            isLoading = true;
            try {
                const resp = await fetch(`/api/fotmob/players?page=${page}&limit=60&_t=${Date.now()}`);
                if (resp.ok) {
                    const data = await resp.json();
                    totalPages = data.totalPages || 1;
                    const list = Array.isArray(data.players) ? data.players : [];
                    if (list.length > 0) {
                        if (!Array.isArray(currentPlayers)) currentPlayers = [];
                        currentPlayers = currentPlayers.concat(list);
                        // 追記表示（差分のみ）
                        const grid = document.getElementById('playersGrid');
                        list.forEach(p => { if (p && p.name) grid.appendChild(createPlayerCard(p)); });
                        console.log(`Loaded page ${page}/${totalPages} with ${list.length} players`);
                    }
                } else {
                    // APIが利用できない場合、フォールバックデータを使用
                    console.log('API unavailable, using fallback data');
                    const fallbackData = generateFallbackPlayers(60);
                    if (!Array.isArray(currentPlayers)) currentPlayers = [];
                    currentPlayers = currentPlayers.concat(fallbackData);
                    const grid = document.getElementById('playersGrid');
                    fallbackData.forEach(p => { if (p && p.name) grid.appendChild(createPlayerCard(p)); });
                }
            } catch (e) {
                console.error('Load page error:', e);
                // エラー時もフォールバックデータを使用
                const fallbackData = generateFallbackPlayers(60);
                if (!Array.isArray(currentPlayers)) currentPlayers = [];
                currentPlayers = currentPlayers.concat(fallbackData);
                const grid = document.getElementById('playersGrid');
                fallbackData.forEach(p => { if (p && p.name) grid.appendChild(createPlayerCard(p)); });
            } finally {
                isLoading = false;
                currentPage = page;
            }
        }

        async function showPlayerDetails(player) {
            ensureDetailsPanel();
            const panel = document.getElementById('playerDetailsPanel');
            const name = player.name || player.fullName || player.japaneseName || 'Unknown Player';
            const team = player.currentTeam || player.team || player.teamName || 'Unknown Team';
            const position = player.position || 'Unknown Position';
            const nationality = player.nationality || 'Unknown';
            let stats = player.stats || {};

            // サーバから詳細を追加取得
            try {
                if (player.id) {
                    const r = await fetch(`/api/fotmob/players/${encodeURIComponent(player.id)}?_t=${Date.now()}`);
                    if (r.ok) {
                        const full = await r.json();
                        if (full && full.stats) { stats = { ...stats, ...full.stats }; }
                    }
                }
            } catch {}

            document.getElementById('detailsName').textContent = name;
            document.getElementById('detailsMeta').textContent = `${team} | ${position} | ${nationality}`;
            const statsEl = document.getElementById('detailsStats');
            statsEl.innerHTML = '';
            const items = [
                ['得点', stats.goals || 0],
                ['アシスト', stats.assists || 0],
                ['出場', stats.appearances || 0],
                ['分', stats.minutes || 0],
                ['評価', stats.rating || 'N/A'],
                ['黄', stats.yellowCards || 0],
                ['赤', stats.redCards || 0],
                ['シュート', stats.shots || 0],
                ['枠内', stats.shotsOnTarget || 0],
                ['パス', stats.passes || 0],
                ['成功率', stats.passAccuracy || 'N/A'],
                ['タックル', stats.tackles || 0]
            ];
            items.forEach(([label, value]) => {
                const box = document.createElement('div');
                box.style.border = '1px solid #2a2a2a';
                box.style.borderRadius = '8px';
                box.style.padding = '6px';
                box.style.textAlign = 'center';
                box.innerHTML = `<div style=\"color:#888;font-size:11px;\">${label}</div><div style=\"color:#e5e5e5;font-weight:700;font-size:13px;\">${value}</div>`;
                statsEl.appendChild(box);
            });
            const radarLink = document.getElementById('openRadar');
            radarLink.href = `/radar?player=${encodeURIComponent(name)}`;
            panel.style.display = 'block';
        }

        // フォールバック検索処理（日本語対応強化）
        function performFallbackSearch(query, league, position, detailedPositions) {
            console.log('Performing fallback search with:', { query, league, position, detailedPositions });
            
            // フォールバックデータが利用できない場合、生成
            if (!currentPlayers || currentPlayers.length === 0) {
                currentPlayers = generateFallbackPlayers(100);
            }
            
            let filteredPlayers = currentPlayers;
            
            // クエリによるフィルタリング（日本語対応）
            if (query) {
                console.log(`🔍 フォールバック検索: "${query}" (日本語対応)`);
                
                // 日本語の選手名を英語名に変換（主要選手）
                const japanesePlayerMap = {
                    '久保建英': 'Takefusa Kubo',
                    '三苫薫': 'Kaoru Mitoma',
                    '堂安律': 'Ritsu Doan',
                    '田中碧': 'Ao Tanaka',
                    '伊藤洋輝': 'Hiroki Ito',
                    '遠藤航': 'Wataru Endo',
                    '南野拓実': 'Takumi Minamino',
                    '浅野拓磨': 'Takuma Asano',
                    '富安健洋': 'Takehiro Tomiyasu'
                };
                
                // 日本語名と英語名の両方で検索
                const searchTerms = [query];
                if (japanesePlayerMap[query]) {
                    searchTerms.push(japanesePlayerMap[query]);
                    console.log(`🇯🇵 日本語選手名検出: ${query} → ${japanesePlayerMap[query]}`);
                }
                
                filteredPlayers = currentPlayers.filter(player => {
                    return searchTerms.some(term => 
                        player.name.toLowerCase().includes(term.toLowerCase()) ||
                        player.fullName.toLowerCase().includes(term.toLowerCase()) ||
                        player.englishName.toLowerCase().includes(term.toLowerCase())
                    );
                });
            }
            // クエリによるフィルタリングは上記で既に処理済み
            
            // リーグによるフィルタリング
            if (league) {
                // リーグ情報がない場合は、チーム名で推測
                filteredPlayers = filteredPlayers.filter(player => 
                    player.currentTeam && player.currentTeam.toLowerCase().includes(league.toLowerCase())
                );
            }
            
            // ポジションによるフィルタリング
            if (position) {
                filteredPlayers = filteredPlayers.filter(player => 
                    player.position && player.position.toLowerCase().includes(position.toLowerCase())
                );
            }
            
            // 詳細ポジションによるフィルタリング
            if (detailedPositions.length > 0) {
                filteredPlayers = filteredPlayers.filter(player => 
                    detailedPositions.some(dp => 
                        player.position && player.position.toLowerCase().includes(dp.toLowerCase())
                    )
                );
            }
            
            console.log('Fallback search results:', filteredPlayers.length, 'players');
            return filteredPlayers;
        }

        // 選択された選手を比較
        async function compareSelectedPlayers() {
            const player1Name = document.getElementById('player1Input').value.trim();
            const player2Name = document.getElementById('player2Input').value.trim();

            if (!player1Name || !player2Name) {
                showError('比較する選手名を両方入力してください');
                return;
            }

            try {
                const response = await fetch('/api/ai/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player1: player1Name, player2: player2Name })
                });

                const data = await response.json();
                
                if (data.response) {
                    showSuccess(`<h3>${player1Name} vs ${player2Name}</h3><p>${data.response}</p>`);
                } else {
                    showError('比較分析を実行できませんでした');
                }
            } catch (error) {
                console.error('Comparison error:', error);
                showError('比較分析中にエラーが発生しました');
            }
        }

        // AI分析実行
        async function performAIAnalysis() {
            const input = document.getElementById('aiInput').value.trim();
            
            if (!input) {
                showError('分析内容を入力してください');
                return;
            }

            const loading = document.getElementById('aiLoading');
            const response = document.getElementById('aiResponse');
            
            loading.style.display = 'block';
            response.innerHTML = '';

            try {
                const aiResponse = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: input })
                });

                const data = await aiResponse.json();
                
                if (data.response) {
                    response.innerHTML = `<div class="success">${data.response}</div>`;
                } else {
                    response.innerHTML = '<div class="error">AI分析を実行できませんでした</div>';
                }
            } catch (error) {
                console.error('AI analysis error:', error);
                response.innerHTML = '<div class="error">AI分析中にエラーが発生しました</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        // エラー表示
        function showError(message) {
            const response = document.getElementById('aiResponse');
            response.innerHTML = `<div class="error">${message}</div>`;
        }

        // 成功表示
        function showSuccess(message) {
            const response = document.getElementById('aiResponse');
            response.innerHTML = `<div class="success">${message}</div>`;
        }

        // 試合スケジュールを読み込む
        async function loadScheduleMatches() {
            const league = document.getElementById('scheduleLeagueSelect').value;
            const timeRange = document.getElementById('scheduleTimeSelect').value;
            
            try {
                console.log('Loading schedule matches for:', { league, timeRange });
                
                // APIから試合データを取得
                const response = await fetch(`/api/fotmob/matches?league=${league}&timeRange=${timeRange}&_t=${Date.now()}`);
                const data = await response.json();
                
                if (data.matches && data.matches.length > 0) {
                    displayScheduleMatches(data.matches);
                    console.log(`Loaded ${data.matches.length} matches`);
                } else {
                    // フォールバックデータを使用
                    console.log('No matches from API, using fallback data');
                    const fallbackMatches = generateFallbackMatches(league, timeRange);
                    displayScheduleMatches(fallbackMatches);
                }
            } catch (error) {
                console.error('Schedule loading error:', error);
                // エラー時もフォールバックデータを使用
                const fallbackMatches = generateFallbackMatches(league, timeRange);
                displayScheduleMatches(fallbackMatches);
            }
        }

        // スケジュールクリア機能
        function clearSchedule() {
            const leagueSelect = document.getElementById('scheduleLeagueSelect');
            const timeSelect = document.getElementById('scheduleTimeSelect');
            
            if (leagueSelect) leagueSelect.value = '';
            if (timeSelect) timeSelect.value = '';
            
            // 試合グリッドをクリア
            const matchesGrid = document.getElementById('matchesGrid');
            if (matchesGrid) {
                matchesGrid.innerHTML = '<div class="no-data">リーグと期間を選択して試合を表示してください</div>';
            }
            
            console.log('Schedule cleared');
        }

        // フォールバック試合データ生成
        function generateFallbackMatches(league, timeRange) {
            const matches = [];
            const today = new Date();
            
            // リーグ別の試合データ
            const leagueMatches = {
                'PL': [
                    { homeTeam: 'Manchester City', awayTeam: 'Arsenal', date: today, status: 'Scheduled' },
                    { homeTeam: 'Liverpool', awayTeam: 'Chelsea', date: new Date(today.getTime() + 86400000), status: 'Scheduled' }
                ],
                'PD': [
                    { homeTeam: 'Real Madrid', awayTeam: 'Barcelona', date: today, status: 'Scheduled' },
                    { homeTeam: 'Atletico Madrid', awayTeam: 'Sevilla', date: new Date(today.getTime() + 86400000), status: 'Scheduled' }
                ],
                'J1': [
                    { homeTeam: '浦和レッズ', awayTeam: '横浜F・マリノス', date: today, status: 'Scheduled' },
                    { homeTeam: '川崎フロンターレ', awayTeam: 'FC東京', date: new Date(today.getTime() + 86400000), status: 'Scheduled' }
                ]
            };
            
            // 選択されたリーグの試合を返す
            if (league && leagueMatches[league]) {
                return leagueMatches[league].map(match => ({
                    ...match,
                    league: league,
                    venue: `${match.homeTeam} Stadium`,
                    homeScore: null,
                    awayScore: null
                }));
            }
            
            // デフォルトの試合データ
            return [
                {
                    league: 'PL',
                    homeTeam: 'Manchester United',
                    awayTeam: 'Tottenham',
                    date: today,
                    status: 'Scheduled',
                    venue: 'Old Trafford',
                    homeScore: null,
                    awayScore: null
                }
            ];
        }

        // 試合スケジュールを表示
        function displayScheduleMatches(matches) {
            const grid = document.getElementById('matchesGrid');
            grid.innerHTML = '';
            
            matches.forEach(match => {
                const matchCard = document.createElement('div');
                matchCard.className = 'match-card';
                matchCard.innerHTML = `
                    <div class="match-header">
                        <span class="match-league">${match.league || 'Unknown League'}</span>
                        <span class="match-status ${getStatusClass(match.status)}">${getStatusText(match.status)}</span>
                    </div>
                    <div class="match-teams">
                        <div class="team home-team">
                            <span class="team-name">${match.homeTeam}</span>
                            <span class="team-score">${match.homeScore || 0}</span>
                        </div>
                        <div class="match-vs">vs</div>
                        <div class="team away-team">
                            <span class="team-score">${match.awayScore || 0}</span>
                            <span class="team-name">${match.awayTeam}</span>
                        </div>
                    </div>
                    <div class="match-info">
                        <span class="match-venue">${match.venue || 'Unknown Venue'}</span>
                        <span class="match-date">${formatMatchDate(match.date)}</span>
                    </div>
                `;
                grid.appendChild(matchCard);
            });
        }

        // 試合ステータスのクラスを取得
        function getStatusClass(status) {
            switch (status) {
                case 'Finished':
                case 'FT':
                case 'FINISHED':
                    return 'status-finished';
                case 'Not Started':
                case 'NOT_STARTED':
                    return 'status-scheduled';
                case 'In Play':
                case 'IN_PLAY':
                    return 'status-live';
                case 'Half Time':
                case 'HALF_TIME':
                    return 'status-halftime';
                default:
                    return 'status-unknown';
            }
        }

        // 試合ステータスのテキストを取得
        function getStatusText(status) {
            switch (status) {
                case 'Finished':
                case 'FT':
                case 'FINISHED':
                    return '終了';
                case 'Not Started':
                case 'NOT_STARTED':
                    return '予定';
                case 'In Play':
                case 'IN_PLAY':
                    return '試合中';
                case 'Half Time':
                case 'HALF_TIME':
                    return 'ハーフタイム';
                default:
                    return '不明';
            }
        }

        // 試合日付をフォーマット
        function formatMatchDate(dateString) {
            if (!dateString) return '日時不明';
            
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('ja-JP', {
                    month: 'numeric',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (error) {
                return '日時不明';
            }
        }
    </script>
