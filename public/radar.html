<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
    <title>強化レーダーチャート - Football Hub Japan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff88;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: #333333;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .controls-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .controls-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
        }

        .comparison-type {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .type-btn {
            background: #333333;
            color: #ffffff;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .type-btn.active {
            background: #00ff88;
            color: #000000;
        }

        .type-btn:hover {
            background: #00ff88;
            color: #000000;
        }

        .stats-selection-section {
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .selection-title {
            color: #00ff88;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .season-selection {
            margin-bottom: 1rem;
        }

        .season-selection label {
            color: #cccccc;
            margin-right: 1rem;
        }

        .season-dropdown {
            padding: 0.5rem;
            background: #0a0a0a;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 5px;
        }

        .stats-dropdown-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stats-dropdown-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stats-dropdown-group label {
            color: #cccccc;
            font-size: 0.9rem;
        }

        .stats-dropdown {
            padding: 0.5rem;
            background: #0a0a0a;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 5px;
        }

        .selection-counter {
            color: #00ff88;
            font-weight: bold;
            text-align: center;
            padding: 0.5rem;
            background: #1a1a1a;
            border-radius: 5px;
        }

        .selection-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .selection-group {
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1.5rem;
        }

        .search-section {
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.8rem;
            background: #0a0a0a;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 5px;
            font-size: 1rem;
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 5px;
            margin-top: 0.5rem;
        }

        .search-result-item {
            padding: 0.8rem;
            cursor: pointer;
            border-bottom: 1px solid #333333;
            transition: background 0.3s;
        }

        .search-result-item:hover {
            background: #333333;
        }

        .selected-player {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #1a1a1a;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            background: #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000000;
        }

        .player-info h4 {
            color: #00ff88;
            margin-bottom: 0.3rem;
        }

        .player-info p {
            color: #cccccc;
            font-size: 0.9rem;
        }

        .compare-btn {
            background: #00ff88;
            color: #000000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .compare-btn:hover {
            background: #00cc6a;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .chart-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
        }

        .chart-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
            background: #0a0a0a;
            border-radius: 10px;
            padding: 1rem;
        }

        .analysis-section {
            background: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .analysis-title {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .analysis-input {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .analysis-input input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #333333;
            border-radius: 5px;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 1rem;
        }

        .analysis-input button {
            padding: 0.8rem 1.5rem;
            background: #00ff88;
            color: #000000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .analysis-result {
            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 1rem;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }

        .loading {
            display: none;
            text-align: center;
            color: #00ff88;
            font-size: 1.1rem;
            margin: 1rem 0;
        }

        .error {
            color: #ff4444;
            background: #330000;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .success {
            color: #00ff88;
            background: #003300;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }

        @media (max-width: 768px) {
            .selection-controls {
                grid-template-columns: 1fr;
            }
            
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .main-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">⚽ Football Hub Japan</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/dashboard'">ダッシュボード</button>
            <button class="nav-btn" onclick="window.location.href='/database-enhanced'">データベース</button>
            <button class="nav-btn" onclick="window.location.href='/advanced-stats.html'">高度分析</button>
            <button class="nav-btn" onclick="window.location.href='/ai-agent-enhanced'">AIエージェント</button>
            <button class="nav-btn" onclick="window.location.href='/'">ログアウト</button>
        </div>
    </header>

    <div class="main-container">
        <h1 class="page-title">レーダーチャート比較</h1>
        <p class="page-subtitle">選手やチームのパフォーマンスを視覚的に比較</p>

        <div class="controls-section">
            <h2 class="controls-title">比較設定</h2>
            
            <div class="comparison-type">
                <button class="type-btn active" onclick="switchType('players')">選手比較</button>
                <button class="type-btn" onclick="switchType('teams')">チーム比較</button>
            </div>

            <!-- 統計項目選択セクション -->
            <div class="stats-selection-section">
                <h3 class="selection-title">📊 比較項目選択（6項目を選択してください）</h3>
                
                <!-- シーズン選択 -->
                <div class="season-selection">
                    <label for="seasonSelect">シーズン:</label>
                    <select id="seasonSelect" class="season-dropdown" onchange="updateSeason()">
                        <option value="2024-2025">2024-2025</option>
                        <option value="2023-2024">2023-2024</option>
                        <option value="2022-2023">2022-2023</option>
                        <option value="2021-2022">2021-2022</option>
                    </select>
                </div>
                
                <div class="stats-dropdown-container">
                    <div class="stats-dropdown-group">
                        <label for="statSelect1">項目 1:</label>
                        <select id="statSelect1" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect2">項目 2:</label>
                        <select id="statSelect2" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect3">項目 3:</label>
                        <select id="statSelect3" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect4">項目 4:</label>
                        <select id="statSelect4" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect5">項目 5:</label>
                        <select id="statSelect5" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="stats-dropdown-group">
                        <label for="statSelect6">項目 6:</label>
                        <select id="statSelect6" class="stats-dropdown" onchange="updateSelectedStats()">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                </div>
                <div class="selection-counter" id="selectionCounter">0/6 項目選択中</div>
            </div>

            <div class="selection-controls">
                <div class="selection-group">
                    <h3 class="selection-title">🏃‍♂️ 比較対象 A</h3>
                    <div class="search-section">
                        <input type="text" id="searchA" class="search-input" placeholder="選手名を入力して検索..." oninput="searchPlayers('A')">
                        <div id="searchResultsA" class="search-results"></div>
                    </div>
                    <div id="selectedPlayerA" class="selected-player" style="display: none;">
                        <div class="player-avatar" id="avatarA">?</div>
                        <div class="player-info">
                            <h4 id="nameA">選手A</h4>
                            <p id="teamA">チーム名</p>
                        </div>
                    </div>
                </div>

                <div class="selection-group">
                    <h3 class="selection-title">🏃‍♂️ 比較対象 B</h3>
                    <div class="search-section">
                        <input type="text" id="searchB" class="search-input" placeholder="選手名を入力して検索..." oninput="searchPlayers('B')">
                        <div id="searchResultsB" class="search-results"></div>
                    </div>
                    <div id="selectedPlayerB" class="selected-player" style="display: none;">
                        <div class="player-avatar" id="avatarB">?</div>
                        <div class="player-info">
                            <h4 id="nameB">選手B</h4>
                            <p id="teamB">チーム名</p>
                        </div>
                    </div>
                </div>
            </div>

            <button class="compare-btn" onclick="startComparison()">📊 比較開始</button>
        </div>

        <div class="charts-container">
        <div class="chart-section">
                <h2 class="chart-title">パフォーマンス比較</h2>
                <div class="chart-wrapper">
                <canvas id="radarChart"></canvas>
            </div>
        </div>

            <div class="chart-section">
                <h2 class="chart-title">詳細統計</h2>
                <div id="statsComparison">
                    <div id="playerAStats">
                        <h3>選手A 詳細統計</h3>
                        <div id="playerAStatsContent"></div>
            </div>
                    <div id="playerBStats">
                        <h3>選手B 詳細統計</h3>
                        <div id="playerBStatsContent"></div>
            </div>
        </div>
                </div>
            </div>

        <div class="analysis-section">
            <h2 class="analysis-title">AI分析</h2>
            <div class="analysis-input">
                <input type="text" id="analysisInput" placeholder="分析したい内容を入力してください（例：久保建英と三笘薫の強みを比較して）">
                <button onclick="performAIAnalysis()">分析実行</button>
                    </div>
            <div class="loading" id="analysisLoading">AI分析中...</div>
            <div class="analysis-result" id="analysisResult">
                AI分析の結果がここに表示されます。
            </div>
        </div>
    </div>

    <script src="/ai-widget.js"></script>
    <script>
        let radarChart = null;
        let currentPlayers = { A: null, B: null };
        let selectedStats = [];
        let availableStats = [
            { value: 'goals', label: '得点' },
            { value: 'assists', label: 'アシスト' },
            { value: 'appearances', label: '出場試合' },
            { value: 'minutes', label: '出場時間' },
            { value: 'passes', label: 'パス成功率' },
            { value: 'dribbles', label: 'ドリブル成功率' },
            { value: 'tackles', label: 'タックル数' },
            { value: 'interceptions', label: 'インターセプト' },
            { value: 'clearances', label: 'クリアランス' },
            { value: 'saves', label: 'セーブ数' },
            { value: 'clean_sheets', label: 'クリーンシート' },
            { value: 'yellow_cards', label: 'イエローカード' },
            { value: 'red_cards', label: 'レッドカード' },
            { value: 'rating', label: '平均評価' },
            { value: 'key_passes', label: 'キーパス' },
            { value: 'shots', label: 'シュート数' },
            { value: 'shots_on_target', label: '枠内シュート' },
            { value: 'fouls', label: 'ファウル数' },
            { value: 'offsides', label: 'オフサイド' },
            { value: 'blocks', label: 'ブロック' }
        ];

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            initializeStatsDropdowns();
            loadSamplePlayers();
        });

        // 統計ドロップダウンの初期化
        function initializeStatsDropdowns() {
            const dropdowns = [
                'statSelect1', 'statSelect2', 'statSelect3', 
                'statSelect4', 'statSelect5', 'statSelect6'
            ];

            dropdowns.forEach((dropdownId, index) => {
                const dropdown = document.getElementById(dropdownId);
                dropdown.innerHTML = '<option value="">選択してください</option>';
                
                availableStats.forEach(stat => {
                    const option = document.createElement('option');
                    option.value = stat.value;
                    option.textContent = stat.label;
                    dropdown.appendChild(option);
                });
            });
        }

        // 選択された統計を更新
        function updateSelectedStats() {
            selectedStats = [];
            const dropdowns = [
                'statSelect1', 'statSelect2', 'statSelect3', 
                'statSelect4', 'statSelect5', 'statSelect6'
            ];

            dropdowns.forEach(dropdownId => {
                const dropdown = document.getElementById(dropdownId);
                if (dropdown.value) {
                    selectedStats.push(dropdown.value);
                }
            });

            const counter = document.getElementById('selectionCounter');
            counter.textContent = `${selectedStats.length}/6 項目選択中`;
        }

        // シーズン更新
        function updateSeason() {
            // シーズンが変更された時の処理
            console.log('Season updated:', document.getElementById('seasonSelect').value);
        }

        // 比較タイプ切り替え
        function switchType(type) {
            const buttons = document.querySelectorAll('.type-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // タイプに応じてUIを更新
            if (type === 'teams') {
                // チーム比較モード
                document.querySelectorAll('.selection-title').forEach(title => {
                    title.innerHTML = title.innerHTML.replace('🏃‍♂️', '🏟️');
                });
            } else {
                // 選手比較モード
                document.querySelectorAll('.selection-title').forEach(title => {
                    title.innerHTML = title.innerHTML.replace('🏟️', '🏃‍♂️');
                });
            }
        }

        // サンプル選手読み込み
        function loadSamplePlayers() {
            const samplePlayers = [
                { name: '久保建英', team: 'レアル・ソシエダード', position: 'MF' },
                { name: '三笘薫', team: 'ブライトン', position: 'FW' },
                { name: '堂安律', team: 'フライブルク', position: 'MF' }
            ];

            // サンプル選手を検索結果として表示
            displaySearchResults(samplePlayers, 'A');
            displaySearchResults(samplePlayers, 'B');
        }

        // 選手検索
        async function searchPlayers(target) {
            const searchInput = document.getElementById(`search${target}`);
            const query = searchInput.value.trim();
            
            if (query.length < 2) {
                document.getElementById(`searchResults${target}`).innerHTML = '';
                    return;
                }

            try {
                const response = await fetch(`/api/search/players?query=${encodeURIComponent(query)}&limit=5`);
                    const data = await response.json();
                
                    if (data.results && data.results.length > 0) {
                        displaySearchResults(data.results, target);
                    } else {
                    document.getElementById(`searchResults${target}`).innerHTML = '<div class="search-result-item">選手が見つかりませんでした</div>';
                }
            } catch (error) {
                console.error('Search error:', error);
                document.getElementById(`searchResults${target}`).innerHTML = '<div class="search-result-item">検索エラーが発生しました</div>';
            }
        }

        // 検索結果表示
        function displaySearchResults(players, target) {
            const resultsContainer = document.getElementById(`searchResults${target}`);
            resultsContainer.innerHTML = '';

            players.forEach(player => {
                const resultItem = document.createElement('div');
                resultItem.className = 'search-result-item';
                resultItem.innerHTML = `
                    <div><strong>${player.name}</strong></div>
                    <div style="font-size: 0.8rem; color: #cccccc;">
                        ${player.currentTeam || player.team} | ${player.position || 'N/A'}
                        </div>
                    `;
                resultItem.onclick = () => selectPlayer(player, target);
                resultsContainer.appendChild(resultItem);
            });
        }

        // 選手選択
        function selectPlayer(player, target) {
            currentPlayers[target] = player;
            
            const selectedPlayerDiv = document.getElementById(`selectedPlayer${target}`);
            const avatar = document.getElementById(`avatar${target}`);
            const name = document.getElementById(`name${target}`);
            const team = document.getElementById(`team${target}`);
            
            avatar.textContent = player.name.charAt(0);
            name.textContent = player.name;
            team.textContent = `${player.currentTeam || player.team} | ${player.position || 'N/A'}`;
            
            selectedPlayerDiv.style.display = 'flex';
            document.getElementById(`searchResults${target}`).innerHTML = '';
            document.getElementById(`search${target}`).value = '';
        }

        // 比較開始
        function startComparison() {
            if (!currentPlayers.A || !currentPlayers.B) {
                alert('比較する選手を2人選択してください');
                return;
            }

            if (selectedStats.length < 6) {
                alert('6項目を選択してください');
                return;
            }

            updateRadarChart();
            updateStatsComparison();
        }

        // レーダーチャート更新
        function updateRadarChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            if (radarChart) {
                radarChart.destroy();
            }

            const labels = selectedStats.map(stat => {
                const statObj = availableStats.find(s => s.value === stat);
                return statObj ? statObj.label : stat;
            });

            const data = {
                    labels: labels,
                    datasets: [
                        {
                        label: currentPlayers.A.name,
                        data: generateRandomData(selectedStats.length),
                            borderColor: '#00ff88',
                            backgroundColor: 'rgba(0, 255, 136, 0.2)',
                        borderWidth: 2
                    },
                    {
                        label: currentPlayers.B.name,
                        data: generateRandomData(selectedStats.length),
                            borderColor: '#ff4444',
                            backgroundColor: 'rgba(255, 68, 68, 0.2)',
                        borderWidth: 2
                    }
                ]
            };

            radarChart = new Chart(ctx, {
                type: 'radar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                color: '#ffffff',
                                backdropColor: 'transparent'
                            },
                            grid: {
                                color: '#333333'
                            },
                            pointLabels: {
                                color: '#ffffff'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#ffffff'
                            }
                        }
                    }
                }
            });
        }

        // ランダムデータ生成（実際のAPIデータに置き換える）
        function generateRandomData(length) {
            return Array.from({ length }, () => Math.floor(Math.random() * 100));
        }

        // 統計比較更新
        function updateStatsComparison() {
            const playerAStats = document.getElementById('playerAStatsContent');
            const playerBStats = document.getElementById('playerBStatsContent');

            playerAStats.innerHTML = generateStatsHTML(currentPlayers.A);
            playerBStats.innerHTML = generateStatsHTML(currentPlayers.B);
        }

        // 統計HTML生成
        function generateStatsHTML(player) {
            let html = `<div style="margin-bottom: 1rem;">`;
            selectedStats.forEach(stat => {
                const statObj = availableStats.find(s => s.value === stat);
                const value = Math.floor(Math.random() * 100);
                html += `
                    <div style="display: flex; justify-content: space-between; padding: 0.5rem; background: #333333; margin-bottom: 0.5rem; border-radius: 5px;">
                        <span>${statObj ? statObj.label : stat}:</span>
                        <span style="color: #00ff88; font-weight: bold;">${value}</span>
                    </div>
                `;
            });
            html += `</div>`;
            return html;
        }

        // AI分析実行
        async function performAIAnalysis() {
            const input = document.getElementById('analysisInput').value.trim();
            
            if (!input) {
                alert('分析内容を入力してください');
                return;
            }

            const loading = document.getElementById('analysisLoading');
            const result = document.getElementById('analysisResult');
            
            loading.style.display = 'block';
            result.innerHTML = '';

            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: input })
                });

                const data = await response.json();
                
                if (data.response) {
                    result.innerHTML = `<div class="success">${data.response}</div>`;
                } else {
                    result.innerHTML = '<div class="error">AI分析を実行できませんでした</div>';
                }
            } catch (error) {
                console.error('AI analysis error:', error);
                result.innerHTML = '<div class="error">AI分析中にエラーが発生しました</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        // プランページとの連携機能
        function createPlayerPlan(playerId, playerName) {
            if (playerId && playerName) {
                const url = `plans.html?player=${playerId}&name=${encodeURIComponent(playerName)}&action=create-plan`;
                window.open(url, '_blank');
            }
        }

        function viewPlayerInDatabase(playerId, playerName) {
            if (playerId && playerName) {
                const url = `database-new.html?player=${playerId}&name=${encodeURIComponent(playerName)}`;
                window.open(url, '_blank');
            }
        }

        // URLパラメータから選手情報を取得
        function getPlayerFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerId = urlParams.get('player');
            const playerName = urlParams.get('name');
            
            if (playerId && playerName) {
                // 該当選手を自動選択
                const playerSelect = document.getElementById('playerASelect');
                if (playerSelect) {
                    // 選手名で検索して選択
                    for (let i = 0; i < playerSelect.options.length; i++) {
                        if (playerSelect.options[i].text.includes(playerName)) {
                            playerSelect.options[i].selected = true;
                            updateRadarChart();
                            break;
                        }
                    }
                }
            }
        }

        // ページ読み込み時にURLパラメータをチェック
        document.addEventListener('DOMContentLoaded', function() {
            getPlayerFromUrl();
        });
    </script>
