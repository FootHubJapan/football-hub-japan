<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Hub Japan - 管理画面</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-47242CTHR5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-47242CTHR5');
    </script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6574544891375303"
     crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .admin-title {
            color: #00ff88;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .admin-subtitle {
            color: #888;
            font-size: 1.1em;
        }

        .admin-section {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .section-title {
            color: #00ff88;
            font-size: 1.5em;
            margin-bottom: 15px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .admin-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #444;
        }

        .card-title {
            color: #00ff88;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .status-display {
            background: #333;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #00ff88;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .status-label {
            color: #ccc;
        }

        .status-value {
            color: #00ff88;
            font-weight: bold;
        }

        .log-section {
            background: #000;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            margin: 2px 0;
            padding: 2px 0;
        }

        .log-info {
            color: #17a2b8;
        }

        .log-success {
            color: #28a745;
        }

        .log-warning {
            color: #ffc107;
        }

        .log-error {
            color: #dc3545;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .back-link {
            display: inline-block;
            color: #00ff88;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <a href="/database" class="back-link">← データベースに戻る</a>
        
        <div class="admin-header">
            <h1 class="admin-title">Football Hub Japan - 管理画面</h1>
            <p class="admin-subtitle">データベース管理とシステム監視</p>
        </div>

        <div class="admin-section">
            <h2 class="section-title">システム状況</h2>
            <div class="admin-grid">
                <div class="admin-card">
                    <h3 class="card-title">サーバー状況</h3>
                    <div id="serverStatus" class="status-display">
                        <div class="status-item">
                            <span class="status-label">ステータス:</span>
                            <span class="status-value">確認中...</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">稼働時間:</span>
                            <span class="status-value">-</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">メモリ使用量:</span>
                            <span class="status-value">-</span>
                        </div>
                    </div>
                    <button onclick="checkServerStatus()" class="btn btn-info">状況更新</button>
                </div>

                <div class="admin-card">
                    <h3 class="card-title">データベース状況</h3>
                    <div id="dataStatus" class="status-display">
                        <div class="status-item">
                            <span class="status-label">選手データ:</span>
                            <span class="status-value">確認中...</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">チームデータ:</span>
                            <span class="status-value">-</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">最終更新:</span>
                            <span class="status-value">-</span>
                        </div>
                    </div>
                    <button onclick="checkDataStatus()" class="btn btn-info">状況確認</button>
                </div>
            </div>
        </div>

        <div class="admin-section">
            <h2 class="section-title">データ管理</h2>
            <div class="quick-actions">
                <button onclick="importData()" class="btn btn-primary">データインポート</button>
                <button onclick="clearCache()" class="btn btn-warning">キャッシュクリア</button>
                <button onclick="refreshData()" class="btn btn-success">データ更新</button>
                <button onclick="backupData()" class="btn btn-info">バックアップ</button>
            </div>
        </div>

        <div class="admin-section">
            <h2 class="section-title">システムログ</h2>
            <div id="systemLog" class="log-section">
                <div class="log-entry log-info">システムログを初期化中...</div>
            </div>
            <button onclick="clearLog()" class="btn btn-danger">ログクリア</button>
        </div>
    </div>

    <script>
        // システムログ管理
        function addLog(message, type = 'info') {
            const logSection = document.getElementById('systemLog');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logSection.appendChild(logEntry);
            logSection.scrollTop = logSection.scrollHeight;
        }

        function clearLog() {
            const logSection = document.getElementById('systemLog');
            logSection.innerHTML = '<div class="log-entry log-info">ログがクリアされました</div>';
        }

        // サーバー状況確認
        async function checkServerStatus() {
            try {
                addLog('サーバー状況を確認中...', 'info');
                const response = await fetch('/health');
                const data = await response.json();
                
                document.querySelector('#serverStatus .status-value').textContent = data.status;
                document.querySelector('#serverStatus .status-item:nth-child(2) .status-value').textContent = 
                    Math.floor(data.uptime / 60) + '分';
                document.querySelector('#serverStatus .status-item:nth-child(3) .status-value').textContent = 
                    Math.round(data.memory.heapUsed / 1024 / 1024) + 'MB';
                
                addLog('サーバー状況確認完了', 'success');
            } catch (error) {
                addLog('サーバー状況確認エラー: ' + error.message, 'error');
            }
        }

        // データ状況確認
        async function checkDataStatus() {
            try {
                addLog('データベース状況を確認中...', 'info');
                
                // サーバーサイドのAPIを直接呼び出し
                const response = await fetch('/admin/data-status');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const status = await response.json();
                
                // データ状況を表示
                document.querySelector('#dataStatus .status-item:nth-child(1) .status-value').textContent = 
                    status.playerCount || '確認中...';
                document.querySelector('#dataStatus .status-item:nth-child(2) .status-value').textContent = 
                    status.teamCount || '確認中...';
                document.querySelector('#dataStatus .status-item:nth-child(3) .status-value').textContent = 
                    new Date().toLocaleString();
                
                addLog(`データ状況確認完了: ${status.playerCount || 0}選手, ${status.teamCount || 0}チーム`, 'success');
            } catch (error) {
                addLog('データ状況確認エラー: ' + error.message, 'error');
                document.querySelector('#dataStatus .status-item:nth-child(1) .status-value').textContent = 'エラー';
                document.querySelector('#dataStatus .status-item:nth-child(2) .status-value').textContent = 'エラー';
            }
        }

        // データインポート
        async function importData() {
            try {
                addLog('データインポートを開始...', 'info');
                
                // サーバーサイドのインポートAPIを呼び出し
                const response = await fetch('/admin/import-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                addLog('データインポート完了: ' + result.message, 'success');
                
                // 状況を更新
                await checkDataStatus();
            } catch (error) {
                addLog('データインポートエラー: ' + error.message, 'error');
            }
        }

        // キャッシュクリア
        async function clearCache() {
            try {
                addLog('キャッシュクリアを開始...', 'warning');
                
                // サーバーサイドのクリアAPIを呼び出し
                const response = await fetch('/admin/clear-cache', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                addLog('キャッシュクリア完了: ' + result.message, 'success');
                
                // 状況を更新
                await checkDataStatus();
            } catch (error) {
                addLog('キャッシュクリアエラー: ' + error.message, 'error');
            }
        }

        // データ更新
        async function refreshData() {
            try {
                addLog('データ更新を開始...', 'info');
                
                // サーバーサイドの更新APIを呼び出し
                const response = await fetch('/admin/refresh-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                addLog('データ更新完了: ' + result.message, 'success');
                
                // 状況を更新
                await checkDataStatus();
            } catch (error) {
                addLog('データ更新エラー: ' + error.message, 'error');
            }
        }

        // バックアップ
        async function backupData() {
            try {
                addLog('バックアップ機能は現在開発中です', 'info');
            } catch (error) {
                addLog('バックアップエラー: ' + error.message, 'error');
            }
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', async function() {
            addLog('管理画面を初期化中...', 'info');
            
            // 初期状況確認
            await checkServerStatus();
            await checkDataStatus();
            
            addLog('管理画面の初期化完了', 'success');
        });
    </script>
</body>
</html>
