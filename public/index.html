<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Global Football World Map Navigation - Football Hub Japan</title>
<meta name="description" content="世界中のサッカーリーグ、チーム、スタジアムをインタラクティブなマップで探索。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Google Tag Manager -->

<style>
:root {
  --bg-dark: #0a0e17;
  --bg-card: #0d1321;
  --neon-blue: #00d2ff;
  --neon-blue-dim: rgba(0, 210, 255, 0.3);
  --text-primary: #ffffff;
  --text-muted: #94a3b8;
  --border: rgba(0, 210, 255, 0.2);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', 'Orbitron', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}
/* Header */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 2rem;
  background: rgba(10, 14, 23, 0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-primary);
  text-decoration: none;
  text-shadow: 0 0 20px var(--neon-blue-dim);
}
.nav {
  display: flex;
  gap: 2rem;
}
.nav a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  padding-bottom: 4px;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.nav a:hover, .nav a.active {
  color: var(--neon-blue);
  text-shadow: 0 0 10px var(--neon-blue-dim);
  border-bottom-color: var(--neon-blue);
}
/* Search Section */
.search-section {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999;
  width: 90%;
  max-width: 600px;
  padding: 1rem 0;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.75rem 1.5rem;
  background: rgba(13, 19, 33, 0.95);
  border: 1px solid var(--border);
  border-radius: 50px;
  box-shadow: 0 0 30px var(--neon-blue-dim), inset 0 0 20px rgba(0,210,255,0.05);
  transition: all 0.3s;
}
.search-bar:focus-within {
  border-color: var(--neon-blue);
  box-shadow: 0 0 40px rgba(0, 210, 255, 0.4);
}
.search-bar svg { color: var(--neon-blue); flex-shrink: 0; }
.search-bar input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 0.95rem;
  outline: none;
}
.search-bar input::placeholder { color: var(--text-muted); opacity: 0.7; }
.search-bar .search-btn {
  background: none;
  border: none;
  color: var(--neon-blue);
  cursor: pointer;
  padding: 0.25rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s;
}
.search-bar .search-btn:hover { opacity: 0.8; }
.search-hint {
  text-align: center;
  margin-top: 0.5rem;
  font-size: 0.8rem;
  color: var(--text-muted);
}
/* Map Container */
.map-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1;
}
#map {
  width: 100%;
  height: 100%;
  background: var(--bg-dark);
}
.leaflet-container {
  font-family: inherit;
  background: var(--bg-dark) !important;
}
.custom-map-marker { background: none !important; border: none !important; }
/* Stats Panels */
.stats-panel {
  position: fixed;
  left: 1.5rem;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  background: rgba(13, 19, 33, 0.9);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
  box-shadow: 0 0 20px var(--neon-blue-dim);
}
.stats-panel .stat {
  margin-bottom: 0.75rem;
  font-size: 0.85rem;
}
.stats-panel .stat:last-child { margin-bottom: 0; }
.stats-panel .stat-value { color: var(--neon-blue); font-weight: 700; font-size: 1.1rem; }
.stats-panel .stat-label { color: var(--text-muted); font-size: 0.75rem; }
/* Map Markers */
.map-marker {
  background: rgba(0, 210, 255, 0.2);
  border: 2px solid var(--neon-blue);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px var(--neon-blue-dim);
  cursor: pointer;
  transition: all 0.2s;
}
.map-marker:hover {
  transform: scale(1.15);
  box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
}
.map-marker span { font-size: 1.2rem; }
.marker-label {
  position: absolute;
  bottom: -24px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--neon-blue);
  text-shadow: 0 0 8px var(--neon-blue-dim);
  pointer-events: none;
}
/* Footer */
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 1rem 2rem;
  background: rgba(10, 14, 23, 0.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}
.footer-links {
  display: flex;
  gap: 1.5rem;
}
.footer-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.8rem;
  transition: color 0.2s;
}
.footer-links a:hover { color: var(--neon-blue); }
.footer-social {
  display: flex;
  gap: 0.75rem;
}
.footer-social a {
  color: var(--text-muted);
  transition: color 0.2s;
}
.footer-social a:hover { color: var(--neon-blue); }
.footer-border {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
  opacity: 0.5;
  z-index: 101;
}
/* Decorative HUD elements */
.hud-coord {
  position: fixed;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  z-index: 50;
  font-size: 0.65rem;
  color: var(--text-muted);
  opacity: 0.5;
  font-family: 'Orbitron', monospace;
}
@media (max-width: 768px) {
  .header { padding: 0.75rem 1rem; }
  .nav { display: none; }
  .stats-panel { left: 0.5rem; padding: 0.75rem; font-size: 0.8rem; }
  .search-section { top: 60px; }
}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PNCBBCBM" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- Header -->
<header class="header">
  <a href="/" class="logo">Global Football World Map Navigation</a>
  <nav class="nav">
    <a href="/" class="active">Home</a>
    <a href="/schedule">Leagues</a>
    <a href="/database">Teams</a>
    <a href="/database">Stadiums</a>
    <a href="/login">My Profile</a>
  </nav>
</header>
<!-- Search -->
<div class="search-section">
  <form class="search-bar" id="searchForm" role="search">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="globalSearch" name="q" placeholder="Search for any team, league, or stadium globally." autocomplete="off"/>
    <button type="submit" class="search-btn" aria-label="Search" title="Search">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </form>
  <p class="search-hint">Explore the world of football through an immersive map experience. Click on any country to zoom in.</p>
</div>
<!-- Stats Panel -->
<div class="stats-panel">
  <div class="stat"><span class="stat-value">142</span><br><span class="stat-label">Active Matches</span></div>
  <div class="stat"><span class="stat-value">35</span><br><span class="stat-label">Global Leagues</span></div>
  <div class="stat"><span class="stat-value">25,890</span><br><span class="stat-label">Users Online</span></div>
</div>
<!-- HUD Decoration -->
<div class="hud-coord">LAT/LONG<br>COORD</div>
<!-- Map -->
<div class="map-container">
  <div id="map"></div>
</div>
<!-- Footer -->
<div class="footer-border"></div>
<footer class="footer">
  <div class="footer-links">
    <a href="/about.html">About Us</a>
    <a href="/contact.html">Contact</a>
    <a href="/terms.html">Terms of Service</a>
    <a href="/privacy-policy.html">Privacy Policy</a>
  </div>
  <div class="footer-social">
    <a href="#" aria-label="Facebook"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
    <a href="#" aria-label="X"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
    <a href="#" aria-label="Instagram"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg></a>
    <a href="#" aria-label="YouTube"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></a>
  </div>
</footer>
<!-- Search form (Leafletに依存しない) -->
<script>
document.getElementById('searchForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const q = document.getElementById('globalSearch').value.trim();
  if (q) window.location.href = '/database?q=' + encodeURIComponent(q);
});
</script>
<!-- Leaflet JS -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  const map = L.map('map', { zoomControl: false }).setView([25, 0], 2);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);
  const markers = [
    { lat: 52.3555, lng: -1.1743, label: 'England', icon: '⚽', url: '/database' },
    { lat: 51.1657, lng: 10.4515, label: 'Germany', icon: '🏆', url: '/database' },
    { lat: 40.4637, lng: -3.7492, label: 'Spain', icon: '⚽', url: '/database' },
    { lat: -14.2350, lng: -51.9253, label: 'Brazil', icon: '⚙️', url: '/database' },
    { lat: -38.4161, lng: -63.6167, label: 'Argentina', icon: '⚽', url: '/database' },
    { lat: 34.0479, lng: 100.6197, label: 'Asia', icon: '🌏', url: '/database' },
    { lat: 36.2048, lng: 138.2529, label: 'Japan', icon: '🏆', url: '/database' }
  ];
  markers.forEach(m => {
    const icon = L.divIcon({
      html: '<div class="map-marker" onclick="window.location.href=\'' + m.url + '\'"><span>' + m.icon + '</span><span class="marker-label">' + m.label + '</span></div>',
      className: 'custom-map-marker',
      iconSize: [60, 50],
      iconAnchor: [30, 25]
    });
    L.marker([m.lat, m.lng], { icon: icon }).addTo(map).on('click', () => window.location.href = m.url);
  });
})();
</script>
<script src="/ai-widget.js"></script>
</body>
</html>
