<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Football Hub Japan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; background: #f7fafc; text-align: center; margin-top: 10vh; }
    h1 { font-size: 2.5rem; color: #333; }
    #startBtn {
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #startBtn:hover { background: #5a67d8; }
  </style>
</head>
<body>
  <h1>Football Hub Japan</h1>
  <button id="startBtn">無料で始める</button>
  <script>
    document.getElementById('startBtn').onclick = () => alert('無料で始める！');
  </script>
</body>
</html>
